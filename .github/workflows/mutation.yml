# Complete mutation gate: called once by PR CI; scheduled and manual entry points remain.
name: Mutation
on:
  workflow_call: null
  schedule:
    - cron: 23 3 * * 1
  workflow_dispatch: null
concurrency:
  group: mutation-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mutate:
    name: Mutate (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hardline-1
            args: --module command-hardline --shard 1/3
          - name: hardline-2
            args: --module command-hardline --shard 2/3
          - name: hardline-3
            args: --module command-hardline --shard 3/3
          - name: others
            args: --module bot-policy,bot-permission,model-fallback-chain,model-error-class,memory-namespace,skill-proposal-validate,message-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/build-workspace.mjs
      - name: Run mutation tests
        run: node scripts/mutation/run-mutation.mjs ${{ matrix.args }} --no-gate --out coverage/mutation/${{ matrix.name }}
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.name }}
          path: coverage/mutation/${{ matrix.name }}
          if-no-files-found: ignore
          retention-days: 7
  gate:
    name: Mutation gate
    needs: mutate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-*
          path: coverage/mutation-shards
      - name: Require successful shards
        env:
          SHARDS: ${{ needs.mutate.result }}
        run: test "$SHARDS" = success
      - name: Merge shard reports and check the baseline
        run: node scripts/mutation/run-mutation.mjs --merge coverage/mutation-shards --out coverage/mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: coverage/mutation
          retention-days: 30
