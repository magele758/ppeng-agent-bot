# 桌面安装包：Apple Silicon mac、Windows、Linux，共 5 套。
# Intel Mac（darwin x64 / mac-x64）不打包：用户太少，且原先在 macos-14 上用
# Node x64（Rosetta）很慢。不要加回 mac-x64、macos-13，或把 macos-latest 当成
# x86 Mac runner，除非产品决策改了。Apple Silicon 保留：mac-arm64 跑 macos-14。
# 每套在对应 arch 的 runner 上编 Next standalone + server-bundle，避免交叉编译原生模块。
# 不含 Docker / Evolution / 真模型。手动：Actions → Desktop artifacts → Run workflow。
# 每天定时打 5 套（合入默认分支后生效）。Cloud agent 不能 workflow_dispatch，推 desktop-v* tag。
# v* tag 打齐 5 套并挂到 GitHub Release；desktop-v* 只打包装、不发版。
# desktop-v0.1.0-mac-arm64 这类后缀只打一套。

name: Desktop artifacts

on:
  schedule:
    # 17:00 UTC = 北京时间 01:00
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Which desktop artifact to build
        type: choice
        default: all
        options:
          - all
          - mac-arm64
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
  push:
    tags:
      - 'v*'
      - 'desktop-v*'

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache

jobs:
  # job-level if 不能用 matrix（否则 GitHub 整份 workflow 解析失败，0s、无 job）。
  targets:
    name: Resolve pack matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.resolve.outputs.include }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: resolve
        env:
          TARGET: ${{ github.event.inputs.target || 'all' }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/desktop/ci-matrix.mjs

  pack:
    name: ${{ matrix.id }}
    needs: targets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.include) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.node_arch }}
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-${{ matrix.id }}-${{ hashFiles('apps/desktop/package.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.id }}
        run: node scripts/build-desktop.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Upload ${{ matrix.id }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.id }}
          if-no-files-found: error
          path: |
            apps/desktop/release/RawAgent-*.dmg
            apps/desktop/release/RawAgent-*.exe
            apps/desktop/release/RawAgent-*.AppImage

  release:
    name: Attach to GitHub Release
    needs: pack
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: desktop-*

      - name: Publish release files
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RawAgent-*
          generate_release_notes: true
