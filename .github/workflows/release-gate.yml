# Independent coverage lanes; CRAP consumes verified artifacts without rerunning tests.
name: Release gate
on:
  workflow_call:
    secrets:
      RAW_AGENT_API_KEY:
        required: false
      RAW_AGENT_BASE_URL:
        required: false
      RAW_AGENT_MODEL_NAME:
        required: false
      RAW_AGENT_ANTHROPIC_URL:
        required: false
      HARNESS_EVAL_API_KEY:
        required: false
  workflow_dispatch: null
permissions:
  contents: read
env:
  CI_PUSH_BEFORE: ${{ github.event.before }}
  CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
jobs:
  soak-performance:
    name: HTTP soak performance (no coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-workspace.mjs
      - name: Verify HTTP soak performance
        run: pnpm run test:bot:soak:performance --profile github-actions
      - name: Preserve HTTP soak performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-performance
          path: test-results/soak-performance/
          if-no-files-found: error
          retention-days: 14
  tests:
    name: Build, unit tests, HTTP regression, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Record measured candidate inputs
        run: node scripts/ci/gate-provenance.mjs "$RUNNER_TEMP/gate-provenance.json"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript build
        run: pnpm run build
      - name: Allow precheck network namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Bot queue and process recovery invariants (no retries)
        run: pnpm run test:bot:faults
      - name: Install and exercise public npm tarballs
        run: pnpm run test:package
      - name: Fast capability contracts (fail on any failed case)
        run: pnpm run agent:eval:fast --exit-on-fail --out test-results/fast-eval
      - name: Verify evaluator against scripted harness outcomes (not live model quality)
        run: pnpm run agent:eval:verify
      - name: Preserve stricter uninstrumented performance contracts
        run: node scripts/ci/ci-unit-performance.mjs
      - name: Preserve test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-evidence
          path: |
            test-results/
            playwright-report/
            doc/eval-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve measured candidate inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-provenance
          path: ${{ runner.temp }}/gate-provenance.json
          if-no-files-found: error
          retention-days: 30
  unit:
    name: Functional unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Review fingerprint preflight
        run: node scripts/ci/reviewed-verification-inputs.mjs
      - name: Verify coverage toolchain
        run: pnpm run test:crap --preflight
      - name: TypeScript build (workspace packages)
        run: node scripts/build-workspace.mjs
      - name: Allow precheck network namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run unit coverage lane
        run: |-
          mkdir -p "$RUNNER_TEMP/validation"
          node scripts/ci/validation-lane.mjs unit --out "$RUNNER_TEMP/validation/unit"
      - name: Preserve validation-unit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-unit
          path: ${{ runner.temp }}/validation/unit
          if-no-files-found: error
          retention-days: 30
      - name: Preserve acceptance-results-unit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-results-unit
          path: ${{ runner.temp }}/validation/unit/results
          if-no-files-found: error
          retention-days: 7
  formal:
    name: Formal + real process verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_VERIFICATION_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Review fingerprint preflight
        run: node scripts/ci/reviewed-verification-inputs.mjs
      - name: Verify coverage toolchain
        run: pnpm run test:crap --preflight
      - name: TypeScript build (workspace packages)
        run: node scripts/build-workspace.mjs
      - name: Allow precheck network namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run formal coverage lane
        run: |-
          mkdir -p "$RUNNER_TEMP/validation"
          node scripts/ci/validation-lane.mjs formal --out "$RUNNER_TEMP/validation/formal"
        env:
          CI_VERIFICATION_EVIDENCE_DIR: ${{ runner.temp }}/verification-evidence
      - name: Preserve validation-formal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-formal
          path: ${{ runner.temp }}/validation/formal
          if-no-files-found: error
          retention-days: 30
      - name: Preserve acceptance-results-formal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-results-formal
          path: ${{ runner.temp }}/validation/formal/results
          if-no-files-found: error
          retention-days: 7
      - name: Upload pairing verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-call-pairing-verification
          path: coverage/formal/pairing/
          if-no-files-found: error
          retention-days: 30
      - name: Upload lifecycle verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-lifecycle-verification
          path: coverage/formal/lifecycle/
          if-no-files-found: error
          retention-days: 30
      - name: Upload restart verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-restart-recovery-verification
          path: coverage/formal/restart/
          if-no-files-found: error
          retention-days: 30
      - name: Upload concurrency verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-multiprocess-concurrency-verification
          path: coverage/formal/concurrency/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve verification reuse records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reuse-evidence
          path: ${{ runner.temp }}/verification-evidence/
          if-no-files-found: ignore
          retention-days: 30
  sdk:
    name: agent-loop SDK tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Review fingerprint preflight
        run: node scripts/ci/reviewed-verification-inputs.mjs
      - name: Verify coverage toolchain
        run: pnpm run test:crap --preflight
      - name: TypeScript build (workspace packages)
        run: node scripts/build-workspace.mjs
      - name: Run sdk coverage lane
        run: |-
          mkdir -p "$RUNNER_TEMP/validation"
          node scripts/ci/validation-lane.mjs sdk --out "$RUNNER_TEMP/validation/sdk"
      - name: Preserve validation-sdk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-sdk
          path: ${{ runner.temp }}/validation/sdk
          if-no-files-found: error
          retention-days: 30
      - name: Preserve acceptance-results-sdk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-results-sdk
          path: ${{ runner.temp }}/validation/sdk/results
          if-no-files-found: error
          retention-days: 7
  crap:
    name: CRAP gate (verified coverage artifacts)
    needs:
      - unit
      - formal
      - sdk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify coverage toolchain
        run: pnpm run test:crap --preflight
      - name: TypeScript build (workspace packages)
        run: node scripts/build-workspace.mjs
      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: validation-unit
          path: ${{ runner.temp }}/validation/unit
      - name: Download formal coverage
        uses: actions/download-artifact@v4
        with:
          name: validation-formal
          path: ${{ runner.temp }}/validation/formal
      - name: Download sdk coverage
        uses: actions/download-artifact@v4
        with:
          name: validation-sdk
          path: ${{ runner.temp }}/validation/sdk
      - name: Validate and merge complete coverage
        run: node scripts/ci/validation-artifacts.mjs "$RUNNER_TEMP/validation" "$RUNNER_TEMP/merged-coverage"
      - name: CRAP gate
        run: node scripts/crap/crap-gate.mjs --node-cov "$RUNNER_TEMP/merged-coverage/node" --vitest-cov
          "$RUNNER_TEMP/merged-coverage/vitest.json"
      - name: Preserve crap-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crap-report
          path: coverage/crap/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve coverage-reuse-evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reuse-evidence
          path: ${{ runner.temp }}/merged-coverage/verified-inputs.json
          if-no-files-found: error
          retention-days: 30
  acceptance:
    name: Acceptance criteria gate
    if: ${{ !cancelled() }}
    needs:
      - tests
      - unit
      - formal
      - sdk
      - crap
      - browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download JUnit results
        uses: actions/download-artifact@v4
        with:
          pattern: acceptance-results-*
          merge-multiple: true
          path: ${{ runner.temp }}/acceptance-results
      - name: Acceptance gate (every approved criterion has a passing test)
        run: node scripts/acceptance/acceptance-gate.mjs --results ${{ runner.temp }}/acceptance-results
      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: coverage/acceptance/
          if-no-files-found: ignore
          retention-days: 14
  secrets-gate:
    name: Check remote-smoke secrets
    runs-on: ubuntu-latest
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
      has-harness-key: ${{ steps.check.outputs.has-harness-key }}
      base-ref: ${{ steps.base.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve comparison base
        id: base
        run: >
          base=$(node --input-type=module -e 'import { baseRevision } from "./scripts/ci/base-revision.mjs";
          console.log(baseRevision(process.cwd()));')

          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: Detect RAW_AGENT_API_KEY
        id: check
        env:
          RAW_AGENT_API_KEY: ${{ secrets.RAW_AGENT_API_KEY }}
          HARNESS_EVAL_API_KEY: ${{ secrets.HARNESS_EVAL_API_KEY }}
        run: >
          if [ -n "$RAW_AGENT_API_KEY" ]; then
            echo "has-key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-key=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$HARNESS_EVAL_API_KEY" ]; then echo "has-harness-key=true" >> "$GITHUB_OUTPUT"; else echo
          "has-harness-key=false" >> "$GITHUB_OUTPUT"; fi
  remote-model-smoke:
    name: Remote model smoke (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - tests
      - crap
      - browser
      - secrets-gate
    if: ${{ github.event.repository.fork == false && needs.secrets-gate.outputs.has-key == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Remote smoke (OpenAI-compatible)
        if: ${{ vars.RAW_AGENT_CI_PROVIDER != 'anthropic-compatible' }}
        run: pnpm run test:remote
        env:
          RAW_AGENT_MODEL_PROVIDER: openai-compatible
          RAW_AGENT_API_KEY: ${{ secrets.RAW_AGENT_API_KEY }}
          RAW_AGENT_BASE_URL: ${{ secrets.RAW_AGENT_BASE_URL }}
          RAW_AGENT_MODEL_NAME: ${{ secrets.RAW_AGENT_MODEL_NAME }}
          RAW_AGENT_USE_JSON_MODE: ${{ vars.RAW_AGENT_USE_JSON_MODE }}
      - name: Remote smoke (Anthropic-compatible)
        if: ${{ vars.RAW_AGENT_CI_PROVIDER == 'anthropic-compatible' }}
        run: pnpm run test:remote
        env:
          RAW_AGENT_MODEL_PROVIDER: anthropic-compatible
          RAW_AGENT_API_KEY: ${{ secrets.RAW_AGENT_API_KEY }}
          RAW_AGENT_ANTHROPIC_URL: ${{ secrets.RAW_AGENT_ANTHROPIC_URL }}
          RAW_AGENT_BASE_URL: ${{ secrets.RAW_AGENT_BASE_URL }}
          RAW_AGENT_MODEL_NAME: ${{ secrets.RAW_AGENT_MODEL_NAME }}
  mutation:
    uses: ./.github/workflows/mutation.yml
  harness:
    needs:
      - tests
      - crap
      - browser
      - secrets-gate
    if: ${{ github.event.repository.fork == false && needs.secrets-gate.outputs.has-harness-key == 'true' }}
    uses: ./.github/workflows/harness-quality.yml
    with:
      baseline_ref: ${{ needs.secrets-gate.outputs.base-ref }}
      experiment: scripts/agent-eval/experiments/starter.json
    secrets: inherit
  compact-ab:
    needs:
      - tests
      - crap
      - browser
      - secrets-gate
    if: ${{ github.event.repository.fork == false && needs.secrets-gate.outputs.has-key == 'true' }}
    uses: ./.github/workflows/compact-ab.yml
    secrets: inherit
  gate:
    name: Main release gate
    if: ${{ !cancelled() }}
    needs:
      - soak-performance
      - tests
      - browser
      - crap
      - acceptance
      - mutation
      - secrets-gate
      - remote-model-smoke
      - harness
      - compact-ab
      - unit
      - formal
      - sdk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require blocking checks and report diagnostic Harness outcome
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/release-results.mjs "$RESULTS"
  browser:
    name: Browser and HTTP regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript build
        run: pnpm run build
      - name: Allow precheck network namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Regression (daemon + API)
        run: pnpm run test:regression
        env:
          RAW_AGENT_MODEL_PROVIDER: heuristic
      - name: Integration (mailbox + approval + social)
        run: pnpm run test:integration
        env:
          RAW_AGENT_MODEL_PROVIDER: heuristic
      - name: Install Playwright Chromium
        if: ${{ !cancelled() }}
        run: pnpm run test:e2e:install
      - name: E2E (Agent Lab)
        if: ${{ !cancelled() }}
        run: pnpm run test:e2e:full --reporter=dot,junit
        env:
          RAW_AGENT_MODEL_PROVIDER: heuristic
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ runner.temp }}/acceptance-results/e2e.xml
      - name: Upload acceptance results (e2e)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-results-e2e
          path: ${{ runner.temp }}/acceptance-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: |
            test-results/
            playwright-report/
            doc/eval-results/
          if-no-files-found: ignore
          retention-days: 14
