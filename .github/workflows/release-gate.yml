# main 发布卡点（可复用）：完整测试 + agent-loop 单测 + CRAP 门禁 + 验收标准门禁，汇总为一个检查「Main release gate」。
# 调用方：ci.yml（每次 push / PR）、publish-npm.yml（发 npm 前）、docker-nightly.yml（推镜像前）。
# 分支保护请把「Release gate / Main release gate」设为 main 的 required status check（见 doc/CI.md）。
# npm 与 Docker 推送强制要求此门禁成功；无观察模式旁路。

name: Release gate

on:
  workflow_call:
    secrets:
      RAW_AGENT_API_KEY:
        required: false
      RAW_AGENT_BASE_URL:
        required: false
      RAW_AGENT_MODEL_NAME:
        required: false
      RAW_AGENT_ANTHROPIC_URL:
        required: false
      HARNESS_EVAL_API_KEY:
        required: false
  workflow_dispatch:

permissions:
  contents: read

# workflow_call inherits the caller's event; share its base with all gate scripts.
env:
  CI_PUSH_BEFORE: ${{ github.event.before }}
  CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  tests:
    name: Build, unit tests, HTTP regression, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      # Ubuntu 24.04 AppArmor blocks the user+net namespace the routine precheck uses to drop network.
      - name: Allow precheck network namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # Retry recovery remains visible and fails unless explicitly allowlisted.
      - name: Unit tests
        run: node scripts/ci/retry-failed-tests.mjs --script test:unit --label unit --report "$RUNNER_TEMP/flaky-tests/unit.json"

      - name: Upload flaky test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-tests-unit
          path: ${{ runner.temp }}/flaky-tests/unit.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Bot queue and process recovery invariants (no retries)
        run: npm run test:bot:faults

      - name: Install and exercise public npm tarballs
        run: npm run test:package

      - name: Formal invariants + MockLLM E2E
        run: npm run test:formal

      - name: Fast capability contracts (fail on any failed case)
        run: npm run agent:eval:fast -- --exit-on-fail --out test-results/fast-eval

      - name: Verify evaluator against scripted harness outcomes (not live model quality)
        run: npm run agent:eval:verify

      - name: Regression (daemon + API)
        run: npm run test:regression
        env:
          RAW_AGENT_MODEL_PROVIDER: heuristic

      - name: Integration (mailbox + approval + social)
        run: npm run test:integration
        env:
          RAW_AGENT_MODEL_PROVIDER: heuristic

      - name: Install Playwright Chromium
        run: npm run test:e2e:install

      - name: E2E (Agent Lab)
        run: npm run test:e2e -- --reporter=dot,junit
        env:
          RAW_AGENT_MODEL_PROVIDER: heuristic
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ runner.temp }}/acceptance-results/e2e.xml

      - name: Upload acceptance results (e2e)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-results-e2e
          path: ${{ runner.temp }}/acceptance-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-evidence
          path: |
            test-results/
            playwright-report/
            doc/eval-results/
          if-no-files-found: ignore
          retention-days: 14

  crap:
    name: agent-loop tests + CRAP gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify coverage toolchain
        run: npm run test:crap -- --preflight

      - name: TypeScript build (workspace packages)
        run: node scripts/build-workspace.mjs

      # Ubuntu 24.04 AppArmor blocks the user+net namespace the routine precheck uses to drop network.
      - name: Allow precheck network namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Prepare acceptance results dir
        run: mkdir -p "${{ runner.temp }}/acceptance-results"

      - name: Unit tests with V8 coverage
        run: >-
          node scripts/ci/retry-failed-tests.mjs --script test:unit --label unit-coverage
          --report "$RUNNER_TEMP/flaky-tests/unit-coverage.json"
          --junit "$RUNNER_TEMP/acceptance-results/unit.xml"
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/v8-coverage

      - name: Upload flaky test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-tests-unit-coverage
          path: ${{ runner.temp }}/flaky-tests/unit-coverage.json
          if-no-files-found: ignore
          retention-days: 30

      - name: agent-loop vitest with coverage
        working-directory: packages/agent-loop
        run: >-
          npx --no-install vitest run
          --coverage.enabled --coverage.provider=v8 --coverage.reporter=json
          --coverage.reportsDirectory=${{ runner.temp }}/vitest-coverage
          --reporter=default --reporter=junit
          --outputFile.junit=${{ runner.temp }}/acceptance-results/vitest.xml

      - name: CRAP gate
        run: >-
          node scripts/crap/crap-gate.mjs
          --node-cov ${{ runner.temp }}/v8-coverage
          --vitest-cov ${{ runner.temp }}/vitest-coverage/coverage-final.json

      - name: Upload CRAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crap-report
          path: coverage/crap/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload acceptance results (unit + vitest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-results-unit
          path: ${{ runner.temp }}/acceptance-results/
          if-no-files-found: ignore
          retention-days: 7

  acceptance:
    name: Acceptance criteria gate
    # Runs after a red test job too, so the summary still shows which criteria lack a passing test.
    if: ${{ !cancelled() }}
    needs: [tests, crap]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download JUnit results
        # A job that died before uploading leaves criteria without passing results; the gate then fails them.
        uses: actions/download-artifact@v4
        with:
          pattern: acceptance-results-*
          merge-multiple: true
          path: ${{ runner.temp }}/acceptance-results

      - name: Acceptance gate (every approved criterion has a passing test)
        run: >-
          node scripts/acceptance/acceptance-gate.mjs
          --results ${{ runner.temp }}/acceptance-results

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: coverage/acceptance/
          if-no-files-found: ignore
          retention-days: 14

  secrets-gate:
    name: Check remote-smoke secrets
    runs-on: ubuntu-latest
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
      has-harness-key: ${{ steps.check.outputs.has-harness-key }}
      base-ref: ${{ steps.base.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve comparison base
        id: base
        run: |
          base=$(node --input-type=module -e 'import { baseRevision } from "./scripts/ci/base-revision.mjs"; console.log(baseRevision(process.cwd()));')
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: Detect RAW_AGENT_API_KEY
        id: check
        env:
          RAW_AGENT_API_KEY: ${{ secrets.RAW_AGENT_API_KEY }}
          HARNESS_EVAL_API_KEY: ${{ secrets.HARNESS_EVAL_API_KEY }}
        run: |
          if [ -n "$RAW_AGENT_API_KEY" ]; then
            echo "has-key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-key=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$HARNESS_EVAL_API_KEY" ]; then echo "has-harness-key=true" >> "$GITHUB_OUTPUT"; else echo "has-harness-key=false" >> "$GITHUB_OUTPUT"; fi

  # 使用你在 GitHub 配置的 Secrets 调用真实第三方 API（见 docs/CI.md）
  remote-model-smoke:
    name: Remote model smoke (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [tests, secrets-gate]
    # 至少提供 API Key；OpenAI 兼容还需 BASE_URL + MODEL_NAME（可在 Secrets 中一并配置）
    if: ${{ github.event.repository.fork == false && needs.secrets-gate.outputs.has-key == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Remote smoke (OpenAI-compatible)
        if: ${{ vars.RAW_AGENT_CI_PROVIDER != 'anthropic-compatible' }}
        run: npm run test:remote
        env:
          RAW_AGENT_MODEL_PROVIDER: openai-compatible
          RAW_AGENT_API_KEY: ${{ secrets.RAW_AGENT_API_KEY }}
          RAW_AGENT_BASE_URL: ${{ secrets.RAW_AGENT_BASE_URL }}
          RAW_AGENT_MODEL_NAME: ${{ secrets.RAW_AGENT_MODEL_NAME }}
          RAW_AGENT_USE_JSON_MODE: ${{ vars.RAW_AGENT_USE_JSON_MODE }}

      - name: Remote smoke (Anthropic-compatible)
        if: ${{ vars.RAW_AGENT_CI_PROVIDER == 'anthropic-compatible' }}
        run: npm run test:remote
        env:
          RAW_AGENT_MODEL_PROVIDER: anthropic-compatible
          RAW_AGENT_API_KEY: ${{ secrets.RAW_AGENT_API_KEY }}
          RAW_AGENT_ANTHROPIC_URL: ${{ secrets.RAW_AGENT_ANTHROPIC_URL }}
          RAW_AGENT_BASE_URL: ${{ secrets.RAW_AGENT_BASE_URL }}
          RAW_AGENT_MODEL_NAME: ${{ secrets.RAW_AGENT_MODEL_NAME }}


  mutation:
    uses: ./.github/workflows/mutation.yml

  # Diagnostic only in Main until a qualifying >=30-case experiment exists.
  # Preserve the reusable workflow failure and artifacts; aggregation reports it.
  harness:
    needs: [tests, secrets-gate]
    if: ${{ github.event.repository.fork == false && needs.secrets-gate.outputs.has-harness-key == 'true' }}
    uses: ./.github/workflows/harness-quality.yml
    with:
      baseline_ref: ${{ needs.secrets-gate.outputs.base-ref }}
      experiment: scripts/agent-eval/experiments/starter.json
    secrets: inherit

  compact-ab:
    needs: [tests, secrets-gate]
    if: ${{ github.event.repository.fork == false && needs.secrets-gate.outputs.has-key == 'true' }}
    uses: ./.github/workflows/compact-ab.yml
    secrets: inherit

  gate:
    name: Main release gate
    if: always()
    needs: [tests, crap, acceptance, mutation, secrets-gate, remote-model-smoke, harness, compact-ab]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require blocking checks and report diagnostic Harness outcome
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/release-results.mjs "$RESULTS"
