# Frequent feedback stays inside two minutes. Core unit tests run beside it.
# Full validation starts when main updates and still runs every two hours.
name: CI
on:
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch:
    inputs:
      benchmark_baseline:
        description: Measure the frozen legacy schedule on this same source revision (manual only)
        type: boolean
        default: false
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (inputs.benchmark_baseline && format('benchmark-{0}',
    github.run_id) || format('full-validation-{0}', github.ref)) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  release-gate:
    name: Release gate
    uses: ./.github/workflows/release-gate.yml
    secrets: inherit
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.benchmark_baseline }}
  benchmark-baseline:
    name: Benchmark baseline
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_baseline }}
    uses: ./.github/workflows/benchmark-gate-baseline.yml
    secrets: inherit
  quick:
    name: Quick gate
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bounded quick verification
        run: node scripts/ci/quick-gate.mjs
        env:
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Preserve quick result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-gate-evidence
          path: test-results/quick-gate.json
          if-no-files-found: error
          retention-days: 30
  core:
    name: Core unit tests
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: node scripts/build-workspace.mjs
      - name: Allow precheck network namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Core unit tests without coverage
        run: node scripts/ci/core-unit.mjs
  main-health:
    name: Main full health
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Block merge while main full validation is red
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/main-full-health.mjs
