# 每次 push / PR：release-gate.yml（构建 + 单元/回归/集成/E2E + agent-loop vitest + CRAP 门禁，无需密钥）
# 可选：配置 Repository secrets 后，额外跑真模型冒烟（OpenAI 兼容或 Anthropic）

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark_baseline:
        description: Measure the frozen legacy schedule on this same source revision (manual only)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # 构建、单元/回归/集成/E2E、agent-loop vitest、CRAP 门禁都在 release-gate.yml，
  # 对外只暴露一个检查「Release gate / Main release gate」，供 main 分支保护设为 required。
  release-gate:
    name: Release gate
    uses: ./.github/workflows/release-gate.yml
    secrets: inherit
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.benchmark_baseline }}

  benchmark-baseline:
    name: Benchmark baseline
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_baseline }}
    uses: ./.github/workflows/benchmark-gate-baseline.yml
    secrets: inherit
