# CI layering A (PR side):
# - Every PR still gets Quick/Core from ci.yml (unchanged).
# - Core-path PRs (scripts/ci/pr-release-paths.mjs): auto-run Formal only
#   (Formal + real process verification / formal coverage lane). Do NOT
#   auto-start the full Release gate pack (no unit-coverage long gate, no
#   CRAP, no mutation on this PR auto path).
# - Label `full-validation`: optional force-full → entire release-gate.yml
#   (same pack as Full validation / main push).
# - CRAP + full Release pack remain on main push + scheduled Full validation.
#   If that gate is red, fix before opening new feature PRs.
name: PR release gate
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
concurrency:
  group: pr-release-gate-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  detect:
    name: Detect core paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.paths.outputs.core }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Match changed files against release-gate paths
        id: paths
        run: node scripts/ci/pr-release-paths.mjs
  formal:
    name: Formal only
    needs: detect
    if: needs.detect.outputs.core == 'true' && !contains(github.event.pull_request.labels.*.name, 'full-validation')
    uses: ./.github/workflows/formal-only.yml
  full:
    name: Release gate
    needs: detect
    if: contains(github.event.pull_request.labels.*.name, 'full-validation')
    uses: ./.github/workflows/release-gate.yml
    secrets: inherit
