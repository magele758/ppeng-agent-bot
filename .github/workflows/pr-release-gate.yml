# The GitHub App cannot workflow_dispatch. pull_request still can start Actions,
# so this branch runs the same release-gate jobs as Full validation.
# The head ref keeps every other PR on the quick gate (AC-4).
name: PR release gate
on:
  pull_request: null
permissions:
  contents: read
concurrency:
  group: pr-release-gate-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  full:
    name: Release gate
    if: github.head_ref == 'cursor/fix-actions-39394459730'
    uses: ./.github/workflows/release-gate.yml
    secrets: inherit
