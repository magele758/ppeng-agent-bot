# The GitHub App cannot workflow_dispatch. pull_request still can start Actions,
# so this pull request runs the same release-gate jobs as Full validation.
# Opt in with a label; ordinary PRs retain the bounded quick gate.
name: PR release gate
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
concurrency:
  group: pr-release-gate-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  full:
    name: Release gate
    if: contains(github.event.pull_request.labels.*.name, 'full-validation')
    uses: ./.github/workflows/release-gate.yml
    secrets: inherit
