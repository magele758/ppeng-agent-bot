# Image publication keeps full validation; ordinary commits use only the Quick gate.
name: Docker nightly
on:
  schedule:
    - cron: 0 16 * * *
  workflow_dispatch:
    inputs:
      force:
        description: Ignore existing nightly SHA and rebuild
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) ||
    'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  packages: write
jobs:
  self-test:
    name: Skip-logic self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Decide helper self-test
        run: node scripts/docker-nightly-should-build.mjs --self-test
      - name: Deploy smoke unit tests
        run: node --test scripts/test/deploy-smoke-lib.test.mjs
  decide:
    name: Skip if nightly already this SHA
    needs: self-test
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      reason: ${{ steps.decide.outputs.reason }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Image prefix
        id: meta
        run: |
          prefix="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_prefix=${prefix}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read nightly revision labels
        id: labels
        env:
          IMAGE_PREFIX: ${{ steps.meta.outputs.image_prefix }}
        run: >
          set +e

          daemon_rev=""

          web_rev=""

          if docker pull "${IMAGE_PREFIX}/daemon:nightly"; then
            daemon_rev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE_PREFIX}/daemon:nightly")"
          fi

          if docker pull "${IMAGE_PREFIX}/web:nightly"; then
            web_rev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE_PREFIX}/web:nightly")"
          fi

          set -e

          {
            echo "daemon_rev=${daemon_rev}"
            echo "web_rev=${web_rev}"
          } >> "$GITHUB_OUTPUT"
      - name: Decide
        id: decide
        env:
          DOCKER_NIGHTLY_SHA: ${{ github.sha }}
          DOCKER_NIGHTLY_DAEMON_REV: ${{ steps.labels.outputs.daemon_rev }}
          DOCKER_NIGHTLY_WEB_REV: ${{ steps.labels.outputs.web_rev }}
          DOCKER_NIGHTLY_FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' }}
        run: node scripts/docker-nightly-should-build.mjs >> "$GITHUB_OUTPUT"
      - name: Summary
        run: >
          echo "should_build=${{ steps.decide.outputs.should_build }} reason=${{ steps.decide.outputs.reason }} sha=${{
          github.sha }}" >> "$GITHUB_STEP_SUMMARY"
  release-gate:
    name: Release gate
    needs: decide
    if: needs.decide.outputs.should_build == 'true'
    uses: ./.github/workflows/release-gate.yml
  build:
    name: Build images + deploy smoke
    needs:
      - self-test
      - decide
    if: "!cancelled() && needs.self-test.result == 'success' && (github.event_name == 'pull_request' ||
      needs.decide.outputs.should_build == 'true')"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      smoke: ${{ steps.smoke.outcome }}
    env:
      IMAGE_PREFIX: ${{ needs.decide.outputs.image_prefix || 'ppeng-agent-core-pr' }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Created timestamp
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build daemon (load, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.daemon
          load: true
          push: false
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/daemon:nightly
            ${{ env.IMAGE_PREFIX }}/daemon:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=docker-nightly-daemon
          cache-to: ${{ env.PUBLISH == 'true' && 'type=gha,mode=max,scope=docker-nightly-daemon' || '' }}
      - name: Build web (load, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          load: true
          push: false
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:nightly
            ${{ env.IMAGE_PREFIX }}/web:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=docker-nightly-web
          cache-to: ${{ env.PUBLISH == 'true' && 'type=gha,mode=max,scope=docker-nightly-web' || '' }}
      - name: Start stack (heuristic model, ephemeral state)
        run: |
          token="$(openssl rand -hex 24)"
          echo "::add-mask::${token}"
          echo "SMOKE_TOKEN=${token}" >> "$GITHUB_ENV"
          docker network create deploy-smoke
          docker run -d --name smoke-daemon --network deploy-smoke --network-alias daemon \
            -e RAW_AGENT_MODEL_PROVIDER=heuristic \
            -e RAW_AGENT_AUTH_TOKEN="${token}" \
            -e RAW_AGENT_STATE_DIR=/tmp/agent-state \
            -e RAW_AGENT_SELF_HEAL_AUTO_START=0 \
            -p 127.0.0.1:37070:37070 \
            "${IMAGE_PREFIX}/daemon:nightly"
          docker run -d --name smoke-web --network deploy-smoke \
            -e DAEMON_PROXY_TARGET=http://daemon:37070 \
            -e RAW_AGENT_AUTH_TOKEN="${token}" \
            -p 127.0.0.1:33815:33815 \
            "${IMAGE_PREFIX}/web:nightly"
      - name: Verify exact image pair and restart persistence
        run: node scripts/release/image-smoke.mjs "${IMAGE_PREFIX}/daemon:nightly" "${IMAGE_PREFIX}/web:nightly"
      - name: Preserve image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-smoke-evidence
          path: test-results/image-smoke.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Deploy smoke
        id: smoke
        continue-on-error: true
        run: node scripts/deploy-smoke.mjs --daemon-url http://127.0.0.1:37070 --web-url http://127.0.0.1:33815 --token
          "$SMOKE_TOKEN" --expect-adapter heuristic --startup-timeout-ms 120000 --json-out
          "$RUNNER_TEMP/deploy-smoke.json" > /dev/null
      - name: Container logs
        if: ${{ !cancelled() && steps.smoke.outcome == 'failure' }}
        run: |
          docker ps -a
          docker logs --tail 200 smoke-daemon || true
          docker logs --tail 200 smoke-web || true
      - name: Smoke verdict
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' }}
        env:
          OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            exit 0
          fi
          echo "::error title=Deploy smoke::Deploy smoke failed (${OUTCOME}); images will not be pushed"
          echo "**Deploy smoke failed — push blocked.**" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Upload smoke summary
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: deploy-smoke
          path: ${{ runner.temp }}/deploy-smoke.json
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
      - name: Save images for push
        if: env.PUBLISH == 'true' && steps.smoke.outcome == 'success'
        run: |
          docker save \
            "${IMAGE_PREFIX}/daemon:nightly" "${IMAGE_PREFIX}/daemon:latest" \
            "${IMAGE_PREFIX}/web:nightly" "${IMAGE_PREFIX}/web:latest" \
            | gzip -1 > "$RUNNER_TEMP/nightly-images.tar.gz"
      - name: Upload images
        if: env.PUBLISH == 'true' && steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-images
          path: ${{ runner.temp }}/nightly-images.tar.gz
          retention-days: 1
          compression-level: 0
          overwrite: true
      - name: Stop stack
        if: always()
        run: docker rm -f smoke-web smoke-daemon >/dev/null 2>&1 || true
  push:
    name: Push nightly images
    needs:
      - decide
      - release-gate
      - build
    if: "!cancelled() && needs.decide.outputs.should_build == 'true' && needs.build.result == 'success' &&
      needs.build.outputs.smoke == 'success' && needs.release-gate.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_PREFIX: ${{ needs.decide.outputs.image_prefix }}
      REVISION: ${{ github.sha }}
    steps:
      - name: Gate status
        env:
          GATE: ${{ needs.release-gate.result }}
          SMOKE: ${{ needs.build.outputs.smoke }}
        run: |
          echo "release_gate=${GATE} deploy_smoke=${SMOKE} mode=enforce" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download image evidence
        uses: actions/download-artifact@v4
        with:
          name: image-smoke-evidence
          path: test-results
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: nightly-images
          path: ${{ runner.temp }}
      - name: Load images
        run: gunzip -c "$RUNNER_TEMP/nightly-images.tar.gz" | docker load
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          for role in daemon web; do
            image_id="$(node -p "require('./test-results/image-smoke.json').images['$role']")"
            loaded_id="$(docker inspect --format '{{.Id}}' "$IMAGE_PREFIX/$role:nightly")"
            test "$image_id" = "$loaded_id"
            docker tag "$image_id" "$IMAGE_PREFIX/$role:sha-$REVISION"
            docker push "$IMAGE_PREFIX/$role:sha-$REVISION"
          done
          for role in daemon web; do
            image_id="$(node -p "require('./test-results/image-smoke.json').images['$role']")"
            for alias in nightly latest; do
              docker tag "$image_id" "$IMAGE_PREFIX/$role:$alias"
              docker push "$IMAGE_PREFIX/$role:$alias"
            done
          done
