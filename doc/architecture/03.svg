<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1080 1400 1000" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7c8c9e"/></marker></defs><rect x="0" y="1080" width="1400" height="1000" rx="18" fill="#fcfcfa" stroke="#d4dce5"/><text x="45" y="1142" fill="#263b51" font-size="30" font-family="Arial,PingFang SC,sans-serif"><tspan x="45" dy="0">03  协作与调度 · 多种执行粒度</tspan></text><text x="45" y="1180" fill="#64758a" font-size="17" font-family="Arial,PingFang SC,sans-serif"><tspan x="45" dy="0">多个 session 可以协作；各模块的生命周期和验收边界独立</tspan></text><rect x="45" y="1235" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="65" y="1274" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="65" dy="0">Goal / Bot Work</tspan></text><text x="65" y="1315" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="65" dy="0">目标、执行尝试、委托与复盘</tspan><tspan x="65" dy="23.400000000000002">完成判定、跟进与通知</tspan></text><rect x="495" y="1235" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="515" y="1274" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="515" dy="0">Routine / Scheduler</tspan></text><text x="515" y="1315" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="515" dy="0">定时触发、运行队列与租约</tspan><tspan x="515" dy="23.400000000000002">后台唤醒、超时与重启整理</tspan></text><rect x="945" y="1235" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="965" y="1274" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="965" dy="0">Durable Wait</tspan></text><text x="965" y="1315" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="965" dy="0">登记条件、观测、组合判断</tspan><tspan x="965" dy="23.400000000000002">持久等待、归属检查、消费恢复</tspan></text><rect x="45" y="1500" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="65" y="1539" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="65" dy="0">SubAgent / Teammate</tspan></text><text x="65" y="1580" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="65" dy="0">独立上下文、权限继承</tspan><tspan x="65" dy="23.400000000000002">结果摘要、任务与信箱通信</tspan></text><rect x="495" y="1500" width="390" height="175" rx="12" fill="#e3f3ec" stroke="#91a3b5"/><text x="515" y="1539" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="515" dy="0">Swarm · pipeline</tspan></text><text x="515" y="1580" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="515" dy="0">任务依赖、并发槽位、超时</tspan><tspan x="515" dy="23.400000000000002">独立审查 + 实际测试 + 证据门禁</tspan></text><rect x="945" y="1500" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="965" y="1539" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="965" dy="0">Orchestrator</tspan></text><text x="965" y="1580" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="965" dy="0">classify → research → implement</tspan><tspan x="965" dy="23.400000000000002">→ review → test；失败阻断后续</tspan></text><rect x="45" y="1765" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="65" y="1804" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="65" dy="0">Team DAG</tspan></text><text x="65" y="1845" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="65" dy="0">规划与依赖图、角色、工作区同步</tspan><tspan x="65" dy="23.400000000000002">团队闸门与文件信箱</tspan></text><rect x="495" y="1765" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="515" y="1804" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="515" dy="0">Rooms / Agent Inbox</tspan></text><text x="515" y="1845" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="515" dy="0">房间轮次、成员调度、预算</tspan><tspan x="515" dy="23.400000000000002">多 Bot 消息、引用与交接</tspan></text><rect x="945" y="1765" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="965" y="1804" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="965" dy="0">Factory / 机器协作</tspan></text><text x="965" y="1845" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="965" dy="0">远程工作、证据、验收与交付</tspan><tspan x="965" dy="23.400000000000002">机器路由、重分配、操作记录</tspan></text><path d="M440,1322.5 L490,1322.5" fill="none" stroke="#7c8c9e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="459" y="1306.5" fill="#60748a" font-size="11" font-family="Arial,PingFang SC,sans-serif"><tspan x="459" dy="0">调度</tspan></text><path d="M890,1322.5 L940,1322.5" fill="none" stroke="#7c8c9e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="903" y="1306.5" fill="#60748a" font-size="11" font-family="Arial,PingFang SC,sans-serif"><tspan x="903" dy="0">条件等待</tspan></text><path d="M240,1415 L240,1495" fill="none" stroke="#7c8c9e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="248" y="1456" fill="#60748a" font-size="11" font-family="Arial,PingFang SC,sans-serif"><tspan x="248" dy="0">子执行</tspan></text><path d="M440,1587.5 L490,1587.5" fill="none" stroke="#7c8c9e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="453" y="1571.5" fill="#60748a" font-size="11" font-family="Arial,PingFang SC,sans-serif"><tspan x="453" dy="0">任务粒度</tspan></text><path d="M940,1587.5 L890,1587.5" fill="none" stroke="#7c8c9e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="903" y="1571.5" fill="#60748a" font-size="11" font-family="Arial,PingFang SC,sans-serif"><tspan x="903" dy="0">实现阶段</tspan></text><path d="M240,1680 L240,1760" fill="none" stroke="#7c8c9e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="248" y="1721" fill="#60748a" font-size="11" font-family="Arial,PingFang SC,sans-serif"><tspan x="248" dy="0">团队粒度</tspan></text><path d="M690,1680 L690,1760" fill="none" stroke="#7c8c9e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="698" y="1721" fill="#60748a" font-size="11" font-family="Arial,PingFang SC,sans-serif"><tspan x="698" dy="0">通信接缝</tspan></text><path d="M1140,1680 L1140,1760" fill="none" stroke="#7c8c9e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1148" y="1721" fill="#60748a" font-size="11" font-family="Arial,PingFang SC,sans-serif"><tspan x="1148" dy="0">独立交付体系</tspan></text><text x="45" y="2046" fill="#64758a" font-size="14" font-family="Arial,PingFang SC,sans-serif"><tspan x="45" dy="0">蓝：运行模块   绿：本区核心   黄：可选 / 局部 / 现场边界     ·     源码路径保存在每个框的链接与 customData 中</tspan></text></svg>