<svg xmlns="http://www.w3.org/2000/svg" viewBox="1480 2160 1400 1000" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7c8c9e"/></marker></defs><rect x="1480" y="2160" width="1400" height="1000" rx="18" fill="#fcfcfa" stroke="#d4dce5"/><text x="1525" y="2222" fill="#263b51" font-size="30" font-family="Arial,PingFang SC,sans-serif"><tspan x="1525" dy="0">06  部署与持久化 · 当前边界</tspan></text><text x="1525" y="2260" fill="#64758a" font-size="17" font-family="Arial,PingFang SC,sans-serif"><tspan x="1525" dy="0">绿色=当前默认路径；黄色=可选或局部能力；虚线不代表现场认证</tspan></text><rect x="1525" y="2315" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="1545" y="2354" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="1545" dy="0">Web / Desktop / CLI</tspan></text><text x="1545" y="2395" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="1545" dy="0">Next 代理 API、桌面壳与客户端</tspan><tspan x="1545" dy="23.400000000000002">浏览器不持有 daemon 密钥</tspan></text><rect x="1975" y="2315" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="1995" y="2354" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="1995" dy="0">Daemon / Runtime</tspan></text><text x="1995" y="2395" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="1995" dy="0">主进程、健康检查、调度器</tspan><tspan x="1995" dy="23.400000000000002">默认单实例主状态</tspan></text><rect x="2425" y="2315" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="2445" y="2354" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="2445" dy="0">执行环境</tspan></text><text x="2445" y="2395" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="2445" dy="0">本机工作区、OS 沙箱</tspan><tspan x="2445" dy="23.400000000000002">已登记机器与可选云执行后端</tspan></text><rect x="1525" y="2580" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="1545" y="2619" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="1545" dy="0">SQLite + 本地状态目录</tspan></text><text x="1545" y="2660" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="1545" dy="0">会话、Bot、目标、审批、任务</tspan><tspan x="1545" dy="23.400000000000002">主运行状态仍在这里</tspan></text><rect x="1975" y="2580" width="390" height="175" rx="12" fill="#fff3d6" stroke="#91a3b5"/><text x="1995" y="2619" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="1995" dy="0">PG / Redis · 局部</tspan></text><text x="1995" y="2660" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="1995" dy="0">事件缓冲、技能注册、锁等端口</tspan><tspan x="1995" dy="23.400000000000002">不等于完整会话已迁移 PG</tspan></text><rect x="2425" y="2580" width="390" height="175" rx="12" fill="#fff3d6" stroke="#91a3b5"/><text x="2445" y="2619" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="2445" dy="0">S3 / 分层资产 · 可选</tspan></text><text x="2445" y="2660" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="2445" dy="0">资产缓存与对象存储</tspan><tspan x="2445" dy="23.400000000000002">需实际配置、依赖与可用性验证</tspan></text><rect x="1525" y="2845" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="1545" y="2884" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="1545" dy="0">Docker / Compose</tspan></text><text x="1545" y="2925" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="1545" dy="0">daemon、web、持久卷</tspan><tspan x="1545" dy="23.400000000000002">开发与发布配置模板</tspan></text><rect x="1975" y="2845" width="390" height="175" rx="12" fill="#fff3d6" stroke="#91a3b5"/><text x="1995" y="2884" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="1995" dy="0">Helm / K