<svg xmlns="http://www.w3.org/2000/svg" viewBox="1480 3240 1400 1000" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7c8c9e"/></marker></defs><rect x="1480" y="3240" width="1400" height="1000" rx="18" fill="#fcfcfa" stroke="#d4dce5"/><text x="1525" y="3302" fill="#263b51" font-size="30" font-family="Arial,PingFang SC,sans-serif"><tspan x="1525" dy="0">08  验证与交付 · 成功必须有证据</tspan></text><text x="1525" y="3340" fill="#64758a" font-size="17" font-family="Arial,PingFang SC,sans-serif"><tspan x="1525" dy="0">软件通过、真实模型样本、部署认证分开记录</tspan></text><rect x="1525" y="3395" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="1545" y="3434" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="1545" dy="0">需求 → 验收规格</tspan></text><text x="1545" y="3475" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="1545" dy="0">acceptance/*.yaml</tspan><tspan x="1545" dy="23.400000000000002">approved → 失败用例 → implemented</tspan></text><rect x="1975" y="3395" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="1995" y="3434" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="1995" dy="0">自动化行为测试</tspan></text><text x="1995" y="3475" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="1995" dy="0">Core / SDK / API / UI 单测</tspan><tspan x="1995" dy="23.400000000000002">失败、缺证据、权限与取消边界</tspan></text><rect x="2425" y="3395" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="2445" y="3434" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="2445" dy="0">形式与恢复验证</tspan></text><text x="2445" y="3475" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="2445" dy="0">工具配对、生命周期、真实进程重启</tspan><tspan x="2445" dy="23.400000000000002">结果与验证范围共同保留</tspan></text