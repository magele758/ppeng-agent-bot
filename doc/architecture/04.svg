ext><text x="1995" y="1845" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="1995" dy="0">密钥引用、凭证注入与访问</tspan><tspan x="1995" dy="23.400000000000002">不把密钥变成界面或模型正文</tspan></text><rect x="2425" y="1765" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="2445" y="1804" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="2445" dy="0">回流与审计</tspan></text><text x="2445" y="1845" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="2445" dy="0">结果脱敏、超大结果归档</tspan><tspan x="2445" dy="23.400000000000002">调用配对、Trace 与失败证据</tspan></text><path d="M1720,1415 L1720,1495" fill="none" stroke="#7c8c9e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1728" y="1456" fill="#60748a" font-size="11" font-family="Arial,PingFang SC,sans-serif"><tspan x="1728" dy="0">候选</tspan></text><path d="M2170,1415 L2170,1495" fill="none" stroke="#7c8c9e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="2178" y="1456" fill="#60748a" font-size="11" font-family="Arial,PingFang SC,sans-serif"><tspan x="2178" dy="0">加载授权</tspan></text><path d="M2620,1415 L2620,1495" fill="none" stroke="#7c8c9e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="2628" y="1456" fill="#60748a" font-size="11" font-family="Arial,PingFang SC,sans-serif"><tspan x="2628" dy="0">调用契约</tspan></text><path d="M1920,1587.5 L1970,1587.5" fill="none" stroke="#7c8c9e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1933" y="1571.5" fill="#60748a" font-size="11" font-family="Arial,PingFang SC,sans-serif"><tspan x="1933" dy="0">允许名单</tspan></text><path d="M2370,1587.5 L2420,1587.5" fill="none" stroke="#7c8c9e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="2383" y="1571.5" fill="#60748a" font-size="11" font-family="Arial,PingFang SC,sans-serif"><tspan x="2383" dy="0">获准派发</tspan></text><path d="M2620,1680 L2620,1760" fill="none" stroke="#7c8c9e" stroke-width="1.6" marker-end="url(#arrow)"/><text x