<svg xmlns="http://www.w3.org/2000/svg" viewBox="1480 1080 1400 1000" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7c8c9e"/></marker></defs><rect x="1480" y="1080" width="1400" height="1000" rx="18" fill="#fcfcfa" stroke="#d4dce5"/><text x="1525" y="1142" fill="#263b51" font-size="30" font-family="Arial,PingFang SC,sans-serif"><tspan x="1525" dy="0">04  工具与安全 · 发现、授权、执行、回流</tspan></text><text x="1525" y="1180" fill="#64758a" font-size="17" font-family="Arial,PingFang SC,sans-serif"><tspan x="1525" dy="0">外部内容是证据；工具可见、获准、执行成功是三个不同事实</tspan></text><rect x="1525" y="1235" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="1545" y="1274" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="1545" dy="0">能力发现与路由</tspan></text><text x="1545" y="1315" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="1545" dy="0">工具搜索、可选组、动态披露</tspan><tspan x="1545" dy="23.400000000000002">发现设置与能力健康状态</tspan></text><rect x="1975" y="1235" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="1995" y="1274" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="1995" dy="0">Skills / 扩展</tspan></text><text x="1995" y="1315" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="1995" dy="0">加载、shortlist、允许名单</tspan><tspan x="1995" dy="23.400000000000002">自建提案、插件与扩展注册</tspan></text><rect x="2425" y="1235" width="390" height="175" rx="12" fill="#edf3f8" stroke="#91a3b5"/><text x="2445" y="1274" fill="#263b51" font-size="22" font-family="Arial,PingFang SC,sans-serif"><tspan x="2445" dy="0">MCP / PTC</tspan></text><text x="2445" y="1315" fill="#465b70" font-size="18" font-family="Arial,PingFang SC,sans-serif"><tspan x="2445" dy="0">远端工具扩展、代码编排</tspan><tspan x="2445" dy="23.400000000000002">隔离执行、动态工具与回放</tspan></text><rect x="1525" y="1