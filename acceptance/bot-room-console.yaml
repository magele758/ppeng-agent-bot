id: bot-room-console
title: 大规模群的对话区界面
status: approved
owner: user
requirement: |
  成员很多时不要平铺所有人。可以按职能组查看，并整组加入或移出。群成员仍至少 2 人。
  输入 @ 时要能看到职能组，也能按职责找到名字并不相同的 Bot。
  界面语言切换后，这些新文案跟着变。
  默认不在群里放批准按钮。
criteria:
  - id: AC-1
    given: 群里超过 6 名成员，群聊设置还关着
    when: 用户看主聊天区，再打开群聊设置
    then: 主聊天区仍是这段对话，不铺成员卡、移出和加入。打开后能看到群主和正在发言的人，并能搜索、按职能组查看、整组加入或移出。移出后成员仍至少为 2 名，名单不出现重复。顶部仅显示真实工作中成员的小头像与短名称，不必先打开设置
  - id: AC-2
    given: 群里有职能组，且有一名 Bot 的名字和职责不同
    when: 用户在输入框键入 @
    then: 只显示当前群成员，不显示职能组。按职责或头衔中的词可以找到这名名字不同的 Bot
  - id: AC-3
    given: 群里有一件进行中的目标
    when: 用户查看群聊顶部
    then: 能看到目标名称和当前进度，并能暂停、补充约束或取消
  - id: AC-4
    given: 用户把界面语言从中文切到英文，或从英文切回中文
    when: 用户查看成员列表、目标条和人数上限设置
    then: 这些文案显示为当前语言
  - id: AC-5
    given: 用户打开 Lab 里的群人数设置
    when: 用户查看并保存名册上限、单群人数和每轮发言人数
    then: 三项都能在 Lab 里改，保存后立刻用于之后的建群和加人。群聊仍在原来的对话区，不新出现一套主导航
  - id: AC-6
    given: 用户没有打开群内批准
    when: 成员需要本人处理一步
    then: 群里不出现批准按钮
notes: |
  2026-10-26 按最新反馈将完整成员管理统一移入群聊设置，顶部仅留工作中成员；assumedApproval: standing-order-2026-10-22。
  2026-10-26 按用户对 @ 分组候选的反馈更新 AC-2：取消分组候选，保留按职责与头衔搜索成员；assumedApproval: standing-order-2026-10-22。原始 requirement 保留作历史记录。
  不替代 play-bot-group AC-1、AC-2，也不替代仍为 draft 的 bot-group-members-off-canvas。成员管理留在群聊设置或负责人允许的成员列表里，不把成员卡铺回主聊天区。AC-1 在超过 6 人时为这个列表补上搜索、职能组和整组加入或移出。
  AC-6 不替代 bot-rooms AC-8，只锁住默认界面不出现批准按钮。群内批准卡片属于 bot-room-inline-approval，未单独批准前不做。
  目标条依赖 bot-room-goal-intake。人数效果依赖 bot-room-sparse-routing。
  待用户批准本规格后，才在旧标准说明里写上上述关系。本次不修改 play-bot-group.yaml 与 bot-rooms.yaml 的状态和正文，也不把它们标为 retired。
