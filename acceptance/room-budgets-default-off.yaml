id: room-budgets-default-off
title: 群预算默认关闭，预算停下时写完的回复照常出现
status: implemented
requirement: |
  发现的问题都查一下和解决，群预算也都默认关闭
criteria:
  - id: AC-1
    given: 新建一个群，没有填费用预算和工具调用上限
    when: 一轮里成员的估算费用超过 1 美元、工具调用超过 100 次
    then: 这个群的费用预算和工具调用上限都是关闭的，这一轮不因预算停下，成员的回复照常出现
  - id: AC-2
    given: 升级前建的群带着旧默认值（费用预算 1 美元、工具调用上限 100 次）
    when: 新版本启动
    then: 这个群的费用预算和工具调用上限都变成关闭
  - id: AC-3
    given: 升级前的群，预算不是旧默认值（例如费用预算 2 美元、工具调用上限 30 次）
    when: 新版本启动
    then: 这个群的预算保持原样，仍然生效
  - id: AC-4
    given: 新版本已经启动过一次，之后有人给某个群打开了 1 美元的费用预算
    when: 服务再次启动，随后这个群的一轮达到费用预算
    then: 这个群的预算没有被再次关掉，这一轮照旧因费用预算停下
  - id: AC-5
    given: 设置里「新建群的默认预算」没有保存过时两项都是 0（关闭）
    when: 把默认费用预算和默认工具调用上限保存成正数，再新建一个群
    then: 新群带着保存的两项预算并且生效；不合法的数值保存不了
  - id: AC-6
    given: 群开了费用预算，同时有几位成员在回复
    when: 一位成员写完回复时达到费用预算，另一位已经写完但还没发出来
    then: 这两条已经写完的回复都出现在群里，这一轮仍显示因费用预算停下
  - id: AC-7
    given: 群开了费用预算，这一轮被预算停下时还有成员正在执行
    when: 预算停下这一轮
    then: 正在执行的成员被取消，不再继续花费，也不在群里发言
  - id: AC-8
    given: 群开了工具调用上限，同时有几位成员在回复
    when: 一位成员要调用的工具超过上限
    then: 这位成员和其他正在执行的成员被取消；已经写完的回复仍出现在群里，这一轮显示因工具调用上限停下
  - id: AC-9
    given: 最近一轮被群预算停下，有成员没有回复
    when: 打开这个群聊
    then: 顶部提示除了原因和群设置入口，还写出没有回复的成员名字
notes: |
  assumedApproval: standing-order-2026-10-22
  「预算」指每轮的费用预算和工具调用上限，这两项停下时都记成预算停止。对话轮上限早就默认关闭，单群人数、每波人数、每分钟回复数是容量设置，不在这次范围。
  已有的群没有记录预算是谁设的：建群界面不发送预算，1 美元和 100 次都来自建群时的旧默认。所以升级时只关掉仍等于旧默认的那一项，其它数值不动。有人特意把预算设成 1 美元或 100 次的话，数据上分不出来，也会被关一次。
  预算停下时，按 doc/bot/07-rooms.md「正在执行的成员一并收口」：没写完的成员真的取消，写完的回复发出来。
