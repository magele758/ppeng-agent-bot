id: routine-owner-permission
title: 定时任务沿用 Bot 免审批
status: implemented
requirement: |
  很奇怪，这个定时任务，是单次的？还有这个定时任务还失败了，帮我排查下原因并修复下
notes: |
  一次性到点后关闭是既定调度，不在本标准里改。本标准只修：Bot 对话已设成执行命令不再向人要批准时，它自己的定时任务仍被降成每次都要人批，十分钟无人应答后失败。
criteria:
  - id: AC-1
    given: 某个 Bot 的对话已被设成执行命令时不再向人要批准
    when: 它名下的定时任务到点，要执行一条在该对话里会直接执行的命令，包括需要读取本机密钥目录、因此不能套系统沙箱的命令
    then: 这条命令按该对话的设定直接执行，不会因为没人在十分钟内批准而失败
  - id: AC-2
    given: 某个 Bot 的对话仍是每次操作都要人批准
    when: 它名下的定时任务到点并要执行命令，十分钟内没有人批准或拒绝
    then: 命令没有执行，这次任务记为失败，原因是无人应答
  - id: AC-3
    given: 某个 Bot 的对话已被设成执行命令时不再向人要批准
    when: 这个 Bot 在对话里另外派出一个子任务去执行命令
    then: 子任务仍然要人批准后才执行，不会因为父对话免批准就直接执行
