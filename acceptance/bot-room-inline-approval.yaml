id: bot-room-inline-approval
title: 群内原位批准
status: implemented
owner: user
requirement: |
  approval = private-default：默认仍转到该 Bot 私聊，结果不自动回群。群内原位批准只作为 Lab 里另行打开的策略，不进第一批实现。
criteria:
  - id: AC-1
    given: 用户没有在 Lab 打开群内批准
    when: 群成员走到需要本人审批、登录或验证的一步
    then: 群里不出现批准按钮，只说明去该 Bot 的私聊处理。结果留在私聊，不自动回到群
  - id: AC-2
    given: 用户在 Lab 打开了群内批准
    when: 一名成员走到需要本人处理的一步，同轮还有其他成员在发言
    then: 群里出现这名成员的批准卡片，能看出是谁申请、要做什么，不展示凭证原文。其他成员的回复照常出现，群不等这张卡片才继续
  - id: AC-3
    given: 群里有一张尚未处理的批准卡片
    when: 用户在群里批准
    then: 这一步继续，最终文字出现在群里
  - id: AC-4
    given: 群里有一张尚未处理的批准卡片
    when: 用户在群里拒绝
    then: 这一步不执行，群里显示已拒绝，其他成员已发出的回复还在，整个群不因此失败
  - id: AC-5
    given: 用户曾经打开群内批准，现在又在 Lab 关掉
    when: 下一次再遇到需要本人处理的步骤
    then: 重新转到该 Bot 的私聊，结果不自动回到群
notes: |
  不进第一批实现。用户确认其他群聊规格时，本规格仍保持 draft，直到用户单独书面批准群内原位审批。
  若日后批准，将替代 bot-rooms AC-8 中这些句子：「群里不等待，也不展示要真人操作的卡片或凭证细节」「结果只留在私聊，不会自动写回群，也不会让群把这一步再执行一遍」「该成员这一轮按已转私聊结束」。AC-8 里「私聊里的内容仍然不会进入群」在默认关闭时仍然成立；打开群内批准后，回到群里的是该步骤的最终文字，不是整段私聊记录。
  待用户单独批准后，才把 AC-8 的相应句子按规范处理。验收规范的 retired 作用于整份规格，不能把 bot-rooms 整份标为 retired，因为 AC-1 至 AC-7 仍然有效。本次不修改 bot-rooms.yaml 的状态和正文。

links:
