id: prd-test-trace
title: 产品需求与测试对照
status: implemented
notes: 'assumedApproval: standing-order-2026-10-22'
requirement: |
  按这个做对照表、核心用例和命令
criteria:
  - id: AC-1
    given: 产品现状说明的每一章，以及已经实现的验收规格
    when: 打开对照表
    then: 每一章列出它点名且已经实现的规格，并且每条规格至少有一个带该规格验收标签的测试；草稿、已批准未实现、已取消，以及还没有规格的方向，都不会被写成已经覆盖
  - id: AC-2
    given: 核心用例
    when: 阅读这些用例
    then: 用例数量在八到十之间，每条都点名已经实现的功能，并且这些功能各自有测试
  - id: AC-3
    given: 只跑核心用例的命令
    when: 运行它，或让它点名一个尚未实现、或没有测试的功能
    then: 它只运行被点名规格所标记的测试；点名尚未实现或没有测试的功能时，命令失败，并且不会被当成通过
