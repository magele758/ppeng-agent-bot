id: composer-draft-per-session
title: 聊天输入框草稿按会话隔离
status: implemented
requirement: |
  聊天页输入框里未发送的草稿，在切换到另一个 bot（或会话）后仍然显示，把在 A bot 输入的内容带到了 B bot。
  需求：草稿按 bot/会话隔离：切换到 B 时显示 B 自己的草稿（没有则为空）；切回 A 时恢复 A 之前未发送的草稿
  （含输入文字；附件/引用/上下文标签等 composer 状态若现有结构支持也一并按会话隔离，至少保证文字）；
  发送成功后清空该会话草稿（保持现有「发送后先挂乐观气泡、再清空、再等待请求」的顺序与行为）；
  刷新页面若项目已有草稿持久化机制则沿用并按 key 隔离，否则内存级即可。
  注意流式进行中切换、新建会话、语音输入（麦克风）回填等边界。
notes: |
  assumedApproval: standing-order-2026-10-22
  项目没有草稿持久化机制，草稿只在本页内存里按会话保留，刷新页面后不保留。
  回复引用沿用既有行为（切换会话即取消引用），不在本标准内恢复。
criteria:
  - id: AC-1
    given: 用户在 Bot A 的输入框里打了字，还没发送
    when: 切换到从没输入过的 Bot B（或另一个会话）
    then: 输入框是空的，看不到 A 的文字
  - id: AC-2
    given: 用户在 A 留了文字、附件和上下文标签，切到 B 后又在 B 打了字
    when: 切回 A，再切回 B
    then: 回到 A 时文字、附件和上下文标签都是 A 原来的；回到 B 时是 B 刚才打的字
  - id: AC-3
    given: A 和 B 都有未发送的草稿
    when: 在 A 发送成功后再切到 B、然后切回 A
    then: A 的输入框在发送后清空，B 仍显示自己的草稿，切回 A 仍是空的
  - id: AC-4
    given: 新对话还没有会话、或 Bot 的会话还在打开，用户已在输入框里打字
    when: 会话建立完成（第一条消息正在生成或 Bot 会话打开成功）
    then: 用户刚打的字留在输入框里，不会被清掉
  - id: AC-5
    given: 用户在 A 正在用麦克风语音输入
    when: 切换到 B
    then: 语音输入停止，A 的语音文字不会写进 B 的输入框，切回 A 时 A 已识别的文字还在
