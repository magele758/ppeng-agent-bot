id: chat-experience
title: 对话页简洁易用
status: implemented
notes: |
  AC-6 的入口位置已按负责人批准的 bot-entry-simplification AC-1、AC-4 同步：移除侧栏重复链接，通过当前 Bot 的权限设置进入其配置。
requirement: |
  对话页配置太多、输入区拥挤、同一设置在多处重复。目标：输入区默认干净、次要选项收进一个紧凑的「会话设置」面板
  （常用在前，其余放进「高级」），全局设置只在「设置」页出现一次；会话列表清晰；工具调用 / 思考块默认折叠、可读。
criteria:
  - id: AC-1
    given: 用户打开对话页
    when: 查看输入区
    then: 输入区只有消息框、发送、附件、模型选择、工作区和一个「会话设置」入口；执行模式、自主度、目标等次要选项默认不显示在对话区
  - id: AC-2
    given: 用户点开「会话设置」
    when: 查看面板内容
    then: 常用项（执行模式、Agent、自主度）直接可见；目标、编排方式、技能域、额外工具等放在默认折叠的「高级」里，展开后可见
  - id: AC-3
    given: 用户点开「会话设置」
    when: 查找 Agent 循环、工具结果压缩等全局设置
    then: 面板里不再重复出现这些全局设置，而是给出前往「设置」页的链接，点击后进入「设置」
  - id: AC-4
    given: 一个会话里有工具调用、工具结果和思考内容
    when: 回复完成后查看对话
    then: 工具调用、工具结果、思考块默认折叠，只显示名称和简短预览，点击后展开看到输入输出；助手正文以 Markdown 渲染
  - id: AC-5
    given: 会话列表里有多个会话
    when: 查看列表
    then: 按日期分组，每项显示标题；只有运行中、等待审批、失败的会话才带状态标签；可按关键词筛选
  - id: AC-6
    given: 用户在 Bot 视图下
    when: 选中 Bot 并点击对话标题旁的权限设置入口
    then: 进入「Bots 与 Agents」中对应 Bot 的配置；侧栏不再重复显示通用管理链接
