id: bot-startup-trace
title: Bot 启动耗时分段可观测
status: implemented
notes: 'assumedApproval: standing-order-2026-10-22'
requirement: |
  我觉得现在bot启动特别慢，在对应位置，打上日志或者trace分析，让我能分析找到具体慢的原因，分多个Agent去快速开发完成
criteria:
  - id: AC-1
    given: 一只 Bot 开始一轮、模型尚未被调用
    when: 这一轮走到模型调用之前
    then: 会话记录里能看到 MCP 加载、文件策略、邮箱、工作区、消息打包、系统提示词、工具选择各自的阶段名和毫秒耗时，且这些记录不含消息正文或密钥
  - id: AC-2
    given: 模型调用前的准备工作结束，或在调用模型前被放弃
    when: 查看这一次启动的记录
    then: 有且仅有一条汇总，写出总毫秒数和最慢的阶段名，不必把多条记录对起来才能看出原因
  - id: AC-3
    given: 守护进程正在启动
    when: 它开始监听
    then: 进程日志里有存储打开、运行时构造、网关准备各自的阶段名和毫秒耗时
  - id: AC-4
    given: 一轮开始前要打包消息并准备提示词
    when: 打包结束
    then: 技能目录加载、技能路由、记忆附录、MCP 展开各自有独立耗时；压缩、折叠、视图和打包总耗时仍然保留
  - id: AC-5
    given: 默认循环内核和参考内核
    when: 各自开始一轮
    then: 两边对同一批共享阶段使用相同的阶段名，换内核不会把慢的一步藏起来
  - id: AC-6
    given: 记录耗时的写入抛错，或某个可选步骤被跳过
    when: 启动继续
    then: 启动不会因为记录失败而失败；被跳过的可选步骤仍然留下一条耗时
  - id: AC-7
    given: 排队工作或房间轮次把 Bot 唤醒
    when: 运行被发起
    then: 能看到这次唤醒等了多久、房间上下文准备了多久，单位是毫秒，且不含消息正文
  - id: AC-8
    given: 一轮已经把各阶段写入会话记录
    when: 查看进程控制台
    then: 控制台不逐条打印这些阶段，也不打印每轮汇总；只有进程启动时的 boot 阶段还打印
