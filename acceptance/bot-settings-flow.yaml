id: bot-settings-flow
title: 简化 Bot 操作与设置生效反馈
status: implemented
requirement: |
  按你这个review直接改吧，把这些问题都修好，简化Bot操作流程，补齐面板配置和生效状态，测试review通过后提交PR并合并。
notes: |
  assumedApproval: standing-order-2026-10-22
criteria:
  - id: AC-1
    given: Bot 正在执行多步任务
    when: 用户修改允许使用的工具
    then: 下一执行步骤使用最新名单，新增与撤销均生效，无需重新开始任务
  - id: AC-2
    given: Bot 曾经保存技能白名单
    when: 用户从统一技能面板查看并保存全部或指定技能
    then: 初始展示保留原限制，保存后按明确选择生效，不被隐藏的旧名单再次限制，冲突保存不覆盖新设置
  - id: AC-3
    given: 用户修改技能使用范围或共享范围尚未保存
    when: 在同一个 Bot 的设置标签间切换
    then: 草稿保留且仍标记未保存，保存失败可重试，切换其他 Bot 不会误保存或显示前一个 Bot 的草稿
  - id: AC-4
    given: 已存在 Bot
    when: 用户在基本设置修改名称、职责和说明
    then: 保存后列表和详情显示新资料，保存失败保留输入并显示错误
  - id: AC-5
    given: 用户需要创建 Bot
    when: 输入名称和用途并创建
    then: 默认直接进入新 Bot 对话，外观与可选资料折叠，不要求先配置高级参数
  - id: AC-6
    given: 用户处于 Bot 对话或管理页
    when: 打开 Bot 设置
    then: 复用同一设置面板，常用模型和权限前置，软件连接按需展开，技能只有一个选择入口，已有任务、记忆与文件仍可访问
  - id: AC-7
    given: 用户修改 Bot 或全局运行设置
    when: 保存成功或失败
    then: 面板区分保存失败、已保存及下一步骤或下次执行生效，并说明作用范围，不承诺改变已经发出的请求或已创建子任务
  - id: AC-8
    given: 用户尚未保存或已经保存技能路由配置
    when: 通过面板修改路由模式、候选数量、严格加载和融合策略
    then: 后续技能路由及加载使用持久化配置，未保存字段保留原回退，非法值不改变配置
  - id: AC-9
    given: 用户需要控制交互卡片与已安装领域能力
    when: 在面板启用或关闭能力
    then: 后续步骤与可用能力列表反映保存配置，无需重启，关闭的能力不可调用，未知领域不能保存
  - id: AC-10
    given: 用户在创建界面展开可选资料与外观
    when: 修改名称、选择脸型或颜色
    then: 能立即看到对应机器人脸预览，不选择则按名称生成；不显示 emoji 和图片地址输入
  - id: AC-11
    given: 用户只填写名称，或同时填写显示标题、描述并选择脸型和颜色
    when: 成功创建 Bot 并刷新页面
    then: 所有填写内容保留，选择器、会话和群聊使用同一机器人脸，工作时动态而空闲时静止
  - id: AC-12
    given: 用户正在创建 Bot
    when: 名称为空、重名、提交失败或用户取消
    then: 无效名称不能创建，失败保留输入并支持重试，取消不创建 Bot 且保留原对话
