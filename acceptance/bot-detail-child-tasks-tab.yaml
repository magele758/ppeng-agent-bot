id: bot-detail-child-tasks-tab
title: 子任务改到详情页签
status: implemented
requirement: |
  “子任务 可以考虑让bot模式加一个能力：自动在输入框填下一次可能输入的内容（用输入框的提示模式），tab才真实输入，如果不tab直接输入，就正常输入，这个下一次”: 这个子任务改到tab菜单里吧，下面的都看不到了
notes: |
  只改位置：子任务不再作为详情顶部常驻的长列表，改成和定时任务、文件资料、记忆、技能一样的页签。
  不改变已实现行为：子任务仍属于派生它的那只 Bot；标题仍是任务原文；点开后主区仍打开这条子任务会话；没有子任务时仍有一句说明目前没有；换到另一只 Bot 后只看到那一只的子任务。
  不改写 bot-fork-sessions-in-detail、bot-detail-menu 里已实现的标准。打开详情后先落在哪个页签，本标准不规定。
criteria:
  - id: AC-1
    given: 一只 Bot 有很多条子任务，标题是很长的任务原文，详情里还有定时任务、文件资料、记忆、技能这些页签
    when: 用户打开这只 Bot 的右侧详情
    then: 子任务不铺在详情顶部把下面挡住；定时任务、文件资料、记忆、技能这些页签不用先把子任务列表滚完，就能直接点到
  - id: AC-2
    given: 当前这只 Bot 派生了若干子任务，标题是任务原文
    when: 用户在右侧详情里点开子任务页签
    then: 能看到当前这只 Bot 的子任务，每条标题仍是任务原文
  - id: AC-3
    given: 当前这只 Bot 没有子任务
    when: 用户打开右侧详情并进入子任务页签
    then: 这个页签里有一句说明目前没有子任务，详情顶部不留一块空白的子任务长列表
  - id: AC-4
    given: 两只 Bot 各自派生了不同的子任务
    when: 用户看过一只 Bot 的子任务页签，再换到另一只 Bot 并打开它的子任务页签
    then: 页签里只看到后一只 Bot 的子任务，看不到前一只的
  - id: AC-5
    given: 子任务页签里列出了当前这只 Bot 的一条子任务
    when: 用户点开这条子任务
    then: 主对话区打开的是这条子任务
  - id: AC-6
    given: 当前这只 Bot 有很多条子任务，标题都很长
    when: 用户打开子任务页签并往下看后面的条目
    then: 列表在这个页签内部滚动，详情的页签栏和关闭按钮仍留在屏幕里
