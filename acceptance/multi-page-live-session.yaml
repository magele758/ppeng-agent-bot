id: multi-page-live-session
title: 多个网页同时看到流式结果和页面状态
status: implemented
requirement: |
  如果有多个网页同时访问，现在会网页里不更新了，这个要能支持多个网页同时显示流式结果和页面状态的更新
criteria:
  - id: AC-1
    given: 同一场对话已经在一个网页里开始生成回复
    when: 另一个网页也打开这场对话
    then: 后打开的网页能看到这轮之后继续流出的内容，而且这场回复不会因此再跑一遍
  - id: AC-2
    given: 两个网页同时打开同一场正在生成的对话
    when: 其中一个网页关掉或刷新
    then: 剩下的网页继续看到后续流出的内容，这场回复也不停止
  - id: AC-3
    given: 两个网页同时打开同一场对话，其中一个正在显示流式结果
    when: 这场对话的页面状态发生变化，例如运行状态或标题
    then: 另一个网页上的页面状态也跟着更新，不必等这轮结束或手动刷新
notes: |
  assumedApproval: standing-order-2026-10-22
  选择：后打开的网页订阅已在进行的这一轮并显示之后的流式内容和页面状态，不另开一轮模型调用。关掉或刷新其中一个网页只断开它自己的显示。
