id: bot-work-restart-resume
title: 重启后从安全检查点继续 Bot 任务
status: implemented
requirement: |
  如果bot在执行过程中，服务重启了，之前的任务就直接停了，重启之后，也没有继续执行。开发期频繁重启时，canonical bot 对话里已经停在安全检查点上的任务要继续；做了一半且效果未确认的保持未知，必须确认后才能重试。
notes: 'assumedApproval: standing-order-2026-10-22'
criteria:
  - id: AC-1
    given: 一个 Bot 任务正在执行时进程退出了。对话里仍留着已关闭的安全检查点，检查点之后是空的，或者只有 read_file、grep_files、list_files、history_read、history_search、memory_get，并且没有未确认的外部效果。
    when: 启动恢复完成后再走一轮工作调度。该任务已经重新跑起来时，再调度一轮。
    then: 同一个任务可以继续执行，之前的对话没有被藏起来，也没有追加禁止继续的恢复说明。已经在跑时再调度一轮，不会把这个任务再启动一次。
  - id: AC-2
    given: 同样是执行中进程退出，但没有安全检查点，或者检查点已经不在当前对话里，或者还有未结束的工具调用，或者检查点之后有上述读取以外的工具，或者外部效果还没确认。
    when: 启动恢复完成，并经过工作调度。
    then: 该任务变成未知，旧的执行被收起，重试仍要明确确认。恢复不会把那些工具再执行一遍。
  - id: AC-3
    given: 一个任务正停在等待批准，对应会话也在等待批准。
    when: 服务重启并做启动恢复。
    then: 该任务不会被收成未知，也不会被当成新任务重新开始。
  - id: AC-4
    given: 一个任务仍在执行，它的会话上已经有一个还在等待、已经就绪，或暂时进行不了的持久等待。
    when: 服务重启并做启动恢复。
    then: 该任务不会被收起，也不会被标成未知。它留给这段等待的所有者继续，启动恢复不会接过这个任务。
