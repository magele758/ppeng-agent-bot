id: bot-room-goal-intake
title: 群目标与中途插话
status: implemented
owner: user
requirement: |
  群正在做事时，用户询问进度、补充约束或喊停，要马上得到对应处理，而不是等当前这轮全部跑完。
  看不出指哪一件事时先追问，不停止全体。
criteria:
  - id: AC-1
    given: 群里有一件尚未完成的事，成员正在处理
    when: 用户只询问进度
    then: 群里很快出现当前进度。正在做的事不被取消，也不因此新增一件目标
  - id: AC-2
    given: 用户说清了要改哪一件进行中的事
    when: 用户追加约束
    then: 之后的行动遵守新约束。来不及停下的冲突行动被标成待核对，不能算作按新约束完成
  - id: AC-3
    given: 群里有多名成员或多件进行中的事
    when: 用户点名取消其中一名成员，或点名取消其中一件事
    then: 只有该对象停止。其他成员和其他事继续。停止前已经来不及收回的动作显示为仍在收尾或待核对
  - id: AC-4
    given: 群里同时有多件进行中的事
    when: 用户的修改或取消看不出指哪一件
    then: 群里先追问。不擅自修改或取消，其他仍可继续的事不受影响
  - id: AC-5
    given: 群里已有一件未完成的事，某 Bot 自己的单聊里也有未完成的目标
    when: 用户在群里提出另一件明确独立的事
    then: 两件群里的事都保留进度，旧的不会被新的替换或误标完成。该 Bot 的单聊目标也不被这件群里的事替换
notes: |
  不改写、不替代 bot-multi-goal-coordination 的已批准标准。群目标与单聊目标分开。AC-4 与该规格 AC-4 的澄清行为一致，但是群里的另一份标准。
  不替代 bot-rooms AC-4、AC-5。待核对沿用 AC-5 的说法。
  待用户批准本规格后，才在旧标准说明里写上「单聊多目标规格保持原样」。本次不修改 bot-multi-goal-coordination.yaml 或 bot-rooms.yaml 的状态和正文，也不把它们标为 retired。

