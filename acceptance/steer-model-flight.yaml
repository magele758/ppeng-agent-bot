id: steer-model-flight
title: 模型生成期间插话与旧工具启动前转向
status: implemented
notes: |
  assumedApproval: standing-order-2026-10-22
  保留 steer-tool-continuity 的普通补充不中断语义；补齐生成期间尚无运行工具的窗口。
requirement: |
  帮我排查一下插话的功能，我觉得我实时插话，好像并没有立刻插入到bot的对话流中，我这2个引导他既没有回复我，也没有改变现有的执行方向，先检查是否是立刻插入到了会话流中，其次，按道理，我第二个指导发出，他应该停止之前的工具，然后按照新的插话的方式去执行才对
criteria:
  - id: AC-1
    given: Bot 正在等待模型生成旧计划
    when: 用户插话改变执行方式，随后生成的工具与新方式冲突
    then: 插话立即保存，冲突工具在启动前取消，下一轮收到插话和配对的取消结果并继续对话
  - id: AC-2
    given: 模型生成期间收到普通补充，或无法判断是否冲突
    when: 旧计划生成工具调用
    then: 保留不冲突的工具，判断超时不无限阻塞，已撤回插话不影响工具
  - id: AC-3
    given: 当前对话包含用户实时插话
    when: 下一次向模型发送输入
    then: 明确提示模型回应最新插话并按新要求调整冲突计划，持久化原文与位置不变
