id: chat-approval-inline
title: 待审批嵌在对话流里
status: implemented
requirement: |
  审批 UI 现在是挂在聊天面板顶部的横幅（待审批）。希望嵌进对话流，不要挂在顶部。
  把待审批渲染成对话里的一块，挨着正在等待的那次工具调用（ask_user 或其他），随消息滚动。
  去掉面板顶部的横幅。批准/拒绝和回复框保持可用。
  如果英文原因显示了两遍，只显示一遍。新文案走中英文 i18n，不要新造一套审批策略。
criteria:
  - id: AC-1
    given: 当前会话有一条待审批，对应的工具调用已经出现在对话里
    when: 用户查看这段对话
    then: 待审批出现在对话流中、紧挨着正在等待的那次工具调用，并随消息一起滚动；聊天面板顶部不再单独挂待审批横幅
  - id: AC-2
    given: 待审批的英文原因和提问区域会显示同一句英文
    when: 这块审批出现在对话里
    then: 这句英文只出现一次
  - id: AC-3
    given: 待审批是向用户提问，或是其他需要确认的工具
    when: 用户查看这块审批
    then: 提问仍可在回复框里填写并回复继续或拒绝；其他工具仍可批准或拒绝
notes: |
  负责人要求直接修好（fix now），标准随这次改动一起落地。没有新增文案，沿用原有审批 i18n。
