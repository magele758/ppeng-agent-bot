id: recap-content-only
title: 回顾有内容才展示
status: implemented
requirement: |
  如果没有回顾，就不要展示，只加一个主动回顾的按钮就行了，另外回顾逻辑给我说一下
notes: 'assumedApproval: standing-order-2026-10-22。按本次要求更新 session-recap AC-1、AC-3 的失败展示规则；自动触发与模型生成逻辑保持不变。'
criteria:
  - id: AC-1
    given: 回顾功能开启且会话已完成至少一轮
    when: 尚无回顾、生成失败或没有生成正文
    then: 不显示回顾卡片或失败提示，只保留主动回顾按钮供再次请求
  - id: AC-2
    given: 用户请求回顾
    when: 正在生成或已成功生成正文
    then: 生成期间仅显示禁用的回顾按钮，不能重复请求；成功后展示正文和收起按钮；收起后仍可主动回顾
