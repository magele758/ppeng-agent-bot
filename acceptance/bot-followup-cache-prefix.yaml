id: bot-followup-cache-prefix
title: 追问时复用上一轮已缓存的对话前缀
status: implemented
requirement: |
  为什么老是响应较慢？分析排查一下

  发现的问题都查一下和解决
criteria:
  - id: AC-1
    given: 一条 Bot 对话已经回答过一轮，用户紧接着再发一条消息，任务要点、待办或技能清单因此变了
    when: 把这一轮发给按请求开头做缓存的模型服务
    then: 请求开头的系统说明和上一轮完全一样，上一轮那条用户消息之前的全部对话逐字节相同；变化的内容随最新一条用户消息送达
  - id: AC-2
    given: 对话中途新增了一条运行时通知（例如目标开始或完成的通知）
    when: 发出下一次请求
    then: 请求开头的系统说明没有因为这条通知而改变；这条通知随最新一条用户消息送达，之前的对话逐字节相同
  - id: AC-3
    given: 一次请求带有每轮变化的上下文和若干条运行时通知
    when: 发给模型
    then: 这些内容一字不少、顺序不变地送达；请求里仍然只有开头一条系统消息；开头的系统说明告诉模型这段内容出自运行时而不是用户，并且只出现在最新一条用户消息的最前面
  - id: AC-4
    given: 请求里没有任何用户消息，或者调用方没有标明哪一段系统说明是固定不变的
    when: 发给模型
    then: 排布和以前一样，全部系统说明和运行时通知都在开头那条系统消息里
  - id: AC-5
    given: 最新一条用户消息带有图片
    when: 发给模型
    then: 每轮变化的上下文排在这条消息的最前面，图片和原文都还在
owner: user
notes: |
  assumedApproval: standing-order-2026-10-22
  只改每轮变化内容在请求里的位置，不改模型收到的信息，另加一句固定说明指出这段内容的位置和来源。
  只针对 Chat Completions 请求；Bot 主会话 50% / 85% 的压缩点不动。
