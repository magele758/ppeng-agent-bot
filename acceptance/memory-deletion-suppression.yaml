id: memory-deletion-suppression
title: 删除记忆后阻止自动写回
status: implemented
requirement: |
  先按你建议的顺序推进第一批：记忆删除抑制、严格预检、定时任务故障治理。按仓库的验收优先流程，先写验收标准给我确认。
notes: |
  第一批增量；保留 bot-history-memory 已批准标准。默认抑制持续到用户主动解除；本批不增加自动到期选项，不承诺删除历史原文。事实匹配覆盖规范化重复及明确同义改写，不要求任意语义等价都能识别。
criteria:
  - id: AC-1
    given: 用户拥有一条已保存记忆
    when: 用户在 Lab 删除它
    then: 该记忆立即从记忆列表和后续记忆召回中消失，并显示对应的自动学习抑制记录
  - id: AC-2
    given: 某条事实已被删除并处于抑制中
    when: 后续自动提取或整理再次从旧对话生成该事实，包括仅空白、标点不同或明确同义的改写
    then: 该事实不会重新出现在此作用域的记忆中，用户可以查看被抑制的原因
  - id: AC-3
    given: 用户删除某条事实时已有自动学习正在处理该事实
    when: 删除操作与自动学习先后完成
    then: 删除成功后该事实不会因这次在途学习重新出现
  - id: AC-4
    given: 某条事实已被抑制
    when: 服务重启后继续自动学习
    then: 抑制仍有效，且用户仍能查看对应记录
  - id: AC-5
    given: 某条事实只在用户甲的 Bot 甲记忆中被抑制
    when: 同一 Bot 学习无关事实，或用户甲的 Bot 乙及用户乙学习同一事实
    then: 无关事实及其他用户、其他 Bot 的合法学习不受该抑制影响
  - id: AC-6
    given: 用户能查看自己作用域内的抑制记录
    when: 用户在 Lab 明确选择重新记住该事实
    then: 仅对应抑制被解除，该事实重新成为可召回记忆，结果立即生效且无需重启
  - id: AC-7
    given: 用户无权管理另一用户或 Bot 的记忆
    when: 尝试查看、删除或解除其记忆抑制
    then: 操作被拒绝且不泄露该记忆内容
  - id: AC-8
    given: 系统无法可靠保存本次删除所需的抑制记录
    when: 用户请求删除记忆
    then: 界面明确显示删除未成功并可重试，不显示已成功遗忘
