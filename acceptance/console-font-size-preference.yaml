id: console-font-size-preference
title: 控制台字体大小偏好
status: implemented
requirement: |
  现在字体又太大了，你在设置里给我加一个字体大小选择的，尺寸参考macos的字体选择吧
notes: |
  参考 macOS 文字大小选择与即时预览的体验；以下数值是本项目的逻辑像素档位，
  不宣称与 macOS 的点数或系统字体尺寸完全等同。
  用户已确认，现同步修订 mac-retina-text-readability 的 AC-1、AC-2：
  原先统一的正文16px、控件14px下限改为服从用户字号选择；正文行高至少1.5倍、
  辅助文字至少12px、4.5:1对比度及浏览器放大可用性要求保留。
  此次确认同时涵盖上述旧标准修订。
  2026-10-21：4项新增行为测试先失败，随后10项字号与可读性浏览器回归通过；
  16项i18n测试、前端类型检查及静态验收门禁通过。200%布局使用等效CSS视口验证。
criteria:
  - id: AC-1
    given: 用户打开设置
    when: 查看外观设置或搜索字体大小
    then: 可找到字体大小选择，提供13、14、15、16、18px五档，标明当前选择及默认14px，并展示中英文与数字预览
  - id: AC-2
    given: 用户尚未设置字号或选择恢复默认
    when: 打开控制台
    then: 消息正文和输入文字为14px，导航、会话名称、按钮及表单文字为13px，辅助文字至少12px；正文行高至少为字号的1.5倍
  - id: AC-3
    given: 用户已打开对话且有未发送草稿
    when: 在设置中选择任意字号并返回对话
    then: 消息正文和输入文字使用所选字号，导航、会话名称、按钮及表单文字比所选字号小1px且不小于12px，辅助文字保持至少12px；无需刷新或重启，草稿和当前会话保留
  - id: AC-4
    given: 用户已选择字号
    when: 刷新页面、重新打开浏览器或切换控制台页面
    then: 同一浏览器保留选择，首次可见正文即使用已保存字号；偏好无法保存时明确提示，当前页面仍可调整且不会报错白屏
  - id: AC-5
    given: 用户选择任意字号并使用浅色或深色主题
    when: 在桌面或窄窗口阅读长标题、多行消息、代码及设置表单，或将浏览器放大到200%
    then: 文字与控件不重叠，输入和发送可用，允许合理换行、省略和区域滚动；文字有效对比度仍至少4.5:1，禁用控件除外
  - id: AC-6
    given: 用户选择中文或英文并使用键盘操作
    when: 查找、调整或恢复默认字体大小
    then: 选项及提示使用所选语言，控件具有明确名称和可见焦点，键盘可完成选择及恢复默认
