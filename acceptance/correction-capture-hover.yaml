id: correction-capture-hover
title: 纠错转评测改为悬停图标
status: implemented
requirement: |
  用户指着助手气泡旁一直显示的按钮「纠错转评测」（button.btn.btn-ghost.btn-sm，组件 CorrectionCapture），说这个太重了。改成 hover 才展示的图标，不要一直展示文字按钮。

  要做成：
  - 默认不显示「纠错转评测」文字，也不占一行。
  - 鼠标悬停这条助手回合（气泡或标签行）时，才出现一个小图标。键盘聚焦到这条回合时也能看到，避免只能用鼠标。移开后图标消失。
  - 点图标仍展开原来的表单，保存、字段、出现条件都不变：正在输出的消息、用户消息仍然没有这个入口。
  - 图标要有可访问名称，文案走 i18n，不要硬编码新的中英文。不要改评测保存逻辑。
notes: |
  assumedApproval: standing-order-2026-10-22
criteria:
  - id: AC-1
    given: 对话里有一条已经说完的助手回复
    when: 鼠标没有停在这条回复上，键盘焦点也不在这条回复里
    then: 看不到「纠错转评测」这几个字，也没有占一行的文字按钮
  - id: AC-2
    given: 这条已经说完的助手回复
    when: 鼠标悬停在这条回复的气泡或标签行上，或者键盘焦点进入这条回复
    then: 出现一个小图标，可访问名称用当前界面语言里的纠错文案；鼠标移开并且焦点离开后图标消失
  - id: AC-3
    given: 图标已经出现
    when: 点这个图标
    then: 展开原来的纠错表单，字段和保存方式与原来一样
  - id: AC-4
    given: 用户自己的消息，或助手还在输出、尚未落成回复的消息
    when: 看这些消息
    then: 没有纠错入口
