id: bot-reply-quote
title: 引用某条 Bot 回复再发消息
status: implemented
requirement: |
  我还想要加一个回复bot里某个具体回复的能力，类似引用的能力
owner: user
notes: |
  负责人已确认。先写带标签的失败测试，通过后再把 status 改为 implemented。
  一对一和群聊都要。引用对象是已经出现的 Bot 回复，不是用户自己的消息。
criteria:
  - id: AC-1
    given: 一对一 Bot 对话里已经有一条 Bot 回复
    when: 用户对这条回复选择引用，写一句新话并发送
    then: 发出的消息上能看到这条回复的引用，随后 Bot 的回答是针对这句引用，而不是把整段对话当成没有指定对象
  - id: AC-2
    given: 用户已经选中一条 Bot 回复作为引用，还没发送
    when: 用户取消这次引用再发送
    then: 发出的消息没有引用，Bot 按一条普通新消息回答
  - id: AC-3
    given: 被引用的 Bot 回复很长
    when: 用户发出带引用的消息
    then: 消息上的引用是这段回复的短摘录，并看得出是哪一条；Bot 仍按完整的那一条回复来回答
  - id: AC-4
    given: 群聊里有多个 Bot，其中一条是某个 Bot 的回复
    when: 用户只引用这一条并发送
    then: 群里的新消息带上这条引用，并看得出是哪个 Bot 的哪一句；被点名的回答针对这句，其他 Bot 不会把它当成对自己说的
  - id: AC-5
    given: 一条带引用的用户消息已经发出
    when: 用户离开后再打开这段对话
    then: 引用仍挂在原来那条用户消息上，摘录和来源不变
  - id: AC-6
    given: 用户想引用的那条 Bot 回复已经不在当前屏幕上
    when: 用户滚到它并选择引用
    then: 可以引用较早的回复，效果与引用刚出现的回复相同
