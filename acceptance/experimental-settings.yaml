id: experimental-settings
title: 设置里的实验特性菜单
status: implemented
notes: |
  assumedApproval: standing-order-2026-10-22
  后续用户要求 Jev 移入模型且始终显示连接配置，见 jev-model-settings；其余实验项不变。
requirement: |
  用户刚得知 Jev 评估藏在「设置 → 集成与可观测 → 显示高级」里，说这样太深了。要求：把这些高级配置单独抽一个配置菜单，名字叫「实验特性」。

  先读设置信息架构：apps/web-console 的 nav（lib/nav.ts）、设置分类 sections/settings/categories/*.tsx、advanced 默认隐藏的机制、doc/UI_REDESIGN.md 里和设置相关的部分。弄清现在哪些条目被标成 advanced、入口在侧栏还是设置内部。

  要做成：
  1. 有一个一眼能看到的配置菜单，文案是「实验特性」（英文 Experimental）。不要再要求先打开「显示高级」才能看见这些配置。
  2. 现在被 advanced 收起来的设置项（含 Jev 评估，以及同一套 advanced 机制里的其它高级项）挪进这个菜单。原位置不要留空壳重复入口。若「显示高级」只是为了露出这些项，挪走后这个开关也不要再挡路；如果它还控制别的东西，只把实验项移走，其余行为保持。
  3. 菜单放在现有设置导航里，作为和「模型」「集成与可观测」同级、默认可见的一项（hash 路由跟现有 #/settings/... 一致）。不要新造一套与 Lab 导航无关的页面，也不要只在搜索里才能找到。
  4. 文案走 i18n，zh 与 en 同一套 key。不要硬编码中英文。不要新增 RAW_AGENT_*。
  5. 只搬入口和分组，不要改这些配置的保存、字段和生效逻辑。

  后续：实验特性里每一项都要能一眼看出开/关，并且有自己的开关。每一项一行：名称、一句它做什么、一个开关。关：这项不生效（Jev 就是不调用，等同关闭档）。开：这项生效，它自己的配置出现在这一项下面（Jev 的地址、Key、档位仍用现有保存逻辑）。已有关闭/精简/标准这类档位的，菜单上的开关是总闸：关=不调用；开=使用该项里保存的档位，若保存的档位本身是关闭，打开开关时落到该项原来的默认启用档（Jev 用标准）。持久化走现有 Lab 配置，不要新增 RAW_AGENT_*。上面第 5 条「不改生效逻辑」由这一条代替。
criteria:
  - id: AC-1
    given: 用户打开设置，且没有打开「显示高级」
    when: 查看设置里与「模型」「集成与可观测」同级的菜单
    then: 能直接看到并进入「实验特性」（英文 Experimental），地址是设置下的子页，不必先打开「显示高级」，也不必靠搜索才找得到
  - id: AC-2
    given: 用户没有打开「显示高级」
    when: 进入「实验特性」
    then: 能看到原先要打开「显示高级」才出现的其它设置项（模型回退、上下文压缩、目标校验、循环内核、Cloudflare 沙箱、动态工具、能力发现、Langfuse）
  - id: AC-3
    given: 用户没有打开「显示高级」，并打开「集成与可观测」等原分类
    when: 寻找 Jev 评估和上述实验项
    then: Jev 唯一入口在模型，其余实验项不在原分类里重复出现；「显示高级」仍可展开它本来就控制的其它分组（如通用 Webhook），但不再是看到这些实验项的必经之路
  - id: AC-4
    given: 用户打开设置，且没有打开「显示高级」
    when: 进入「实验特性」
    then: 每一项都是一行，有名称、一句说明和一个开关；开关本身表示开或关，不必钻进表单才知道状态
  - id: AC-5
    given: 某一项已经保存了自己的配置；Jev 的档位如果是关闭
    when: 把该项的开关关掉再打开
    then: 关掉时这项不生效，实验项详细配置收起（Jev 已移入模型且始终显示配置），已保存的地址、Key、档位和其它字段还在；Jev 关掉等于不调用。再打开时使用保存的档位并出现该项配置；若保存的档位本身是关闭，打开后落到该项原来的默认启用档（Jev 为标准），而不是仍关着
  - id: AC-6
    given: 用户改过某一项的开关
    when: 刷新「实验特性」
    then: 开关状态还在，走的是现有 Lab 配置，没有新增 RAW_AGENT_*
