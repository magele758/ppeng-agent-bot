id: low-interference-onboarding-goals
title: 仅向新用户展示首次引导并隐藏少量目标面板
status: implemented
requirement: |
  这个不要每个bot第一次创建都搞一个，判定是新用户才加这个，如果不是就不要搞这个了
  没有目标或者少于2个目标的时候，目标与进展可以不展示，减少干扰
criteria:
  - id: AC-1
    given: 用户此前已发送过对话消息或关闭过首次任务引导
    when: 新建 Bot、切换 Bot 或刷新页面
    then: 不再展示首次任务引导，不按每个 Bot 重复展示
  - id: AC-2
    given: 用户没有任何对话使用记录且未关闭过首次任务引导
    when: 首次进入空白 Bot 对话
    then: 可以看到首次任务引导；关闭引导或发出第一条消息后，其他 Bot 和刷新后的页面也不再展示
  - id: AC-3
    given: 当前 Bot 有零个或一个目标
    when: 打开对话或目标数量更新
    then: 不展示目标与进展面板，不留空白占位；目标数据及执行不受影响
  - id: AC-4
    given: 当前 Bot 有至少两个目标
    when: 打开对话或目标数量更新
    then: 正常展示目标与进展面板；数量降到两个以下时自动隐藏
notes: |
  新用户按现有对话使用记录与已关闭引导记录判断，不按 Bot 是否新建判断。
  数据尚未加载时不短暂弹出引导或目标面板。目标数量按面板原本展示的目标集合计算，不修改筛选和执行规则。
  2026-10-21 补充验证：当前开发页的三个独立浏览器用例通过，未向真实 Bot 发送消息或修改目标。
  实现与 bot-first-task-new-user、bot-goals-panel-threshold 一并整理交付，测试复用更完整的首次引导与目标阈值用例，保留本规格全部标准及标签。
  整理验证：36 项相关 Playwright 用例、24 项单元及国际化用例、生产构建与静态验收门禁通过。
