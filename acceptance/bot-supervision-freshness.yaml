id: bot-supervision-freshness
title: "Bot 监督状态新鲜度与回复关联"
status: implemented
requirement: |
  那就按v2计划开始改，先把日志里这些真实问题复现成测试，再逐项修好，验收通过后review、提交PR并合并，不要停下来等我确认。
notes: 'assumedApproval: standing-order-2026-10-22；v2 R3 监督快照、请求回执和真实观察时间；R2 的观察门禁继续有效。'
criteria:
  - id: AC-1
    given: "用户要求监督若干开发 Bot"
    when: "一次监督检查开始"
    then: "监督先取得指定 Bot 当前工作与证据采样时间，再决定是否询问、协助或报告，而不是先重复催促"
  - id: AC-2
    given: "某 Bot 主会话空闲但外部开发进程仍在运行"
    when: "监督或用户查询工作状态"
    then: "工作显示外部执行的实际状态与最近观察时间，不把会话空闲解释为工作停止或完成"
  - id: AC-3
    given: "监督发出一次状态刷新请求"
    when: "对方确认收到但尚未给出新证据，或在期限内没有回复"
    then: "系统分别显示已接收、等待新状态或未回复，不把消息送达当成取得最新状态"
  - id: AC-4
    given: "对方刚回复但引用的是较早的观察结果"
    when: "监督读取回复"
    then: "明确保留原证据采样时间并标示过期，不把收到回复的时间当作现场检查时间"
  - id: AC-5
    given: "监督只关注当前几只 Bot 的活跃开发工作"
    when: "读取状态并向用户汇报"
    then: "默认得到精简的工作阶段、阻塞、下一步和必要证据，历史无关任务按需读取，用户报告采用简短列表"
  - id: AC-6
    given: "定时任务运行期间检查未执行、检查失败或没有新证据"
    when: "系统生成本轮结果"
    then: "显示未核验或具体检查失败，只有成功观察且无变化时才按静默策略处理，不能把未检查包装为健康巡检成功"
