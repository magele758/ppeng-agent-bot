id: multi-machine-readonly-pilot
title: 多机软件工厂第一阶段：只读试运行
status: implemented
requirement: |
  按这个方案推进，先做第一阶段的只读多机试运行，把群到任务的通道、机器执行与容量、统一任务状态的验收标准写出来给我确认。
notes: |
  本阶段包含群内派单、机器配置与只读执行、容量调度、统一任务状态、结果回群和基础巡检。
  只读指不修改目标仓库、分支、依赖或运行中的服务；允许保存工厂自己的任务记录、执行日志和巡检记录。
  首轮真实机器验收使用读取分支/SHA、读取已有日志、统计文件等任务；不运行可能生成产物或修改依赖的检查命令。
  开发、安装依赖、测试/评审修复循环、推送、合入、部署和清理分支/worktree属于后续阶段。
  默认机器容量为 Ubuntu1=2、Ubuntu2=2、4090=5、MacBook=0；名称与连接信息可由用户配置。
  自动化测试之外，还需在至少两台真实执行机器上完成人工可核对的只读试跑；自动化模拟通过不代表真实多机验收通过。
criteria:
  - id: AC-1
    given: 用户有工厂管理权限
    when: 在 Lab 保存机器名称、连接方式、关联 Bot 和执行容量
    then: 配置刷新后仍保留，后续新任务立即使用已保存配置，无需修改环境变量或重启服务。
  - id: AC-2
    given: 用户已配置一台执行机器
    when: 在 Lab 检查连接
    then: 显示该机器是否可达及可核对的机器身份，失败时给出可理解的原因，连接凭据不出现在群消息或普通执行日志中。
  - id: AC-3
    given: 协调 Bot 和执行 Bot 已加入协作群，目标机器可接收任务且有空位
    when: 有权限的用户在群里要求协调 Bot 给指定机器派发一个只读任务
    then: 群里返回可追踪的任务编号与目标机器，该任务实际进入后台执行，不以一条口头回复代替派发。
  - id: AC-4
    given: 一个群内派单请求已被接收
    when: 同一请求因重复投递或提交重试再次到达
    then: 返回原任务编号，机器上只出现一次该任务的执行。
  - id: AC-5
    given: 发起人无目标机器的派单权限，或指定了不存在的机器
    when: 发起群内派单
    then: 明确告知拒绝原因，目标机器不执行任务。
  - id: AC-6
    given: 一个任务被指定给某台机器
    when: 该任务开始执行
    then: 执行记录证明只读操作发生在指定机器，并能核对目标仓库、分支和提交，不会静默改在协调服务所在机器执行。
  - id: AC-7
    given: 工厂处于第一阶段只读试运行
    when: 派发修改目标仓库、安装依赖、推送、合入、部署、删除分支或工作目录的请求
    then: 在机器执行前拒绝请求并说明只读限制，用户仅通过任务文字要求放行不能解除限制。
  - id: AC-8
    given: 机器执行槽位已满
    when: 从群聊或其他派单入口同时提交更多任务
    then: 新任务保持排队，该机器实际同时执行的工厂任务数不超过保存的容量。
  - id: AC-9
    given: 多个 Bot 关联同一台机器
    when: 这些 Bot 同时接收任务
    then: 所有 Bot 共用该机器的容量上限，不因 Bot 数量增加而突破上限。
  - id: AC-10
    given: 一台机器的执行容量为零
    when: 用户尝试向它派发执行任务
    then: 明确提示该机器不接收执行任务，不启动任务，也不产生永远等待空位的排队任务。
  - id: AC-11
    given: 一台机器有排队任务
    when: 正在执行的任务确认成功、失败或取消完成并释放空位
    then: 最早排队且符合执行条件的任务自动开始，不需要再次在群里催办。
  - id: AC-12
    given: 机器不可达，或执行中的机器失去连接
    when: 系统检测到连接异常
    then: 机器显示离线，新任务不启动；执行中的任务显示待核实，不自动改派或重复执行，原执行未确认结束前仍计入占用。
  - id: AC-13
    given: 一个只读任务已被接收
    when: 用户从任务详情、机器看板或群内查询其进展
    then: 各入口显示同一任务编号、目标机器、当前状态、最近进展时间和结果，不出现相互矛盾的完成结论。
  - id: AC-14
    given: 一个只读任务正常执行完毕
    when: 查看任务历史
    then: 能按时间核对排队、执行中、成功的变化，以及开始和结束时间、机器身份、目标提交与只读结果；成功只表示本次只读任务完成。
  - id: AC-15
    given: 只读任务执行报错或超过任务设定的执行时限
    when: 系统处理执行结果
    then: 显示失败或超时及原因，保留已有输出；远程执行尚未确认结束时显示待核实，不把停止等待结果当成执行成功或已释放空位。
  - id: AC-16
    given: 服务重启前存在排队或执行中的任务
    when: 服务恢复并与机器重新核对
    then: 保留原任务编号和历史，排队任务继续等待或执行，原执行中的任务根据核实结果续接或保持待核实，不直接重复启动。
  - id: AC-17
    given: 任务已完成核实并有较新的状态
    when: 收到重复或延迟的旧进度报告
    then: 当前状态和结果不被旧报告覆盖，已结束任务不倒退为执行中。
  - id: AC-18
    given: 群内派发的任务产生成功、失败或待核实结果
    when: 结果送回原协作群，或服务恢复后再次尝试送达
    then: 群里只出现一条对应结果变化的有效报告，包含任务编号、机器和结论，不暴露凭据，也不引发其他 Bot 自动创建相同任务。
  - id: AC-19
    given: 用户启用前已保存每小时巡检，时区为 Asia/Shanghai
    when: 创建巡检并随后由用户在 Lab 启用
    then: 新建时保持停用，启用后按所选时区每小时检查，暂停后停止产生新的巡检执行。
  - id: AC-20
    given: 没有未结束任务，或任务状态无变化且没有执行中任务超过一小时无进展
    when: 巡检触发
    then: 只做便宜检查，不访问执行机器、不调用模型、不向群或用户发送消息。
  - id: AC-21
    given: 一个执行中任务超过一小时没有进展报告
    when: 巡检核实进程、日志或状态新鲜度、最近提交和 CPU 情况
    then: 保留四项核实结果，仅对有停滞证据或机器离线的任务发询问式提醒；排队等待空位不算卡住，无法核实的情况明确标为待核实。
  - id: AC-22
    given: 同一任务的同一卡点已经提醒过且没有实质变化
    when: 后续巡检触发或巡检服务重启
    then: 不重复催办或私信；01:00至08:00按 Asia/Shanghai 只发送新卡住或需要用户处理的提醒，无变化时保持安静。
  - id: AC-23
    given: 至少两台真实执行机器已配置且连接验证通过
    when: 从协作群分别派发读取仓库分支与提交的只读任务
    then: 两台机器均留下可核对的实际执行记录，Lab 和群内结果与各机器现场读取值一致，目标仓库内容、分支和运行中的服务保持不变。
