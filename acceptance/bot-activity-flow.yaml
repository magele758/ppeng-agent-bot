id: bot-activity-flow
title: 从 Bot 运行记录查看工作流
status: implemented
notes: "assumedApproval: standing-order-2026-10-22"
requirement: |
  然后这个bot的逻辑工作流，如果有逻辑关系，我希望能有一个可视化的界面来看到这个逻辑流的日常流的情况，比如流转到哪里了，卡在哪里了，是否成功以及结果和消耗，点击能跳转到bot或者他的子任务会话里，其实就是把逻辑流程可视化一下，算个没用，但是有意思的功能吧，你看看帮我设计和实现一下，要能根据我的bot对话的实际情况来动态生成，不要搞一个配置来搞这个，要零侵入的实现这个流的能力
criteria:
  - id: AC-1
    given: 已有委派和群聊执行记录
    when: 打开工作流
    then: 根据真实父子关系和参与会话展示步骤，可打开相应会话，时间接近的独立工作不会被连接
  - id: AC-2
    given: 定时工作有运行及结果记录
    when: 查看进度
    then: 显示运行状态及结果，区分受阻报告和正常完成，未记录的费用显示未知
