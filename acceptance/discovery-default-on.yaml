id: discovery-default-on
title: 能力发现总开关默认开启
status: implemented
requirement: |
  能力发现 / tool_search 的总开关要默认开启。
notes: |
  只改「从未在界面保存、也没有另行指定」时的默认。界面里已经保存的开或关优先。
  未保存时，若安装配置已经单独指定开或关，仍遵从该指定；不新增开关，也不靠改安装配置来达到默认开启。
  默认开启只指总开关。读取设备列表、主动扫描和探查白名单仍默认关闭或空白。
  用户于 2026-10-21 确认开发时，原 AC-6（每轮仍把全部工具的完整定义交给模型）在批准前删除，避免和 necessary-tool-injection 冲突。工具定义范围以那份规格为准。
criteria:
  - id: AC-1
    given: 从未在「更多 → 能力发现」保存过设置，也没有另行指定这项开关
    when: 用户打开一个新会话，模型调用 tool_search
    then: 调用不会因为能力发现未开启而失败；能力发现处于可用状态。没有匹配结果时可以说明没找到，但不得用「未开启」拒绝
  - id: AC-2
    given: 用户曾在「更多 → 能力发现」把「启用能力发现」关掉并保存
    when: 之后打开该页，或在新会话里模型再次调用 tool_search
    then: 总开关仍是关。tool_search 仍被拒绝，并说明能力发现未开启
  - id: AC-3
    given: 用户曾在「更多 → 能力发现」打开「启用能力发现」并保存
    when: 之后打开该页，或在新会话里模型调用 tool_search
    then: 总开关仍是开。tool_search 不会因为能力发现未开启而失败
  - id: AC-4
    given: 从未在「更多 → 能力发现」保存过，但这份安装已经单独把能力发现指定为关闭
    when: 用户打开一个新会话，模型调用 tool_search
    then: 调用仍被拒绝，并说明能力发现未开启
  - id: AC-5
    given: 从未保存过能力发现设置，也没有另行指定
    when: 用户打开「更多 → 能力发现」
    then: 「启用能力发现」显示为开，并标明默认是开；把总开关关掉后再恢复默认，会回到开。读取设备列表和主动扫描仍是关，允许探查的主机和网段仍为空。页面说明与此一致，不再把总开关说成默认关闭
