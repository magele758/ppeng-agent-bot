id: bot-room-speaker-identity
title: Bot 一开始就知道群里发言用自己的身份
status: implemented
requirement: |
  bot回复群聊的时候，或者从单聊发送消息到群聊的时候，现在是不是没有指定发送人的身份的？比如我从单聊让bot去群里回复，他没办法使用自己的身份去发送消息
  好像是可以的，但是好像各个bot开始不知道这个规则，你看看增强一下这个
criteria:
  - id: AC-1
    given: 一个 Bot 正在群聊里轮到自己回复
    when: 它收到这一轮的说明
    then: 说明写明这条回复会自动记在它自己的名字下，它不用也不能另选发送人
  - id: AC-2
    given: 一个 Bot 在自己的单聊里，并且能往群里发一条消息
    when: 它阅读常驻说明和这个发群工具
    then: 说明写明该工具是以人的身份发到群里并叫醒成员；要显示成自己，得写在自己的群聊回复里
  - id: AC-3
    given: 这个 Bot 在群聊回合里写出一条普通回复
    when: 这条回复出现在群里
    then: 发送人是这个 Bot，不是人
