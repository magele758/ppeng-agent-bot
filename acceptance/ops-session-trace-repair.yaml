id: ops-session-trace-repair
title: 运维会话轨迹能定位没看过的对话
status: implemented
requirement: |
  上一轮结论是：运维会话轨迹不够。用户说「那你就去补上啊」。补的是下面这 5 项「缺了会修不了」，不要顺手做「有了更好」里的模型调试日志页面、toolCallId 耗时、会话列表父会话标记，除非为了这 5 项必须碰到。

  1. tool_end 写上工具参数和失败正文。现在只有工具名和 ok。失败时要能看到命令/参数和报错（stdout/stderr/异常里真正的错误）。成功时参数也要在，结果正文过长就沿用会话消息已有的头尾保留、中间省略（约 12 万字那套），不要整段无限写入。
  2. 轨迹里要有用户话和助手正文。空转、截断要能看到复读了什么、断在哪一句。不要把整份 prompt 或系统提示倒进去。只记本轮用户可见的用户消息和助手输出。过长同样头尾保留。
  3. spawn_subagent / 会创建子会话的工具，在轨迹里记下子会话 id，能对上另一场轨迹。goal 续跑、concurrent-bot-work、botGoalWorker 若已有子会话，也要能从父轨迹找到子会话 id。
  4. 运维页面不要只拿最后 500 条。读取上限已是 5000，页面要用上，避免 134 轮这种场次把开头静默丢掉、统计变小。若 5000 仍不够，不要静默截断：页面上要能看出「还有更早的记录没显示」。不要为此新增 RAW_AGENT_*。
  5. 目标没达成要能看出来：goal_eval.met=false 计入出错/可筛选，并带上目标原文（或标题）和拿去评判时的那句 reason。reason 仍是「goal not met」时，至少让人知道目标是哪一句。

  密钥沿用现有 result redaction，写成 [REDACTED:名字]，不要把 .env / token 原样写进 events.jsonl。
  用户可见的新文案走 i18n，zh/en 同步。禁止新增 RAW_AGENT_*。
notes: |
  assumedApproval: standing-order-2026-10-22
  未达成的目标计入既有「只看出错」筛选，不另开一套错误开关。
criteria:
  - id: AC-1
    given: 一轮里有工具调用，其中一次失败，参数里带有命令，输出或异常里有真正的报错，并且参数或报错里出现了密钥
    when: 查看这次工具结束在会话轨迹里的记录
    then: 能看到工具参数（含命令）和报错正文；密钥显示为 [REDACTED:名字]，原文不在记录里
  - id: AC-2
    given: 一次工具调用成功，结果正文长过约 12 万字的头尾保留上限
    when: 查看这次工具结束在会话轨迹里的记录
    then: 参数仍在；正文保留开头和结尾并注明中间省略，而不是整段无限写入
  - id: AC-3
    given: 一轮对话有用户能看到的用户消息和助手回复；另有一轮输出在复读后被中止，或回复在某一句被截断
    when: 查看这两轮的会话轨迹
    then: 轨迹里有本轮用户消息和助手正文，没有整份系统提示；复读中止能看到复读内容，截断能看到断掉的那句；过长文本同样头尾保留
  - id: AC-4
    given: 父会话通过会创建子会话的工具（含 spawn_subagent）拉起子会话，或通过目标续跑、并发 Bot 工作、目标 worker 拉起已有子会话
    when: 查看父会话轨迹
    then: 能找到子会话 id，并据此对上另一场轨迹
  - id: AC-5
    given: 一个会话的轨迹超过 500 条但不超过 5000 条（例如一百多轮），另一个会话超过 5000 条
    when: 在运维「会话轨迹」打开它们
    then: 页面按已有 5000 条上限读取，一百多轮的开头仍在、摘要不会因此变小；超过 5000 条时页面说明还有更早的记录没显示
  - id: AC-6
    given: 一轮的目标评判没有达成，理由仍是「goal not met」或一句具体 reason，并带有目标原文或标题
    when: 打开「只看出错」，并查看这条评判
    then: 该轮出现在出错结果里；能看到目标原文或标题，以及拿去评判的那句 reason；理由只是「goal not met」时仍能看出目标是哪一句
