id: bot-child-task-chat-entry
title: 普通会话列表里的 Bot 子任务入口
status: implemented
requirement: |
  “可以考虑让bot模式加一个能力：自动在输入框填下一次可能输入的内容（用输入框的提示模式），tab才真实输入，如果不tab直接输入，就正常输入，这个下一次的提示来”: 这个会话是bot的子任务是吗？我看点击是跳转到会话页面了？会话页面那边列表里没有，要么在会话列表里可以加个入口也可以
notes: |
  这是对已实现规格 bot-fork-sessions-in-detail AC-5 的收窄。
  Bot 模式左侧仍然不列出子任务；变的是普通会话页的会话列表要能看到这些子任务入口。
  2026-10-22 用户确认 bot-child-task-chat-entry 后，子任务出现在普通会话列表，不再要求普通列表完全隐藏。
criteria:
  - id: AC-1
    given: 一只 Bot 的详情里列着一条子任务
    when: 用户点开这条子任务
    then: 主区打开的就是这条子任务
  - id: AC-2
    given: 用户刚从这只 Bot 的详情点开一条子任务，主区正打开它
    when: 用户查看普通会话页左侧的会话列表
    then: 列表里有这条子任务的入口
  - id: AC-3
    given: 普通会话页左侧的会话列表里有这条子任务的入口，主区正打开它
    when: 用户看这条入口
    then: 能看出当前打开的就是这一条
  - id: AC-4
    given: 会话列表里有一条 Bot 子任务入口
    when: 用户看这条入口的标题
    then: 标题是这条子任务的任务原文，不是裸的 bot id
  - id: AC-5
    given: 这条子任务入口属于某一只 Bot
    when: 用户看这条入口
    then: 能辨认它属于哪只 Bot，看到的是这只 Bot 的名字或同等可读标记，而不是只剩一长串 id
  - id: AC-6
    given: 这只 Bot 除了当前这条，还有其他子任务
    when: 用户在普通会话页查看会话列表
    then: 这只 Bot 的其他子任务也能在会话列表里找到
  - id: AC-7
    given: 另一只 Bot 也有自己的子任务
    when: 用户在普通会话页查看会话列表
    then: 另一只 Bot 的子任务能看出属于那一只，不会和这只 Bot 的子任务混成看不出归属
  - id: AC-8
    given: 这些子任务已经出现在普通会话页的会话列表里
    when: 用户查看 Bot 模式左侧列表，包括未分组、功能分组和置顶
    then: 这些子任务仍然不出现在这些位置
  - id: AC-9
    given: 这些子任务已经出现在普通会话页的会话列表里，Bot 模式左侧能看到未分组、功能分组和置顶的数量
    when: 用户查看这些分组数量
    then: 这些子任务不计入那边的分组数量
  - id: AC-10
    given: 普通会话页里有普通聊天会话，会话列表里同时也有 Bot 子任务入口
    when: 用户查看会话列表
    then: 这些普通聊天会话仍在列表里
  - id: AC-11
    given: 没有任何 Bot 子任务
    when: 用户查看普通会话页的会话列表
    then: 会话列表不多出空入口
  - id: AC-12
    given: 一只 Bot 自己没有子任务
    when: 用户查看普通会话页的会话列表
    then: 不为这只没有子任务的 Bot 多出空入口
