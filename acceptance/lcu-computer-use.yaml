id: lcu-computer-use
title: 本机 LCU 桌面操作接入
status: implemented
requirement: |
  那你去接一下
notes: |
  承接上一轮已讨论的方案：在 ppeng-agent-core 宿主层接入可选 LCU 桌面能力，
  agent-loop 保持通用 SDK；首期验证本机 macOS 桌面，不启用浏览器或音频能力。
  协议和界面自动化测试之外，必须记录本机真实模型、实际桌面操作及独立结果检查。
criteria:
  - id: AC-1
    given: 本机满足桌面操作条件，且用户已启用桌面操作能力
    when: 用户让 Agent 操作桌面应用
    then: Agent 能发现并调用桌面工具；关闭此能力后，普通聊天和其他工具仍可正常使用
  - id: AC-2
    given: Agent 首次操作尚未授权的应用
    when: 出现应用授权请求
    then: 用户能看见并决定授权；拒绝或关闭请求后，Agent 不操作该应用并明确报告未获授权
  - id: AC-3
    given: 用户已授权一个临时 TextEdit 文档
    when: 真实 Agent 按要求输入指定文字并保存文档
    then: 磁盘上的文档经独立读取与指定文字一致，且返回的截图实际进入模型可见的对话内容
  - id: AC-4
    given: 两个对话都使用桌面操作能力
    when: 它们各自执行操作，且其中一个对话结束
    then: 对话上下文和授权不会相互冒用；结束一个对话不清除另一个对话的有效状态
  - id: AC-5
    given: Agent 正在操作桌面或有待执行的操作
    when: 用户停止当前回合
    then: 停止后不再执行排队的操作，当前回合的临时资源得到清理，未完成的动作不被报告为成功
  - id: AC-6
    given: 桌面能力缺少必要组件、系统权限不足、连接失败或执行报错
    when: 用户尝试使用桌面操作
    then: 用户看见具体失败原因和可采取的下一步；原始错误保留，失败不会被显示为成功
  - id: AC-7
    given: 多个 Agent 同时请求操作同一个桌面
    when: 它们准备点击、输入或切换窗口
    then: 操作按顺序执行，不因并发操作把输入发到另一个 Agent 的目标窗口
