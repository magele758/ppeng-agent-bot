id: loop-guard-model-switch
title: 重复检测默认只约束弱模型
status: implemented
requirement: |
  另外，我觉得 agent 的重复判断是不是过于严格了，我经常使用着，他就说多个工具重复，然后把 agent-loop 断开了，看看是否可以放松一点，还有使用查看文件的限制，好像也过于强了，你要么加个开关，我觉得目前重复检测可以只针对弱的模型，这样我可以通过开关来控制，同时放开强模型的能力
notes: |
  assumedApproval: standing-order-2026-10-22
  弱模型：本地演示模型，以及名字分段里带 mini、small、haiku、flash、nano、lite 的模型（如 gpt-4o-mini）。强模型：其余常见大模型，以及无法判断强弱的名字。大小标记优先，所以带 mini 的不算强。
  三档：仅弱模型（默认）、全部模型、关闭。关闭后不再因重复或查看次数断开。安全沙箱、审批、敏感路径拒绝、打开图形界面和无限制扫盘仍然拒绝。同一工具连续失败仍会停下，那是失败不是重复。
criteria:
  - id: AC-1
    given: 重复检测保持默认（只约束弱模型），当前对话用的是弱模型
    when: 同一段工作里连续多轮用同样的方式调用工具，包括一轮里同时查看文件和搜索，内容没有变化；或者过多地列出目录、搜索代码
    then: 这段工作会断开，对话里能看出是因为重复检测；过多的目录列出和代码搜索仍会被拦住
  - id: AC-2
    given: 重复检测保持默认，当前对话用的是强模型（含无法判断强弱的模型名）
    when: 同一段工作里多次用同样的方式调用工具，或反复查看、搜索文件
    then: 不会因为多个工具重复或查看次数而断开，这些查看和搜索会真正执行
  - id: AC-3
    given: 用户在设置里把重复检测改成全部模型并保存
    when: 不重启，下一轮起让强模型继续用同样的方式反复调用工具，或反复列出目录
    then: 这段工作会因为重复检测断开，过多的目录列出也会被拦住
  - id: AC-4
    given: 用户在设置里把重复检测改成关闭并保存
    when: 不重启，下一轮起让弱模型用同样的方式反复调用工具或反复列出目录，同时仍尝试打开图形界面、无限制地扫描系统目录，以及读取名为 .env 的敏感文件
    then: 不会因为重复或查看次数断开，目录列出也会执行；打开图形界面、无限制扫描和读取敏感文件仍然被拒绝
  - id: AC-5
    given: 用户打开设置里的对话默认行为
    when: 查看重复检测这一项
    then: 能看到三档，仅弱模型、全部模型和关闭，默认是仅弱模型，中文和英文都有对应文案
