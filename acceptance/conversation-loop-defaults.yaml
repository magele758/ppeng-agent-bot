id: conversation-loop-defaults
title: 对话默认行为要进入新对话和正在跑的普通对话
status: implemented
requirement: |
  检查设置页「对话默认行为」里的配置，以及这个页面里的配置是否都生效了。感觉没有生效；而且改了「工作中发来新消息」（新消息是否转向）也没有办法保存。
  这一页有：默认任务模式、默认技能范围、重复检测、工作中发来新消息。底部写着「已保存，立即生效」。
  找出这四项各自是否保存且生效。存不住的要能保存并在刷新后还在；标了立即生效但运行时不读的，接到现有读取路径。已经生效的不要改行为。若「已保存」在请求失败时仍出现，改成失败可见。
  对话里系统气泡写着：执行已停止。[recovery] Stopped: tool "edit_file" failed 8 times in a row。用户把重复检测设成了关闭，问这样还会停吗？若是另一条规则，关掉重复检测不会放行这种连续失败停止；不要为了让这个例子继续跑下去而关掉失败熔断。
notes: |
  assumedApproval: standing-order-2026-10-22
  Bot 固定对话仍按既有规则立刻转向，排队或不接收也不拒绝这条消息。同一工具连续失败的熔断不属于重复检测。
criteria:
  - id: AC-1
    given: 默认任务模式已保存成极速
    when: 新建一条还没有自己的任务模式的对话
    then: 这条新对话使用极速
  - id: AC-2
    given: 默认技能范围已保存成仅本轮勾选
    when: 新建一条还没有自己的技能范围的对话
    then: 这条新对话只使用本轮勾选的技能
  - id: AC-3
    given: 一条对话已经有自己的任务模式和技能范围，之后默认值被改成别的
    when: 继续使用这条已有对话
    then: 它仍使用自己原来的任务模式和技能范围
  - id: AC-4
    given: 一条普通对话正在生成，工作中发来新消息已保存为立即转向
    when: 打开着的页面仍按排队方式送出一条新消息
    then: 这条消息在下一枪转向，而不是等到本轮结束
  - id: AC-5
    given: 一条普通对话正在生成，工作中发来新消息已保存为排队等待
    when: 打开着的页面仍按立即转向送出一条新消息
    then: 这条消息等到本轮结束再处理
  - id: AC-6
    given: 重复检测已关闭
    when: 同一个工具连续失败直到熔断
    then: 这次执行仍会停下，并能看出是这个工具连续失败，而不是重复检测
