id: composer-drop-retirement-soak-isolation
title: 退役消息框拖拽并独立验证 HTTP soak 性能
status: implemented
requirement: |
  那就把拖拽功能整体去掉，保留加号附件入口，相关验收和测试一起退役。其他核心测试保留，HTTP soak 的性能检查单独跑，先给我验收草案。
notes: |
  用户已确认全部八条标准并授权实施；2026-10-21 完成拖拽退役、独立性能门禁及两个 soak 阻塞修复。
  已将 composer-drag-context 整体标记 retired，保留原标准和明确的 retiredReason；退役专属测试及其标签，共享核心测试继续保留。
  普通对话和单 Bot 保留加号附件入口；群聊维持没有加号附件入口的现状。
  初次验证曾因例行任务漏确认及 receive p95 超标而失败，样本保留，未计作通过。
  修复受控模型在上下文压缩后遗漏已成功工具结果的问题；技能路由采用有界缓存和分批让出事件循环，保留评分与排序。
  最终连续两轮独立性能验证均通过：receive p95 302ms / 95ms，原门槛 500ms 不变；全部工作正常完成，无重复软件调用。
  相关回归 234/234，通过且没有跳过；core/daemon 构建通过。此前附件及核心聊天审批 E2E 8/8、SDK 435/435 已通过。
  bot-release-readiness#AC-3 继续有效；本次短时验证不替代完整浸泡、标准硬件或完整发布验收。
  证据见 test-results/soak-fix/ 与 doc/COMPOSER_ATTACHMENT_SOAK.md。
criteria:
  - id: AC-1
    given: 用户正在普通对话、单 Bot 对话或群聊的消息框中编辑草稿
    when: 将文件、文件夹、文字或链接拖入消息框
    then: 不出现附件拖放提示，不因拖放添加上下文或提交消息，已有草稿不丢失，之后仍能编辑并发送消息
  - id: AC-2
    given: 用户打开普通对话或单 Bot 对话的消息框
    when: 使用加号选择现有支持的本地文件、图片或附件地址，并移除其中一项后发送
    then: 保留的附件按原有方式随消息交给当前对话，移除的附件不会发送，附件处理失败时有明确提示且不误报成功
  - id: AC-3
    given: 历史消息已经通过拖拽附带文件或文件夹上下文
    when: 用户在功能退役后重新打开或刷新该对话
    then: 历史消息及其已保存的上下文仍可查看，不因入口退役丢失或改变归属
  - id: AC-4
    given: 维护者检查本次退役后的验收清单和测试结果
    when: 查看拖拽功能相关条目
    then: 原拖拽标准保留并明确标记退役及原因，专属测试不再执行或计作有效覆盖，共享的核心能力检查仍然执行
  - id: AC-5
    given: 维护者执行 HTTP soak 的功能检查
    when: 验证负载输入、工作处理、调度、审批和异常收尾
    then: 这些行为仍被验证，正确性失败仍阻断通过，功能检查的结论不依赖响应延迟是否达到性能门槛
  - id: AC-6
    given: 维护者需要验证 HTTP soak 性能
    when: 全量验证运行，或维护者单独发起性能检查
    then: 性能检查在独立且不采集代码覆盖率的执行环境中运行，使用既有负载及性能门槛，并单独报告实测指标与通过或失败结果
  - id: AC-7
    given: HTTP soak 功能检查通过，但必需的独立性能检查失败、未运行或未完成
    when: 汇总全量验证及发布评估
    then: 不宣称全部通过或性能达标，明确列出性能失败或证据缺失，短时检查通过也不会被当作完整浸泡验收通过
  - id: AC-8
    given: 本次调整已完成
    when: 执行核心功能、审批、隔离、恢复和其他既有有效验收检查
    then: 除明确退役的拖拽专属检查外，其他核心检查保持有效，不因本次调整被删除、跳过或降低通过门槛
