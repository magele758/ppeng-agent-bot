id: console-skin-motion
title: 各外观独立特效与极简黑白
status: implemented
notes: |
  assumedApproval: standing-order-2026-10-22
  特效只在对应外观下播放。系统要求减少动态时停掉。装饰层不挡点击。极简黑白与像素分开，默认仍是经典。
requirement: |
  给每个主题都加一些特定的元素和独立的特效，现在全是静态的，按照各种风格去添加特效，要炫酷，再加一套极简黑白风格的设计，分多个Agent去快速完成
criteria:
  - id: AC-1
    given: 用户选中圣所、赛博朋克、恶魔的聚会、机器人大舞台、像素或童趣幼儿园
    when: 页面显示且系统没有要求减少动态
    then: 只有当前这套外观在动，换到另一套后上一套的特效消失
  - id: AC-2
    given: 系统开启了减少动态效果
    when: 用户查看任意一套外观
    then: 特效停住，文字和按钮仍可阅读、可点击
  - id: AC-3
    given: 用户打开外观列表
    when: 选择极简黑白
    then: 页面立刻变成只有黑白灰的极简外观，刷新后仍保持，深浅色选择不被改掉
  - id: AC-4
    given: 这台浏览器没有选过外观
    when: 打开控制台
    then: 仍是经典外观，不会自动播放任何主题特效
