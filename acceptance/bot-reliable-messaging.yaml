id: bot-reliable-messaging
title: Bot可靠工作与身份连续性
status: approved
requirement: |
  分多个agent补齐所有缺失直到评估完成
notes: 用户明确授权按已审阅开发计划实施，无需重复确认。
criteria:
  - id: AC-1
    given: 忙碌或等待审批的Bot
    when: 收到消息
    then: 消息被保存并在可执行时处理
  - id: AC-2
    given: 用户重复派发相同工作
    when: 重试派发
    then: 只有一项委派且结果可追踪
  - id: AC-3
    given: 处理中的进程中断
    when: 重新启动
    then: 未知执行明确显示且不自动重复副作用
