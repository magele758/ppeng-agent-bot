id: multi-machine-controlled-development
title: 多机软件工厂第二阶段：受控开发至 READY
status: implemented
requirement: |
  继续推进第二阶段，先结合第一阶段的结果，把第二阶段的范围、需要补齐的能力和验收标准写出来给我确认。
notes: |
  负责人已确认第二阶段33条验收，授权先写失败测试、实现、双机试跑、纵向审查与自动化验证；标准内容保持不变。
  复用第一阶段派单、真实机器身份、共享容量、账本、回群和巡检；原23条只读验收不变。
  新增独立授权的开发任务，同一台机器负责隔离开发、测试、自审、最多6轮修复，终点为本地READY。
  READY代表指定本地提交的测试与评审证据齐全，不代表已推送、CI通过、已合入或已部署。
  不包含远程推送、创建或合并PR、部署、重启已有服务、自动清理分支或工作区。
  机器上的编码工具与评审工具沿用已安装的可用工具；本阶段不自动安装宿主工具、不更改宿主全局配置。
  模型、工具、项目检查策略、隔离与网络权限、时限及轮次通过Lab持久化配置；模型供应商不硬编码。
  真实双机验收使用用户指定的专用试验仓库与无业务影响的任务，保留工作区和证据供复查。
criteria:
  - id: AC-1
    given: 用户有工厂管理权限
    when: 在Lab保存某项目的开发工具、模型、检查与评审策略、隔离范围、时限和修复轮次
    then: 配置刷新后保留并对后续新任务生效；开发默认关闭，启用无需新增功能环境变量或重启。
  - id: AC-2
    given: 用户准备向一台机器派发开发任务
    when: 检查开发就绪条件
    then: 能逐项看到工具、模型连接、磁盘、仓库基线、依赖来源、检查与评审策略及隔离能力的结果；必要项不满足时禁止开始开发并说明原因。
  - id: AC-3
    given: 用户有目标项目的开发权限且需求已有批准的验收标准
    when: 从工厂群或Lab派发开发任务
    then: 得到同一可追踪任务编号，任务保存需求、批准标准、基线提交、指定机器和执行策略的可核对版本；缺少批准标准时明确拒绝启动。
  - id: AC-4
    given: 开发未启用、用户无开发权限，或请求来自只读任务、Bot转发或未获授权的自动消息
    when: 请求修改代码或升级为开发任务
    then: 在执行前拒绝并说明原因，任务文字或Bot回复不能提升权限，原只读入口继续保持只读。
  - id: AC-5
    given: 一个开发请求已被接收
    when: 群消息重复投递、提交重试或调度重复触发
    then: 返回原任务编号，不额外启动编码进程或创建第二份任务工作区。
  - id: AC-6
    given: 一个开发任务已指定机器和负责Bot
    when: 执行开发、测试、自审和修复，或有人请求改派
    then: 各阶段由原机器和Bot负责；只有原执行确认结束且获授权改派后才生成明确的新执行记录，不在两台机器并行处理同一任务。
  - id: AC-7
    given: 一个任务明确依赖另一个任务的指定提交产物
    when: 依赖尚未就绪或用户解除依赖等待
    then: 未就绪时显示等待依赖且不占执行槽位，只有指定产物可用并核对后才进入开发队列，不把仅收到完成消息当作依赖满足。
  - id: AC-8
    given: 同一物理机器上同时存在只读和开发任务，或有多个关联Bot和机器别名
    when: 并发派单并释放执行槽位
    then: 所有实际执行共享机器容量且不超限，最早满足条件的任务自动开始；容量为零的机器拒绝执行任务。
  - id: AC-9
    given: 任务已指定执行机器和基线
    when: 开始开发
    then: 记录可核对的实际机器身份和起始提交；机器不可用或身份不符时不启动，也不静默改在协调服务或其他机器执行。
  - id: AC-10
    given: 目标仓库已有未提交改动、其他任务或受保护分支
    when: 为新任务准备工作区
    then: 从指定基线建立独立任务分支和干净工作区，保留已有改动和其他任务，原检出的分支、工作区内容及受保护分支指向不变。
  - id: AC-11
    given: 一个任务需要安装项目依赖
    when: 准备开发和测试环境
    then: 在任务独立环境内按已核准的依赖策略安装并保留结果，不共享其他检出的可写依赖目录，不修改宿主全局工具；依赖准备失败不能进入就绪。
  - id: AC-12
    given: 开发工具、测试、依赖脚本或仓库内容尝试访问任务授权范围以外的资源
    when: 尝试修改其他工作区、受保护分支、宿主配置或服务，获取宿主凭据、推送或进行未获准的网络访问
    then: 越界操作被执行边界阻止并记录原因；隔离能力不可用时拒绝开发，不降级为无限制执行。
  - id: AC-13
    given: 一个已批准标准要求新增或改变行为
    when: 执行该行为的开发
    then: 先保存关联该标准且因目标行为缺失而失败的测试证据，再实现并保存同一测试通过的证据；环境故障不充当失败测试。
  - id: AC-14
    given: 基线检查存在已知失败
    when: 对比任务改动后的检查结果
    then: 逐项显示基线失败、新增失败及其依据，不能只比较失败数量或由编码工具临时声明豁免；新增失败会阻止就绪。
  - id: AC-15
    given: 任务进入测试阶段
    when: 按已保存的项目策略检查当前提交
    then: 所有必需的类型、全量单测、验收及项目专属门禁均有对应提交的执行结果；缺失、跳过、超时或失败的必需检查不能算通过。
  - id: AC-16
    given: 当前提交已完成必需测试
    when: 同机独立评审检查相对基线的完整改动和验收路径
    then: 保存全部评审范围、策略版本、逐段结论和问题；任一改动未覆盖或任一段缺少有效结论时不得判为CLEAN。
  - id: AC-17
    given: 评审存在未关闭的P0或P1问题，或其他级别问题
    when: 汇总评审结果
    then: P0或P1阻止就绪，其他问题明确列出；误报关闭必须保留理由和验证依据，不能用一条CLEAN文字覆盖问题。
  - id: AC-18
    given: 任务评审发现阻塞问题且尚有修复轮次
    when: 自动继续修复
    then: 按修复、测试、评审形成可核对的一整轮；默认最多6轮，达到上限仍阻塞时停止新修复并进入待决，不擅自增加轮次。
  - id: AC-19
    given: 任务因轮次用尽或需要修改需求与验收而进入待决
    when: 用户查看并作出决定
    then: 能看到剩余问题、已有提交和可选后续动作；只有有权用户明确批准的动作才能继续，改验收需重新确认，批准加轮不授予推送或合入权限。
  - id: AC-20
    given: 编码或评审遇到模型不可用、工具故障或超过已保存的运行限额
    when: 故障重试或恢复预算耗尽
    then: 保留已有产物并显示明确的延期、失败或待决原因，不无限重试，不把缺失的测试或评审当作通过。
  - id: AC-21
    given: 一个任务排队或正在执行
    when: 用户暂停、取消任务或任务到达时限
    then: 停止新的阶段启动并终止当前任务的执行进程，保留代码和证据；确认相关进程结束后才释放占用，无法确认时保持待核实。
  - id: AC-22
    given: 开发、测试或评审期间连接中断或协调服务重启
    when: 服务恢复核对远端执行
    then: 保留原任务、工作区、轮次和历史，先核实原进程与结果，不重复启动阶段、不自动改派，未确认结束的执行继续占用容量。
  - id: AC-23
    given: 任务已产生较新结果或已经获准改派
    when: 收到重复、延迟或来自旧执行的阶段报告
    then: 旧报告不能覆盖当前阶段、提交和结论，也不能触发额外执行。
  - id: AC-24
    given: 开发任务产生代码、测试输出和评审记录
    when: 用户查看任务证据
    then: 可核对基线与结果提交、改动清单、验收覆盖、检查结果、评审问题及处理依据；群消息、界面和可下载证据不暴露凭据，产物超限或不可用时明确提示。
  - id: AC-25
    given: 同一提交的必需检查全部通过、评审完整且无未关闭阻塞问题
    when: 系统标记READY
    then: 保留任务分支上的本地提交及可复查工作区，并明确显示仅本地就绪、尚未推送；没有远程发布证据时不显示已合入、已部署或整个特性交付完成。
  - id: AC-26
    given: 任务曾有通过的测试或CLEAN评审
    when: 代码、目标基线、验收版本或必需检查与评审策略发生变化
    then: 原证据保留但不再代表当前版本就绪，必须针对确认后的版本重新完成相应检查与评审。
  - id: AC-27
    given: 一个开发任务发生阶段变化
    when: 在Lab看板、任务详情和原群查询
    then: 各入口显示一致的任务、机器、阶段、轮次、当前提交和下一步，并区分执行状态、开发就绪与发布交付状态。
  - id: AC-28
    given: 开发任务出现就绪、阻塞、待决或失败等需报告的变化
    when: 回报原协作群或服务恢复后补发
    then: 同一变化只出现一条有效报告，包含任务编号、机器、提交和下一步，不引发Bot重新派发相同任务；夜间按Asia/Shanghai仅报告新卡点或待决事项。
  - id: AC-29
    given: 开发任务处于修复、等待依赖、暂停、待决或READY状态
    when: 每小时巡检触发
    then: 按阶段判断是否需要核实，不把正常等待当卡住；无变化时保持安静，疑似停滞先核实进程、进展新鲜度、提交和CPU，同一卡点不重复提醒。
  - id: AC-30
    given: 一个开发任务需要有权用户补充信息或作出决定
    when: 打开Lab待决事项或原群中的对应提醒
    then: 能定位并处理同一待决事项、看到决定者和决定历史；本阶段不自行向外部即时通讯或邮件发送私信。
  - id: AC-31
    given: 第二阶段开发能力已启用或关闭
    when: 回归第一阶段全部23条只读验收
    then: 只读派单、容量、恢复、统一状态、脱敏与巡检继续通过，既有只读任务不会因开发启用而获得写入能力。
  - id: AC-32
    given: 至少两台身份不同的真实执行机器完成开发就绪检查，用户已指定专用试验仓库及批准标准
    when: 从群分别派发无业务影响的开发任务并走完测试、自审和至少一次实际阻塞修复
    then: 两台机器均产出可独立核对的本地提交与READY证据，群和Lab一致，远程分支、原检出及已有服务不变，不推送、不合入、不部署、不删除工作区。
  - id: AC-33
    given: 真实双机试运行中存在已启动的开发任务
    when: 重复提交请求并中断连接或重启临时协调服务后恢复
    then: 现场证据证明没有重复编码执行或额外工作区，原任务经核实后续接或保持待核实，容量与进程占用一致。
