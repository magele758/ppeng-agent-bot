id: play-context-stack
title: Play 右侧栏模型上下文
status: implemented
requirement: |
  在 Play 对话右侧栏，现有「活动」标签旁边加一个标签，用来调试当前会话的模型上下文。
  里面要有一条横向堆叠条，每一段是将要发给模型的一块上下文，不同种类用不同颜色，能看出组成和相对大小（含图例，以及 token 或字符占比）。
  条下面按顺序列出每一块的实际内容，能读到系统提示、摘要、记忆附录、工作日志、用户/助手轮次、工具结果、压缩占位，以及准备视图里真正有的其它内容。长内容要能滚动或展开，不能收成没用的哈希。
  这是当前会话准备好的模型上下文，不是聊天记录的第二份副本。走运行时在调用模型前用的同一套准备和预算（系统提示、折叠/摘要、微压缩占位、记忆附录、工作日志、钉住消息、普通会话 20% 上限或 Bot 会话 50/85 线，看这条会话适用哪一种）。
  会话切换和一轮结束时刷新，可以有手动刷新。不要另造一套和模型所见不一致的上下文格式。
criteria:
  - id: AC-1
    given: 打开 Play 对话
    when: 看右侧栏标签
    then: 「活动」旁有上下文标签，中文和英文都有各自的文案
  - id: AC-2
    given: 准备好的上下文里有不同种类的块
    when: 查看堆叠条
    then: 每种块有自己的颜色，块的 token 越大，条上的占比越大，并有图例
  - id: AC-3
    given: 一个已有对话的会话
    when: 打开上下文视图
    then: 按顺序列出每一块的种类、全文和 token 估算，系统提示、记忆、工作日志、用户话和工具压缩占位都能读到原文
  - id: AC-4
    given: 普通会话或 Bot 会话
    when: 查看上下文预算
    then: 普通会话按窗口的 20% 标出会发送、将摘要或已排除的块；Bot 会话标出 50% 和 85% 线，并保留当前原文
