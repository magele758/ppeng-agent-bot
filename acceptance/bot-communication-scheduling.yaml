id: bot-communication-scheduling
title: "Bot 主会话调度与排队期限"
status: draft
requirement: |
  那先帮我制订一个详细的改造和提升的开发计划
notes: "用户明确要求先制定计划，本轮仅为 P4 编写验收草稿，不代表实施或验收通过。方案见 doc/BOT_COMMUNICATION_UPGRADE_PLAN.md。实施该阶段时按 acceptance-first 改 approved 并加入 standing-order notes，逐条写失败测试再实现；既有标准保持有效。"
criteria:
  - id: AC-1
    given: "Bot 主会话有后台积压且用户明确停止或修改其中一项工作"
    when: "系统到达可安全处理控制的执行位置"
    then: "控制作用于指定工作，不被普通后台队列遮挡，也不取消其他工作"
  - id: AC-2
    given: "Bot 的定时任务到点且主会话繁忙或等待批准"
    when: "调度器处理这次触发"
    then: "任务留在该 Bot 主会话的工作主线，忙时排队，待批准时不重复启动，也不另开默认 Routine 会话"
  - id: AC-3
    given: "一条尚未开始的定时工作配置了最晚开始时间"
    when: "排队时间超过该期限"
    then: "该次工作按配置跳过并说明原因，原计划和运行记录仍可查看"
  - id: AC-4
    given: "一次定时工作已经开始或产生了待核实的外部效果"
    when: "原排队期限经过或出现更新的触发"
    then: "正在执行的工作不因排队合并被重做，待核实效果不会自动重复"
  - id: AC-5
    given: "前台请求持续到来且后台工作也具备运行条件"
    when: "连续处理了五项普通前台工作且没有优先控制指令"
    then: "至少给一项已就绪后台工作执行机会，不让它无限等待"
  - id: AC-6
    given: "队列已满，或服务在接收工作后重启"
    when: "新请求到来或恢复派发"
    then: "新请求被明确告知是否接收，已接收工作不丢失、不重复占用容量，也不同时启动两个主会话执行者"
  - id: AC-7
    given: "用户在 Lab 保存排队期限或调度设置"
    when: "保存成功后产生后续待处理工作"
    then: "新设置无需环境变量或重启即可生效，已有明确漏跑策略不被覆盖；保存失败仍使用原设置"
