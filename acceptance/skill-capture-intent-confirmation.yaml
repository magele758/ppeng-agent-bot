id: skill-capture-intent-confirmation
title: 模型判断技能沉淀并在提炼前请求确认
status: implemented
requirement: |
  帮我开启技能提案和自动提醒，提醒间隔先设为每 10 次工具迭代，并确认所有 Bot 的 skill_propose 都已可用。沉淀技能可以让模型判断，不用我人工去介入，如果模型判断值得记录或者去更新技能，可以给一个操作提醒的交互框，我确认之后再去提炼
notes: |
  技能提案开启和每 10 次工具迭代提醒已通过现有配置完成。
  本草案新增先确认意图再提炼的流程；确认后由模型完成提炼并保存，不再要求第二次审核正文。
  此流程改变 acceptance/skill-proposals.yaml 中 AC-2、AC-3 对新流程的适用方式，
  本次确认需同时涵盖该行为变化；现有待审提案仍保留原来的查看、批准、拒绝和撤销能力。
criteria:
  - id: AC-1
    given: 已开启技能提案并设置每 10 次工具迭代提醒
    when: Bot 在任务中达到提醒间隔
    then: 模型自行判断已完成的工作是否值得沉淀或更新技能，没有值得沉淀的经验时不向用户弹出确认框
  - id: AC-2
    given: 模型判断一段成功经验值得沉淀为新技能或更新已有技能
    when: 模型向用户发起沉淀建议
    then: 当前对话出现操作确认框，说明技能名称、新建或更新、沉淀理由和拟记录内容概要；更新时标明目标技能，确认前不提炼正文、不保存或修改技能
  - id: AC-3
    given: 用户看到了模型的技能沉淀建议
    when: 用户确认该建议
    then: 模型根据相关对话自动提炼并保存本次确认范围内的技能，成功后显示结果且可查找和加载，无需用户编写内容或再次审核正文
  - id: AC-4
    given: 用户尚未确认技能沉淀建议
    when: 用户拒绝或暂不处理
    then: 不提炼或保存该技能，正常对话仍可继续，已拒绝的同一建议不会因下一次周期提醒而重复弹出
  - id: AC-5
    given: 用户已确认一条技能沉淀建议
    when: 确认被重复提交，或者提炼及保存过程失败
    then: 不重复创建技能；失败时明确显示失败状态和原因，已有技能保持原状，不把失败报告为保存成功
  - id: AC-6
    given: 已有通过原流程产生的待审提案或已安装技能
    when: 用户使用新的提炼前确认流程
    then: 既有待审提案仍可查看、批准和拒绝，原有及新保存技能仍可撤销，且新的确认只授权当前建议所对应的技能操作
