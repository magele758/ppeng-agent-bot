id: bot-product-p1
title: Bot首次任务与软件连接引导
status: implemented
requirement: |
  我觉得你说的非常好，P0到P2的功能，我都挺喜欢的，帮我都做了
notes: |
  承接本次纵向切片评估的P1；保留轻量创建与高级接口导入。
  软件向导覆盖项目已有受支持的HTTP/OpenAPI与MCP连接方式，明确展示支持范围，不承诺任意第三方均支持一键登录。
  新界面支持中英文，设置经界面持久保存，密钥不回显；不新增功能开关环境变量。
  2026-10-21 用户批准收窄 AC-1：不再要求刚创建的每个 Bot 都出现示例，改为新用户第一次进入尚未开始的 Bot 对话时可以直接描述任务或选择示例。其余 AC 不改。
criteria:
  - id: AC-1
    given: 新用户第一次进入一个尚未开始的 Bot 对话，且尚未配置额外软件
    when: 查看这次对话
    then: 可以直接描述第一项任务或选择示例，并看到无需额外连接即可完成的任务入口
  - id: AC-2
    given: 用户提出第一项任务
    when: 所需模型、工具、连接或权限未就绪
    then: Bot说明具体缺项及补齐入口，并明确当前能完成的部分，不把未就绪能力宣称为可直接执行
  - id: AC-3
    given: 用户需要连接一种受支持的软件
    when: 使用默认连接入口
    then: 可以选择连接类型并按表单完成必要配置、权限范围选择和连接验证，无需手写接口或工具定义，未支持的软件明确提示限制
  - id: AC-4
    given: 用户需要自定义软件接口
    when: 使用高级连接入口
    then: 仍可导入接口或配置自定义工具，格式错误与不支持的操作有可定位的提示，失败不会覆盖已有可用连接
  - id: AC-5
    given: 软件连接完成验证
    when: 用户查看Bot能力
    then: 能看到该连接支持的具体任务、已授予的操作范围和最近验证时间，未授予的操作不会显示为已授权
  - id: AC-6
    given: 软件授权已失效或被撤销
    when: 用户查看连接或执行受影响的任务
    then: 两处均明确显示授权问题及修复入口，修复过程保留任务上下文且不泄露凭据
  - id: AC-7
    given: 新用户完成必要连接且首次任务可执行
    when: 按引导执行任务
    then: 能从同一流程查看真实交付和验证情况，失败时看到原因及下一步，不以演示数据或成功提示替代实际结果
  - id: AC-8
    given: 用户切换界面语言或重新打开应用
    when: 继续首次任务或查看连接配置
    then: 引导与连接文案使用所选语言，已保存配置仍然生效且无需修改环境变量或重启服务
