id: model-sandbox-isolation
title: 命令隔离由对话里的 Agent 自己选
status: implemented
requirement: |
  而且沙箱的隔离方式，应该是都提供，让模型自己选的啊，而不是都要人去设置，这个理解成本太高了吧？
criteria:
  - id: AC-1
    given: 人没有先把隔离模式设成某种方式，甚至环境或已保存的设置里写的是无隔离
    when: 对话里的 Agent 执行命令时不指定隔离方式
    then: 命令用当前这台机器上最强的可用隔离执行；机器做得到系统级隔离时，不会退成无隔离
  - id: AC-2
    given: 已实现的隔离方式都出现在命令工具上，包括系统级隔离、无隔离，以及已接通时的远程沙箱
    when: Agent 在一次命令里选定其中一种
    then: 这次命令按该方式执行，不需要人先把全局模式改成同一种
  - id: AC-3
    given: Agent 在一次命令里选择无隔离，且这次对话不是从不请求审批
    when: 人还没有批准
    then: 命令不会执行，并进入审批；人批准之后才会按无隔离执行
  - id: AC-4
    given: Agent 指定了这台机器做不到的系统级隔离，或指定了尚未提供的容器隔离
    when: 执行这次命令
    then: 命令不会跑起来，也不会悄悄改成无隔离执行
  - id: AC-5
    given: Agent 用任意一种已实现的隔离执行命令
    when: 命令启动
    then: 环境变量消毒仍然生效，用来注入代码的环境变量不会进入命令
  - id: AC-6
    given: 用户打开设置里的命令沙箱
    when: 阅读说明
    then: 说明写明隔离由对话里的 Agent 每次执行时自己选，人不必先选择隔离模式；选择无隔离时仍能看到风险提示
