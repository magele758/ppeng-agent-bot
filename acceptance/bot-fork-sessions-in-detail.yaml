id: bot-fork-sessions-in-detail
title: Bot 子任务会话放进详情菜单
status: implemented
requirement: |
  “可以考虑让bot模式加一个能力：自动在输入框填下一次可能输入的内容（用输入框的提示模式），tab才真实输入，如果不tab直接输入，就正常输入，这个下一次的提示来”: 这些事bot fork的子任务会话？这个放到bot的详情菜单里吧，不要放这里了
notes: |
  左侧「未分组」里标题是任务原文、下面一行是 bot id 的那些行，是这只 Bot 派出去的子任务会话，不是它自己的对话。
  它们要离开 Bot 模式左侧列表（含未分组和功能分组），改到这只 Bot 的右侧详情菜单里单独一块。
  Bot 自己的对话行仍留在左侧原来的分组。
  2026-10-22 用户确认 bot-child-task-chat-entry 后，子任务出现在普通会话列表，不再要求普通列表完全隐藏。
criteria:
  - id: AC-1
    given: 一只 Bot 有自己的对话，并且派生了若干子任务会话，标题是任务原文
    when: 用户查看 Bot 模式左侧列表，包括未分组和各个功能分组
    then: 这些子任务会话不出现在左侧，也不计入分组数量；这只 Bot 自己的对话仍在它原来的分组里
  - id: AC-2
    given: 两只 Bot 各自派生了不同的子任务会话
    when: 用户打开其中一只 Bot 的右侧详情菜单，再换到另一只
    then: 详情里单独一块只列出当前这只 Bot 的子任务，标题是任务原文；看不到另一只 Bot 的子任务
  - id: AC-3
    given: 当前这只 Bot 没有子任务会话
    when: 用户打开它的右侧详情菜单并查看子任务这一块
    then: 有一句说明目前没有子任务
  - id: AC-4
    given: 详情菜单里列出了这只 Bot 的一条子任务
    when: 用户点开这条子任务
    then: 主对话区打开的是这条子任务会话
  - id: AC-5
    given: 用户正在普通聊天模式
    when: 用户查看左侧会话列表
    then: 普通会话列表里有这些 Bot 子任务会话，Bot 模式左侧没有这些子任务
