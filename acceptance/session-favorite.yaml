id: session-favorite
title: 当前会话一键收藏
status: implemented
requirement: |
  在当前会话里一键把这个会话收进收藏，之后能从会话列表找到。
notes: |
  assumedApproval: standing-order-2026-10-22
  参考 open-chrome-ai 里现有剪藏的交互，只读，不改那个仓库。不要接别的检出里未提交的启动性能改动。收藏用当前会话顶栏一键切换，不走填备注的弹窗；列表里收藏单独成组，并能只看收藏。
criteria:
  - id: AC-1
    given: 打开了一场还没收藏的会话
    when: 在这场会话里点一次收藏
    then: 这场会话显示为已收藏，左侧会话列表里也能看出它已收藏
  - id: AC-2
    given: 会话列表里既有已收藏的会话，也有没收藏的会话
    when: 查看会话列表，或只看收藏
    then: 已收藏的会话出现在收藏分组里；只看收藏时其余会话不出现。一场收藏都没有时，列表说明没有收藏的会话
  - id: AC-3
    given: 一场已收藏的会话
    when: 再点一次收藏
    then: 收藏取消，列表里不再把它标成已收藏，只看收藏时也找不到它
  - id: AC-4
    given: 一场已经收藏的会话
    when: 重新打开会话列表
    then: 收藏还在。不是是否收藏的取值不会改掉原来的收藏
