id: bot-functional-groups
title: Bot 功能分组、共享范围优先级与头像修复
status: implemented
requirement: |
  群聊不能删除
  这个小花朵的icon还是有问题，没正常显示
  没任务的时候，不要这个表情，用个静止的等待的活泼点的表情
  不需要按照日期分组，按照功能分组，可以有未分组，以及按照功能分组，可以拖拽到不同的分组里，分组是隔离域的优先级，比全局的bot共享互通信息优先级高一档，群聊内的最高，最低是未分组的和全局的之间的
owner: user
notes: |
  2026-10-18：用户确认全部验收标准正确，并要求分多个 Agent 开发。
  功能分组是用户自定义的 Bot 分类，与群聊是两个概念。
  信息适用优先级解释为：当前群聊 > 所属功能分组 > 全局共享；未分组 Bot 仅使用获准的全局共享层。
  共享范围只包含用户明确共享的内容，不自动公开 Bot 私有历史或私有记忆；沿用 bot-rooms AC-3。
  拖拽移动后原分组专属信息不再可用，已存在的私人或群聊历史保留。
criteria:
  - id: AC-1
    given: 用户有权管理一个群聊
    when: 用户从群聊入口选择删除并确认
    then: 群聊从列表移除且刷新后不会重新出现，成员 Bot 及其私人对话仍保留
  - id: AC-2
    given: 用户正在删除群聊
    when: 用户取消确认或删除失败
    then: 群聊保留，失败时显示可理解的错误并允许重试
  - id: AC-3
    given: DeskBot 使用小花朵头像
    when: 用户查看 Bot 列表或对话中的头像
    then: 花朵轮廓和面部五官均清晰完整可见，不被遮挡或裁切
  - id: AC-4
    given: Bot 没有正在执行或等待处理的任务
    when: 用户查看它的头像
    then: 显示活泼的等待表情，不显示忙碌表情或工作动画；列表可播放轻快、间歇的待机小动作，其他位置保持静止
  - id: AC-5
    given: 用户打开 Bot 列表
    when: 查看分类
    then: 按自定义功能分组和未分组展示 Bot，不再按日期分类，并且仍可访问群聊
  - id: AC-6
    given: 用户需要按用途组织 Bot
    when: 用户创建、重命名或删除功能分组
    then: 分组变更在刷新或重启后保留，删除分组时其中 Bot 回到未分组且 Bot 与对话仍保留
  - id: AC-7
    given: Bot 位于某功能分组或未分组
    when: 用户将它拖拽到另一功能分组或未分组
    then: Bot 归属立即更新并在刷新或重启后保留，移动失败时恢复原归属并提示原因
  - id: AC-8
    given: 用户已分别在全局、功能分组和当前群聊明确共享了相互冲突的信息
    when: Bot 在相应范围内处理相关问题
    then: 信息适用顺序为当前群聊高于所属功能分组、所属功能分组高于全局；未分组 Bot 仅使用获准的全局共享信息
  - id: AC-9
    given: 不同功能分组和不同群聊各有专属共享信息
    when: Bot 在某分组或群聊内工作，或被移动到另一个功能分组
    then: 不会自动获得其他分组或其他群聊的专属信息，移动后不能继续读取原分组的专属共享信息
  - id: AC-10
    given: Bot 已有私人对话和私有记忆
    when: 用户将 Bot 加入功能分组或群聊
    then: 私人历史和私有记忆不会因此自动向其他 Bot 公开
