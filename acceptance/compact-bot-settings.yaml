id: compact-bot-settings
title: Bot 设置优先展示基本信息与已有定时任务
status: implemented
requirement: |
  这个界面太臃肿了，核心信息全部被档到下面，定时任务新增应该要隐藏到二次弹窗里，已有的定时任务和基本信息在第一个tab里前置展示，其他的配置，非必要就隐藏或者折叠起来
notes: |
  assumedApproval: standing-order-2026-10-22
  定时任务从自动化标签移入首个概览标签；配置能力保留，调整默认展开与入口位置。
criteria:
  - id: AC-1
    given: Bot 的简介很长且已有定时任务
    when: 用户打开 Bot 设置
    then: 首个标签展示基本信息与已有任务，长简介默认折叠，不把标签和任务列表推到页面底部
  - id: AC-2
    given: 用户查看已有定时任务
    when: 点击新增或编辑
    then: 独立弹窗展示表单，取消或 Escape 关闭且不保存；保存成功后关闭并刷新列表，失败时保留输入和错误
  - id: AC-3
    given: 用户打开 Bot 设置概览
    when: 尚未展开任何配置
    then: 资料编辑、模型与运行配置、外观、定时任务高级选项默认折叠，仍可展开访问，权限链接仍能定位对应配置
