id: chat-tail-kept
title: 对话结束时助手正文留在对话里
status: implemented
requirement: |
  会话和 Bot 里经常丢消息，特别是模型吐出来的内容。过程（工具、Trace）还在，输出完了内容就从对话流里消失；整页刷新后又出现。所以是已经落库，前端在结束时把刚写完的助手消息弄丢了，不是没存上。
  修好后的行为：模型输出结束后，助手正文留在对话里，不必刷新。工具过程仍在。之后的自动刷新不能再把这条正文冲掉。刷新页面仍然看得到。不要为了留住气泡去重发请求或造假消息。
  Bot 房间回合和普通 session 都要保住。
notes: "assumedApproval: standing-order-2026-10-22"
criteria:
  - id: AC-1
    given: 一轮对话正在输出，工具过程已经在对话里
    when: 模型正常结束
    then: 助手正文留在对话里，工具过程也还在，不用整页刷新
  - id: AC-2
    given: 助手正文已经在当前对话里
    when: 之后的自动刷新带回一份没有这段正文的旧快照
    then: 这段助手正文仍留在对话里
  - id: AC-3
    given: Bot 房间里已经显示机器人的回复
    when: 房间刷新带回同一条但没有正文的记录
    then: 这条回复的正文仍在
  - id: AC-4
    given: 模型刚说完，保存下来的记录里还没有这段正文
    when: 对话结束并刷新记录
    then: 刚说完的正文仍留在对话里，直到保存的记录带上它，且不会把用户那句话再发一次
