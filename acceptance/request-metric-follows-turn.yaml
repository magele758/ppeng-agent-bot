id: request-metric-follows-turn
title: 已发送请求指标随所选轮变化
status: implemented
requirement: |
  这里要跟着下面拖动的会话轮数显示对应轮的请求token啊
notes: |
  用户看到的是对话右侧「最近一次已发送请求」那一块。下面可拖动的控件在中文界面叫「上下文时间」，不是「会话轮数」；当前位置显示「第 N 次 · 时间」或「当前 · 最新」，两侧是「上一刻」「下一刻」。
  只要求这块的发送时估算 token、模型窗口占比、上游输入用量和发送时间跟着所选轮走。某一轮上游输入用量为未知时保持未知，不把「为什么是未知」当作要修的问题。
  拖到最右端「当前 · 最新」时，这块仍是最近一次已发送请求。它下面的下一轮预览可以和这次已发送请求不是同一个数。
criteria:
  - id: AC-1
    given: 当前对话已经发出过至少三轮请求，各轮发送时估算的 token 数都不相同
    when: 把这块下面的「上下文时间」先拖到较早的一轮，再拖到另一轮，使当前位置先后显示这两轮各自的「第 N 次」
    then: 这块的 token 数先后变成这两轮各自的发送时估算，两次都不是最近一次已发送请求的 token，也不是对方那一轮的 token
  - id: AC-2
    given: 当前对话至少有两轮已发送请求，它们的模型窗口占比、上游输入用量和发送时间并不都相同
    when: 拖动「上下文时间」停在其中一轮，当前位置显示该轮的「第 N 次」
    then: 同一块里的模型窗口占比、上游输入用量和发送时间都换成这一轮的，并与这一轮的 token 属于同一次发送；能看出数字对应的是这一轮，而不是仍标成最近一次已发送请求
  - id: AC-3
    given: 当前对话有多轮已发送请求，最近一次的 token、模型窗口占比、上游输入用量和发送时间都已显示过
    when: 把「上下文时间」拖到最右端，当前位置显示「当前 · 最新」
    then: 这块的 token、模型窗口占比、上游输入用量和发送时间与最近一次已发送请求一致，并标明这是最近一次已发送请求
  - id: AC-4
    given: 同一条对话里，某一轮没有上游输入用量，另一轮有上游输入用量，两轮的 token 数不同
    when: 把「上下文时间」拖到没有上游输入用量的那一轮
    then: 这一轮的上游输入用量显示未知，不显示另一轮的用量；这一轮的 token、模型窗口占比和发送时间仍是这一轮自己的
  - id: AC-5
    given: 当前对话有多轮已发送请求，右侧这块已经打开
    when: 拖动「上下文时间」换到另一轮，并且不点击「刷新」
    then: 这块的 token、模型窗口占比、上游输入用量和发送时间立刻变成所选轮的；只要还停在这一轮，就保持这一轮的数字，不会自己变回最近一次
  - id: AC-6
    given: 当前对话只发出过一轮请求，另一条对话有不同的 token、模型窗口占比、上游输入用量和发送时间
    when: 打开当前对话查看这块；若「上下文时间」可以拖，再分别停在这一轮的「第 N 次」和「当前 · 最新」
    then: 不报错；两种位置下的数字都是这一轮的，与最近一次已发送请求一致，不出现另一条对话的数字
  - id: AC-7
    given: 当前对话还没有已发送请求，另一条对话已经有请求数字
    when: 打开当前对话查看这块
    then: 不报错；这里表明还在等待请求，模型窗口占比和上游输入用量为未知，不显示某一轮的发送时间，也不出现另一条对话的数字
