id: tool-call-pairing-verification
title: 工具调用与结果配对验证试点
status: implemented
requirement: |
  可以，就先拿工具调用与结果配对做试点，按项目规范先写验收标准给我确认。如果效果好，可以扩大到更大的范围
notes: |
  本次仅验证工具调用与结果配对，不承诺全项目无缺陷或单测不再偶发失败。
  配对完整性针对正常运行及可控异常处理后的有效对话记录；进程被强杀、机器断电和存储损坏后的恢复不在本次范围内。
  运行中或等待审批时允许尚未完成的调用，但不得把它报告为已完成且配对完整。
  本次授权范围为验证能力；如发现现有产品行为违反标准，保留失败证据并另提修复验收，不弱化标准或擅自修复产品行为。
  是否扩大范围由本次报告及后续确认决定。
links:
  - https://github.com/cursor/plugins/blob/main/pstack/skills/create-formal-verification-skill/SKILL.md
criteria:
  - id: AC-1
    given: 对话中存在一个或多个工具调用
    when: 工具正常执行且本次运行已结束
    then: 有效对话记录中的每个调用恰好对应一个结果，每个结果都有先前对应的调用，且不同调用的结果不会相互错配
  - id: AC-2
    given: 工具调用过程中发生执行失败、未知工具、审批拒绝、可控取消或重试
    when: 对应处理完成且本次运行已结束
    then: 每个已记录的调用仍恰好对应一个成功或明确失败的结果，不因重试或重复返回而产生重复结果或无对应调用的结果
  - id: AC-3
    given: 工具仍在执行或正在等待用户审批
    when: 检查当前对话记录
    then: 尚未返回的调用被明确识别为待完成，不被误报为已完成且配对完整，也不因暂时缺少结果而被判为已结束记录的配对缺陷
  - id: AC-4
    given: 开发者运行试点验证
    when: 查看验证报告
    then: 能看到实际检查的性质、事件顺序探索范围、假设及排除场景，并能区分模型检查与真实程序回归结果；仅运行普通测试或检查规格文件不能被报告为模型检查通过
  - id: AC-5
    given: 配对约束被违反
    when: 试点验证发现问题
    then: 验证失败并提供可复现的事件顺序、涉及的调用及具体违约说明，保留问题而不通过缩小已批准范围或弱化标准把结果改为通过
  - id: AC-6
    given: 在隔离副本中分别故意引入遗漏结果、重复结果及结果关联错误的真实代码缺陷
    when: 运行试点验证并在演练后恢复原始代码
    then: 每一种缺陷均被检测为失败，恢复后结果回到演练前状态，并留下可查看的演练证据
  - id: AC-7
    given: 开发者按项目说明准备固定版本的验证工具，且不配置真实模型密钥
    when: 使用同一个入口重复运行验证，或遇到工具缺失、执行超时及检查未完成
    then: 相同代码与配置得到一致的判定；无法完成检查时明确报告未完成及原因，并阻止发布门禁通过，不将其视为验证成功
  - id: AC-8
    given: 后续开发者或 Coding Agent 修改了试点覆盖的配对逻辑
    when: 按项目验证指引检查该改动
    then: 能识别需要复核的验证范围、执行验证并判断模型是否仍符合真实行为；覆盖代码变化而尚未完成对应复核时，检查明确提示需要复核且不沿用旧的通过结论
