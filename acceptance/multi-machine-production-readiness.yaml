id: multi-machine-production-readiness
title: 多机软件工厂第四阶段：实际环境运行与限定范围发布就绪
status: approved
verificationStage: deployment
requirement: |
  继续推进第四阶段，结合第三阶段的结果和当前缺口，把实际环境部署、真实项目接入、持续运行和发布就绪验收的范围、需要补齐的能力及验收标准写出来给我确认。
notes: |
  2026-10-19 用户明确批准按8条拆分本地交付，原40条保留为现场验收；原标准正文和approved状态不变。
  用户已确认按本规格开发；当前按“先本地吧”仅做本地实现与验证，具体远端部署和接入仍待明确。前三阶段23/33/36条标准及已有发布就绪标准保持不变。
  第三阶段基线为PR #188的已合并提交decf8cfca70fabf81d22994f939594ae53664c0a。
  首版限定Linux常驻协调服务、单实例持久状态和至少两台真实Linux执行机器；优先复用现有Compose部署资产，不宣称多协调器高可用或任意平台支持。
  本阶段部署对象是工厂自身。接入真实项目的交付终点仍为MERGED，不包含该项目的业务部署、重启或数据库变更。
  具体主机、入口、状态目录、真实项目、分支、可见性、身份、模型和费用上限必须在实施清单中明确；缺失时只能准备，不能部署、扩权或发布。
  不默认新建公开仓库、不复用试验App扩大业务权限、不清理既有分支或工作区、不外发私信。真实用户流量的接入范围和工厂服务切换需有明确授权。
  性能与浸泡沿用既有完整协议，受控模型/软件负载与真实模型/真实项目证据分别记账；短时、降配、模拟或拼接运行不能充当完整验收。
  发布结论仅适用于已核对的候选制品、配置、支持环境和授权项目，不代表整个产品已完成所有开发。
