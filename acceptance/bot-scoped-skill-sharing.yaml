id: bot-scoped-skill-sharing
title: Bot 私有技能沉淀与指定 Bot 共享
status: implemented
requirement: |
  我希望沉淀的技能默认按 Bot 隔离，也可以选择共享给其他 Bot。帮我设计一下，先写验收标准给我确认。
notes: |
  设计范围：新沉淀技能默认归发起 Bot 私有；共享为对同一份技能的只读使用授权，
  由用户指定接收 Bot，不复制技能，不默认共享给所有 Bot 或未来新建的 Bot。
  确认卡片允许选择共享对象；保存后也可从技能管理页调整共享对象。
  本次确认同时明确既有 skill-capture-intent-confirmation 的 AC-2、AC-3、AC-6：
  确认范围增加所属 Bot 与共享对象；可查找和加载只针对有权使用该技能的 Bot；撤销按所属技能作用。
  原有一次确认后自动提炼保存、无需再次审核正文的流程不变。
  历史全局技能保留现有可用范围，标记为历史共享，用户可显式归属并收窄范围；
  仓库技能、内置技能及外部导入技能不在本次归属迁移范围内。
  撤回共享影响后续发现和加载，不承诺抹除接收 Bot 已读入历史对话的正文。
criteria:
  - id: AC-1
    given: Bot A 判断经验值得沉淀为新技能
    when: 用户打开沉淀确认框
    then: 确认框显示所属 Bot A，默认仅 Bot A 可用且未选中其他共享对象
  - id: AC-2
    given: 用户保持仅 Bot A 可用并确认沉淀
    when: 自动提炼保存成功
    then: Bot A 的其他对话可搜索和加载该技能，Bot B 无法发现该技能或通过准确名称和标识加载正文，且不需要第二次审核正文
  - id: AC-3
    given: 用户正在确认新技能或管理 Bot A 已保存的技能
    when: 用户选择共享给 Bot B 并保存
    then: Bot B 可搜索和加载该技能并看到来源 Bot A，未选中的 Bot C 和后来新建的 Bot 不获得访问权限
  - id: AC-4
    given: Bot A 的技能已共享给 Bot B
    when: Bot B 的模型尝试更新、撤销或转共享该技能
    then: 操作被拒绝且原技能和共享范围不变；Bot B 可以另行提出自己的私有技能建议，仍需用户确认后保存
  - id: AC-5
    given: Bot A 的技能已共享给 Bot B
    when: 用户确认 Bot A 对该技能的更新并成功保存
    then: Bot B 下次加载得到更新后的正文，所属 Bot 和已确认的共享对象保持不变
  - id: AC-6
    given: Bot A 的技能已共享给 Bot B 和 Bot C
    when: 用户在管理页取消对 Bot B 的共享
    then: Bot B 后续搜索不再出现该技能且加载被拒绝，Bot A 和 Bot C 仍可使用；界面说明此操作不会清除历史对话中已加载的内容
  - id: AC-7
    given: Bot A 的技能已共享给其他 Bot
    when: 用户撤销该技能并确认界面列出的受影响 Bot
    then: 该技能从可用技能中移除，所属 Bot 及所有接收 Bot 后续均不能搜索和加载，处理记录保留
  - id: AC-8
    given: Bot A 和 Bot B 分别沉淀了同名技能
    when: 用户确认各自的建议
    then: 两份技能独立保存，互不覆盖，更新或撤销其中一份不会影响另一份
  - id: AC-9
    given: 一个 Bot 同时有权使用多份同名技能
    when: 用户或模型搜索并加载该名称
    then: 搜索结果区分各份技能的所属来源，指定具体结果可加载对应正文，仅提供有歧义的名称时提示选择而不默默加载其中一份
  - id: AC-10
    given: 用户打开技能管理页
    when: 用户按 Bot 查看沉淀技能
    then: 页面区分该 Bot 自有和其他 Bot 共享的技能，显示所属来源与共享对象，并提供用户调整共享范围和撤销自有技能的入口
  - id: AC-11
    given: 接收 Bot 的技能使用范围受到额外限制
    when: 用户将技能共享给该 Bot
    then: 共享不会绕过既有使用限制，界面明确提示该 Bot 当前仍不能使用的原因
  - id: AC-12
    given: 用户保存共享范围时发生失败或选择的接收 Bot 已不存在
    when: 系统返回操作结果
    then: 明确提示失败原因且不报告共享成功，原技能内容与原共享范围保持不变
  - id: AC-13
    given: 已保存 Bot 私有技能及其共享范围
    when: 本地服务重启
    then: 技能归属和共享范围保持不变，未授权 Bot 仍不可搜索和加载
  - id: AC-14
    given: 升级前已经存在全局可用的沉淀技能或待确认建议
    when: 用户升级后查看和处理它们
    then: 历史技能保留原可用范围并标记为历史共享；用户可明确选择所属 Bot 和共享对象后转换；旧建议确认前必须显示待保存的所属和可见范围，不静默改变已有技能权限
