id: session-eval-lift
title: 会话评估能区分能力提升和下降
status: implemented
requirement: |
  结合最新代码，这个评估集，需要做什么升级和配合来检测新的功能是带来提升还是下降？
  分多个agent去帮我开发完成
notes: 'assumedApproval: standing-order-2026-10-22'
criteria:
  - id: AC-1
    given: 一道要求先按指定顺序和参数调用工具的会话题
    when: 最终答案和落盘结果都正确，但开头的工具顺序或参数不对
    then: 这一次判失败
  - id: AC-2
    given: 同一批会话题在冻结基线和候选版本上各重复多次
    when: 某一类或一道关键题变差，即使总通过次数上升
    then: 对照结论是退步；重复运行不把同一道题算成更多道题
  - id: AC-3
    given: 一份回归卷结果和一份更难的能力卷结果
    when: 回归卷只是保持不差，或者任一卷样本不够
    then: 不能叫做能力提升；只有能力卷变好且回归卷没有变差才叫做提升；回归卷或能力卷变差叫做下降；样本不够叫做证据不足，不叫做持平
  - id: AC-4
    given: 一道需要工具的会话题
    when: 这一轮没有把这些工具提供给模型
    then: 这次试验无效，不能记成模型成功，也不能记成模型退步
  - id: AC-5
    given: 原有不要求工具顺序的会话题，以及新的回归卷和能力卷
    when: 用原来的评分方式检查这些旧题，并检查两套新卷
    then: 旧题评分结果保持不变；回归卷包含原来的全部题目且至少三十道不同的题；能力卷与回归卷没有重复题
