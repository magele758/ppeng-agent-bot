id: bot-input-suggestion-cache
title: Bot 每轮推荐只生成一次并保留
status: implemented
requirement: |
  还有，帮我检查下，之前做的bot自动推荐问题的功能，有保存和重复调用模型吗？我切换一下会话就没了，我想要一轮会话只调用模型推荐一次，切换会话还可以保留
notes: |
  assumedApproval: standing-order-2026-10-22
  一轮指用户发起并由 Bot 完成回复的一轮。同轮重复请求复用结果或等待同一调用，取代旧规格中同轮取消重发的行为；跨轮和跨会话仍拒绝过期响应。
criteria:
  - id: AC-1
    given: Bot 完成一轮回复且推荐已启用
    when: 多次聚焦或并发请求该轮推荐
    then: 模型最多调用一次，所有有效请求复用同一份推荐
  - id: AC-2
    given: 当前轮推荐已生成
    when: 切到别的会话再回来、刷新页面或重启服务
    then: 仍能读取保存的同轮推荐，不重新调用模型，也不显示其他会话的推荐
  - id: AC-3
    given: 旧一轮推荐仍在生成
    when: 用户开始新一轮并获得新回复
    then: 新轮最多生成一次，旧轮结果不能覆盖新轮推荐；回复未完成时不生成
  - id: AC-4
    given: 推荐失败、为空、已关闭或会话不可访问
    when: 重复请求推荐
    then: 失败和空结果不会在同轮触发反复模型调用；关闭或无权限时不返回推荐或调用模型
