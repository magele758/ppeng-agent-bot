id: bot-room-work-continuity
title: 群派工到原 Bot 持久工作的可靠承接
status: implemented
requirement: |
  那就按v2计划开始改，先把日志里这些真实问题复现成测试，再逐项修好，验收通过后review、提交PR并合并，不要停下来等我确认。
notes: 'assumedApproval: standing-order-2026-10-22；v2 R4：真实用户在任务协作群派工，明确承接到指定 Bot 的现有 Goal 服务。'
criteria:
  - id: AC-1
    given: 真实用户在任务协作群向成员布置明确工作
    when: 服务器接受请求或收到同一幂等请求
    then: 原 Bot 的单聊中只有一个对应持久目标，群立即获得带工作关联的接收回执，不依赖一次模型发言
  - id: AC-2
    given: 群讨论已结束或预算不足，但工作尚未交付
    when: 后续调度或用户到原 Bot 单聊追问
    then: 同一工作仍可继续，区分讨论结束和工作状态，不要求重新派发或另建无关目标
  - id: AC-3
    given: 关联工作经现有目标服务核验完成、受阻或失败
    when: 状态回流原群且发生重复调度或重启
    then: 原群获得对应状态和原工作入口，状态回执不重复，不自动复制私聊正文或私有证据
  - id: AC-4
    given: Bot 自动投稿、伪造的人类标记、外来用户或已退出群的 Bot
    when: 尝试承接或发布群工作结果
    then: 不凭消息文本取得人类授权，不创建越权工作，不把结果回退到无关群或用户
  - id: AC-5
    given: 原群已有一项关联工作
    when: 用户只追问状态、调整格式，或明确暂停、取消、续跑这项工作
    then: 查询和格式偏好不创建新目标，控制只影响对应工作，其他 Bot 的工作不受影响
  - id: AC-6
    given: 用户在 Lab 查看接收回执、后续状态及工作入口
    when: 切换语言或打开 Bot 工作记录
    then: 界面明确说明讨论和交付的区别，使用本地化文案并打开同一工作所属会话
