id: bot-execution-p0
title: Bot 任务直达执行与证据保真
status: implemented
requirement: |
  那就按你建议的顺序直接改，先把 P0 的分类路由、压缩丢证据、完成验证和执行提示修好，参考 grok-build 的实现，做好测试和 review 后提交合并。
notes: |
  复用 PR247 的缺失 team/swarm 运行修复与回归夹具修正：缺失引用进入 blocked，不自动重派。默认轮数测试对齐既有 unlimited 标准。
  assumedApproval: standing-order-2026-10-22
  默认当前 Bot 完整执行；显式并行、委托、权限和隔离约束仍生效。费用耗尽不得停掉执行。保留分析类请求不创建冗余目标的既有标准。
criteria:
  - id: AC-1
    given: 用户请求修复或实现并可能附带研究步骤
    when: 改用礼貌问句、问号或中英文同义表达
    then: 交付目标不会因标点丢失，普通任务由当前 Bot 完整执行，不被隐式降为研究子任务
  - id: AC-2
    given: 用户讨论暂停取消，或者明确请求并行与委托
    when: Bot 判定意图和执行方式
    then: 讨论不触发控制操作，明确隔离任务仍隔离且不能越过权限；费用耗尽不得停掉执行
  - id: AC-3
    given: 旧工具输出很长且末尾包含失败结论或产物位置
    when: Bot 压缩上下文
    then: 摘要仍看到首尾证据和结果状态，结构化结果保留关键字段，原文仍可回查且不被改写
  - id: AC-4
    given: 执行包含长日志、多次工具调用和最终测试结果
    when: Bot 验证是否完成
    then: 验证材料结构完整且保留可定位的真实工具结果，不能靠助手口头声明或伪造引用通过外部行动的完成验证
  - id: AC-5
    given: 验证返回具体未完成事项或验证服务失败
    when: Bot 结算本次执行
    then: 未完成事项明确传给下一轮；服务失败、无效裁决或无法核实的完成声明保留证据待核对，不伪装完成或盲目重做
  - id: AC-6
    given: Bot 指定了不同于全局默认的模型
    when: 进行意图判定和完成验证
    then: 使用该会话配置的模型而不是静默交给全局默认模型
  - id: AC-7
    given: 用户授权了一个多步骤任务
    when: Bot 收到执行指导
    then: 指导要求真实调用工具、验证交付、持续完成已授权步骤，明确阻塞时说明原因，并保留审批边界；普通 Bot 不被强制要求角色流水线
