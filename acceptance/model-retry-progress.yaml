id: model-retry-progress
title: 临时模型故障延长退避并展示重试进度
status: implemented
requirement: |
  那就把这块改一下，临时模型报错别这么快就停，延长重试退避，界面显示重试进度。先按验收优先写标准给我确认。
notes: |
  以下次数和时间是本次已确认的默认行为，适用于普通 Agent 和 Bot 对话。
  不新增环境变量或配置界面；已有显式重试次数设置继续生效，以下次数均以未设置覆盖值为前提。
  与 upstream-resilience 的已批准标准共同生效；本草案明确其 AC-4 的等待上限为 120 秒，保留超过上限不原地等待的行为。
criteria:
  - id: AC-1
    given: 用户正在与 Agent 或 Bot 对话，未配置备选模型，也未覆盖默认重试次数
    when: 模型请求连续遇到网络断连、请求超时、HTTP 408、429 或 5xx 临时错误，且上游未指定等待时间
    then: 首次失败后最多自动重试 5 次，依次等待 2、4、8、16、30 秒；等待期间任务保持进行中，不提前宣告失败
  - id: AC-2
    given: 模型请求因临时错误进入自动重试
    when: 某次重试成功
    then: Agent 在原会话继续未完成的工作，无需用户重发消息，且不会因重试重复执行已经成功完成的工具操作
  - id: AC-3
    given: 模型限流并明确要求等待一段时间
    when: 系统决定下一次尝试
    then: 要求等待不超过 120 秒时，至少等待该时间与本次默认退避时间的较大值；超过 120 秒时不对该模型原地等待，有备选则尝试备选，没有备选则明确说明等待要求超出上限
  - id: AC-4
    given: 模型请求返回明确的鉴权失败、权限不足、模型不存在或无效参数错误，且不属于已有上下文或协议修复场景
    when: 系统处理此次错误
    then: 不对同一请求进行延时重试；有适用备选则沿用模型切换行为，否则立即显示可理解的失败原因
  - id: AC-5
    given: 用户已配置可用的模型备选链，且未覆盖默认重试次数
    when: 主模型及备选模型连续发生可重试的临时错误，且上游未指定等待时间
    then: 主模型先按 2、4、8、16、30 秒最多重试 5 次，耗尽后依次切换备选；每个备选首次失败后等待 2 秒重试 1 次，全部耗尽后才结束本次运行
  - id: AC-6
    given: 用户正在 Lab 中查看发生临时模型错误的对话
    when: 系统等待重试或开始下一次请求
    then: 对话区显示当前模型、简明错误原因、该模型即将进行的重试序号及最大次数；等待时显示逐秒更新的剩余时间，请求开始后显示正在重试，切换备选时显示目标模型；中文和英文界面均使用对应语言
  - id: AC-7
    given: 自动重试正在等待退避结束
    when: 用户点击停止
    then: 界面在 1 秒内退出等待状态，显示已停止，且不再发起后续重试或切换备选模型
  - id: AC-8
    given: 一次失败的模型尝试已经在对话中显示部分回答
    when: 系统重试并最终成功
    then: 最终只展示成功尝试的回答，不拼接失败尝试的残留文字；成功后移除进行中的重试提示，用户消息不重复出现
  - id: AC-9
    given: 所有允许的模型请求与重试均已失败
    when: 本次运行结束
    then: 界面退出重试和加载状态，明确显示自动重试已耗尽、实际总请求次数及最后失败原因，并保留用户消息和此前已完成的对话内容，不把失败标记为任务成功
