id: bot-room-sparse-routing
title: 所有群稀疏唤醒
status: implemented
owner: user
requirement: |
  routing = sparse-all：所有群（含 2–3 人小群）都稀疏唤醒，不再「未点名则全员轮流」。静默不占有效发言预算。小群未点名时仍必须有人回复（群主或被选中的成员），不能变成群里沉默。群成员仍至少 2 人。
  把点名直达、容量、静默不占预算，与「未点名 = 群主稀疏选人」放到同一个可合并切片。
criteria:
  - id: AC-1
    given: 用户在 Lab 里保存了更大的名册上限和单群人数上限
    when: 用户按新上限创建 Bot、建立群，或把自己有权使用的整个职能组加入群
    then: 不必修改环境变量或重启即可完成。超过上限时看到明确提示，已经在群里的成员保持不变。无权使用的 Bot 不会被整组带进群，并说明原因
  - id: AC-2
    given: 群里有多名成员，且本轮发言人数有上限
    when: 用户用 @ 点名其中若干成员
    then: 只有被点到、且不超过该上限的成员发言，其余成员不发言。被点到的人保持沉默时，群里不出现他的气泡，也不会因此叫来没被点名的成员
  - id: AC-3
    given: 群里有多名成员
    when: 用户 @ 了一个不在群里的名字
    then: 群里出现一句未找到对象的说明，其他成员不会因此全体发言
  - id: AC-4
    given: 群里有 2 名、3 名或更多成员
    when: 用户不点名，直接发一条需要回答的消息
    then: 不是每位成员都发言。发言的是群主，或群主选出的、不超过本轮人数上限的成员
  - id: AC-5
    given: 群里只有 2 名或 3 名成员
    when: 用户不点名直接发消息
    then: 群里至少出现一条可见回复，来自群主或被选中的成员。群不会一直没有任何成员回复
  - id: AC-6
    given: 本轮已经安排了下一位成员，且本轮还能发表的可见回复没有用完
    when: 当前成员保持沉默、不往群里发消息
    then: 这次沉默不算失败，也不占用本轮的有效发言次数。下一位已经被选中的成员仍可以发表可见回复
  - id: AC-7
    given: 用户已有多个 Bot，或群里已经有至少两名成员
    when: 用少于两名 Bot 建群、把同一个 Bot 重复加入，或移出后会少于两名
    then: 群不会变成少于两名或出现重复成员
  - id: AC-8
    given: 一个已经存在的群有自己的本轮可见回复上限
    when: 用户只提高全局的单群人数上限，而没有修改这个群
    then: 这个群本轮可见回复上限保持原值
notes: |
  用户于 2026-10-21 确认。被替代的 bot-rooms AC-2 句子已改写，整份 bot-rooms 保持 implemented。play-bot-group 的「至少 2 人」未改。
  验收规范的 retired 作用于整份规格。bot-rooms 的 AC-1、AC-4、AC-5、AC-6、AC-7、AC-8 仍然有效，不能把整份标为 retired。批准后请用户确认改写 bot-rooms AC-2，而不是整份 retired。AC-2 里被本规格替代的句子是：「有 @ 时，被点到的成员按出现顺序先发言，然后当前其余成员也按群里的顺序轮到，并被告知自己没被点名、除非有必要补充否则保持沉默」「没有 @ 时当前每个成员都照常轮到一次」「静默也占用本轮一次成员发言预算」「本轮实际会跑到的最后一名成员会被告知这是本轮收尾，非必要不回复」。同文件 notes 里 2026-10-15「没有 @ 时由当前全部成员回应」和 2026-10-17「没被 @ 的成员也会轮到」一并被替代。
  play-bot-group 的 AC-1、AC-2 不替代。本规格 AC-7 复述「至少两名且不重复」，避免稀疏调度把群减到一人。
  本规格是第一个可合并切片。被选中的成员可以串行。未点名路径在此切片已经是群主稀疏选人，不保留全员轮流的中间态。
