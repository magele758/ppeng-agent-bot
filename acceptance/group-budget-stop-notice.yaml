id: group-budget-stop-notice
title: 群聊顶部的失败提示写明是预算停下的
status: implemented
requirement: |
  这个怎么一直在显示
criteria:
  - id: AC-1
    given: 群开了费用预算，最近一轮因为达到费用预算被停下
    when: 打开这个群聊
    then: 顶部提示写明这一轮达到了群的费用预算、还没回复的成员不再回复、可以在群设置里调整，不再让人去检查成员模型
  - id: AC-2
    given: 群开了工具调用上限，最近一轮因为达到工具调用上限被停下
    when: 打开这个群聊
    then: 顶部提示写明这一轮达到了群的工具调用上限、可以在群设置里调整，不再让人去检查成员模型
  - id: AC-3
    given: 最近一轮因为成员自己执行失败而失败
    when: 打开这个群聊
    then: 顶部仍显示原来那条「群成员本次回复失败」的提示
  - id: AC-4
    given: 最近一轮正常结束、还在进行，或群里还没有任何一轮
    when: 打开这个群聊
    then: 顶部不显示失败提示
notes: |
  assumedApproval: standing-order-2026-10-22
  用户截图里的提示是「群成员本次回复失败，请检查成员模型或稍后重试。你可以继续发送消息。」。
  那个群每一轮都是被费用预算停下的，成员模型没有报错，所以这条提示每轮都回来，而且给的原因不对。
  这里只改提示写的原因。预算怎么算、回合记成什么状态都不动。
