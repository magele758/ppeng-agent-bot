id: steer-timeline-order
title: 实时插话前后的回复保持时间线位置
status: implemented
requirement: |
  实时插话显示的位置应该是时间轴上一致的，现在是我插话，自动把模型返回整体后挪了，这个跟真实逻辑有差距
notes: 'assumedApproval: standing-order-2026-10-22。保留当前插话消费时机，修复显示层在插话落库后重复渲染已输出回复的问题。'
criteria:
  - id: AC-1
    given: 助手已输出一段回复，用户在同一执行中插话
    when: 插话落库并刷新对话记录
    then: 插话前的回复保持原位置且只显示一次，流式区域只保留尚未落库的新输出
  - id: AC-2
    given: 同一执行中连续插话或流式结束时仍有未落库的输出
    when: 更新对话或保留末尾输出
    then: 不把插话之前已经保存的回复重复放到插话之后，也不丢失新增内容
  - id: AC-3
    given: 用户开始一个真正的新请求
    when: 新回复恰好与旧回复文字相同
    then: 新回复仍正常显示，不被上一轮内容误去重
