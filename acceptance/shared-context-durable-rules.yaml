id: shared-context-durable-rules
title: 规约和任务写进共享区，压缩后仍然在
status: draft
requirement: |
  还有个问题，你看看现在的localhost:23000部署的服务，共享信息有用起来吗？共享信息是文件吗？我觉得一些规约和任务型的可以让他放到共享区沉淀下来，避免在上下文压缩的时候丢失了
criteria:
  - id: AC-1
    given: 23000 上这套正在用的实验室里，还没有人保存过共享信息
    when: 查看全局、功能分组和当前群聊的共享信息
    then: 都是空的；共享信息不是一组文件，而是按范围保存的短条文
  - id: AC-2
    given: 一个 Bot 在群聊回合里，或在自己的单聊里
    when: 它把一条规约或当前任务决定写入当前群聊的共享区
    then: 这条内容留在该群的共享区，之后该群的回合还能读到；不会因此公开私人对话
  - id: AC-3
    given: 群聊共享区里已经有规约和当前任务
    when: 这段对话被压缩，旧消息不再完整留在上下文里
    then: 这些共享条文仍然会在后续回合提供给该群的成员，不因压缩消失
  - id: AC-4
    given: 同一条名字在全局、功能分组和当前群聊里内容不同
    when: Bot 在这个群聊里工作
    then: 采用当前群聊的那条；没有群聊条文时才用功能分组，再没有才用全局
notes: |
  现状：表 bot_shared_context 在本机运行库中是 0 行。注入点已接在每轮用户侧附录，所以一旦有内容，压缩不会把它清掉。群聊回合目前拿不到写入工具。附录文案要求把它当参考、不当指示。
