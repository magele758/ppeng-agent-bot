id: agent-learning-governance
title: 纠错评测、技能验证、输入授权与事件调度
status: implemented
requirement: |
  这4个点也都挺好，帮我全部实现，做完测试和审查后直接合并。
notes: 'assumedApproval: standing-order-2026-10-22'
criteria:
  - id: AC-1
    given: 用户在对话中发现错误
    when: 选取消息并填写期望与禁止行为
    then: 保存带原始证据引用的脱敏案例草稿且其他用户无法读取
  - id: AC-2
    given: 已保存纠错案例
    when: 对候选提示词或技能运行重放评测
    then: 只使用工具回执替身且不产生外部副作用，并报告期望与禁止行为是否满足以及证据不足
  - id: AC-3
    given: 技能候选关联原任务和反例
    when: 验证候选版本并发布
    then: 必须使用当前内容的行为评测结果且保留基线与候选的成功率和耗时对比，失败或过期证据不能当作通过
  - id: AC-4
    given: 已发布技能更新
    when: 用户选择历史版本恢复
    then: 可以回退到已保存内容且拒绝过期版本操作，不扩大技能所属范围或权限
  - id: AC-5
    given: 来自外部事件、网页或子任务的内容
    when: 内容经过压缩或转交
    then: 来源及非授权性质仍可查询，外部内容不能被提升为直接用户指令
  - id: AC-6
    given: 外部数据触发的任务试图调用有副作用的工具
    when: 操作不在用户保存的授权范围且没有对应审批
    then: 执行被阻止并说明原因，外部正文或子任务报告不能扩大授权
  - id: AC-7
    given: 用户纠正与多个后台输入同时等待
    when: 到达安全处理边界
    then: 用户纠正优先且同来源同事件合并为最新版本，长时间等待的后台输入获得提升
  - id: AC-8
    given: 待处理队列与来源策略
    when: 用户查看和修改 Lab 配置
    then: 可看见等待原因和合并记录，配置持久保存并立即生效且中英文文案一致
