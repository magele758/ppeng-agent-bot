id: reasoning-replay-separation
title: 历史思考不冒充已发布正文
status: implemented
requirement: |
  那把那 15 条已经落库的短段复述也深挖一下，查清是模型复读还是流式拼接的问题，有问题继续修，补回归测试并上线验证。
notes: 'assumedApproval: standing-order-2026-10-22；原始非流式上游响应已复现短句重复；纠正历史思考被当作助手正文反馈的行为，不清洗历史或按相同文字删除内容。'
criteria:
  - id: AC-1
    given: 历史助手消息同时包含思考摘要和已发布正文
    when: 继续进行流式或非流式对话
    then: 仅把已发布正文作为历史助手正文发给模型，思考摘要仍保留在历史中供查看
  - id: AC-2
    given: 历史消息包含工具调用、结果或只有思考摘要
    when: 通过 Chat Completions 或 Responses 继续对话
    then: 工具调用和结果保持配对，不将思考伪装成正文，不发送空的助手正文
  - id: AC-3
    given: 上游正文或历史正文含有合法重复句，且思考内容与正文相同
    when: 模型响应被接收或下一轮历史被发送
    then: 保留正文的原始内容和重复次数，不合并两个通道，不按文字相同去重
