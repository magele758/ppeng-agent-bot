id: bot-room-speaker-pick
title: 群聊按贴题程度决定谁开口
status: implemented
owner: user
requirement: |
  群聊不要只靠群主。未点名时，知道细节的成员要能先答。群主已经答过，明显更贴题的那一只还可以补充或修正。大家都不沾边，就整群不回复。不要把每个成员都叫醒写长回复。
  未点名、未引用：用名字、头衔、简介、职能组对用户这句话打分。只叫醒超过门槛的前几位，不超过每轮发言人数（默认 4）。这些专家先并行答。群主如果也过线，可以在这批里；群主没过线就不要为了收尾先写长回复。
  有专家给出可见的实质回复之后，群主若还没发言，可以再做一次短收尾。没有新事实就不要发。收尾不是再把其余成员跑一遍。
  群主已经有可见回复，且还有一只没发言但分数明显更高：再用「最多再加一位」把那只叫起来。它能看到已有回复，可以补充或修正，也可以沉默。不要第二轮把所有人再跑一遍。
  没人过门槛：这一轮零回复。不叫醒大家表态，不贴「我先接住」。
  [SILENT] 和短否定（我不知道、不清楚、没有要补充）不进群，不占有效发言。
  被 @ 时仍只叫醒被点到的人，截到本轮人数上限。点名没人中，保持现有「没找到」行为。引用某条 bot 回复时，仍只叫醒被引用的那只。
  群主是建群时指定的那一只；没指定就是成员列表第一只。不要假设某个固定 Bot 一定是群主。
criteria:
  - id: AC-1
    given: 群里有群主和另外几名成员，用户没有 @，也没有引用某条回复
    when: 这句话只和其中一名成员的名字、头衔、简介或职能组对得上
    then: 这名成员先回复。对不上的成员不回复。群主如果自己对不上，不会赶在这名成员之前先发一条长回复
  - id: AC-2
    given: 群里有多名成员，本轮发言人数有上限
    when: 用户不点名，这句话和其中好几名成员都对得上
    then: 先开口的只有对得上、且不超过该上限的成员，他们可以同时回复。对不上的成员不会被叫醒
  - id: AC-3
    given: 已经有对得上的成员在群里给出可见回复，群主这轮还没有发过言
    when: 这一轮继续
    then: 群主可以再发一条短收尾。收尾若是没有要补充或只有静默标记，群里不出现这条。不会因此把其余没对上的成员都叫起来
  - id: AC-4
    given: 群主这轮已经有可见回复，本轮先开口的人数已经到上限，还有一名没开口但明显更贴这句消息的成员
    when: 这一轮继续
    then: 最多再叫这一名。他能看到已有回复，可以补充或修正；他若表示没有要补充，群里不出现这句话。不会再叫第二名
  - id: AC-5
    given: 群里有 2 名、3 名或更多成员
    when: 用户不点名，这句话和每一名成员都对不上
    then: 这一轮没有任何成员回复，也没有「我先接住」。不会把每个成员都叫醒表态
  - id: AC-6
    given: 这一轮已经叫醒了成员，本轮还能发表的可见回复没有用完
    when: 其中一名只回复静默标记，或只回复「我不知道」「不清楚」「没有要补充」这类短否定
    then: 这句话不出现在群里，也不占用本轮有效发言次数。下一位已经被选中的成员仍可以发表可见回复
  - id: AC-7
    given: 群里有多名成员，本轮发言人数有上限
    when: 用户用 @ 点名其中若干成员，或点了一个不在群里的名字
    then: 只叫醒被点到、且不超过该上限的成员。点名没有命中任何人时，群里说明没找到，其他成员不发言
  - id: AC-8
    given: 群里已经有某名成员的回复
    when: 用户引用这一条回复再发一句
    then: 只叫醒被引用的那一名成员，即使这句话和另一名成员更贴题
  - id: AC-9
    given: 建群时指定了不是成员列表第一位的成员当群主；另一个群没有指定群主
    when: 用户在指定了群主的群里不点名发一句只和第三名成员对得上的话
    then: 先回复的是对得上的那一名，而不是成员列表里的第一名。没指定群主的群，群主是成员列表第一名
notes: |
  assumedApproval: standing-order-2026-10-22
  未点名由调度按名字、头衔、简介、职能组选人，不依赖群主调用选人工具。
  与 bot-room-sparse-routing AC-4、AC-5 和 bot-rooms AC-2 里「未点名由群主回答、小群至少一条回复」冲突的句子已在同一轮改写。bot-room-tasks 仍是成员提出补充请求后只加一名，本规格不实现私下求助。
