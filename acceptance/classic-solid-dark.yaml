id: classic-solid-dark
title: 经典主题深色用纯色
status: implemented
requirement: |
  经典主题黑色要纯色的，不要搞一些毛玻璃效果。
notes: |
  assumedApproval: standing-order-2026-10-22
  仅经典（无 data-skin）且深色/黑色：侧栏、卡片、面板、输入区为不透明纯色，无 backdrop-filter 模糊。其它外观与经典浅色可继续使用毛玻璃。
criteria:
  - id: AC-1
    given: 用户选了经典外观，并且外观是深色或黑色
    when: 查看侧栏、卡片、面板和输入区
    then: 这些表面是不透明的纯色黑/灰，没有毛玻璃模糊或半透明玻璃感
