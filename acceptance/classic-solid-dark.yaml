id: classic-solid-dark
title: 经典主题深色用纯色
status: implemented
requirement: |
  经典主题黑色要纯色的，不要搞一些毛玻璃效果。
notes: |
  assumedApproval: standing-order-2026-10-22
  仅经典且深色/黑色：侧栏、卡片、面板、输入区为不透明纯色，没有毛玻璃模糊。其它外观与经典浅色可继续使用毛玻璃。
  账户偏好同步之后，经典深色仍是纯色，不会重新出现毛玻璃或顶部白光。
criteria:
  - id: AC-1
    given: 用户选了经典外观，并且外观是深色或黑色
    when: 查看侧栏、卡片、面板和输入区
    then: 这些表面是不透明的纯色黑/灰，没有毛玻璃模糊或半透明玻璃感
  - id: AC-2
    given: 用户正在使用经典外观，并且是深色或黑色
    when: 账户偏好同步成功，过几秒再次同步也一样
    then: 侧栏、卡片、面板和输入区仍是不透明纯色，没有重新出现毛玻璃模糊或顶部白光
