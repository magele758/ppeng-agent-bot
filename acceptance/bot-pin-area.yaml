id: bot-pin-area
title: Bot 列表置顶区
status: implemented
requirement: |
  我还想要加一个bot里的置顶的功能，顶部加一个置顶区域，我把bot拖进去就可以置顶，默认是把big boss（super bot？）置顶的
notes: |
  列表里这只默认 Bot 显示的名字是 Super Bot。置顶区在「Bot」页左侧、功能分组和未分组的上方。
  置顶不改它原来的功能分组或未分组归属，也不新开对话。已经出现在置顶区的 Bot 不再同时出现在下面的功能分组或未分组里；取消置顶后回到原来的分组。
  置顶区自己的标题和提示跟随界面语言；Bot 的名字仍是它原来的名字。
criteria:
  - id: AC-1
    given: 用户打开「Bot」页，左侧能看到功能分组或未分组
    when: 查看单个 Bot 所在列表的顶部
    then: 功能分组和未分组的上方有一块置顶区；群聊不会出现在这块置顶区里
  - id: AC-2
    given: 某只普通 Bot 在某个功能分组或未分组里，并且当前不在置顶区
    when: 用户把它拖进置顶区
    then: 置顶区里能看到这只 Bot 的名字，同一只不会在置顶区重复出现，已经置顶的其他 Bot 仍在；刷新页面后它还在置顶区，所属的功能分组或未分组与拖之前相同
  - id: AC-3
    given: 新用户，或还没有自己把任何 Bot 拖进或拖出过置顶区
    when: 打开「Bot」页
    then: 置顶区里已经有名为 Super Bot 的那只 Bot
  - id: AC-4
    given: 置顶区里有 Bot，其中可以是名为 Super Bot 的那只，也可以是后来置顶的普通 Bot
    when: 用户把其中一只拖出置顶区，然后刷新页面
    then: 这只 Bot 不在置顶区，也不会自己回到置顶区；它仍出现在拖进置顶区之前的那个功能分组或未分组里
  - id: AC-5
    given: 某只本来可以对话的 Bot 已在置顶区
    when: 用户点击置顶区里的这只 Bot
    then: 打开的是它原来的那条对话，可以继续发消息；置顶没有使它无法对话，也没有另开一条新对话
  - id: AC-6
    given: 「Bot」页左侧列表可以正常使用
    when: 把一段文字或一个文件拖进置顶区，或把拖放落在置顶区以外的空白处
    then: 置顶区不会多出没有名字的空项；已有 Bot 仍可点开，列表仍可使用
  - id: AC-7
    given: 界面语言分别是中文和 English
    when: 查看置顶区的标题、空状态或提示
    then: 这些界面文案与当前语言一致，不夹另一种语言的固定句子
  - id: AC-8
    given: Bot 页左侧置顶区里已经有 Bot，可以是默认的 Super Bot，也可以是后来放进去的普通 Bot；另有没置顶的 Bot 留在自己的功能分组或未分组
    when: 查看置顶区下面的功能分组和未分组
    then: 已经出现在置顶区的 Bot 不再出现在这些分组里；没置顶的 Bot 仍留在自己的分组；把某只移出置顶区后，它回到原来的功能分组或未分组，置顶区本身还在
