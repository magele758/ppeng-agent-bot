id: bot-product-admin
title: 对话 bot 能管理产品和配置
status: implemented
requirement: |
  我问 bot，他说也没有创建 bot 和创建群聊的能力，其实这个项目里的功能都可以暴露给 bot，让他能完全自主的操作和管理，你先评估一下，缺哪些，然后都去补齐一下，包含创建以及修改配置之类的都要能支持
criteria:
  - id: AC-1
    given: 用户正在和一个没有单独限制工具的 bot 私聊
    when: 用户让它新建一个 bot，并给出名字
    then: 花名册里出现这个 bot，名字与用户给的一致；若同时给了头衔或简介，也会保存
  - id: AC-2
    given: 花名册里已有一个 bot
    when: 用户让当前 bot 修改它的名字、头衔、简介或单轮上限
    then: 再次查看时这些字段已是新值
  - id: AC-3
    given: 花名册里至少有两个 bot
    when: 用户让当前 bot 用这些成员新建一个群聊，并给出标题
    then: 群聊存在，标题正确，并且包含这些成员
  - id: AC-4
    given: 已有一个群聊
    when: 用户让当前 bot 修改群聊标题或发言轮数上限
    then: 再次查看时标题和轮数上限已是新值
  - id: AC-5
    given: 已有一个群聊
    when: 用户让当前 bot 删除该群聊
    then: 没有明确确认时群聊还在；确认后群聊消失，成员 bot 仍在
  - id: AC-6
    given: 用户在和一个没有工具白名单的 bot 私聊，或在用通用助手
    when: 这一轮准备可用能力
    then: 创建 bot、修改 bot、创建群聊、修改群聊和修改已保存设置都在可用能力里，并且提示明确说自己能做这些事；同一个 bot 在群聊回合里没有这些管理能力
  - id: AC-7
    given: 实验室里已有可保存的设置
    when: 用户让 bot 修改一项非密钥设置（例如记忆整理方式）
    then: 之后读到的是新值，并且结果里不出现 API key、token 或其他密钥原文
  - id: AC-8
    given: 用户让 bot 保存一个模型服务商，并提供了 API key
    when: 保存完成并把结果交回对话
    then: 服务商已保存，但交回的内容里没有这把 key 的原文
  - id: AC-9
    given: 用户正在私聊
    when: 用户让 bot 新建一个功能分组，或新建一条普通会话
    then: 分组或会话被创建，并且可以再被改名
notes: |
  删除类操作必须带明确确认，并走现有审批。密钥只写不回显。
  不包含：代替用户批准工具调用或出站草稿、自愈改仓库、网关/外部代理这类只在 daemon 层校验的密钥配置。
