id: live-bot-quality
title: 真实 Bot 任务评估与版本准入
status: implemented
requirement: |
  那就直接落地这套真实模型任务评估和新旧版本对照门禁，先把这次 P0 问题和常见任务做成评估集，用当前配置的 Grok 模型跑一轮基线，做好测试和 review 后提交合并。
notes: |
  assumedApproval: standing-order-2026-10-22
  首轮基线用于发现问题，不宣称统计认证；模拟、A/A、单次或不充分样本不得放行。真实运行只在隔离夹具执行，不改变当前 Bot 的历史或设置。
criteria:
  - id: AC-1
    given: P0 问题和常见工作任务
    when: 执行评估集
    then: 覆盖问句与组合交付、实际产物、长日志压缩、假完成、错误恢复和权限约束，结果由独立证据验收
  - id: AC-2
    given: Lab 中当前 Bot 已配置模型
    when: 启动真实基线
    then: 只读解析该配置，使用真实模型而不静默回退，凭证不进入报告或模型可操作的工作区
  - id: AC-3
    given: 模型执行一个任务
    when: 超时、预算耗尽、服务报错或用量缺失
    then: 记录实际失败及已有轨迹，不伪装通过，隔离任务不能修改生产数据或调用外部副作用工具
  - id: AC-4
    given: 稳定版与候选版
    when: 对照运行
    then: 使用相同任务模型预算并交错重复，保留版本与构建指纹、逐次结果、分类完成率、稳定性及成本耗时信息
  - id: AC-5
    given: 发布前执行能力准入
    when: 证据缺失或篡改、版本不匹配、关键任务失败、能力退化、样本不足或模拟结果
    then: 门禁拒绝放行并说明原因，不允许降低策略来掩盖失败
  - id: AC-6
    given: 首次真实模型基线
    when: 完成一轮采样
    then: 输出可复查的逐任务证据与汇总，明确样本通过与发布认证的区别，失败任务如实保留
