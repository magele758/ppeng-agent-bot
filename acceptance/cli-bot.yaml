id: cli-bot
title: 命令行使用机器人
status: implemented
requirement: |
  当前项目的cli模式，是否完整？分多个agent去检查下入口、功能、链路、以及新加入的bot模式是否支持在cli模式里使用？如果要能使用，要做什么？分多个agent去快速排查和补齐
criteria:
  - id: AC-1
    given: 已有若干机器人
    when: 用户在命令行列出机器人
    then: 输出里能看到每个机器人的 id 和名字
  - id: AC-2
    given: 用户准备好了一个机器人名字
    when: 用户在命令行创建该机器人，然后再列出机器人
    then: 创建结果里有新机器人的 id，随后的列表里能看到这个名字
  - id: AC-3
    given: 已有一个机器人
    when: 用户在命令行打开它
    then: 输出里有该机器人当前对话的会话 id
  - id: AC-4
    given: 已有一个机器人
    when: 用户在命令行向它发送一句话
    then: 这句话进入该机器人的对话，终端打印助手回复的文字
  - id: AC-5
    given: 一个机器人的当前对话上有目标，另一个机器人的当前对话上没有目标
    when: 用户分别在命令行查看这两个机器人的目标
    then: 有目标时输出包含目标的 id、标题和状态；没有目标时打印明确的空提示，并且命令成功结束
  - id: AC-6
    given: 用户要操作机器人，但没有给出子命令，或子命令无法识别
    when: 用户执行该命令
    then: 命令以非零状态结束，并打印机器人命令的用法
  - id: AC-7
    given: 用户给出的机器人并不存在
    when: 用户在命令行打开它
    then: 命令以非零状态结束，并显示不存在的原因，而不是一长串调用栈
  - id: AC-8
    given: 用户要创建机器人或给机器人发消息
    when: 创建时没有名字，或发送时没有消息正文
    then: 命令以非零状态结束并打印用法，且不会发出创建或发送请求
notes: 'assumedApproval: standing-order-2026-10-22'
