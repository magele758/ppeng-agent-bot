id: bot-skill-panel-layout
title: Bot 技能面板布局清晰且适应窄屏
status: implemented
requirement: |
  这个页面结构都是乱的，特别上面的部分，去修一下
notes: |
  用户截图为 Bot 详情中的技能页，重点是使用范围、保存按钮、搜索和清除搜索挤在一起。
  本次只调整展示和交互排布，不修改技能授权、共享或保存规则。
  与 skill-operation-card-dismissal 分别验收，可在用户一并确认后实施。
criteria:
  - id: AC-1
    given: 用户打开 Bot 详情的技能页
    when: 查看顶部控件
    then: 使用范围及保存操作、技能搜索及清除操作分区清楚，标签完整，控件对齐，不再混排或把搜索标签拆到两行两处
  - id: AC-2
    given: 用户使用桌面或 820 像素宽的窗口，并选择项目提供的不同字号
    when: 打开技能页或调整窗口大小
    then: 控件随可用宽度合理排列，不重叠、不裁切、不横向溢出，按钮文字可读且能操作
  - id: AC-3
    given: 用户查看包含长名称、描述或标识的技能列表
    when: 浏览或展开技能详情
    then: 技能名称、说明、归属和状态层次清楚，长内容在面板内换行，列表可正常滚动且不撑破布局
  - id: AC-4
    given: 用户正在搜索技能或修改技能使用范围
    when: 搜索、清除、保存或遇到保存失败
    then: 筛选和保存行为保持正常，未保存提示、保存结果和错误信息清晰可见；搜索或清除不会误改技能选择，键盘操作及中英文显示正常
