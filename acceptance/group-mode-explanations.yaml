id: group-mode-explanations
title: 群聊回复模式与运行限制说明
status: implemented
requirement: |
  这个是干嘛的？有必要留吗？
  这里的回复模式，介绍的详细点，现在太简单了，没说清楚
  群聊需要加定时任务的能力吗？还是由默认协调者来控制即可？群聊只做组织形式？
notes: 'assumedApproval: standing-order-2026-10-22；保留折叠的运行限制并解释用途，定时任务本轮仅分析，不新增调度功能。'
criteria:
  - id: AC-1
    given: 用户打开群聊设置
    when: 展开回复方式的详细说明
    then: 无需切换或保存模式即可阅读三种方式的执行流程、适用场景及点名规则，且不把协调者模式描述成始终由主持先回复
  - id: AC-2
    given: 用户展开运行限制
    when: 查看限制说明
    then: 能理解限制针对一条消息触发的本次执行、三个额度的作用、费用估算局限和全员模式发言次数例外
