id: bot-goal-nested-approval
title: 目标子任务的待批准出现在主对话
status: implemented
requirement: |
  再用真实模型跑一轮复杂场景：多目标并行、子任务失败重试、暂停恢复、执行中追加要求和服务重启恢复，检查默认配置下有没有新的卡点，发现问题就修复补回归，审查通过后合并并重启。
notes: |
  assumedApproval: standing-order-2026-10-22
  2026-10-25 默认配置真实模型场景：beta 的孙会话停在待批准，目标一直显示等待且主对话没有批准卡片。
  不改 bot-multi-goal-coordination AC-8：外部结果到达后继续处理。本规格只补「还没批准时人必须看得到并点得了」。
  不自动通过审批，也不把待批准收成失败。
criteria:
  - id: AC-1
    given: 一个进行中的目标把工作交给子任务，子任务停在需要人批准的步骤
    when: 人查看该 Bot 的主对话
    then: 主对话里出现这张待批准，目标写明在等这个批准；人在主对话里批准或拒绝后，子任务按该决定继续或停住，目标不再假装还在无人值守地跑
