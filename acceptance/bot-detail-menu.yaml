id: bot-detail-menu
title: Bot 对话右侧详情菜单
status: implemented
requirement: |
  还有一个问题，就是 bot 界面右侧要加一个菜单，显示每个 bot 的详细信息，可以看到他有哪些定时任务，生成的什么历史的文件或者资料，以及他的记忆的情况
  定时任务在这个 bot 菜单里，要能直接操作开启和关闭
  文件要能直接打开文件所在目录
notes: |
  用户授权按这些原话直接实现，不等二次确认。
  定时任务的开启和关闭、以及打开文件所在目录，都做在同一个右侧详情菜单里。
criteria:
  - id: AC-1
    given: 两个 Bot 各自有不同的定时任务、生成过的文件和记忆
    when: 用户在 Bot 对话界面打开右侧详情菜单，并从一个 Bot 换到另一个 Bot
    then: 菜单只显示当前这个 Bot 的定时任务、历史文件或资料、记忆；三块可以分别看到；记忆里的密钥或 token 原文不会显示出来
  - id: AC-2
    given: 当前 Bot 没有定时任务、没有生成过文件或资料、也没有记忆
    when: 用户打开右侧详情菜单并查看这三块
    then: 每一块都有说明目前为空的文案
  - id: AC-3
    given: 当前 Bot 有定时任务
    when: 用户在右侧菜单里开启一条任务，再关闭一条任务
    then: 任务的开启状态变成用户刚刚选择的状态
  - id: AC-4
    given: 当前 Bot 有一条定时任务，开启或关闭没有保存成功
    when: 用户在右侧菜单里尝试切换它
    then: 任务仍显示切换前的状态，并出现失败说明，不会显示成已经切换成功
  - id: AC-5
    given: 当前 Bot 有一份已登记的生成文件，并且文件在家目录内
    when: 用户在右侧菜单里打开该文件所在目录
    then: 本机打开的是这份文件的父目录
  - id: AC-6
    given: 要打开的位置不是当前 Bot 已登记的生成文件，或路径越出该文件，或位于家目录之外
    when: 尝试打开该位置
    then: 操作被拒绝，不会打开任何目录
  - id: AC-7
    given: 用户正在和一个 Bot 对话
    when: 用户打开右侧详情菜单，然后再收起
    then: 可以打开并看到三块详情；收起后面板不再占住对话主区；窄屏时面板覆盖在对话上，而不是把对话挤没
