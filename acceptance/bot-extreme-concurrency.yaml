id: bot-extreme-concurrency
title: Bot 以高并发同时推进多件工作
status: implemented
requirement: |
  现在bot的并发能力和并发机制是什么样的？我想要极致的并发能力，来快速完成各种任务，分多个agent去分析和完成提升
notes: |
  assumedApproval: standing-order-2026-10-22
  同一条消息里点名要分多个 agent、并且逐条列出的独立工作，各自成为目标并同时开工。
  没有点名拆分的单件工作仍由主对话自己做，不额外派生子代理。
  已在工作台保存的更低并发上限继续生效。同一工作区上的修改仍排队，避免互相覆盖。
criteria:
  - id: AC-1
    given: Bot 从未保存过并发上限，一条消息要求分多个 agent，并列出超过四件互相独立的工作
    when: Bot 接下这些工作
    then: 这些工作同时开工，而不是只放行四件、其余停在等待并发名额
  - id: AC-2
    given: 一条消息要求分多个 agent，并列出超过八件互相独立的工作
    when: Bot 理解这句消息
    then: 每一件独立工作都保留成自己的目标，不会被收成一个目标
  - id: AC-3
    given: 用户已经在工作台把并发上限保存为 1
    when: 又来了多件可以并行的工作
    then: 只有一件开工，其余停在等待并发名额，已保存的上限立即生效
  - id: AC-4
    given: 用户把团队任务的同时运行人数保存为大于 16
    when: 设置被保存
    then: 大于 16 的人数被保留，不再被压回 16
  - id: AC-5
    given: 工作台的目标并发设置
    when: 用户填写大于 32 的同时执行上限
    then: 输入允许大于 32，保存后的数字就是之后派发使用的上限
