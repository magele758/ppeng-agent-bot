id: refresh-keeps-agent-run
title: 刷新页面不终止正在进行的对话
status: implemented
requirement: |
  刷新页面，按道理不应该把 agent 终止的，怎么刚才我刷新页面，就说 agent 终止了，这个也要处理一下。
criteria:
  - id: AC-1
    given: 对话里一轮回复正在生成
    when: 用户刷新页面、页面热更新卸载，或先离开再回到这场对话，并且没有点停止
    then: 这场回复继续进行，界面不会把它显示成用户终止
  - id: AC-2
    given: 对话里一轮回复正在生成
    when: 用户明确点停止
    then: 这场回复停止
  - id: AC-3
    given: 用户在回复生成过程中刷新并重新打开同一场对话
    when: 这轮还在进行，或已经跑完
    then: 能接着看到正在生成的内容，或在历史里看到完成后的回复，而不是用户终止
notes: |
  2026-10-19 用户确认刷新不得终止正在跑的回合。这与原先 chat-basics AC-5「断开连接就取消上游」相反，该条已按此改写。
