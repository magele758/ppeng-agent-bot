id: rail-foot-menu
title: 侧栏底部收成悬停菜单
status: implemented
requirement: |
  你在仓库 /Users/penglei/developer/self-test-grounding/ppeng-agent-core。用户指着左侧栏底部 div.lab-rail__foot（组件 Rail），里面现在铺开了「配置模型」、语言「中文 / English」，附图里同一块还有几个图标。他说这几个放到一个 hover 菜单里，不要搞这么大的占位。

  要做成：
  - 默认底部只留一个小触发按钮，不要把配置模型和语言选择铺成大块。
  - 鼠标悬停（以及键盘聚焦，避免只能用鼠标）时展开菜单，里面仍是原来的「配置模型」、语言切换，以及这个 foot 里现有的其它按钮。点「配置模型」和切换语言的行为不变。
  - 菜单不要撑高侧栏。移开鼠标和焦点后收起。
  - 文案继续走 i18n，不要硬编码新的中英文。语言按钮仍显示语言自称（中文 / English）。
  - 不要改模型配置页本身，不要新增环境变量。
notes: |
  assumedApproval: standing-order-2026-10-22
criteria:
  - id: AC-1
    given: 左侧栏底部原来铺开了配置模型、语言选择和其它按钮
    when: 鼠标和键盘焦点都不在这块上
    then: 底部只留一个小触发按钮，配置模型和语言选择不再铺成大块，菜单也不把侧栏撑高
  - id: AC-2
    given: 底部只有那个小触发按钮
    when: 鼠标悬停到这块，或键盘焦点进入
    then: 菜单里能看到配置模型、语言自称（中文 / English）和原来的其它底部按钮，点配置模型和切换语言仍是原来的动作；移开鼠标和焦点后菜单收起
