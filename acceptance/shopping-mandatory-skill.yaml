id: shopping-mandatory-skill
title: 捆绑 shopping 强制技能可加载并解锁购物面
status: implemented
requirement: |
  Repo ships skills/shopping (SKILL.md + sibling Manifest). load_skill(shopping)
  unlocks vault_fill / checkout-marked browser_click|browser_type; without load
  they stay fail-closed. Skill body: read then dispatch; no plaintext; no Grok/Canvas
  commerce UI clone; separate from login Secure Form track.
notes: 'assumedApproval: standing-order-2026-10-22'
criteria:
  - id: AC-1
    given: 仓库 skills/ 目录已检出
    when: 代理或运行时扫描 workspace skills
    then: 存在可发现的 shopping 技能，且 Manifest 允许 vault_fill、browser_click、browser_type，正文写明先读技能再派发、禁止明文与 Grok/Canvas 购物 UI 克隆，并与 login Secure Form 分开
  - id: AC-2
    given: 当前会话尚未成功 load_skill(shopping)
    when: 代理调用 vault_fill 或带 checkout 标记的 browser_click/browser_type
    then: 强制技能门 fail-closed，提示先 load_skill(shopping)
  - id: AC-3
    given: 本会话已经成功 load_skill(shopping)
    when: 代理再次调用 vault_fill（非卡号字段）或 checkout 标记的 browser 工具
    then: 强制技能门放行（仍受 Auto-review 与 Manifest allowTools 约束；卡号字段另需 payment）
