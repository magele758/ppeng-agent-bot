id: ci-parallel-validation
title: 完整验证职责并行与覆盖率产物复用
status: implemented
requirement: |
  按这个方案继续推进，保持验证范围和阈值不变，把单测、Formal、SDK拆开并行，CRAP复用覆盖率产物，Quick保持2分钟以内。先把这次调整的验收标准写出来给我确认。
notes: |
  本规格补充 ci-fast-and-bihourly-gates，不替代或弱化其8条已批准标准。
  对照基线为 main 703a9d2a6d91f0296c5e00260b1d66093dfcdd8c 的验证范围与阈值。
  用户已确认13条标准；先写带验收标签的失败测试，再实现、纵向review和自动化验证。
  两分钟指Quick在执行器上从任务开始到结束的实际耗时，包含准备、安装和检查；平台排队另列。
  不承诺完整验证两分钟结束，不以减少正式故障注入、反向控制或规定重复次数换取提速。
  部署仍后置；原现场验收和未完成的性能对比继续保留。
criteria:
  - id: AC-1
    given: 调整前已有完整验证范围、判定阈值和批准的验收标准
    when: 对照调整后的完整验证
    then: 全量功能、覆盖率、Formal及真实进程、SDK、全部变异、HTTP与集成、浏览器和验收范围完整保留，阈值与基线不放宽；复杂度评分不再阻塞发布
  - id: AC-2
    given: 为一个固定候选启动完整验证且执行资源可用
    when: 单测、Formal和SDK检查具备各自的运行条件
    then: 三类检查可并行推进，任一类无需等待另两类完成才开始，平台资源排队与检查依赖等待分别可见
  - id: AC-3
    given: 检查被重新分工，或以后新增了测试
    when: 核对本轮应执行与实际执行的检查清单
    then: 每项检查都有明确归属，没有遗漏或静默跳过，未归属或范围不完整时完整验证失败
  - id: AC-4
    given: 同一候选的多个检查需要相同的功能测试或Formal证据
    when: 执行完整验证并复用已产生的证据
    then: 不为重复消费结果而重跑同一批功能测试，Formal证据仅在严格输入一致时复用，既有真实进程、故障注入、反向控制与规定重复次数全部保留
  - id: AC-5
    given: 单测、Formal和SDK检查已经产生本轮应有的覆盖率产物
    when: 进行复杂度与覆盖率风险评分
    then: 该评分不再作为完整验证或合并的必须项，也不再为它重跑同一批测试
  - id: AC-6
    given: 待消费的测试结果或覆盖率来自错误候选、无法核验来源的执行尝试、不兼容输入，或存在缺失、损坏
    when: 汇总完整验证或进行风险评分
    then: 拒绝使用并明确说明原因，不能未经严格核验混用其他轮次产物或因缺失覆盖率而错误通过
  - id: AC-7
    given: 任一必须检查失败、超时、取消或未产生必须证据
    when: 其他独立检查继续执行并汇总结果
    then: 保留其余独立检查的真实结果，同时将完整验证判为未通过并阻止发布，不能把失败项的未运行后续步骤当作通过
  - id: AC-8
    given: 多类检查分别产生测试结果并行上传
    when: 汇总验收报告
    then: 各类结果互不覆盖且全部纳入验收，报告可追溯到实际候选和执行尝试，缺少必须结果不得通过
  - id: AC-9
    given: 当前PR或主分支版本触发Quick检查
    when: 执行既有快速检查及存储迁移、引用与分叉的短关键回归
    then: 不删减既有快速范围，在执行器上120秒内给出结论，准备和安装耗时计入，平台排队单独报告
  - id: AC-10
    given: 当前候选Quick失败、超时、取消、缺失或仍有未解决review问题
    when: 判断是否允许合并
    then: 不允许合并，不能借用其他版本结果、取消两分钟限制或以重试掩盖失败
  - id: AC-11
    given: 普通提交、每两小时定时验证或手动完整验证到来
    when: 按调整后的安排运行
    then: 普通提交仍只自动触发Quick，定时和手动仍执行相同完整范围，全部变异分片及其他既有检查频率和判定规则保持不变
  - id: AC-12
    given: 调整前后的运行存在排队、并行执行、复用、重试或取消
    when: 展示运行记录与耗时分析
    then: 分别报告总历时及各检查执行耗时，标明证据复用、首轮失败和重试结果，保留历史记录，不把并行耗时相加或局部复用时间冒充完整验证提速
  - id: AC-13
    given: 当前候选Quick或完整软件验证通过
    when: 判断发布或实际环境上线是否就绪
    then: Quick不能替代候选完整验证，发布仍要求实际候选的完整证据与既有产物检查，现场40条验收和部署后置安排保持不变
