id: room-debate-mode
title: 群聊辩论回复方式
status: implemented
owner: user
notes: "assumedApproval: standing-order-2026-10-22"
requirement: |
  用户想让群里的几只 bot 就一个课题自动进行多轮讨论和辩论。设计好了就做。
  用户在群里选「辩论」方式并发出课题后，参与的 bot 自动按顺序多轮交替发言，后发言者能看到前面所有发言，
  最后由裁判给出总结裁决，全程显示在现有群聊界面里，用户可以随时停止。
  可配置项至少包括：辩论轮数、参与者及其发言顺序、每位参与者的立场（如正方 / 反方，允许自定义文字）、
  裁判由谁担任（可以没有裁判）。给出合理默认值，让用户不配置也能直接开辩。
  长发言不能让对手只看到截断版。总发言数有上限，现有的费用和工具调用上限继续生效，用户暂停或停止能立刻中止辩论，
  进程重启后回合不会重复发言或卡死。其他回复方式的行为保持不变。
criteria:
  - id: AC-1
    given: 一个至少有两名成员的群
    when: 用户把回复方式存为辩论，并填写轮数、参与者顺序、立场和裁判
    then: 再次打开这个群时回复方式仍是辩论，填写的内容原样保留；轮数越界、参与者不是群成员、裁判同时是参与者这类填写被拒绝并说明原因
  - id: AC-2
    given: 一个三人群存为辩论方式，没有填写任何辩论配置
    when: 用户发出一个课题
    then: 主持以外的两名成员按成员顺序各发言三轮，立场分别是正方和反方，最后由主持发一条裁决；两人群则两人对辩且没有裁判
  - id: AC-3
    given: 辩论方式的群，配置了两名参与者、两轮和一名裁判
    when: 用户发出课题
    then: 群里依次出现甲、乙、甲、乙四条发言和裁判的一条裁决，同一成员出现多次，发言一条接一条而不是同时进行
  - id: AC-4
    given: 辩论正在进行
    when: 轮到某位成员发言
    then: 它收到的内容里有此前所有人在这场辩论里的发言，并且对手最近一条发言是全文，不因为过长被截断
  - id: AC-5
    given: 辩论正在进行
    when: 轮到某位参与者发言
    then: 它被告知当前是第几轮、处于立论、反驳还是结辩阶段、自己的立场、要回应对手上一条的论点、必须发言不能沉默；「最多回复一次」和「没有新内容就沉默」这类说法不出现
  - id: AC-6
    given: 辩论的全部轮次已经结束，并且有裁判
    when: 裁判发言
    then: 裁判被要求总结双方论点并给出裁决，能看到整场辩论的全文，它的发言是这一回合最后一条
  - id: AC-7
    given: 辩论进行到一半
    when: 用户停止这个群
    then: 之后不再出现新的发言，正在准备的那条也不会发出来，这一回合显示为已取消
  - id: AC-8
    given: 辩论进行到一半时进程重启
    when: 服务恢复后继续运行
    then: 这场辩论不会重复已经发过的发言，也不会一直占着群；用户接着发的下一个课题能正常开辩
  - id: AC-9
    given: 群打开了单回合发言数上限，或保存的轮数与人数相乘超过辩论总发言上限
    when: 用户发出课题
    then: 发言总数不超过上限；被发言数上限截短时仍留一条给裁判；工具或费用上限触发时这场辩论按原有规则停下
  - id: AC-10
    given: 每分钟回复数上限低于一场辩论的发言数
    when: 辩论进行到上限
    then: 群里说明正在等待，时间到后辩论从停下的地方接着进行，不丢轮次也不重复
  - id: AC-11
    given: 辩论中某位参与者这一轮执行失败或坚持沉默
    when: 轮到下一位
    then: 群里留下一句这一轮未能发言的说明，辩论继续，后面的轮次和裁决照常进行
  - id: AC-12
    given: 辩论方式的群
    when: 用户用 @ 点名某位成员提问
    then: 只有被点名的成员回答一次，不开始辩论；协调者、全员、任务协作三种方式的群收到消息时的表现与之前一致
  - id: AC-13
    given: 群设置页
    when: 用户查看回复方式
    then: 能选择「辩论」，选中后出现轮数、参与者与顺序、立场、裁判的填写项，界面文字随中英文切换
