id: bot-communication-routing
title: "Bot 组织与群的能力寻址"
status: draft
requirement: |
  那先帮我制订一个详细的改造和提升的开发计划
notes: "用户明确要求先制定计划，本轮仅为 P5 编写验收草稿，不代表实施或验收通过。方案见 doc/BOT_COMMUNICATION_UPGRADE_PLAN.md。实施该阶段时按 acceptance-first 改 approved 并加入 standing-order notes，逐条写失败测试再实现；既有标准保持有效。"
criteria:
  - id: AC-1
    given: "用户明确点名或引用某只群成员"
    when: "被指定成员忙碌或缺少所需能力"
    then: "系统按该成员的实际情况排队或说明原因，不私自扩散给未点名成员"
  - id: AC-2
    given: "用户明确要求一个职能组承担一项工作"
    when: "有多位授权候选且能力和负载不同"
    then: "选择合适的负责人承接并能解释依据，不默认向全组广播"
  - id: AC-3
    given: "一项工作需要具体工具或连接"
    when: "没有候选具备所需授权和可用能力"
    then: "系统说明具体缺口，不借同组关系或其他 Bot 的权限兜底"
  - id: AC-4
    given: "成员已经被选中但尚未领取工作"
    when: "该成员被移出群或权限被撤销"
    then: "系统重新校验并阻止不再合法的执行，不继续使用过期资格"
  - id: AC-5
    given: "群保存为全员模式或任务协作模式"
    when: "用户发送未点名的工作请求"
    then: "全员模式保持原来的全员语义；任务协作模式由负责人按需邀请群内成员，不因能力排序混成另一模式"
  - id: AC-6
    given: "用户只在普通对话中提到职能组名称，或存在同名组歧义"
    when: "系统解释用户意图"
    then: "普通提及不会自动触发全组派工；需要选组却无法唯一确定时明确说明歧义"
