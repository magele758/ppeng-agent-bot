id: bot-room-recall
title: 群纪要、群规约与按群取回
status: implemented
owner: user
requirement: |
  记忆打通单独成阶段，放在群上下文推送之后。
  bot-room-recall：纪要 + 群规约 + 最近消息 + 按群取回。
criteria:
  - id: AC-1
    given: 群里已经有很长的讨论，其中一名成员这次才被叫醒
    when: 他开始回复
    then: 他看得到此前结论的摘要和最近消息，并知道更早的原话还可以再查。摘要还没有生成时，最近消息仍然在
  - id: AC-2
    given: 本群、其他群和别人的单聊里都有可搜索的原话
    when: 本群成员按原话查找更早的内容
    then: 只能看到本群的消息，看不到其他群或别人的单聊
  - id: AC-3
    given: 用户在较早的消息里上传过附件
    when: 后被叫醒的成员查看本群资料并打开该附件
    then: 可以读到附件正文。无权用户不能读取该群的摘要、历史和附件
  - id: AC-4
    given: 群主把一条规约写入当前群的共享条文
    when: 之后的讨论被压缩，旧消息不再完整留在上下文里
    then: 这条群规约仍会提供给之后被叫醒的成员，不因压缩消失，也不会因此把私人对话贴进群里
  - id: AC-5
    given: 同一条名字在全局、职能组和当前群里内容不同
    when: 成员在这个群里工作
    then: 采用当前群的那条。没有群条文时才用职能组，再没有才用全局
notes: |
  本规格不打通单聊记忆。触达记忆见 bot-room-touched-memory，排在本规格之后。
  与仍为 draft 的 shared-context-durable-rules AC-2、AC-3、AC-4 一致，不替代那份草稿。
  不替代 bot-functional-groups AC-8、AC-9。AC-5 与 AC-8 的优先级一致。
  不替代 bot-rooms AC-3、AC-6。私人对话仍不整段复制进群；历史分页和无权访问仍由 AC-6 约束。
  待用户批准本规格后，才在旧标准的说明里写上上述关系。本次不修改那些文件的状态和正文，也不把任何已批准规格标为 retired。
