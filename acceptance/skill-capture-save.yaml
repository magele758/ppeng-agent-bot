id: skill-capture-save
title: 技能沉淀确认后能把正文存下来
status: implemented
requirement: |
  我看现在skill沉淀的功能有问题，特别是最后存储的部分，已经失败好几次了，排查修复一下
notes: |
  assumedApproval: standing-order-2026-10-22
  已确认的沉淀在模型返回合格正文后必须写入技能；对话里的大段工具输出不能把这次保存拖失败。
  模型一直不返回时仍记失败，不写文件。失败的旧记录不会自动重跑。
criteria:
  - id: AC-1
    given: 一条待确认的技能沉淀，其所依据的对话里夹着很长的工具输出
    when: 用户确认沉淀
    then: 提炼只用有限的用户和助手正文，不把整段工具输出送给模型，确认后技能被保存并可加载
  - id: AC-2
    given: 用户已确认沉淀，模型已经返回合格的技能正文
    when: 模型等待时限在写入之前已经结束
    then: 技能仍然保存成功，不会因为等待时限再取消这次写入
  - id: AC-3
    given: 用户已确认沉淀
    when: 模型在等待时限内一直没有返回正文
    then: 这次沉淀记为失败并说明原因，不写入技能文件
