id: group-member-quiet
title: 群聊成员区只留成员本身的信息
status: implemented
requirement: |
  用户指着 Lab 群聊界面说这一块和顶部都是一团糟，大块无意义信息。
  群聊成员区只留成员本身需要的信息：头像、名字、移出、加入 Bot。不要把 Bot 的系统提示 / 职责描述 / persona 长文铺在卡片里。
  每张卡不要重复「全局默认 · 本地服务 / grok/grok-4.7」这种跟顶部一模一样的模型路径。只有该 Bot 有与全局默认不同的专属模型时，用一行短文本标出模型名（不要再写「全局默认」「这里展示普通文本模型配置」这类讲解）。
  顶部那两行解释收掉。若还需要进入全局默认模型设置，只留一个短链接/按钮，不要段落。
  不要改加入/移出/群聊共享信息的行为。
  用户可见文案走 i18n：zh 与 en 同一套 key，禁止硬编码中英文。不要新增 RAW_AGENT_* 开关。
notes: |
  assumedApproval: standing-order-2026-10-22
  与已实现的 global-default-model-clarity AC-4 冲突：群聊不再展示全局默认路径，也不再给每个成员标「全局默认 / Bot 专属」。只在专属模型与全局默认不同时显示模型名，设置入口改成短链接。该条标准已按这个行为改写。
  草稿 bot-group-members-off-canvas 里要求标题栏保留两行说明、成员名单展示职责的句子，已改成与这次一致。2026-10-26 按最新要求，完整成员区已搬入群聊设置，顶部仅显示工作中成员。
  2026-10-27 更新 AC-1：群主标出且不能移出，其他成员仍可移出。AC-5 的加入改为添加区里一行一个加入，不再用下拉框。标准没有删。
criteria:
  - id: AC-1
    given: 打开一个群聊，成员 Bot 写有职责、系统提示或 persona 长文
    when: 打开群聊设置查看成员卡，以及人多时的成员名单
    then: 每张卡能看到头像和名字。群主被标出且没有移出，其他成员有移出。人多时的名单同样只给非群主移出。看不到那段职责、系统提示或 persona 长文
  - id: AC-2
    given: 成员使用的模型与全局默认相同，或还没有单独指定模型
    when: 看该成员的卡片
    then: 卡片上没有「全局默认」，也没有服务商和模型路径
  - id: AC-3
    given: 某成员有与全局默认不同的专属模型
    when: 看该成员的卡片
    then: 只有一行模型名。没有「全局默认」「Bot 专属」，也没有「这里展示普通文本模型配置」这类说明
  - id: AC-4
    given: 打开群聊
    when: 看成员区上方的标题栏
    then: 不再有全局默认模型路径那一行，也不再有成员优先跟随全局默认的说明段落。要改全局默认模型时，只看到一个短链接或按钮
  - id: AC-5
    given: 同一个群聊
    when: 要加入成员、移出成员或查看群聊共享信息
    then: 加入、移出和群聊共享信息集中在群聊设置内，原有保存、加入和移出功能保留
