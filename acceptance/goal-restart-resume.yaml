id: goal-restart-resume
title: 重启后从安全检查点继续 Goal
status: implemented
requirement: |
  如果bot在执行过程中，服务重启了，之前的任务就直接停了，重启之后，也没有继续执行。开发期频繁重启时，已经停在安全检查点上的 Goal 要继续，做了一半且效果未确认的不要重做。
  本切片只处理 Goal 执行。
notes: |
  assumedApproval: standing-order-2026-10-22
criteria:
  - id: AC-1
    given: 某个 Goal 的执行者已经不在了，对话停在一份仍保留的已关闭检查点上，检查点之后没有工具或只有读文件、搜索文件、列目录、读历史、搜历史、读取记忆，并且没有未确认的外部效果
    when: Goal 调度运行一次，然后再运行一次
    then: 同一个 Goal 被重新排队并只启动一次续跑；第二次调度不再启动第二次续跑；恢复本身不会再次执行已经跑过的工具
  - id: AC-2
    given: 执行者仍然活着，或当前进程仍在跑该会话，或该执行正停在审批等待上
    when: Goal 调度运行
    then: 调度不打断这次执行，也不启动续跑
  - id: AC-3
    given: 执行者已经不在，但缺少检查点、检查点不在对话记录里、有未结束的工具调用、检查点之后有非只读工具，或存在未确认的外部效果
    when: Goal 调度运行，并再次运行
    then: 该 Goal 变为阻塞，原因是重试前必须先核实效果；不会创建续跑会话；再次调度也不会创建
  - id: AC-4
    given: 某个 Goal 已经停在一次仍在等待的持久等待上
    when: 调度尝试恢复
    then: 该 Goal 继续等待；恢复不会取消这次等待，也不会在等待仍未结束时启动模型续跑
