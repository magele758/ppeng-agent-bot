id: multi-machine-local-foundation
title: 多机软件工厂第四阶段本地软件交付
status: implemented
requirement: |
  修复一下，然后再commit和合并。
  确认按8条拆分本地交付，原40条保留为现场验收。
notes: |
  用户于2026-10-19明确批准doc/MULTI_MACHINE_STAGE4_LOCAL_PR_SPLIT_PROPOSAL.md中的8条标准。
  本规格只覆盖本地软件能力；原40条保持approved，verificationStage为deployment，未经现场验证不宣称部署或发布就绪。
  既有主分支的软件验收不得通过改阶段移出合并门禁。
links:
  - doc/MULTI_MACHINE_STAGE4_LOCAL_PR_SPLIT_PROPOSAL.md
  - acceptance/multi-machine-production-readiness.yaml
criteria:
  - id: AC-1
    given: 用户访问工厂准备配置与验证记录
    when: 未登录、无管理员权限或另一个管理员发起访问
    then: 未登录和无权访问被拒绝，不同管理员之间的配置与记录互不可见。
  - id: AC-2
    given: 管理员通过Lab配置本地交付准备信息
    when: 保存并重新打开，或者提交凭据、任意命令、未确认公开范围或非法制品标识
    then: 合法配置持久保留，危险或非法输入被拒绝且不落库。
  - id: AC-3
    given: 管理员已经保存并查看配置
    when: 冻结验证记录、重试同一请求或服务重启，或者别处已经修改配置
    then: 记录固定所见版本，同请求仅一份且重启仍在；旧版本不能冻结后来保存的新范围。
  - id: AC-4
    given: 工厂当前仅支持本地准备
    when: 用户预检或评估验证记录
    then: 展示本机真实观测和缺项，不显示远端已探查、已部署或发布就绪。
  - id: AC-5
    given: 本地状态含数据库、授权、预算与附属文件
    when: 保存一致备份并向独立目录恢复，或者备份损坏、过期、来源不明
    then: 合法备份恢复并核对一致，非法输入不覆盖原服务与已有目的地。
  - id: AC-6
    given: 本地协调服务需要恢复
    when: 检查写入者、隔离状态、数据兼容性并尝试切换到独立恢复状态
    then: 只有写入者已停止且隔离持续有效才允许核验与切换；恢复写入、格式未知、身份变化或恢复失败均不报成功并保留已有数据。
  - id: AC-7
    given: 本地准备能力与既有A/B发布流程共存
    when: 使用本地准备或执行既有发布流程
    then: 本地准备不无条件禁用既有发布；新增恢复路径仅在实际隔离条件成立时可用，不支持的方式明确待决且不能用布尔开关绕过。
  - id: AC-8
    given: 本地软件准备申请合入且现场验收尚未完成
    when: 汇总证据并运行自动化、复查与CI
    then: 缺失、篡改、过期、跨候选、指标不完整或模拟冒充真实均不能放行现场发布；本地自动化与复查通过后只交付本地软件，第四阶段不报完成，业务部署保持后置。
