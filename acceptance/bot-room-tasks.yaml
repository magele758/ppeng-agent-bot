id: bot-room-tasks
title: 群子任务与成员接力
status: approved
owner: user
requirement: |
  bot-room-tasks：子任务、接力；审批仍默认私聊。
  approval = private-default：默认仍转到该 Bot 私聊，结果不自动回群。群内原位批准只作为 Lab 里另行打开的策略，不进第一批实现。
criteria:
  - id: AC-1
    given: 群里有多名成员，群主把一件事拆给其中几名
    when: 用户查看这个群
    then: 能看到每件子任务的负责人和进度。一件失败时看得到失败，其他子任务的进度还在
  - id: AC-2
    given: 一名成员发现需要另一名同群成员补充，且本轮人数还有余量
    when: 他提出这个补充请求
    then: 后续只增加通过校验的那一名成员。已经在本轮公开发过言的人不会因此再说一次。没被点到的其他成员不会全体被叫醒
  - id: AC-3
    given: 一名成员正在群里工作，下一步需要本人审批、登录或验证
    when: 这一步出现
    then: 群里不等待，也不出现批准卡片或凭证细节，只留一句简短说明，让用户去和这个 Bot 的私聊里处理。处理结果留在私聊，不自动写回群，群也不会把这一步再执行一遍。该成员这一轮按已转私聊结束，而不是失败。其他被选中的成员该说的话照常继续
  - id: AC-4
    given: 普通成员和群主都在群里
    when: 普通成员试图给群派子任务，群主再派一件
    then: 普通成员派不成。群主派的那件出现在群的任务板上
notes: |
  不替代 bot-rooms AC-8。AC-3 复述 AC-8，保证子任务和接力不把审批留在群里。
  不进入 bot-room-inline-approval。那份规格未单独批准前，不提供会把审批留在群里的 Lab 开关。
  不改写 bot-multi-goal-coordination。群子任务不是该 Bot 的单聊目标。
  不替代 bot-rooms AC-7。
  待用户批准本规格后，才在旧标准说明里写上「AC-8 继续有效」。本次不修改 bot-rooms.yaml 的状态和正文，也不把任何已批准条目标为 retired。
