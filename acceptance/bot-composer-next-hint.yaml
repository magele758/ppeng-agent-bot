id: bot-composer-next-hint
title: Bot 输入框推荐下一句
status: implemented
requirement: |
  可以考虑让bot模式加一个能力：自动在输入框填下一次可能输入的内容（用输入框的提示模式），tab才真实输入，如果不tab直接输入，就正常输入，这个下一次的提示来源，可以让bot根据之前会话内容推荐
  2、bot会话框里推荐的会话是要推荐下一步的行动的，你现在推荐的内容质量比较低
  那就对话框里的内容让bot生成，然后作为下一步的行动推荐，不要搞成写死的
notes: |
  assumedApproval: standing-order-2026-10-22
  2026-10-22 用户要求建议是下一步行动，不是把助手上一句改写成「那…呢」。
  2026-10-22 用户要求行动指南由模型生成，上限 500 字，不再用 80 字，也不再用本地套话顶替模型。assumedApproval: standing-order-2026-10-22
  2026-10-22 推荐正文只能是模型根据这场对话生成的，禁止写死句子、词表拼接或按关键词选固定文案。AC-11 已覆盖，不另加标准。assumedApproval: standing-order-2026-10-22
criteria:
  - id: AC-1
    given: Bot 主对话里输入框是空的，上一轮助手已经回复完，当前没有正在生成
    when: 过一会儿
    then: 输入框里出现下一句建议，以提示方式显示，还不是真正输入的内容
  - id: AC-2
    given: 输入框里出现了下一句建议
    when: 查看这条建议从哪来
    then: 这条建议来自这场对话里已经说过的内容，而不是固定文案，也不是用户还没打完的半句话
  - id: AC-3
    given: 建议显示着
    when: 用户按 Tab
    then: 建议成为输入框里的真实内容，提示消失
  - id: AC-4
    given: 建议显示着
    when: 用户不按 Tab，直接打字
    then: 打出来的是用户自己的字，建议不混进去，提示让位
  - id: AC-5
    given: 输入框里已有用户打的字，或助手还在回复，或这场对话还没有任何助手回复
    when: 查看输入框
    then: 不出现下一句建议
  - id: AC-6
    given: 普通聊天，或不是这只 Bot 主对话的会话
    when: 查看输入框
    then: 不出现这套下一句建议
  - id: AC-7
    given: 建议接口失败，或暂时没有合适的一句
    when: 用户看对话并继续输入
    then: 输入框保持可输入，不插入半截建议，也不报一块错误把对话挡住
  - id: AC-8
    given: 没有按 Tab
    when: 把消息发出去
    then: 发出去的是用户真正输入的内容；只显示着建议、输入框仍空时，不会把建议当成用户消息发出
  - id: AC-9
    given: Bot 主对话里助手刚说完，这段对话里出现了具体事物，并且还能继续查、核对或修改
    when: 输入框出现下一句建议
    then: 这句是用户可以发出去的下一步行动，用到刚才出现的具体事物，是一句短话；不是「继续」「好的」「那…呢」，也不是把助手整段回复缩成一句问话
  - id: AC-10
    given: Bot 主对话里助手刚说完，但对话里没有可执行的下一步
    when: 查看输入框的建议
    then: 建议为空，不会硬编一句空话
  - id: AC-11
    given: Bot 主对话里可以给出下一步，模型写出了一段行动指南
    when: 输入框出现建议
    then: 显示的就是模型写的这段正文，可以长过 80 字，到 500 字为止；不会改成另一句本地拼出来的套话
