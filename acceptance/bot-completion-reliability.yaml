id: bot-completion-reliability
title: 完成验证可追溯与任务收尾可靠性
status: implemented
requirement: |
  继续修复目标已完成却停在 queued、CSV 未保存和严格输出格式的问题，补齐完成判官的原始证据，不降低门禁标准，用当前 Grok 重跑新旧版本对照，通过测试和 review 后再合并 PR #251。
notes: |
  assumedApproval: standing-order-2026-10-22
  保留原评估集、失败与门禁；只有真实证据满足原条件才能完成或发布。
criteria:
  - id: AC-1
    given: 完成判官返回成功、拒绝、非法返回或请求失败
    when: 真实模型评估结束
    then: 保存判官原始输入、返回或错误以及目标状态与拒绝原因，密钥不写入证据
  - id: AC-2
    given: 任务已执行且存在可核对的成功工具证据
    when: 完成验证采用真实证据
    then: 合格结果能完成目标；未解决失败、无效引用或只有口头声明仍不能冒充完成
  - id: AC-3
    given: 用户请求读取数据并保存转换后的结果
    when: 初始数据来源不可用但有其他授权查询工具
    then: 执行约束要求切换数据来源而非连续猜测路径，拿到输入后完成必要保存与验证
  - id: AC-4
    given: 用户明确要求只输出一个值或指定格式
    when: Agent 返回最终回答
    then: 执行约束要求保持该格式，不额外添加解释或收尾报告
  - id: AC-5
    given: 新旧版本真实模型重复对照
    when: 发布门禁判定
    then: 原始任务与阈值不降低，未通过则保持 PR 未合并且不部署
  - id: AC-6
    given: 直接执行任务的首次收尾被判官指出具体缺口
    when: 尚有本轮预算且没有取消或审批阻塞
    then: 在同一执行中最多提供一次修正机会，沿用实际证据且不重复已确认副作用；未解决的缺口仍不算完成
  - id: AC-7
    given: 工具失败且用户明确指定失败时的答复或停止条件
    when: Agent 已正确遵循失败分支而实际目标仍未完成
    then: 判官区分目标完成与本轮继续修正，不强制改写合规失败答复，也不将失败目标标为完成
  - id: AC-8
    given: 没有持久目标的 Bot 查询明确要求只输出路径、数字、版本号或 JSON
    when: 已有回答明显违反指定格式且尚有本轮预算
    then: 使用已有证据最多重答一次而不裁剪原答或改评分；普通文本和条件式失败答复不被误当作无条件格式要求
  - id: AC-9
    given: 用户只要求从既有检查证据返回部署版本等历史结果
    when: 路由识别到部署等领域名词
    then: 作为本轮只读查询完成，不创建新的部署执行目标；同时要求修改、保存或重新执行的请求仍保留工作目标，真实评估同时核对答案和目标状态
  - id: AC-10
    given: Bot 需要根据完成反馈重新回答且历史含内部推理
    when: 构造发送给模型的重答请求
    then: 以明确的同一请求续答触发结束输入，不把历史推理当已公开答案；原始消息与工具证据不变，额外视图计入上下文预算且不创建新用户任务
