id: quiet-goal-results
title: 目标结果不再默认要求人工核对
status: implemented
requirement: |
  还有个问题，这个目标列表，老是让我审批、审批，要审批和核对什么？如果非必要就去掉类似的询问的功能
notes: |
  assumedApproval: standing-order-2026-10-22
  取消自动核验未通过时默认要求用户接受或退回的界面流程。未核验结果保留真实状态，归入目标历史，不冒充已完成。
  按本次要求同步调整 bot-goal-lifecycle-boundaries AC-3、AC-4 的界面要求；已有验证接口保留兼容。
criteria:
  - id: AC-1
    given: 一个或多个目标已返回结果但自动核验未通过，包括已有的待核对目标
    when: 用户打开目标列表或对话
    then: 不出现核对完成或打回按钮，不主动弹出处理卡片，未核验结果不计入正在进行的目标
  - id: AC-2
    given: 目标已返回未核验的结果
    when: 用户打开目标历史
    then: 能查看结果及证据，标为结果已返回但未自动核验，不宣称已完成也不要求用户审批
  - id: AC-3
    given: 目标自动核验不可用或证据不足
    when: 系统记录目标状态
    then: 不向对话追加要求用户核对的通知，保留结果且不自动重复执行
  - id: AC-4
    given: 目标确实受预算或权限限制而无法继续
    when: 用户打开目标列表
    then: 仍显示具体阻塞原因和适用的处理入口，不自动放开额度或权限
