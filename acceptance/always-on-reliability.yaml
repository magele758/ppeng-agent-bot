id: always-on-reliability
title: 常驻 Agent 的恢复、通知、长期评测、缓存诊断与压缩契约
status: implemented
requirement: |
  我觉得这5个点分析的都挺好的，帮我全都实现把
notes: 'assumedApproval: standing-order-2026-10-22'
criteria:
  - id: AC-1
    given: 常驻任务在执行中中断
    when: 服务重新启动
    then: 可核验的安全步骤从已保存进度继续，外部效果未确认的任务保持待核验且不会重复执行，界面可见恢复原因
  - id: AC-2
    given: 用户配置了重要变化通知
    when: 事实未变但报告措辞变化，或进入安静时段或超过通知预算
    then: 不重复打扰用户，延迟通知合并为摘要且记录决策原因，用户可在界面保存立即生效的策略
  - id: AC-3
    given: 长期任务跨越重启、重复事件、目标变更、压缩和子任务失败
    when: 运行时间快进评测
    then: 输出可复现的检查结果，检测重复动作、旧约束复活、信息丢失和通知错误
  - id: AC-4
    given: 会话连续运行多轮
    when: 提示词或工具定义变化
    then: 界面显示变化的片段和上游实际提供的缓存用量，未提供用量时明确显示未知
  - id: AC-5
    given: 用户为长期任务保存目标、约束、待办和证据引用
    when: 上下文经历多次压缩或用户更新任务要求
    then: 最新任务契约保持可获取且有来源和版本，缺失项被补回，旧要求不会覆盖新要求
