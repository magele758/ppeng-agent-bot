id: saved-sandbox-mode-constrains-shell
title: 已保存的隔离方式约束 shell
status: implemented
requirement: |
  1、SSH 被沙箱拦住了，这个我不是设置了沙箱用模式吗？为什么还会走沙箱的shell的模式？
notes: |
  assumedApproval: standing-order-2026-10-22
  「沙箱用模式」就是设置里「命令沙箱」的「隔离方式」（自动 / 系统级隔离 / 直接执行 / 容器 / Cloudflare 远程沙箱）。没有单独的会话级沙箱模式，shell 沿用这一项；没在界面保存过时，仍用原来的环境回退，界面上看到的有效模式就是约束。
  先前 shell 不读这项：没传当次隔离时一律用最强系统沙箱，模型自己选 os 也会盖过已保存的直接执行，所以 ssh 仍被 sandbox-exec / bwrap 套住。系统沙箱拒绝读取 ~/.ssh，ssh 客户端因此拿不到密钥。
  现在已保存的模式约束 bash、后台命令和取证命令。直接执行时 ssh 客户端按直接执行启动，不再套系统沙箱，也不再为「去掉系统沙箱」单独审批。系统级隔离或自动（没指定时用最强隔离）时，不为了 ssh 改成直接执行；对话里写明这次仍走系统沙箱的原因。容器仍未实现，保存后命令不运行。远程未接通时命令不运行，不拉回本机。
  系统沙箱对 ~/.ssh 等密钥目录的拒绝没有放开。与 model-sandbox-isolation 冲突处已改：已保存的直接执行不再被忽略；模型自选只在隔离方式为自动时成立。
criteria:
  - id: AC-1
    given: 命令沙箱里已保存的隔离方式是直接执行
    when: 对话里执行 shell，包括 ssh；这次命令可以不另选隔离，也可以选系统级隔离
    then: 这次命令不走操作系统沙箱，ssh 客户端按直接执行启动，不会因为系统沙箱停住，也不再为去掉系统沙箱单独等待批准
  - id: AC-2
    given: 命令沙箱里已保存的隔离方式是系统级隔离
    when: 对话里执行 shell，包括 ssh，即使这次命令要求改成直接执行
    then: 命令仍走操作系统沙箱，不会改成直接执行；对话里能看出原因是保存的隔离方式是系统级隔离。这台机器做不到系统级隔离时，命令不运行，也不改成直接执行
  - id: AC-3
    given: 命令沙箱里的隔离方式是自动，或还没保存过因而按自动
    when: 对话里执行 shell 且没有获准改成直接执行
    then: 机器做得到系统级隔离时，命令仍走系统沙箱，不会为了 ssh 改成直接执行；对话里能看出这次仍走系统沙箱是因为自动模式用了最强隔离，或这次命令自己选了系统级隔离
  - id: AC-4
    given: 操作系统沙箱仍会挡住密钥目录
    when: 查看这项限制，并在隔离方式为直接执行时启动 ssh 客户端
    then: 系统沙箱仍然不能读写 ~/.ssh 等密钥目录；直接执行只是让 ssh 客户端不套这层沙箱，并没有为 ssh 放开密钥目录
  - id: AC-5
    given: 已保存的隔离方式是还没提供的容器，或是远程沙箱但远程没接通
    when: 执行 shell
    then: 命令不运行，也不会改成直接执行，或悄悄改用本机的另一种沙箱
  - id: AC-6
    given: 用户打开命令沙箱设置
    when: 阅读隔离方式的说明
    then: 能看出已保存的方式会约束后续命令；直接执行不再写「保存了也不会去掉隔离」；系统级隔离写明密钥目录仍不可读；自动写明没指定时仍可能走系统沙箱
