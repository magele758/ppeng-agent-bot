id: tool-exposure-tiers
title: 工具三层分类与独立的渐进和全量提供方式
status: implemented
requirement: |
  就按这个思路，先把现在的工具按三层列出具体清单，再写验收标准给我确认，先别改代码。
  我还发现一个问题，我关闭了能力发现，他也不是全tool一起加载的，现在是不是有问题？这个也排查一下，搞清楚
notes: |
  三层具体清单及排查证据见 doc/TOOL_EXPOSURE_TIERS.md。141 是本机目录快照，不是所有安装的固定总数。
  已确认默认渐进加载、最多一次加载 5 个匹配工具、会话内持久复用及 Agent 固定能力包。
  已同步调整旧标准 discovery-default-on AC-2/AC-4 的总开关含义，以及 necessary-tool-injection AC-1 的适用模式。
  用户于 2026-10-21 确认三层清单、15 条标准及两项旧标准调整；本次实施保留权限约束。
criteria:
  - id: AC-1
    given: "使用默认渐进加载，且没有固定额外能力包"
    when: "用户开始新对话"
    then: "首轮提供清单第一层中当前可用的工具；第二、三层只显示简短能力目录，不携带完整工具定义"
  - id: AC-2
    given: "文件读写、Shell 和网络搜索均已配置可用且被允许"
    when: "用户要求读写文件、执行命令或搜索网页"
    then: "Agent 可以直接调用对应工具，不需要先搜索或加载工具"
  - id: AC-3
    given: "渐进加载下存在当前允许使用但尚未加载的工具"
    when: "Agent 搜索相关能力并找到匹配工具"
    then: "一次搜索自动加载最多 5 个匹配工具并返回准确清单，下一轮可直接调用，无需另一次加载操作；搜索本身不执行目标工具"
  - id: AC-4
    given: "工具搜索没有匹配结果或加载失败"
    when: "Agent 收到搜索结果"
    then: "明确显示未找到或失败原因，不虚报加载成功，也不把整个工具目录作为回退一次性提供"
  - id: AC-5
    given: "某工具已在当前会话成功加载且仍被允许"
    when: "后续回合或应用重启后继续该会话"
    then: "工具仍可直接调用，无需重复搜索；新建会话不继承该会话的临时加载记录"
  - id: AC-6
    given: "用户给一个 Agent 固定启用第二层或第三层能力包"
    when: "该 Agent 开始新会话"
    then: "包内当前允许且可用的工具从首轮直接提供，其他 Agent 的固定能力包不受影响"
  - id: AC-7
    given: "用户选择全量可用工具模式"
    when: "下一次模型请求开始"
    then: "当前 Agent 和会话允许且配置可用的所有已注册业务工具直接提供，不再因按需加载而隐藏，也无需工具搜索或加载入口"
  - id: AC-8
    given: "某能力被禁用、缺少必要配置、被 Agent 白名单排除或不适用于当前会话模式"
    when: "Agent 直接调用、搜索加载、固定能力包或使用全量模式"
    then: "均不能绕过原有使用限制；已加载后被撤销的工具在后续请求中也不可用，原有审批和沙箱要求保持有效"
  - id: AC-9
    given: "用户关闭外部服务发现，但允许使用本地业务工具"
    when: "用户继续使用渐进模式或全量模式"
    then: "外部服务发现保持关闭；本地工具仍按所选模式搜索加载或直接提供；关闭外部服务发现不会被当作切换全量模式"
  - id: AC-10
    given: "用户在设置中查看工具提供方式和外部服务发现"
    when: "用户阅读说明并切换设置"
    then: "能明确分辨工具提供方式与外部服务发现的作用；中文和英文说明一致，不再把外部服务发现称为所有工具搜索的总开关"
  - id: AC-11
    given: "用户在界面保存工具模式或 Agent 固定能力包"
    when: "保存成功并继续对话或重启应用"
    then: "设置持久保留并从下一次模型请求生效，无需修改环境变量或重启才能生效，已经执行的工具不被重复执行"
  - id: AC-12
    given: "用户首次使用或升级后从未保存工具提供方式"
    when: "打开设置并继续新会话或已有会话"
    then: "默认显示并使用渐进加载；已有权限、白名单和外部服务发现关闭状态保持不变"
  - id: AC-13
    given: "用户查看某个 Agent 会话的工具清单"
    when: "展开工具可用性详情"
    then: "能看到已注册、当前可用、已提供、待加载及不可用的数量与逐项名称，能查看不可用原因，并区分未配置、被禁用、模式不适用和仅尚未加载"
  - id: AC-14
    notes: "任务协作新增已分类的群聊调度工具归入第一层；原 141 项基线归属及数量不变，外部 Agent 通信新增五个工具归入第二层团队协作组；含新增工具总数为 51、28、68。非群聊不暴露该工具。assumedApproval: standing-order-2026-10-22"
    given: "本机具有三层清单列出的 141 个工具，或新增未分类扩展"
    when: "用户查看分类目录"
    then: "原清单每个工具恰好归入一层且无遗漏，数量为 50、23、68；新增未分类扩展归入第三层可搜索目录，不自动常驻"
  - id: AC-15
    given: "用户在渐进模式知道一个允许使用的工具名称，或希望重新收起临时加载工具"
    when: "按名称加载该工具或在界面清除当前会话加载记录"
    then: "按名称加载后下一轮可直接调用；清除后下一轮仅保留常驻和固定能力包，业务会话历史与已完成结果不被删除"
