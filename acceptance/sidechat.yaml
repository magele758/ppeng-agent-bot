id: sidechat
title: 对话和 Bot 的原文批注与跨会话侧聊
status: implemented
notes: "assumedApproval: standing-order-2026-10-22"
requirement: |
  我想要开发一个功能，叫sidechat的能力，主要针对场景是模型返回的内容里有一部分，或者有一些词，是我不理解的，但是又不想新开一轮会话来影响我看当前轮返回的内容，这个可以在右侧有一个专门管理类似的会话的列表，可以多个会话，可以新增一个当前bot或者session流里的裂变的UI，你理解我要做一个什么样的东西吗？有点类似论文或者文档的批注的能力，针对某一个内容的扩写，以后又可以看到当时在这个地方的扩展思考，这样我觉得挺方便学习使用的
  你把跨会话查找也补到视觉稿里，用两个会话举个例子，我想实际点一下，看看从当前批注找到以前的讨论、再回到原文的体验。
  对话和bot都要有这个能力，这是这么设计的吧？
criteria:
  - id: AC-1
    given: 用户在普通对话或一对一 Bot 阅读已完成的助手回答
    when: 选中词段或选择就整条回复侧聊
    then: 打开独立侧栏，草稿不产生批注，发送后可回看多条讨论并用键盘或手机返回主阅读区
  - id: AC-2
    given: 两个入口各有一条来源回复
    when: 用户在侧聊连续追问
    then: 来源的 Agent 或 Bot 在独立的讨论上下文作答，主对话消息、上下文和排序保持原样
  - id: AC-3
    given: 两个会话各有批注，讨论中包含只有追问或回答才提过的词
    when: 用户按相同摘录或关键词跨会话查询
    then: 只列有权查看的个人批注，按讨论聚合，可定位命中问答；删除来源会话或撤权后不可见
  - id: AC-4
    given: 已保存的多条批注包含重复出现的词或来自同一选区
    when: 重新打开原文或点击标记
    then: 仍能找回正确位置和讨论，位置无法唯一确定时安全降级，支持整条和选段
  - id: AC-5
    given: 当前会话有阅读位置和草稿
    when: 在侧栏预览另一会话的批注、打开来源、返回
    then: 预览保留当前会话，打开来源才定位旧原文，返回时还原原会话、阅读位置和草稿
  - id: AC-6
    given: 请求重复、生成失败、停止或切换讨论
    when: 用户重试或重访对应讨论
    then: 保留已提交问题、生成状态和已有回复，重复提交不重复创建批注或用户消息
