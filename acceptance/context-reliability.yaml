id: context-reliability
title: 持续对话的任务保真与历史记忆找回
status: implemented
requirement: |
  那你分多个agent， 去把需要做的任务都完成，然后做一下回归和验证
owner: user
notes: |
  承接本轮讨论的四项改进：统一任务状态与约束保护、压缩和剥离后的来源可追溯、历史与记忆检索取回闭环、长对话回归与质量验证。
  保留已经实施的普通会话 20% 与 Bot 主会话 50%/85% 默认策略，不改写现有验收标准。
  以实际送给助手的任务状态、检索与原文读取结果、可观察的降级记录验收确定性行为；不承诺模型输出永远正确。
  回归必须区分离线或模拟链路检查与真实模型语义评测。真实模型不可用时如实报告未验证，不把跳过当成通过。
  审批后并行分工：任务状态保护；压缩与来源导航；历史检索与记忆编译；独立回归与质量评估。跨模块集成由主 Agent 负责。
criteria:
  - id: AC-1
    given: 用户已明确当前任务目标、限制条件和未完成事项
    when: 普通或 Bot 会话经过多次历史压缩后用户说继续
    then: 助手本轮可用的任务信息仍包含这些有效目标、限制和未完成事项
  - id: AC-2
    given: 用户先提出一项任务要求，随后明确修正同一项要求
    when: 对话继续或历史被压缩
    then: 当前任务采用修正后的要求，旧要求仅作为已被替代的历史保留
  - id: AC-3
    given: 会话已经积累任务 A 的进度和专属限制
    when: 用户明确切换到任务 B 后再切回任务 A
    then: 当前任务恢复自己的目标、进度和专属限制，不混入另一任务的专属要求
  - id: AC-4
    given: 最新用户问题之后已经产生多次工具操作
    when: 普通或 Bot 会话需要压缩或剥离历史
    then: 最新问题原文仍保留，工具调用与结果的对应关系不被破坏
  - id: AC-5
    given: 旧工具结果或历史对话已被占位、压缩或移出本轮上下文
    when: 用户追问其中的具体事实
    then: 助手仍能通过来源线索找到对应原文，并提供可核对的位置
  - id: AC-6
    given: 用户在允许访问的其他会话中留下了历史对话，其中部分已经压缩
    when: 用户在新对话中用其中的关键词查找
    then: 返回匹配的历史片段、所属会话和可继续查看原文的引用
  - id: AC-7
    given: 用户已获得一条历史或记忆搜索结果
    when: 用户请求查看这条结果的依据
    then: 返回对应原文，长内容可以继续阅读，不把搜索摘要冒充完整原文
  - id: AC-8
    given: 系统同时保存其他用户、其他租户或其他 Bot 的私有内容
    when: 用户搜索或直接请求读取无权访问的内容
    then: 不返回越权内容及其标题、摘要、原文或可推断的命中信息
  - id: AC-9
    given: 当前会话、问题、可访问记忆及设置相同，期间没有数据变化
    when: 用户预览本轮记忆并实际发送同一问题
    then: 预览与真实对话选用相同的记忆内容
  - id: AC-10
    given: 对话所用的增强检索服务暂时不可用
    when: 用户继续提问
    then: 对话可以使用可用的基础检索继续，并能查看检索已降级的原因
  - id: AC-11
    given: 同一会话已经连续压缩多次
    when: 助手为下一轮准备历史摘要
    then: 摘要更新已有结论，不因重复拼接同一旧摘要而持续膨胀或重复占用本轮上下文
  - id: AC-12
    given: 当前任务已有有效目标和限制，但摘要生成失败或受保护内容本身超出预算目标
    when: 用户继续这一轮
    then: 最新问题和有效任务要求不被静默删除，并能查看未完成压缩或超预算的原因
  - id: AC-13
    given: 用户按既有默认策略使用普通会话或 Bot 主会话
    when: 本次改进启用并准备下一次请求
    then: 普通会话仍使用 20% 请求目标及已有超限例外，Bot 主会话仍使用 50% 与 85% 历史压缩策略
  - id: AC-14
    given: 已准备覆盖约束保留、用户纠正、任务切换、压缩后事实查找和跨会话找回的长对话样例
    when: 执行回归与质量验证
    then: 报告提供可复查的结果，区分确定性检查和真实模型语义评测，不将未执行或跳过的评测标为通过
