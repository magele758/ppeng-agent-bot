id: bot-linked-watchers
title: 关联原工作的临时盯梢与观察证据
status: implemented
requirement: |
  那就按v2计划开始改，先把日志里这些真实问题复现成测试，再逐项修好，验收通过后review、提交PR并合并，不要停下来等我确认。
notes: 'assumedApproval: standing-order-2026-10-22；v2 R2/R5 工作关联纵向切片，现有目标服务仍是唯一完成判定来源。'
criteria:
  - id: AC-1
    given: 临时盯梢关联当前 Bot 的一项持久工作
    when: 创建、编辑或再次执行盯梢
    then: 关联必须属于该 Bot 和该用户，引用不存在或越权时明确失败，不扩大工具权限
  - id: AC-2
    given: 临时盯梢关联的工作已核验完成或已取消
    when: 继续调度该盯梢
    then: 不再启动模型，停用该临时盯梢并保留历史运行记录，独立长期巡检继续生效
  - id: AC-3
    given: 工作要求或引用的 SOP 已更新
    when: 下一次盯梢执行
    then: 读取最新工作约束与 SOP，记录版本依据，不让已复制的旧提示覆盖当前要求；读取失败明确受阻
  - id: AC-4
    given: 盯梢回复没有新情况但没有成功执行本轮观察
    when: 本轮结束
    then: 记录未核验或检查失败，不能当成成功静默；成功观察无变化仍可静默
  - id: AC-5
    given: 盯梢关联一个有所属会话及启动时间的外部任务
    when: 外部任务更新或失去关联
    then: 保存对应任务身份及本次观察时间，不凭会话空闲或旧结果宣告工作完成，关联失效时明确受阻
  - id: AC-6
    given: 用户在 Lab 配置工作关联
    when: 保存后再次编辑或执行
    then: 关联即时持久生效，支持解除关联，不增加环境变量
  - id: AC-7
    given: 当前工作经授权启动了一个后台执行，并等待其真实结果
    when: 对应执行结束且身份与工作版本仍匹配
    then: 结果归回原工作并唤醒下一阶段，不把进程退出直接当作交付完成；重复调度不重复启动阶段
