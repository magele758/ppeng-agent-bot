id: turn-end-actions
title: 完整回复结束后才在末尾显示操作
status: implemented
notes: "assumedApproval: standing-order-2026-10-22"
requirement: |
  对话流里，引用、时间、收藏是 hover 之后出现在消息顶部的。操作别扭。
  改成：这三个操作跟到每次完整会话的末尾，不要再悬在顶部。
  不要给每个流式分段都加。一段完整返回结束之后，只加一次。
  正在流式输出、还没结束的片段不要出现这排操作。
  完整的一条回复结束才出现，位置在该条末尾。
  只动这排操作的出现时机和位置。不要改对话数据、不要改收藏本身的存储逻辑、不要顺手改别的界面。
criteria:
  - id: AC-1
    given: 一条已经结束的回复分成多段正文
    when: 查看这整条回复
    then: 时间、纠错和引用只在最后一段末尾出现一次，不悬在顶部，也不在每一段上各出现一次
  - id: AC-2
    given: 一条回复还在输出，没有结束
    when: 查看正在输出的内容和同一轮里已经露出的分段
    then: 不出现这排操作
  - id: AC-3
    given: 回复已经结束
    when: 使用末尾的引用
    then: 引用的是这一整条回复的正文，结束时间仍取最后一段的保存时间
