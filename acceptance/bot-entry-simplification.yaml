id: bot-entry-simplification
title: Bot 创建入口统一与管理页面职责拆分
status: implemented
owner: user
requirement: |
  这个新增界面，还是功能揉的太多了，看看怎么把功能拆开一下，免得人根本不会用
  这个团队工作都不知道什么意思？还有必要留吗？现在有bot 组了？
  这个很多余，有设置了，这里一行其实只要保留添加就行了，每个组和bot后面带个删除加double check就够了
  新建群聊、新建bot、新建功能分组都统一收到上面的新建里，可以做hover菜单，现在搞的怪怪的
notes: |
  建议保留任务分派能力，移到「任务 → Bot 任务」，改用明确名称；功能分组用于共享信息隔离，群聊用于多人对话，任务分派用于指定 Bot 执行和追踪工作。
  Bot 管理页只负责 Bot 列表及单个 Bot 配置；创建使用独立面板，运行限制放到设置，群聊在 Bot 聊天页管理。
  删除确认沿用对应对象既有删除语义，明确区别删除 Bot 与只删除会话；功能分组删除时成员回到未分组，不删除成员。
  2026-10-22：群聊列表行的删除不再常驻「删除」文字，改为悬停、键盘聚焦或触摸设备上才出现的图标菜单（play-group-delete-menu）。AC-7 的确认、取消和失败语义不变；Bot 行和功能分组的删除按钮未改。
criteria:
  - id: AC-1
    given: 用户打开 Bot 聊天页
    when: 查看侧栏顶部和列表
    then: 顶部只有一个「新建」入口，不再显示管理 Bot 提示链接、独立的新建群聊按钮或新建功能分组按钮
  - id: AC-2
    given: 用户使用鼠标、键盘或触屏
    when: 悬停、点击或通过键盘打开「新建」菜单
    then: 能选择「新建 Bot」「新建群聊」「新建功能分组」，每项只打开对应创建界面，支持取消且不丢失当前对话
  - id: AC-3
    given: 用户正在创建 Bot、群聊或功能分组
    when: 查看创建界面并提交
    then: 只显示当前对象所需的内容，必填项和失败原因清楚，创建成功后新对象立即可见，取消或失败不会创建额外对象
  - id: AC-4
    given: 用户打开 Bot 管理页
    when: 查找 Bot 或编辑某个 Bot
    then: 首屏以 Bot 列表和搜索为主，选择后查看单个 Bot 配置，不再混入任务分派、任务历史、群聊管理或全局运行限制表单
  - id: AC-5
    given: 用户需要分派工作或查看既有 Bot 任务
    when: 打开「任务 → Bot 任务」
    then: 能明确选择执行 Bot、分派工作并查看未完成及历史任务和详情，既有任务保持可访问，页面说明任务分派与群聊、功能分组的用途区别
  - id: AC-6
    given: 用户需要调整 Bot 的全局运行限制
    when: 打开设置中的 Bot 运行限制
    then: 能查看并保存现有运行限制，成功与失败均有明确反馈，无需在 Bot 创建界面寻找此功能
  - id: AC-7
    given: 用户查看侧栏中的 Bot、群聊或自定义功能分组
    when: 点击对应删除按钮
    then: 先显示对象名称及删除影响，取消不改变数据，确认成功后更新列表；删除功能分组只把成员移至未分组，删除 Bot 明确区别于只删除会话，失败时保留对象并显示原因
