id: sidechat-learning
title: 侧聊的掌握、一句话批注和引用回主线
status: implemented
notes: "assumedApproval: standing-order-2026-10-22"
requirement: |
  你参考下 open-chrome-ai针对侧聊新增的哪些能力，都补齐一下，那边的产品功能推进的更多点，你可以参考下
criteria:
  - id: AC-1
    given: 一条已完成的回复里有可以选中的词，这段可能已经有批注
    when: 选中这段文字
    then: 可以复制它，也可以直接请侧聊用通俗的话解释；已有批注时可以打开那条讨论。主对话记录不变
  - id: AC-2
    given: 已经打开一条侧聊
    when: 使用通俗类比、举个例子或深挖原理
    then: 对应问题出现在这条侧聊里并得到回答，主对话的输入和记录保持原样
  - id: AC-3
    given: 本会话有多条侧聊
    when: 把一条标成已掌握，或按状态和原文顺序查看
    then: 侧栏和原文标记都能看出已掌握或思考中，列表可以只看其中一种，也能按原文先后排列
  - id: AC-4
    given: 一条已保存的侧聊
    when: 凝练一句话、改写、清除，或在还没有完成回答时凝练
    then: 这句话出现在侧栏，原文标记上也能看到；改写和清除立即生效。没有完成的回答或凝练失败时会说明原因，原来的话还在
  - id: AC-5
    given: 侧聊里有一条完成的回答，主输入框里可能已有草稿
    when: 引用回主线或复制这条回答
    then: 完整回答接在主输入框已有草稿后面，引用说明使用当前界面语言，不会自动发送，主对话记录不变
  - id: AC-6
    given: 一条侧聊已标成已掌握并写有一句话
    when: 修改标题，或在全部批注里按状态、这句话查找
    then: 列表使用新标题；只能看到自己有权查看的批注，可以用状态或这句话里的词找到它
