id: skill-operation-confirm-bar
title: 技能操作确认后收成可关闭的小横条
status: implemented
requirement: |
  这个我点了，就缩成一个小横条，带个关闭窗口就行了，好像沉淀的过程比较慢，会一直挡着
  这怎么还蹦出来2个？
  这还有问题，失败的无法关闭
notes: |
  assumedApproval: standing-order-2026-10-22
  同一技能、同一操作只留一条。已经完成或正在处理时，不再铺同名的待确认大卡，也不再铺完成后的重复失败卡。
  关闭只从当前对话拿掉提示，不取消已经发出的确认，不把失败改成成功，也不自动重试。
criteria:
  - id: AC-1
    given: 对话里有一张还没确认的技能沉淀建议大卡
    when: 用户点击确认并执行
    then: 大卡立刻变成一条小横条，能看出技能名和正在处理的短状态，长正文不再挡住对话，确认请求仍然发出
  - id: AC-2
    given: 技能操作正在处理、已经完成或已经失败，对话里是一条小横条
    when: 用户点击关闭
    then: 这条提示从当前对话消失；正在进行的沉淀不会被取消，失败不会变成成功，也不会自动重试
  - id: AC-3
    given: 一条技能建议还没有确认
    when: 用户查看或点击拒绝
    then: 仍显示建议正文以及确认并执行、拒绝；拒绝沿用原来的拒绝结果，不会变成执行中
  - id: AC-4
    given: 同一对话里同一技能的同一种操作已经完成或正在处理，又出现一条同名待确认或失败记录
    when: 用户查看对话
    then: 只保留一条小横条，不再另铺一张同名大卡或重复失败卡；另一条不同技能、尚未确认的建议仍显示大卡
  - id: AC-5
    given: 一条技能操作失败，且没有已完成的同名同类操作盖住它
    when: 用户查看并关闭这条提示
    then: 它是一条带失败状态和可访问名称关闭按钮的小横条；关闭后提示消失，失败状态不会被改成成功
