id: ci-http-fixture-timing
title: 共享持续集成 HTTP 夹具计时
status: implemented
requirement: |
  云端的Action又报错了，去排查修复一下问题
notes: |
  assumedApproval: standing-order-2026-10-22
  只放宽共享 CI 冒烟夹具自己的完成宽限、关闭等待和排空预算。收集覆盖率时，压缩浸泡沿用 90 秒排空，并把默认读队列加深，避免已计划的读被算成错过。未收集覆盖率时仍是 30 秒和深度 20。全量协议的检索宽限、120 秒排空，以及 8000ms 延迟门槛保持不变。bot-release-readiness 仍要求冒烟夹具拒绝发布。
criteria:
  - id: AC-1
    given: 共享持续集成在收集覆盖率时运行 HTTP 冒烟夹具
    when: 固定读写窗口里已发出的请求在短宽限内还没返回，或已经排队但还没开始
    then: 这些请求仍计入原定读写数量并完成；发布结论仍然明确拒绝，并说明还缺发布证据
  - id: AC-2
    given: 冒烟夹具的服务进程在交出最终账本后故意不再退出
    when: 检查等待它关闭
    then: 检查在关闭预算内结束该进程，判定失败并留下关闭预算证据；检查自己的等待时间盖住冒烟耗时和关闭预算，不会在预算结束前先报超时
  - id: AC-3
    given: 共享持续集成的压缩 HTTP 浸泡里，计划中的读写和任务都已完成，只剩结果通知还在收尾
    when: 发布性能检查等待排空
    then: 检查能在自己的时限内看到排空，并继续用现有延迟门槛判断；本地默认排空和全量协议排空不变。进程挂死、任务没完成或延迟超过门槛时仍然失败
  - id: AC-4
    given: 共享持续集成在收集覆盖率时运行压缩 HTTP 浸泡夹具
    when: 驱动变慢，本地默认的读队列装不下正在进行的读，或结果通知超过 30 秒还没结束
    then: 计划中的读仍全部入队并完成，排空在 90 秒内被观察到，发布结论仍然明确拒绝。不收集覆盖率时排空仍是 30 秒、读队列深度仍是 20。全量协议的排空和队列深度不变，性能检查的 8000ms 延迟门槛也不变
