id: background-job-notice
title: 后台任务回执保留系统身份
status: implemented
requirement: |
  这个是什么东西
  那你分多个Agent修复一下问题
notes: 'assumedApproval: standing-order-2026-10-22; Background job completed 被显示成用户消息，且迟至下一次输入才出现。'
criteria:
  - id: AC-1
    given: 后台命令在原来的模型回复结束后完成
    when: 执行结果到达
    then: 立即记录系统回执，不等下一条用户消息，也不在随后消费时重复显示
  - id: AC-2
    given: 历史里有旧格式的后台任务回执
    when: 打开对话
    then: 将带后台任务来源标识的回执显示为系统通知，普通用户文字仍属于用户
  - id: AC-3
    given: 后台命令以非零状态结束或输出包含外部文字
    when: 记录执行结果
    then: 非零状态不记为成功，外部输出保留数据边界且回执不冒充用户指令
