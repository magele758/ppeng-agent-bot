id: bot-quality-reliability
title: 限定写入范围与辅助判断可靠性及重复对照
status: implemented
requirement: |
  继续把这次基线暴露的额外保存和辅助请求取消导致用量缺失的问题修好，扩充评估集并用当前 Grok 跑新旧版本重复对照，别降低门禁标准，做好测试和 review 后提交合并。
notes: |
  assumedApproval: standing-order-2026-10-22
  旧版失败与用量缺口不得回填或隐去；对照不充分仍拒绝发布，不把完成采样等同认证。
criteria:
  - id: AC-1
    given: 用户要求修改并检查指定产物
    when: Bot 执行并报告完成证据
    then: 执行指令限定写入于任务需要的产物，已有工具观测作为证据，不要求额外保存报告或使用替代存储冒充进度记录
  - id: AC-2
    given: 辅助语义判断在合理时限内返回真实结果
    when: 请求超过旧的三秒时限但尚未达到新的有界时限
    then: 等待并采用有效结果，不提前取消或在成功后触发取消；真正超时仍取消并保留原任务
  - id: AC-3
    given: 扩充后的真实任务集
    when: 新旧版本使用同一配置重复运行
    then: 保留原十六题并新增不同任务，至少三十题每版三次；并发有界且同题新旧交错，每次证据独立留存
  - id: AC-4
    given: 对照证据存在旧版失败、取消或用量缺失
    when: 计算结果并执行门禁
    then: 保留未知用量和失败，不以零补齐，不删除任务或降低原有门禁阈值
  - id: AC-5
    given: 压缩摘要可能包含旧目标或摘要生成时的格式要求
    when: Bot 继续处理当前请求
    then: 摘要生成指令与历史内容分离，回流摘要明确作为历史背景，不授权额外保存或替换当前输出要求
  - id: AC-6
    given: 当前请求经过多轮工具调用且历史选择器裁剪上下文
    when: 模型继续执行当前请求
    then: 当前用户要求和它之后的执行轨迹保留，不因尾部截断丢掉当前目标而恢复旧目标
