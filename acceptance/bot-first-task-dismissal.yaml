id: bot-first-task-dismissal
title: 首次任务引导可关闭且不干扰已有对话
status: implemented
requirement: |
  这个也非常的干扰，要么显示过了不要显示了，要么加个关闭，现在关闭也管不了
notes: |
  保留新 Bot 首次对话的示例入口，补充关闭和显示范围，不取消原首次任务能力。
  用户于 2026-10-21 批准。旧实现上复现长对话误显示及两种宽度缺少关闭入口的失败。
  实现后新增与原有首次使用流程共 9 项浏览器测试通过，国际化 16 项通过；
  Next 生产构建与验收门禁通过，当前小卡拉长对话已不再显示引导。
  2026-10-21 用户再次批准改写 AC-2、AC-3：引导不再跟着每个未关闭的新 Bot 出现。
  AC-2 只约束引导出现时的关闭方式；AC-3 改为关闭后在同一浏览器保持关闭，
  其他 Bot 也不再因为还没单独关闭而显示。AC-1、AC-4、AC-5 不改。
criteria:
  - id: AC-1
    given: 用户正在查看已经发送过消息的 Bot 对话
    when: 打开、刷新或切换回该对话，包括当前加载片段只有助手或工具消息的长对话
    then: 不显示“让 Bot 完成第一件事”引导，不因历史分页或自动刷新再次出现
  - id: AC-2
    given: 首次任务引导正在显示
    when: 用户用鼠标或键盘关闭它
    then: 有明确的关闭入口，鼠标和键盘都能关闭；关闭后立即释放空间，输入框和已有草稿不受影响
  - id: AC-3
    given: 用户已经关闭首次任务引导
    when: 在同一浏览器中刷新、重新进入或切走再回来，或打开其他 Bot
    then: 该引导保持关闭；其他 Bot 也不再因为还没单独关闭过而再显示
  - id: AC-4
    given: 新 Bot 的首次任务引导仍显示
    when: 用户选择任务示例或自行发送第一条消息
    then: 选择示例只填入输入框而不自动发送；第一条消息发送后引导不再出现，后续模型配置或连接问题仍有原来的补齐入口
  - id: AC-5
    given: 用户在桌面或窄屏中关闭首次任务引导
    when: 引导消失
    then: 对话和输入区可正常使用，不留下空白占位，不跳到无关历史，也不触发消息发送
