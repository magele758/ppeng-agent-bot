id: bot-autonomous-execution-coverage
title: Bot 自动选择并完整承接原有执行能力
status: implemented
requirement: |
  现在的bot模式是否可以使用所有的原来的agent的执行模式和功能？帮我检查下，bot应该是原来会话的agent的增强版才对，核查一下这个问题
  bot不应该继续让用户配置，把原来的模式让bot流程里自己根据任务去选择呢？
notes: |
  2026-10-24 P0 默认路由调整：普通任务在当前 Bot 执行；AC-4 的专业执行者测试使用显式子代理委托，保留实际派发与能力可用性断言。assumedApproval: standing-order-2026-10-22
  用户于 2026-10-21 确认全部七条标准并授权实现及测试。
  2026-10-21：完成自动路由、专业执行者、专用服务衔接及生命周期验证；相关回归 430 项通过。
  Evolution 沿用既有产品禁用状态，按 AC-6 明确报告不可用，不以普通执行替代。真实模型与远程机器现场效果不由本地测试替代。
  补充 bot-multi-goal-coordination 的执行覆盖范围，不改写其已批准标准。
  不恢复旧模式选择器；已有权限、审批、预算和目标取消约束继续有效。
criteria:
  - id: AC-1
    given: 用户在 Bot 对话中提出问答或多步骤任务
    when: Bot 开始处理
    then: Bot 自行选择直接回答或任务执行，用户无需配置执行模式、任务模式或编排引擎
  - id: AC-2
    given: 研究、浏览器、电脑操作、批量处理或多人协作所需能力已可用且已获授权
    when: 用户提出对应任务
    then: Bot 自动使用适合该任务的执行能力并返回实际结果，不要求用户转到旧会话选择模式
  - id: AC-3
    given: 原有编排、自愈、演进或工厂流程已可用且任务在授权范围内
    when: 用户在 Bot 中提出需要相应流程的任务
    then: Bot 能启动相应流程并跟踪其进度与结果，不以普通聊天代替实际执行或声称已执行
  - id: AC-4
    given: 已有规划、生成、评估等专业 Agent 可用且用户任务需要这些专业能力
    when: Bot 安排任务
    then: Bot 自动调用相应专业能力并整合结果，用户无需手动切换 Agent，原有专业约束继续生效
  - id: AC-5
    given: 同一目标在执行中出现新的工作需要
    when: 需要从研究转为实现、验证或协作等不同执行方式
    then: Bot 自动衔接执行方式，保留原目标、用户约束和已有成果，不要求用户重开会话或重新配置模式
  - id: AC-6
    given: 所需执行能力不可用、权限不足或必须由用户完成审批或登录
    when: Bot 判断后续行动
    then: Bot 说明具体原因，仅在能满足原任务要求时自动采用获授权的替代方式，否则报告阻塞或请求必要操作，不要求用户猜选技术模式，也不伪装完成
  - id: AC-7
    given: Bot 已启动某种执行流程
    when: 用户在同一对话中查询进度、追加约束或取消该任务
    then: Bot 将请求作用于对应的实际执行流程并反馈状态，取消后不再派发该任务的后续工作，也不被迟到结果重新启动
