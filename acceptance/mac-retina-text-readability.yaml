id: mac-retina-text-readability
title: Mac Retina 屏幕文字可读性优化
status: implemented
requirement: |
  主要是文字偏小、发灰，你帮我优化一下 Mac Retina 屏幕上的文字显示效果，先按项目要求写验收标准。
notes: |
  以 Mac Retina 屏幕、浏览器 100% 缩放为默认阅读场景，覆盖浅色与深色主题。
  下述字号均指浏览器显示的逻辑像素，不是屏幕物理像素；具体数值已由用户确认。
  自动化验证字号、有效对比度和布局；实际 Mac Safari 与 Chrome 的文字观感另做人工复核，
  不将模拟高像素密度的自动化结果宣称为真实设备观感验收。
criteria:
  - id: AC-1
    given: 用户在 Mac Retina 屏幕上以 100% 缩放打开聊天页面
    when: 阅读用户消息、助手回复和编辑待发送消息
    then: 消息正文与输入文字遵循用户选择的13、14、15、16、18px档位，默认14px，正文行高不小于字号的 1.5 倍
  - id: AC-2
    given: 用户以 100% 缩放使用控制台
    when: 查看导航、会话列表、按钮、设置表单以及时间和状态等辅助信息
    then: 导航、会话名称、按钮和表单文字比所选正文字号小1px且不小于12px，默认13px，时间和状态等辅助文字不小于 12px
  - id: AC-3
    given: 用户使用浅色或深色主题，界面没有遮罩覆盖
    when: 阅读消息正文、导航、会话名称、可用控件标签、输入占位提示及时间和状态等辅助文字
    then: 上述文字与其实际背景的有效对比度均不低于 4.5:1，计入透明度影响；禁用控件不在此要求内
  - id: AC-4
    given: 用户在宽度为 1280px 或 1440px 的桌面窗口中以 100% 缩放使用控制台
    when: 查看包含长会话名称、多行中英文消息、代码块和设置表单的页面
    then: 文字放大后不出现文字相互覆盖或控件标签被裁切，长会话名称可省略显示，代码块可在自身区域横向滚动
  - id: AC-5
    given: 用户在桌面浏览器中打开聊天页面
    when: 将浏览器缩放从 100% 调整到 200%
    then: 用户仍可阅读消息、编辑输入内容并操作发送按钮，允许页面重排和滚动，但文字与控件不相互遮挡
