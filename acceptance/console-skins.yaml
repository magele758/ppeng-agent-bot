id: console-skins
title: 多套可切换外观
status: implemented
notes: |
  assumedApproval: standing-order-2026-10-22
  外观与深浅色分开存。默认经典。每套外观可随时切回，不改掉原来的深色、浅色或跟随系统。
requirement: |
  我觉得可以，可以给圣所主题加一些元素，可以参考data-agent的元素，另外，按照这个模式再帮我开发：赛博朋克2077、恶魔的聚会、机器人大舞台、纯黑白像素风格的这几套主题，供我平时使用，分多个Agent去快速完成开发
  再加一套，童趣幼儿园的主题
criteria:
  - id: AC-1
    given: 用户打开设置里的外观
    when: 在经典、圣所、赛博朋克、恶魔的聚会、机器人大舞台、像素、童趣幼儿园之间切换
    then: 页面立刻换成所选外观，刷新后仍保持
  - id: AC-2
    given: 用户已经选了深色、浅色或跟随系统
    when: 换到任意一套外观再切回经典
    then: 深浅色选择没有被改掉
  - id: AC-3
    given: 用户选了圣所
    when: 查看页面
    then: 仍是炭绿和旧金，并多出不挡住操作的数学几何装饰
  - id: AC-4
    given: 用户分别选中赛博朋克、恶魔的聚会、机器人大舞台、像素、童趣幼儿园
    when: 查看页面
    then: 五套外观彼此不同，也不同于经典的纯黑加链接蓝
  - id: AC-5
    given: 用户选了像素
    when: 查看页面
    then: 只有黑、白、灰，没有彩色
  - id: AC-6
    given: 这台浏览器没有选过外观
    when: 打开控制台
    then: 仍是经典外观
