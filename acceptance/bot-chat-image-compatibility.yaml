id: bot-chat-image-compatibility
title: Bot 历史图片兼容与群聊发送恢复
status: implemented
requirement: |
  怎么这个bot突然不能对话了？模型是没问题的，其他的bot可以对话，帮我排查一下，我之前还碰到过群聊不能发送消息问题，一起看看
criteria:
  - id: AC-1
    given: Bot 历史对话包含图片，当前选择的模型仅支持文本且可正常服务
    when: 用户继续发送纯文本消息
    then: Bot 能正常回复，原有历史消息和图片仍可查看，不因历史图片而持续失败
  - id: AC-2
    given: 用户本次发送图片，但当前模型不能处理图片且没有可用的图片理解模型
    when: 用户发送消息
    then: 界面明确说明图片与模型不兼容，不静默丢弃本次图片或假装理解图片
  - id: AC-3
    given: 群聊处于可发送状态，成员模型正常可用
    when: 用户发送纯文本消息，包括在一次失败后再次发送
    then: 消息被接收并能获得成员回复，不因之前的失败永久卡住；若本次失败，界面显示可理解的原因
