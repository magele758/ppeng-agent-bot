id: bot-product-p2
title: Bot成果复用记忆纠错与持续协作
status: implemented
requirement: |
  我觉得你说的非常好，P0到P2的功能，我都挺喜欢的，帮我都做了
notes: |
  承接本次纵向切片评估的P2；补充现有历史记忆、Room、委派和Routine标准。
  新界面支持中英文，策略经界面持久保存；沿用现有审批，不因自动化或委派扩大权限。
  度量只使用真实观测，未知成本与未验证结果保持未知，不以估计冒充实测。
criteria:
  - id: AC-1
    given: 用户已有一项交付成果
    when: 选择基于该版本继续修改
    then: 新成果保留版本关系和来源任务，旧版本仍可查看，用户无需重新从聊天记录寻找或粘贴原成果
  - id: AC-2
    given: Bot保存重要长期偏好或使用已有记忆影响回答
    when: 用户查看相关提示
    then: 可以查看记忆内容、来源、适用范围与更新时间，并能撤销新增记忆或纠正已有记忆
  - id: AC-3
    given: 用户已有长期偏好或项目事实
    when: 给出本次任务的临时要求或纠正旧事实
    then: 临时要求不会改写长期偏好，纠正内容在后续召回中生效且冲突处理可查看，删除的记忆不会再次作为有效记忆使用
  - id: AC-4
    given: 长对话已多次压缩且存在未完成工作与被纠正的事实
    when: 用户继续任务并查询历史依据
    then: 能继续未完成工作并检索可访问的原始来源，沿用纠正后的事实，不将短摘要当作完整历史
  - id: AC-5
    given: 用户向主Bot提出适合多人协作的任务
    when: 主Bot委派工作
    then: 用户默认看到统一目标、总体进展、阻塞点与汇总交付，并可展开各成员工作，成员不会获得超出原有授权的能力
  - id: AC-6
    given: 多Bot协作中一个成员失败或等待人工处理
    when: 用户查看任务
    then: 能看到受影响的部分和已有成果，处理阻塞后只继续必要工作，不重复已完成的外部操作或把部分成功当作全部完成
  - id: AC-7
    given: 用户已完成一次任务并希望定期复用
    when: 将其保存为例行任务
    then: 可以确认执行时间及时区、输入来源、输出位置和通知规则，支持仅变化时通知、达到指定连续失败次数后提醒及发送前审批，重新打开后仍保留这些设置
  - id: AC-8
    given: 用户已有执行记录
    when: 查看产品效果统计并选择时间范围
    then: 可以查看首次有效交付耗时、任务验收成功率、人工干预次数、故障恢复成功率和每次成功交付成本，各指标说明统计口径且缺失数据不记作零或成功
