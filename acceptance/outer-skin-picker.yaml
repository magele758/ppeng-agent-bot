id: outer-skin-picker
title: 外层外观设置可选中
status: implemented
requirement: |
  外层的主题设置的按钮坏了，选择没反应。
notes: |
  assumedApproval: standing-order-2026-10-22
  侧栏底部悬停菜单里的外观列表在选项可选中前保持打开，选中后立刻应用并在刷新后仍保持。
  底部菜单带着毛玻璃时，列表仍要出现在按钮旁边并且点得到。点在选项上先换外观，不能当成点在外面先关掉。按 Escape 或点在外面则只关闭列表。
criteria:
  - id: AC-1
    given: 用户打开侧栏底部菜单并展开外观列表
    when: 把指针移到某一外观选项并点击
    then: 底部菜单在选项可选中前保持打开，选中后外观立刻切换并在刷新后仍保持
  - id: AC-2
    given: 侧栏底部菜单开着，当前外观带着毛玻璃
    when: 用户打开外观列表并点选其中一项
    then: 选项出现在按钮旁边且指针能点中，外观立刻换成这一项；点在选项上不会先被当成点在外面而把列表关掉
  - id: AC-3
    given: 外观列表已经展开
    when: 用户按下 Escape，或在列表和外观按钮以外按下指针
    then: 列表关闭，已经选中的外观保持不变
