id: lab-startup-request-load
title: 控制台启动时的请求负担
status: implemented
notes: 'assumedApproval: standing-order-2026-10-22'
requirement: |
  我看现在网页启动，请求太多了，把页面都卡半天，优化一下启动速度

  发现的问题都查一下和解决
criteria:
  - id: AC-1
    given: 一条会话累积了大量运行日志和检查点
    when: 控制台打开这条会话，或定时读取它的状态
    then: 返回内容不携带这些内部日志，会话的其它设置照常返回，已保存的会话没有被改动
  - id: AC-2
    given: 一个 Bot 的主会话累积了大量运行日志和检查点
    when: 控制台打开这个 Bot
    then: 返回的会话不携带这些内部日志，其它设置照常返回
  - id: AC-3
    given: 页面上某项定时读取还没返回
    when: 同一个地址的下一次定时读取到来
    then: 不再重复发出，两次共用同一次请求并拿到同样的结果；这次请求结束后再读，会重新发出请求
  - id: AC-4
    given: 页面上某项定时读取还没返回
    when: 期间保存了一次修改，随后再定时读取同一个地址
    then: 后一次读取重新发出请求，不复用修改之前发出的那一次
  - id: AC-5
    given: 控制台刚打开，版本与健康状态还没返回
    when: 页面开始加载概览列表
    then: 概览列表不等版本与健康状态返回就开始加载
  - id: AC-6
    given: 某个地址的定时读取还没返回
    when: 因为打开会话、发送消息或回复结束而读取同一个地址
    then: 这次读取单独发出请求，拿到的是发出之后的结果，不复用已经在路上的那一次
  - id: AC-7
    given: 控制台停在对话页
    when: 页面定时刷新
    then: 只读取侧栏用到的会话、Bot 和待审批；任务、日程、草稿、工作区、后台任务、运行记录和邮箱这些只在各自页面显示的列表不再读取，已有内容和加载结果保持不变
  - id: AC-8
    given: 控制台停在对话页，任务等列表没有在定时读取
    when: 切到显示这些列表的页面
    then: 该页用到的列表立即读取，不等下一次定时刷新；即使切页时正有一次刷新在路上也会补读；停留期间照常定时刷新
  - id: AC-9
    given: 版本和健康状态、Agent 列表已经读过
    when: 页面定时刷新
    then: 三十秒内不重复读取它们；手动刷新或某个操作引起的刷新照常立即读取
  - id: AC-10
    given: 页面上有定时读取在进行
    when: 标签页切到后台
    then: 定时读取暂停，Bot 工作状态放慢但不停止，桌面通知照常；标签页回到前台时立即读取一次并恢复原来的节奏
  - id: AC-11
    given: 标签页在后台期间，打开的会话有了新的活动
    when: 标签页回到前台
    then: 会话正文重新读取；期间没有新活动则不重读正文
  - id: AC-12
    given: 打开的会话处于空闲
    when: 定时读取它的状态、技能卡片和活动列表
    then: 读取间隔放慢；会话开始运行或等待审批时立即读取一次并恢复快速读取，运行结束时再立即读取一次
  - id: AC-13
    given: 没有 Bot 在工作
    when: 定时读取 Bot 工作状态
    then: 每两秒读取一次；有 Bot 在工作时每秒一次；连续失败时按原来的方式逐步放慢
  - id: AC-14
    given: 偏好或置顶没有待保存的本地修改
    when: 页面定时与后台同步
    then: 每十五秒才读取一次其它浏览器的修改，标签页在后台时不读取；本地有待保存的修改时在下一次检查就发出，不受这个间隔限制
  - id: AC-15
    given: 上一次定时读取还没返回
    when: 到了下一次读取的时间
    then: 等上一次结束后再按间隔安排下一次，同一项读取不会叠加
