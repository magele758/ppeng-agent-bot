id: bot-routine-lifecycle
title: Bot 可靠例行任务
status: approved
requirement: |
  完整补齐前述 gap，按 Bot 模式多 Agent 协作开发计划实施。
notes: |
  final acceptance by lei pending
  用户已授权完整实施，承接开发计划 G09–G12，不重复索取相同授权。
criteria:
  - id: AC-1
    given: Bot 正在私聊或等待审批
    when: 一次性任务到期
    then: 任务运行被持久记录，并在独立工作对话中执行，不因关闭未来触发而丢失
  - id: AC-2
    given: 用户设置自己的时区和周期任务
    when: 夏令时重复或缺失时刻以及停机后的恢复发生
    then: 重复时刻只执行一次，缺失时刻被跳过，错过触发按选择策略处理并可查看记录
  - id: AC-3
    given: 任务已触发或执行中
    when: 用户查看运行历史、取消、重试或进程重启
    then: 显示真实状态与结果，未开始工作可恢复，未知效果不自动重放，审批规则继续有效
  - id: AC-4
    given: 用户使用 Bot 定时任务功能
    when: 选择周期、一次性、间隔或事件任务，或者在对话中要求安排任务
    then: 可以保存任务并重新读取，不需要新增环境变量，未启用的对话工具可在界面配置
  - id: AC-5
    given: 后台任务正常完成、失败或预检跳过
    when: 用户检查私人对话和任务运行
    then: 原始任务在独立工作上下文执行，主对话只收到结果摘要及原结果引用，跳过不会显示为成功
  - id: AC-6
    given: 用户创建或修改周期任务并设置未来的截止时间
    when: 到达截止时间
    then: 不再产生新运行，已产生的运行结束后自动删除任务配置并保留运行历史
  - id: AC-7
    given: 例行任务完成模型执行
    when: 最终输出去除首尾空白后以 '[NO_UPDATE]' 开头
    then: 运行显示静默状态且主对话不收到摘要，普通输出仍正常通知
  - id: AC-8
    given: 用户通过界面、接口或对话安排间隔任务
    when: 设置小于一分钟的间隔或非未来的截止时间
    then: 保存被拒绝，一分钟及以上间隔和未来截止时间可保存
