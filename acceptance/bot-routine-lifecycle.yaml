id: bot-routine-lifecycle
title: Bot 可靠例行任务
status: approved
requirement: |
  完整补齐前述 gap，按 Bot 模式多 Agent 协作开发计划实施。
notes: |
  final acceptance by lei pending
  用户已授权完整实施，承接开发计划 G09–G12，不重复索取相同授权。
criteria:
  - id: AC-1
    given: Bot 正在私聊或等待审批
    when: 一次性任务到期
    then: 任务运行被持久记录，并在独立工作对话中执行，不因关闭未来触发而丢失
  - id: AC-2
    given: 用户设置自己的时区和周期任务
    when: 夏令时重复或缺失时刻以及停机后的恢复发生
    then: 重复时刻只执行一次，缺失时刻被跳过，错过触发按选择策略处理并可查看记录
  - id: AC-3
    given: 任务已触发或执行中
    when: 用户查看运行历史、取消、重试或进程重启
    then: 显示真实状态与结果，未开始工作可恢复，未知效果不自动重放，审批规则继续有效
  - id: AC-4
    given: 用户使用 Bot 定时任务功能
    when: 选择周期、一次性、间隔或事件任务，或者在对话中要求安排任务
    then: 可以保存任务并重新读取，不需要新增环境变量，未启用的对话工具可在界面配置
  - id: AC-5
    given: 后台任务正常完成、失败或预检跳过
    when: 用户检查私人对话和任务运行
    then: 原始任务在独立工作上下文执行，主对话只收到结果摘要及原结果引用，跳过不会显示为成功
  - id: AC-6
    given: 用户创建或修改周期任务并设置未来的截止时间
    when: 到达截止时间
    then: 不再产生新运行，已产生的运行结束后自动删除任务配置并保留运行历史
  - id: AC-7
    given: 例行任务完成模型执行
    when: 最终输出去除首尾空白后以 '[NO_UPDATE]' 开头
    then: 运行显示静默状态且主对话不收到摘要，普通输出仍正常通知
  - id: AC-8
    given: 用户通过界面、接口或对话安排间隔任务
    when: 设置小于一分钟的间隔或非未来的截止时间
    then: 保存被拒绝，一分钟及以上间隔和未来截止时间可保存
  - id: AC-9
    given: 用户已为通用 Webhook 或 CI 事件任务配置独立签名凭据和可选完成结论筛选
    when: 收到事件通知
    then: 仅签名正确、时间在五分钟窗口内且投递标识未重复的事件可触发任务，CI 仅匹配完成事件及所选结论，任意 JSON 通用载荷均可接收
  - id: AC-10
    given: 用户启用例行任务对话工具并拥有任务
    when: 在对话中要求立即运行或分页查询运行历史及单次详情
    then: 可以立即提交运行并查询真实结果，仍遵守任务串行与审批规则，不能访问他人的任务或运行
  - id: AC-11
    given: 任务运行处于静默、跳过或未知状态
    when: 用户在中文或英文面板查看运行记录
    then: 三种状态分别显示不同标签和样式，均不显示为成功
  - id: AC-12
    given: 多个服务实例共享同一份例行任务状态
    when: 同一触发到期、运行持续较久或实例中断后恢复
    then: 每次触发仅一个实例执行，存活运行持续保有执行权，未开始工作在执行权过期后可接管，可能已产生效果的中断运行显示未知且不自动重放
  - id: AC-13
    given: 例行任务已向主对话发布结果摘要
    when: 用户引用该摘要或紧接摘要发送下一条消息
    then: Bot 使用关联工作对话的上下文继续回答并在主对话返回结果，工作对话已删除时仍可正常聊天且不引用其他对话
