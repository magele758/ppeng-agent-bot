id: bot-rooms
title: 多 Bot 群会话与可靠发言
status: implemented
requirement: |
  跟其他bot的通信的模式，组群会话的能力是否能支持
  群里遇到需要真人登录/验证/审批的步骤，转到私聊完成
owner: user
notes: |
  用户已授权按 Bot 模式多 Agent 开发计划完整补齐；本规格承接该计划的群会话范围。
  2026-10-15：负责人要求没有 @ 时由当前全部成员回应，不再只由主持 Bot 回应。点名仍只叫醒被点到的成员。
  2026-10-17：负责人批准成员可静默结束本次发言（不算失败，仍占用本轮一次发言预算）；本轮实际会跑到的最后一名成员收到「本轮收尾，非必要不回」提示。
  2026-10-17：负责人批准没被 @ 的成员也会轮到，但排在被点名成员之后并收到克制提示，非必要保持静默，且只在本轮发言预算还没用完时才轮到；取代 2026-10-15 记录里「点名仍只叫醒被点到的成员」。
  2026-10-17：负责人批准群回合可以给其他 Bot 发 1:1 私聊（含叫醒与只入库两种）。AC-3 的隔离语义不变：私聊原文和私有记忆仍不进群。
  2026-10-18：负责人批准 AC-8。群里遇到需要真人审批、登录或验证的步骤时，转到该 Bot 与真人的私聊完成；群里只留一句简短说明。AC-3 的隔离语义不变。
criteria:
  - id: AC-1
    given: 用户有多个有权访问的 Bot
    when: 创建群会话并选择成员
    then: 群有独立名称、成员和持久历史，重启后仍可读取
  - id: AC-2
    given: 群会话里有多名成员
    when: 用户用 @ 点名其中若干成员，或不点名直接发送
    then: 有 @ 时，被点到的成员按出现顺序先发言，然后当前其余成员也按群里的顺序轮到，并被告知自己没被点名、除非有必要补充否则保持沉默；没有 @ 时当前每个成员都照常轮到一次；无论哪种情况，本轮实际发言的成员总数不超过本轮发言预算，预算被点名成员用完时没被点名的成员不再轮到；轮到的成员可以保持沉默（空回复或只回复静默标记）——这只结束它自己这一次发言，不会往群里发消息，不算失败，但静默也占用本轮一次成员发言预算，预算未用完时本轮继续让下一名成员发言；本轮实际会跑到的最后一名成员会被告知这是本轮收尾，非必要不回复；不是成员的名字不会被拉进群
  - id: AC-3
    given: 成员在私人对话中已有历史
    when: 成员在群里工作并回复
    then: 它能看到群共享历史，回复回到群中，私人历史不会自动复制入群且群工作不写入私人对话
  - id: AC-4
    given: 群会话正在处理工作
    when: 达到发言预算或用户停止、暂停、移除成员
    then: 群按限制停止新增发言，显示终止原因，已退出的成员不再被调度
  - id: AC-5
    given: 成员正在运行或等待审批且新群消息到达
    when: 工作继续或运行进程重启
    then: 新工作被可靠保存而不并发执行同一上下文，未开始工作可继续，执行中无法确认的工作明确显示待核对
  - id: AC-6
    given: 群历史含附件引用且有其他用户
    when: 分页读取历史或请求访问群
    then: 历史稳定分页并保留附件引用，无权用户不能读取、修改或触发该群
  - id: AC-7
    given: 群里有多名成员，且安装里还有其他有权联系的 Bot
    when: 正在发言的成员给另一个存在的 Bot 发一条 1:1 私聊，并选择立刻叫醒对方，或只把消息留给对方下次自己开口时再看
    then: 私聊记到对方自己的对话里，并标明来自哪个群；立刻叫醒时对方会开始处理，只留言时对方不会因此被叫醒。不是 Bot、不存在或无权联系的对象收不到。这条私聊及其后对方私聊里出现的内容不会写回群历史。同一条私聊链最多再转 3 跳，群这一轮的工具次数用尽后不能再发。群回合不能借这条私聊让对方去做仍需真人点头的事，对方要等真人授权。
  - id: AC-8
    given: 群里有成员正在回应，下一步需要真人审批、登录或验证才能继续
    when: 这一步出现
    then: 群里不等待，也不展示要真人操作的卡片或凭证细节，只留一句简短说明，告诉真人去和这个 Bot 的私聊里处理。这一步出现在该 Bot 与真人的私聊里，由真人在私聊里批准或完成。真人在私聊里处理完之后，结果只留在私聊，不会自动写回群，也不会让群把这一步再执行一遍。群这一轮不会因此卡住，该成员这一轮按已转私聊结束，而不是失败。其他成员该说的话照常继续。私聊里的内容仍然不会进入群。
