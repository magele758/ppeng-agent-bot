id: bot-rooms
title: 多 Bot 群会话与可靠发言
status: implemented
requirement: |
  跟其他bot的通信的模式，组群会话的能力是否能支持
  群里遇到需要真人登录/验证/审批的步骤，转到私聊完成
owner: user
notes: |
  用户已授权按 Bot 模式多 Agent 开发计划完整补齐；本规格承接该计划的群会话范围。
  2026-10-15：负责人要求没有 @ 时由当前全部成员回应，不再只由主持 Bot 回应。点名仍只叫醒被点到的成员。
  2026-10-17：负责人批准成员可静默结束本次发言（不算失败，仍占用本轮一次发言预算）；本轮实际会跑到的最后一名成员收到「本轮收尾，非必要不回」提示。
  2026-10-17：负责人批准没被 @ 的成员也会轮到，但排在被点名成员之后并收到克制提示，非必要保持静默，且只在本轮发言预算还没用完时才轮到；取代 2026-10-15 记录里「点名仍只叫醒被点到的成员」。
  2026-10-17：负责人批准群回合可以给其他 Bot 发 1:1 私聊（含叫醒与只入库两种）。AC-3 的隔离语义不变：私聊原文和私有记忆仍不进群。
  2026-10-18：负责人批准 AC-8。群里遇到需要真人审批、登录或验证的步骤时，转到该 Bot 与真人的私聊完成；群里只留一句简短说明。AC-3 的隔离语义不变。
  2026-10-21：负责人确认改写 AC-2、AC-3 的隔离句和 AC-8，不废弃本规格，AC-1、AC-4、AC-5、AC-6、AC-7 与「至少 2 人」保持有效。
  AC-2 的发言规则改由 bot-room-sparse-routing 承接：所有群稀疏唤醒，点名只叫醒被点到的人，静默不占有效发言次数。上文 2026-10-15「未点名由全部成员回应」和 2026-10-17「没被点名的成员也会轮到、静默仍占预算」被这次改写取代。
  2026-10-21：AC-2 里「按出现顺序发言」改由 bot-room-wave-dispatch 承接：被选中的成员可以同时处理，先完成的先出现；同一成员这一轮最多一条公开回复，群主可以在其他人说完后做一次收尾总结；停止或取消后，还没出现的回复不再出现。不改 AC-4、AC-5。
  2026-10-22：AC-2 里「未点名由群主回答、2 人或 3 人至少一条可见回复」改为按贴题程度选人；谁都对不上时零回复，不再贴「我先接住」。短否定与静默标记一样不进群。本规格不 retired。
  AC-3 里「私人历史不进群、群工作不写入私人对话」改由 bot-room-touched-memory 承接：私人原文不整段贴进群；触达过的群内容可进入该 Bot 之后的单聊；单聊记忆可以说进群里。AC-7 的私聊链仍不回写群历史。
  AC-8 默认仍是私聊移交，由 bot-room-tasks 复述。Lab 打开群内原位批准后按 bot-room-inline-approval。默认不改成群内批准。
criteria:
  - id: AC-1
    given: 用户有多个有权访问的 Bot
    when: 创建群会话并选择成员
    then: 群有独立名称、成员和持久历史，重启后仍可读取
  - id: AC-2
    given: 群会话里有多名成员
    when: 用户用 @ 点名其中若干成员，或不点名直接发送
    then: 有 @ 时，只叫醒被点到且不超过本轮发言人数上限的成员，他们可以同时处理，先完成的先出现在群里，没被点名的成员不发言。同一成员这一轮最多一条公开回复；群主可以在其他人说完后做一次收尾总结。用户停止或取消后，还没出现在群里的回复不再出现。点名没有命中任何成员时，群里只说明没找到对象，不叫醒其他成员。没有 @、也没有引用某条回复时，不是每位成员都发言，只由和这句消息对得上、且不超过上限的成员发言；谁都对不上时这一轮没有任何成员回复，也不会替群主补一句「我先接住」。成员可以保持沉默（空回复、只回复静默标记，或只回复「我不知道」「不清楚」「没有要补充」这类短否定），这不往群里发消息，不算失败，也不占用本轮有效发言次数；下一位已经被选中的成员仍可以发表可见回复。不是成员的名字不会被拉进群。可见回复条数不超过本轮发言预算
  - id: AC-3
    given: 成员在私人对话中已有历史
    when: 成员在群里工作并回复
    then: 它能看到这次推送给它的群共享历史，回复回到群中。私人对话原文不会整段复制进群。它可以使用自己的单聊记忆，因此单聊里记住的事实可能出现在群回复里。它这次实际收到的纪要、最近消息、自己取回的原文和附件，以及自己发出的群消息，可以在它之后的单聊里使用。没有推送给它、它也没有取回的群内容，不因它在群里就进入单聊
  - id: AC-4
    given: 群会话正在处理工作
    when: 达到发言预算或用户停止、暂停、移除成员
    then: 群按限制停止新增发言，显示终止原因，已退出的成员不再被调度
  - id: AC-5
    given: 成员正在运行或等待审批且新群消息到达
    when: 工作继续或运行进程重启
    then: 新工作被可靠保存而不并发执行同一上下文，未开始工作可继续，执行中无法确认的工作明确显示待核对
  - id: AC-6
    given: 群历史含附件引用且有其他用户
    when: 分页读取历史或请求访问群
    then: 历史稳定分页并保留附件引用，无权用户不能读取、修改或触发该群
  - id: AC-7
    given: 群里有多名成员，且安装里还有其他有权联系的 Bot
    when: 正在发言的成员给另一个存在的 Bot 发一条 1:1 私聊，并选择立刻叫醒对方，或只把消息留给对方下次自己开口时再看
    then: 私聊记到对方自己的对话里，并标明来自哪个群；立刻叫醒时对方会开始处理，只留言时对方不会因此被叫醒。不是 Bot、不存在或无权联系的对象收不到。这条私聊及其后对方私聊里出现的内容不会写回群历史。同一条私聊链最多再转 3 跳。费用或这一轮工具次数用尽不得停掉群回合，也不得因此取消会话或拦住这条私聊。群回合不能借这条私聊让对方去做仍需真人点头的事，对方要等真人授权。
  - id: AC-8
    given: 群里有成员正在回应，下一步需要真人审批、登录或验证才能继续
    when: 这一步出现
    then: 默认仍转到该 Bot 的私聊。群里不等待，也不展示要真人操作的卡片或凭证细节，只留一句简短说明。真人在私聊里批准或完成后，结果只留在私聊，不会自动写回群，群也不会把这一步再执行一遍。该成员这一轮按已转私聊结束，而不是失败。其他成员该说的话照常继续。私聊里的审批过程不进入群。用户在 Lab 打开群内原位批准后，群里才出现批准卡片，批准后的最终文字回到群，拒绝后该步不执行；关掉该设置后，下一次又转回私聊。默认不是群内批准
