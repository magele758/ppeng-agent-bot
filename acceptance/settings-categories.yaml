id: settings-categories
title: 设置页「行为 / 安全 / 工具 / 集成」分类易用化
status: implemented
requirement: |
  配置太多不好用。行为、安全与沙箱、工具与技能、集成与可观测这几类设置要按意图分组，
  用大白话写清每一项是干什么的并显示默认值，危险或专家级选项收进「高级」，
  保存 / 重置 / 未保存提示的交互要统一，并且都能被搜索到。
criteria:
  - id: AC-1
    given: 用户未开启「显示高级」，依次打开行为、安全、工具、集成四个分类
    when: 浏览每个分类
    then: 每个分类至少有一项常用设置可见，每个设置分组都带一句大白话说明；循环内核、上下文压缩、目标校验、沙箱 Cloudflare 连接、动态工具、能力发现、Langfuse、Jev 不在这些分类里，未开启「显示高级」时在「实验特性」里直接可见
  - id: AC-2
    given: 用户在「行为」分类看到「默认任务模式」等下拉或开关
    when: 用户改动其中一项
    then: 立即保存并提示「已保存」，刷新页面后该值保持不变
  - id: AC-3
    given: 某个设置项的值不同于系统默认值，且旁边显示了「默认：xxx」
    when: 用户点击该项的「恢复默认」
    then: 该项回到默认值并保存；值等于默认时不再显示「恢复默认」
  - id: AC-4
    given: 用户在需要点「保存」的表单类设置（如 Goal 最大轮数、Langfuse 连接）里修改了内容但还没保存
    when: 查看该表单
    then: 出现「有未保存的修改」提示，「保存」和「撤销修改」可点；点「撤销修改」后恢复到已保存的值，提示消失
  - id: AC-5
    given: 用户在带数字输入的设置里填入超出范围或不是整数的值
    when: 离开输入框或点保存
    then: 输入框旁显示明确的范围提示，且不会把非法值保存下去
  - id: AC-6
    given: 用户选择风险较高的选项（沙箱「直接执行（无隔离）」、能力发现的「主动扫描」）
    when: 选中该选项
    then: 立即在该选项旁看到风险警告说明；选择更安全的选项后警告消失
  - id: AC-7
    given: 用户在设置页搜索框用大白话输入需求（如「上下文太长」「审计」「追踪」）
    when: 关键词匹配某项设置的标题或同义词（含高级设置）
    then: 对应设置出现并标注所属分类，无需先开启「显示高级」
  - id: AC-8
    given: 用户切换界面语言为 English
    when: 打开行为、安全、工具、集成分类
    then: 标题、说明、默认值提示、按钮都显示英文，没有残留中文
