id: chat-reading
title: 会话正文阅读节奏
status: implemented
requirement: |
  我总觉得当前项目的web里面的对话的内容看起来很累，内容很挤，然后密密麻麻的，看起来不适合阅读，你看看怎么优化下会话里的对话内容展示，现在是markdown的渲染，有什么最佳的渲染实践吗？帮我先搜索研究一下，然后分多个agent去完成这块ui的提升
notes: 'assumedApproval: standing-order-2026-10-22'
criteria:
  - id: AC-1
    given: 助手回复是 Markdown，两段正文之间有一个空行
    when: 这段回复显示在会话里
    then: 两段各自成段，段与段之间有可见的空白；同一段里的单个换行不会变成一行一行的硬折行
  - id: AC-2
    given: 助手回复里有标题、段落、列表和引用
    when: 这段回复显示在会话里
    then: 标题比正文大并且标题上方留白多于下方，正文行距松于挤在一起的单倍行距，段落、列表和引用的行宽停在适合阅读的篇幅，代码块和表格仍可使用会话栏的全宽
  - id: AC-3
    given: 助手回复里有一段标明语言的代码
    when: 这段回复显示在会话里
    then: 代码块上方能看到语言名和复制按钮；点复制后按钮变成已复制，代码文本进入剪贴板；代码块不会被限制在大约半屏的高度里
  - id: AC-4
    given: 助手回复里有一张列很多的表
    when: 这段回复显示在会话里
    then: 表格在气泡内横向滚动而不是把会话撑破，表头在表格区域内滚动时保持可见，单元格有足够的内边距
  - id: AC-5
    given: 一条长过折叠阈值的助手回复
    when: 读者展开全文
    then: 全文仍按 Markdown 排版，而不是一整块等宽原文
  - id: AC-6
    given: 回复里有普通链接，以及夹带的脚本标签
    when: 这段回复显示在会话里
    then: 链接在新标签打开，脚本不会被执行
