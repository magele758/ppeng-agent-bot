id: risk-advisory-ui
title: 对话里的运行策略提醒
status: implemented
requirement: |
  这种是什么？为什么会有这个提醒？算警告？给他先加个ui，然后分析下他警告的是否合理，我看这个最近挺频繁的
notes: |
  assumedApproval: standing-order-2026-10-22
  本次先改展示并分析现有触发机制，不调整运行阈值或关闭保护。
criteria:
  - id: AC-1
    given: 系统消息包含运行策略提醒
    when: 在聊天中查看历史或实时消息
    then: 显示可读的提示卡，轮次和预算提醒与连续失败或重复行为区分，原始详情默认折叠且可展开
  - id: AC-2
    given: 用户引用提醒文本或系统出现未知和不完整的提醒
    when: 渲染消息
    then: 不把用户引用当作系统警告，不丢失未知内容，也不把原始数字误称为风险等级或剩余次数
  - id: AC-3
    given: 用户在窄屏或英文界面查看提醒
    when: 展开详情
    then: 内容不撑出页面，标题与说明使用当前语言
