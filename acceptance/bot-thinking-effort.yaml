id: bot-thinking-effort
title: 每个 Bot 的思考力度固定
status: implemented
requirement: |
  实现「per-bot thinking effort pin 并透出到 Lab UI」：给每个 Bot 单独固定思考力度，可选
  跟随全局（默认）/ 关闭 / 低 / 中 / 高；只要固定了（包括关闭）就覆盖全局，未固定才跟随全局
  思考力度设置；BotDetail 在模型固定旁可以选择，「跟随全局」带出当前全局档位，zh/en 文案齐全。
notes: 'assumedApproval: standing-order-2026-10-22'
criteria:
  - id: AC-1
    given: 一只 Bot 还没有固定思考力度
    when: 在 Bot 设置里把思考力度选为关闭、低、中或高并保存，再重新打开这个 Bot 的设置
    then: 这只 Bot 的每条对话（包括之后新开的）都记住了这一档，不用重启；只能保存这四档或跟随全局，别的值被拒绝且原设置不变
  - id: AC-2
    given: 全局思考力度是高，某只 Bot 固定为低
    when: 在这只 Bot 的对话里发起下一轮
    then: 这一轮按低要求思考，而不是全局的高
  - id: AC-3
    given: 全局思考力度是中，另一只 Bot 没有固定思考力度
    when: 在这只 Bot 的对话里或一条普通对话里发起下一轮
    then: 这一轮按全局的中要求思考，行为与固定功能加入之前一致
  - id: AC-4
    given: 某只 Bot 已固定思考力度为高
    when: 在 Bot 设置里改回「跟随全局」，然后在该 Bot 的对话里发起下一轮
    then: 这一轮按全局档位要求思考（全局关闭时不再要求思考力度），该 Bot 的对话里不再留有固定值
  - id: AC-5
    given: 打开某个 Bot 的设置页
    when: 查看模型固定旁边的思考力度选择
    then: 可以选「跟随全局」（带出当前全局档位）或关闭、低、中、高，界面显示当前实际生效的档位，中英文文案都齐全
  - id: AC-6
    given: 全局思考力度行为设置已经存在
    when: 不给任何 Bot 固定思考力度并保存全局档位
    then: 全局设置卡的保存、读取与下一轮生效行为与之前完全一样，没有回归
  - id: AC-7
    given: 全局思考力度是高，某只 Bot 固定为关闭（例如它固定的模型不支持思考力度）
    when: 在这只 Bot 的对话里发起下一轮
    then: 这一轮请求不带思考力度；其他没有固定的对话仍按全局的高
  - id: AC-8
    given: 某只 Bot 固定了思考力度
    when: 它派出子代理或队友
    then: 子代理和队友沿用这只 Bot 的固定档位；没有固定的 Bot 派出的子会话不带固定值
