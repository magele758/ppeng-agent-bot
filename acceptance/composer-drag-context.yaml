id: composer-drag-context
title: 消息框拖入文件和文件夹作为上下文
status: retired
retiredReason: 用户已批准整体移除消息框拖拽功能，保留加号附件和历史上下文；由 composer-drop-retirement-soak-isolation 替代入口行为验收。
requirement: |
  我需要新增一个输入框支持拖拽文件、文件夹作为上下文的信息源的能力，无论是对话或者bot模式，帮我加好
notes: |
  覆盖三处发消息的输入框：「对话」页、「Bot」页里单个 Bot 的对话、「Bot」页里的群聊。
  「对话」页和单个 Bot 对话里，现有的加号选择本地文件、图片或附件地址仍然可用；本标准只增加拖入文件和文件夹。
  拖入后待发送项以文件名或文件夹名展示。群聊输入框目前没有加号附件。
  证明「已交给对方」时用文本文件里的原句；不要求当前模型看懂图片。
criteria:
  - id: AC-1
    given: 分别打开「对话」页的消息框、Bot 页里某个 Bot 的消息框、以及 Bot 页里某个群聊的消息框，框里可以已有还没发送的文字
    when: 把一个或多个文件拖进其中任意一处消息框
    then: 没发送的文字还在；能看到每个文件的文件名，并且可以单独拿掉。拿掉后再发送，发出的消息里不再包含被拿掉的文件
  - id: AC-2
    given: 上述三处消息框都可以使用
    when: 把一个文件夹拖进其中任意一处
    then: 能看到这个文件夹的名称，并且可以拿掉。拿掉后再发送，发出的消息里不再包含这个文件夹
  - id: AC-3
    given: 在「对话」页拖入一个写有独特句子的文本文件，以及一个里面放着文本文件的文件夹，并且都没有拿掉
    when: 写一句话并发送
    then: 这条用户消息带着这些文件名和文件夹名出现在当前对话里，刷新后重新打开仍然在。助手能用到该文件里的原句，也能用到文件夹中那个文件里的原句；这些内容不是只停在发送前的输入框上
  - id: AC-4
    given: Bot 页打开的是某个 Bot 的对话，不是另一个 Bot，也不是一条普通对话；已拖入文本文件和内含文本文件的文件夹且没有拿掉
    when: 写一句话并发送
    then: 文件名和文件夹名出现在这个 Bot 的这条消息上，刷新后仍在；这个 Bot 能用到其中的原句。另一 Bot 的对话和普通对话里不会凭空多出这条带上下文的消息
  - id: AC-5
    given: Bot 页打开的是某个群聊；已拖入文本文件和内含文本文件的文件夹且没有拿掉
    when: 在群聊消息框写一句话并发送
    then: 群聊记录里这条消息带着这些文件名和文件夹名，刷新后仍在，群成员能用到其中的原句。这条消息不会因此写进成员 Bot 的私人对话
  - id: AC-6
    given: 上述三处消息框里已有还没发送的文字
    when: 拖入一段选中的文字、一个网页链接，或一次没有文件也没有文件夹的拖放
    then: 草稿还在，不会多出空的或没有名称的上下文，消息框之后仍能继续输入并发送
  - id: AC-7
    given: 界面语言分别是中文和英文
    when: 拖入文件或文件夹，查看已选上下文和拿掉操作上的文字
    then: 这些文字与当前界面语言一致，不会夹着另一种语言的固定句子
