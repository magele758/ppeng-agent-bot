id: ci-gate-speedup
title: CI门禁去重与并行提速（保持现有验证范围）
status: retired
retiredReason: 用户确认由ci-fast-and-bihourly-gates替代触发频率与合并条件；原9条及历史记录保留，性能对比未验收。
requirement: |
  哪些是必须要跑的，哪些是可以统一批量跑的？看看门禁是不是可以提提速
notes: |
  本阶段仅消除同次候选验证的重复开销、重复触发与不必要串行等待。
  不将当前必需检查移至夜间，不修改已有标准、测试阈值、变异基线或flaky判定。
  按改动影响范围裁剪检查与多PR批量集成作为后续独立确认范围。
criteria:
  - id: AC-1
    given: 同一PR的同一版本因提交和PR更新产生多个验证事件
    when: 系统安排昂贵的完整验证
    then: 不重复启动等价的完整验证，PR仍能得到该版本完整、可追踪的检查结果；主分支集成与手动验证仍可执行
  - id: AC-2
    given: 一次候选验证中的多个检查需要相同的实际探查结果
    when: 探查已经完成且验证输入完全匹配
    then: 各项检查可核对并复用该次完整证据，所有原有场景、规定的重复性验证和反向控制均保留，没有只因重复调用而再次执行整套探查
  - id: AC-3
    given: 已有探查证据缺失、损坏、不完整、失败，或验证所依赖的输入发生变化
    when: 其他检查尝试使用该证据
    then: 系统拒绝将其当作通过依据，明确指出原因，重新验证成功前不能合入
  - id: AC-4
    given: 互不依赖的测试可以同时执行
    when: 系统运行这些测试
    then: 它们在受控并发下尽早执行且相互隔离，不争用数据、端口、证据文件或被变异的源码，浏览器失败无需等所有长探查结束才暴露
  - id: AC-5
    given: 同一批测试需要提供功能判定与覆盖率结果
    when: 系统汇总执行结果
    then: 尽可能由一次实际执行提供两类证据，明确要求不同运行条件的验证仍单独保留，原覆盖率和复杂度阈值不降低
  - id: AC-6
    given: 当前所有已批准的软件标准及现有门禁适用于候选版本
    when: 优化后的门禁决定能否合入
    then: 仍要求全部适用标准的真实通过结果、完整变异和原有安全与状态验证；失败、未获准flaky、超时或不完整均阻断，不靠删除标准、扩大豁免或只检查测试标题放行
  - id: AC-7
    given: PR有更新版本，旧版检查正在排队或运行
    when: 系统终止被替代的验证
    then: 旧版结果和已消耗资源记录保留，旧版收尾不持续阻塞新版，新版仍须独立满足全部必需检查
  - id: AC-8
    given: 任一必需门禁失败，包括变异或验收汇总
    when: 尝试正常合入PR
    then: 分支保护与门禁汇总结论一致并阻止合入，不因漏配置某个检查而放行
  - id: AC-9
    given: 新旧方案在可比代码、运行条件及验证范围下各有至少三次完整运行
    when: 评估提速效果
    then: 分别提供排队耗时、执行墙钟、总计算用量和首次通过率；执行耗时中位数至少降低30%，若未达到或出现验证范围丢失则不得宣称提速验收通过
