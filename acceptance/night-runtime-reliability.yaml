id: night-runtime-reliability
title: 夜间运行可靠性修复
status: implemented
requirement: |
  最新一版很多问题：
  1、输出死循环次数增多
  2、经常定时任务不回复
  3、实时对话流输出有重复，又消失
  你好好查一下今天晚上的运行日志，看看还有什么问题，深度挖掘一下，然后解决一下
notes: 'assumedApproval: standing-order-2026-10-22'
criteria:
  - id: AC-1
    given: 长期会话上一项请求加载过受限技能
    when: 新的普通请求开始，或同一请求在重启后恢复
    then: 新请求不继承上一项请求的技能限制，同一请求恢复仍保留限制，转向消息不解除限制
  - id: AC-2
    given: 一次回复包含多轮正文、思考和工具调用
    when: 历史刷新与实时输出交错到达，且新一轮出现相同文字
    then: 每条已保存消息只显示一次，新一轮尚未保存的内容持续可见，失败尝试可回退而不删除已保存内容
  - id: AC-3
    given: 定时资料采集的某个目标已删除或更新失败
    when: 采集器向多个独立任务更新资料
    then: 记录该目标的失败并继续更新其他目标，单个目标故障不会让后续任务一直使用旧资料
  - id: AC-4
    given: 长期会话里留着一份更早的技能限制，但没有记下它属于哪一次请求
    when: 一条新的普通请求第一次开始
    then: 这次请求不再受那份旧限制，原先被挡住的工具可以继续使用
  - id: AC-5
    given: 会话正在回复上一项已经加载受限技能的请求
    when: 这条回复还没结束，用户又发来一条新的普通请求
    then: 新请求不再受上一项请求的技能限制；这段回复里如果只收到转向或备注，原有限制仍在
  - id: AC-6
    given: 同一轮里前一段正文已经保存，但对话记录里还没有这条消息
    when: 下一段实时输出的正文和它完全相同
    then: 记录出现之前这段文字只显示一次；记录出现之后，尚未保存的新一段仍然可见
  - id: AC-7
    given: 本轮已经保存过一段正文，实时片段上没有保存身份
    when: 流里先回放这段已保存正文，后面又出现一段文字相同、尚未保存的新内容
    then: 已保存的那份只占一次显示，尚未保存的新内容仍然可见
  - id: AC-8
    given: 下一段正文已经接在尚未标记保存的上一段后面，随后上一段才保存成功
    when: 保存完成，或其后的失败尝试被回退
    then: 已保存的正文还在，尚未保存的新正文也还在，回退不会删掉已保存内容
