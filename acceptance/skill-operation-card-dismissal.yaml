id: skill-operation-card-dismissal
title: 技能管理结果可收起关闭且不干扰对话
status: implemented
requirement: |
  这个也没有关闭窗口，一直占着对话流，没办法关闭，先修复这个，然后看看其他的组件、或者对话流有没有类似的问题
  这个也是
  还有这个
  这个也是一样的问题
  这个也没有
notes: |
  用户标注的沉淀、更新、共享、删除均为技能管理操作卡片，和已支持关闭的技能沉淀提示是不同入口。
  同类检查范围是对话区附加提示和操作结果；不把聊天正文或仍需用户处理的审批直接隐藏。
  关闭只改变展示，不执行或撤销技能操作。新需求先确认验收标准再写失败测试与实现。
criteria:
  - id: AC-1
    given: 对话中有已完成的技能沉淀、更新、共享、取消共享、共享范围修改或删除记录，包括以前留下的记录
    when: 用户打开对话或操作刚刚完成
    then: 结果默认紧凑显示名称、操作类型和状态，并提供查看详情、收起和关闭入口，不展开长篇内容占据对话
  - id: AC-2
    given: 用户正在查看一条已完成的技能管理结果
    when: 用户关闭结果提示
    then: 该卡片从对话区移除；技能内容、版本、共享范围和删除结果不变，不产生额外确认、拒绝、撤销或重复执行
  - id: AC-3
    given: 用户关闭了一条已完成的结果提示
    when: 数据自动刷新、页面刷新或在同一浏览器离开后重新打开该会话
    then: 该提示保持关闭；其他会话和后来新增的操作提示不受影响
  - id: AC-4
    given: 同一对话中还有待确认、处理中或失败的技能操作，以及待审工具操作
    when: 用户关闭或收起其他已完成提示
    then: 未完成事项仍可找到并处理，保留确认入口、处理状态或错误信息，不被误确认、误拒绝或误报成功
  - id: AC-5
    given: 用户在桌面或窄屏对话中通过鼠标或键盘操作结果卡片
    when: 用户展开、收起或关闭卡片
    then: 按钮含义明确且可操作，长内容不撑破布局，关闭后不会残留空白遮挡或跳到无关历史位置，用户能继续阅读和输入
  - id: AC-6
    given: 对话中同时出现技能管理结果、技能沉淀提示和首次任务引导
    when: 用户分别关闭已完成提示或不再需要的引导，并刷新或切换会话
    then: 各入口遵守各自已确认的关闭规则，不因轮询或切换重新弹出已关闭内容；聊天正文和仍待处理的审批保持可见
  - id: AC-7
    given: 技能沉淀或技能管理建议已被拒绝
    when: 用户查看或关闭这条提示
    then: 默认紧凑显示名称和已拒绝状态，可展开详情并关闭；刷新后保持关闭，拒绝状态不变
  - id: AC-8
    given: 技能沉淀或技能管理操作失败且附有长篇错误信息
    when: 用户收起错误详情
    then: 长详情可以收起并再次展开，名称、失败状态和已有处理入口保持可见，不把失败当成成功隐藏
