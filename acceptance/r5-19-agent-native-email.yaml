# Agent Native Email Inbox (r5-19)

## Overview
Implements Agent-native email inbox with product-domain `local-part@agent.local` addressing.
Per-user maximum 1 claimed inbox. Supports email/received event routine binding with +tag addressing.
Product-domain inbound persists via AgentInboxPort (not only external HMAC relay).

