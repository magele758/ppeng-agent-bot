id: group-chat-sidebar-placement
title: 群聊可置顶并可拖入功能分组
status: implemented
requirement: |
  用户指着会话列表里的群聊块（div.play-group-block，组件 PlayBotGroupList），例如「Jarvis 开发群」，说群组也要能拖拽到各个功能分组里，或者置顶。

  现在 Bot 可以拖到「置顶」，拖出置顶区可取消置顶，也可以进「功能分组」（开发、日常、研究、生活这类）。群聊是单独一块，拖不进去。

  要做成：
  - 群聊可以拖进置顶，和 Bot 一样。拖出置顶区就取消置顶。
  - 群聊可以拖进现有的功能分组，也可以在分组之间移动。拖进某个分组后，不要再在顶部单独的群聊块里重复出现。
  - 没放进分组、也没置顶的群聊，仍出现在原来的群聊位置。
  - 沿用 Bot 已有的拖拽和持久化，不要另做一套只存在前端内存里的排序。刷新后还在。不要新增 RAW_AGENT_*。
  - 文案若要改「把 Bot 拖出此区域可取消置顶」这类只写 Bot 的句子，改成也包含群聊，走 i18n，zh/en 同一套 key。
  - 不要改群聊回复、成员、置顶 Bot 的原有行为。会话列表的收起按钮留着。
notes: |
  assumedApproval: standing-order-2026-10-22
  与 bot-pin-area AC-1 的「群聊不会出现在置顶区」冲突：改为只有被拖进置顶的群聊才出现在置顶区，未置顶的群聊仍不出现。
  置顶与 Bot 共用同一份置顶记录；功能分组与 Bot 共用同一份分组保存。群聊回复、成员和已置顶 Bot 的归属不变。
criteria:
  - id: AC-1
    given: 会话列表里有一个未置顶的群聊，置顶区里可以已经有 Bot
    when: 用户把这个群聊拖进置顶区
    then: 置顶区能看到该群聊的名字，已经置顶的 Bot 仍在，刷新后该群聊还在置顶区，且不再同时出现在顶部群聊块
  - id: AC-2
    given: 已经有功能分组，群聊当前不在该分组
    when: 用户把群聊拖进该分组，或从一个功能分组拖到另一个
    then: 群聊出现在目标分组中，刷新后仍在该分组，顶部群聊块不再重复出现它
  - id: AC-3
    given: 群聊已经在置顶区
    when: 用户把它拖出置顶区后刷新
    then: 置顶区不再有该群聊，它也不会自己回到置顶区；若拖进置顶前在某个功能分组，则回到该分组，否则回到顶部群聊块
  - id: AC-4
    given: 群聊已被置顶或放进功能分组
    when: 用户刷新页面
    then: 它仍在置顶区或该功能分组，而不是只留在当次打开的页面里
  - id: AC-5
    given: 一个群聊已放进功能分组或已置顶，另一个群聊既没进分组也没置顶
    when: 用户查看会话列表
    then: 已放入的群聊不在顶部群聊块重复出现，没放进分组也没置顶的群聊仍在原来的群聊位置
