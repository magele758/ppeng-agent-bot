id: bot-goals-panel-threshold
title: 目标与进展少于两个目标时不展示
status: implemented
requirement: |
  这个少于2个goal的时候不要展示
notes: |
  以这个 Bot 当前列出的目标条数为准，进行中、已完成、失败、取消都计入。
  0 条或 1 条不展示「目标与进展」；2 条及以上才展示，原有多目标查看与操作不变。
  目标列表读失败时也不展示这块面板，避免在输入框上方只留下失败提示。
criteria:
  - id: AC-1
    given: 这个 Bot 当前列出的目标少于 2 个，包括一个都没有
    when: 打开、刷新或切换到它的对话
    then: 不展示「目标与进展」，输入框上方不出现目标选择或失败提示
  - id: AC-2
    given: 这个 Bot 当前列出的目标达到 2 个
    when: 打开它的对话
    then: 展示「目标与进展」，能看到这些目标并选择下一条消息关联的目标
  - id: AC-3
    given: 对话里本来没有这块面板
    when: 目标从少于 2 个变成 2 个，或从 2 个及以上变成少于 2 个
    then: 面板随之出现或消失，不需要刷新页面
