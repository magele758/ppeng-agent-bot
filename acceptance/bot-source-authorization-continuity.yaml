id: bot-source-authorization-continuity
title: Bot 已授权工作的来源连续性
status: implemented
requirement: 那就按v2计划开始改，先把日志里这些真实问题复现成测试，再逐项修好，验收通过后review、提交PR并合并，不要停下来等我确认。
notes: "assumedApproval:
  standing-order-2026-10-22；R1：复用保存的来源策略，增加完整工具参数的精确授权；保留审批、子任务缩权和跨用户隔离。"
criteria:
  - id: AC-1
    given: 用户已经为一件机器工作保存有效且未撤销的操作授权
    when: 同一范围的工作由单聊、定时任务、合法 Bot 委派或子任务接力
    then: 各入口按同一有效范围判断可执行性，不仅因消息入口变化反复要求相同授权
  - id: AC-2
    given: 任务来源是外部内容或另一只 Bot，且没有该工作的有效授权
    when: 它请求超出当前有效范围的机器、仓库或操作
    then: 操作被拒绝，提示词中的授权声明和其他 Bot 的放行不能扩大权限
  - id: AC-3
    given: 一个盯梢需要的检查操作未获授权
    when: 定时触发或尝试创建该盯梢
    then: 界面准确呈现缺失授权与处理入口，不把策略拒绝说成网络故障，也不连续用无变化掩盖未检查
  - id: AC-4
    given: 授权已被撤销，或工作目标及操作范围变化
    when: 下一阶段准备执行
    then: 系统重新校验有效范围，撤销生效，旧授权不覆盖新增范围
  - id: AC-5
    given: 监督 Bot 只需读取授权范围内的工作状态
    when: 它发起状态查询
    then: 可以取得相应只读状态与证据引用，不需要额外获得通用命令或他人私聊权限
  - id: AC-6
    given: 多个待处理来源进入同一 Bot 主会话
    when: 已有执行正在请求批准或准备继续
    then: 审批仍对应原工作和具体操作，不被后来排队的消息改写身份或授权范围
