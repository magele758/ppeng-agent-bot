id: bot-product-p0
title: Bot可靠工作与可验收交付闭环
status: implemented
requirement: |
  我觉得你说的非常好，P0到P2的功能，我都挺喜欢的，帮我都做了
notes: |
  承接本次纵向切片评估的P0；补充已有可靠消息、人工续跑、内联审批与软件执行标准，不替换或弱化它们。
  新界面支持中英文，设置经界面持久保存；沿用现有权限边界。
  发布仍须满足已有发布标准；本地软件测试通过不代表真实服务、长期浸泡或生产环境验收通过。
criteria:
  - id: AC-1
    given: 用户向忙碌的Bot提交任务
    when: 任务被接收且用户刷新页面
    then: 用户仍能看到已接收或排队的任务、排队数量及取消入口，同一次提交的重试不产生重复工作
  - id: AC-2
    given: 同一任务经历排队、执行、等待用户、受阻、待核对和完成
    when: 用户从聊天、Bot列表、活动栏或任务详情查看它
    then: 各入口对任务状态的表达一致，并显示当前步骤或阻塞原因，执行结束但目标未完成时不显示为已完成
  - id: AC-3
    given: 用户正在查看任务进展
    when: 与服务的连接中断并随后恢复
    then: 界面提示状态暂不可确认及上次更新时间，不把失联显示为空闲或完成，恢复后自动显示最新状态
  - id: AC-4
    given: 一个或多个Bot有等待用户处理的工作
    when: 用户打开待处理入口或任务中的审批卡
    then: 用户能定位来源任务并看到操作目的、影响对象及实际待发送内容或配置变更，批准或拒绝后各入口同步更新
  - id: AC-5
    given: 任务因授权失效或外部操作结果未知而暂停
    when: 用户查看恢复入口
    then: 授权失效可重新连接后继续，结果未知可查看操作记录并登记核对结论，未核对前不会自动重放可能已生效的操作
  - id: AC-6
    given: 用户的任务产出报告、文件、代码或外部操作结果
    when: 查看交付
    then: 报告可读且有可用来源，文件或代码可预览和下载，外部操作展示真实回执，各类交付均可追溯来源任务且不会捏造缺失的来源或回执
  - id: AC-7
    given: 一项任务结束且部分工作失败或尚未验证
    when: 用户查看结果
    then: 已完成部分与未完成部分分别列出，系统区分Bot声明、执行回执与实际验证，并保留已有成果及继续处理入口
  - id: AC-8
    given: 用户在执行过程中补充要求或停止任务
    when: 操作被接收
    then: 界面明确补充要求何时处理或停止是否已生效，已发生的外部操作不会被描述为已撤销，刷新后仍能查看该操作结果
