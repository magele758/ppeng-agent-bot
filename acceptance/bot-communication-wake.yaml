id: bot-communication-wake
title: "Bot 按需唤醒与结果通知合并"
status: draft
requirement: |
  那先帮我制订一个详细的改造和提升的开发计划
notes: "用户明确要求先制定计划，本轮仅为 P3 编写验收草稿，不代表实施或验收通过。方案见 doc/BOT_COMMUNICATION_UPGRADE_PLAN.md。实施该阶段时按 acceptance-first 改 approved 并加入 standing-order notes，逐条写失败测试再实现；既有标准保持有效。"
criteria:
  - id: AC-1
    given: "一条消息只报告普通进度或接收回执且无需继续决策"
    when: "消息到达"
    then: "工作状态可查询，不为该消息额外启动模型回复"
  - id: AC-2
    given: "一项工作明确等待三个子任务且它们在同一合并窗口内完成"
    when: "三个结果依次返回"
    then: "三个结果均被保留和结算，父 Bot 只被唤醒一次进行汇总或继续工作"
  - id: AC-3
    given: "同一目标的一批结果处于合并窗口内"
    when: "出现失败、待批准或结果不明等需要人处理的情况"
    then: "用户能立即看到该情况，不必等普通进度合并结束"
  - id: AC-4
    given: "多个目标在同一 Bot 下运行"
    when: "它们同时产生结果"
    then: "各目标分别保留结果与摘要，不把不同目标的证据合并成一件工作"
  - id: AC-5
    given: "普通进度不断到达，或服务在合并窗口期间重启"
    when: "达到最长等待时间或服务恢复"
    then: "通知按持久化计划送达，不被新进度无限推迟，也不因重启丢失或重复刷屏"
  - id: AC-6
    given: "Bot 向群发布报告"
    when: "仅发布报告，或者用户明确要求群成员讨论"
    then: "仅发布时不自动唤醒成员；明确要求讨论时按群回复模式处理"
  - id: AC-7
    given: "用户已配置定时任务的静默、变化通知或发布审批"
    when: "统一通知策略处理该任务结果"
    then: "原设置继续生效，未批准的报告不因合并或重启被发布"
