id: bot-routine-main-session
title: Bot 定时任务跟自己的会话走
status: implemented
requirement: |
  bot 的定时任务怎么还是通过新建会话来执行的？而且权限也没继承？我不是说要 bot 的定时任务是跟着 bot 的会话一起走的吗？
notes: |
  不改 bot-routine-lifecycle 里已写明「独立工作对话」的条款。那几条仍由非 Bot 定时任务的测试覆盖。本标准只约束挂在 Bot 主会话上的定时任务。
criteria:
  - id: AC-1
    given: 一只 Bot 已有自己的主会话，并且名下有一条定时任务
    when: 这条定时任务到点
    then: 任务出现在这只 Bot 的主会话里执行，不会再开一条标题像 Routine 的新会话
  - id: AC-2
    given: 这只 Bot 的主会话已被设成执行命令时不再向人要批准
    when: 它名下的定时任务到点并要执行一条在该主会话里会直接执行的命令
    then: 命令按主会话的设定直接执行，不会被改成每次都要人批准
  - id: AC-3
    given: 这只 Bot 的主会话仍是每次操作都要人批准
    when: 它名下的定时任务到点并要执行命令
    then: 这次执行仍然要人批准，批准规则与主会话相同
  - id: AC-4
    given: 一条定时任务没有挂在任何 Bot 的主会话上
    when: 它到点
    then: 仍会另开一条工作会话来执行，不占用某只 Bot 的主会话
  - id: AC-5
    given: 这只 Bot 的主会话正在回复
    when: 它名下的定时任务到点
    then: 任务插进这只 Bot 当前会话的插话队列，不另开会话；插话进入对话的位置仍按现有插话规则
  - id: AC-6
    given: 这只 Bot 名下的定时任务已经从列表里删除，但还有一次尚未开始的排队
    when: 调度再次醒来
    then: 不会为这次已删除的任务开新会话，也不会在主会话里把它跑起来
