id: bot-goals-panel-rules
title: 目标与进展只展示同时在做的多件事
status: implemented
requirement: |
  “目标与进展 (3) 下一条消息关联的目标 自动判断 现在ppeng-agent-core又加了很多提交，特别是bot room这一块，看看新增的特性有什么可以搬”: 这个goal的逻辑要调整一下
  1、为什么会有阻塞？这几个内容应该是我还在询问和讨论，是否不该直接定目标？
  2、已完成的就从这里显示里去掉
  3、如果少于2个目标就不要展示目标和进展，这个是给一个会话中有多个主题同时在干准备的
notes: |
  还在询问、商量、让对方先复述规则或先确认还记不记得的话，现在会被收成一条必须做完的目标。只有寒暄、询问进度、明确的暂停/继续/取消，以及少数一上来就在提问或句末带问号的话，才不当成新目标；其余默认当成要交付的工作。语义判断若没有给出可接受的结果，也沿用这个默认。截图里「可以都加一下，你先复述开发规则，我先看看你还记得不」和「看看新增特性有什么可以搬」都属于还在问，不是已经说清要做完的事。
  一旦被收成目标，就要执行并核对是否做完。核对失败、执行被打断、拿不出可核对的完成证据，或几轮都没有实质进展，这条就会变成「已阻塞」，操作显示为「恢复」（「已暂停」也是恢复）。截图里已完成卡片上方露出的「恢复」，就是还没结束的那几条里处于已阻塞或已暂停。那条复述规则后来显示「已完成」，是因为回复被当成了做完的证据。两种结果都来自同一处误收。真正要做完的目标，做不下去时仍应标明已阻塞，本规格不取消这种阻塞。
  「还在进行」指排队中、执行中、等待中、已阻塞、已暂停。已完成、失败、已取消都不是还在进行：不出现在「目标与进展」里，也不计入标题数字，也不计入是否展示。标题数字今天已经不含已完成，但列表仍画出已完成；是否展示则把已完成、失败、已取消也算进条数，所以旧的已完成会把这块面板撑出来。
  本规格覆盖已实现的 bot-goals-panel-threshold：该规格按「当前列出的全部目标」计数，进行中、已完成、失败、取消都算，满 2 条就展示。也覆盖 low-interference-onboarding-goals 的 AC-3、AC-4 及其说明里「按面板原本展示的目标集合计数、不改筛选」。批准后，是否展示和列表内容以本规格的「还在进行」为准。不修改这两份文件，也不改它们的状态。列表读失败时仍不展示这块面板，沿用 bot-goals-panel-threshold 的已有行为。
  不改写 bot-multi-goal-coordination。其 AC-1 的「另一个明确独立的任务」仍然成为目标，对应本规格 AC-3。其 AC-2 的进度询问仍然不新增目标。其 AC-6、AC-7、AC-13 对真正的目标仍可报告阻塞。用户点名的那两句询问不视为 AC-1 的明确任务。
  不替代 bot-room-goal-intake。那份管的是群里正在做事时的插话，本规格管的是单个 Bot 对话底部的「目标与进展」。
  不修改 bot-fork-sessions-in-detail、goal-update-presentation。
criteria:
  - id: AC-1
    given: 用户正在和这个 Bot 对话，话里还在询问、商量，或让对方先复述规则、先确认还记不记得，没有说清要做完什么
    when: 用户发出这类话，例如「这个功能可以给ai-agent-node和ppeng-agent-core都加一下，2个应该都没有，你跟我复述一下ai-agent-node和ppeng-agent-core的开发规则先，我先看看你还记得不」，或「现在ppeng-agent-core又加了很多提交，特别是bot room这一块，看看新增的特性有什么可以搬」
    then: 这场对话的「目标与进展」里不会多出以这些话为内容的目标
  - id: AC-2
    given: 用户发出的仍是还在询问、商量或先复述确认的话，没有说清要做完什么
    when: 这句话被收下
    then: 不会因此多出一条「已阻塞」的目标，也不会因此让这场对话里已有的目标变成「已阻塞」
  - id: AC-3
    given: 用户在同一场对话里明确要同时做完几件独立的事
    when: 用户把每件事要完成的结果说清楚
    then: 每件事各留下一条还在进行的目标，这些目标都不被取消，也不被标成已完成
  - id: AC-4
    given: 这场对话里至少还有 2 个还在进行的目标，并且另有目标已经是「已完成」
    when: 展开「目标与进展」
    then: 列表里看不到已完成的目标，标题括号里的数字只等于还在进行的条数
  - id: AC-5
    given: 这场对话里还在进行的目标少于 2 个，包括一个都没有；旁边可以还有已完成、失败或已取消的旧目标
    when: 打开、刷新或停留在这场对话
    then: 不展示「目标与进展」
  - id: AC-6
    given: 这场对话里还在进行的目标达到 2 个或更多
    when: 打开这场对话
    then: 展示「目标与进展」，列表里只有这些还在进行的目标，标题括号里的数字与这个条数一致
  - id: AC-7
    given: 「目标与进展」是否出现，只按还在进行的目标条数决定
    when: 还在进行的目标从少于 2 个变成 2 个及以上，或从 2 个及以上变成少于 2 个
    then: 这块面板随之出现或消失，不用刷新页面
  - id: AC-8
    given: 同一个 Bot 的另一场对话里已经有目标
    when: 打开当前这场对话
    then: 另一场对话的目标不会出现在当前这场的「目标与进展」里
