id: bot-room-wave-dispatch
title: 群发言并行与停止拦截
status: implemented
owner: user
requirement: |
  并行波次可以紧随其后。未点名由 bot-room-speaker-pick 按贴题程度稀疏选人，不是全员轮流，也不是群主点名。
  覆盖：并行波次、一人一轮一次公开发言、停止后旧回复不入群。
criteria:
  - id: AC-1
    given: 群主已经选出多名成员同时处理同一条用户消息
    when: 他们完成的时间不同
    then: 先完成的先出现在群里。未点名的大群仍然不会把没被选中的成员都叫起来
  - id: AC-2
    given: 一名成员这一轮已经在群里发表过可见回复
    when: 同一轮里再次要求他公开发言
    then: 他不会再发第二条公开回复。群主可以在其他人说完后做一次收尾总结
  - id: AC-3
    given: 有成员正在准备回复
    when: 用户停止这个群，或明确取消当前这轮
    then: 尚未出现在群里的回复不再出现。已经发生、无法确认是否完成的外部动作显示为待核对
  - id: AC-4
    given: 多名成员同时在处理
    when: 其中一位失败或被转到私聊处理
    then: 其他成员已经发到群里的回复还在，这一轮不因此整轮失败
  - id: AC-5
    given: 群主给出的名单里有不是成员的对象，或人数超过本轮上限
    when: 这一轮开始发言
    then: 只有合格且不超过上限的成员发言，群里说明被去掉的原因
  - id: AC-6
    given: 短时间内群里的成员回复已经达到用户保存的每分钟上限
    when: 还要继续安排新的成员发言
    then: 继续安排会暂停，并说明何时恢复。用户仍然可以发消息。群不会变成必须手动点继续才能恢复的停止状态
  - id: AC-7
    given: 用户没有打开短回复过滤
    when: 成员只用很短的话作出实质回答，例如「是」或「已完成」
    then: 这句话仍出现在群里
notes: |
  依赖 bot-room-sparse-routing 已批准并实现。本规格不把未点名改回全员轮流。
  不替代 bot-rooms AC-4、AC-5。AC-4 的停止、暂停、移出成员和终止原因仍然有效。AC-5 的「不并发执行同一上下文」仍然有效：同时发言的是不同成员；同一成员的同一次群上下文不并行跑两次。停止后无法确认的外部动作沿用 AC-5 的待核对。
  用户于 2026-10-21 确认。bot-rooms AC-2 里被本规格替代的「按出现顺序发言」已改写。整份 bot-rooms 不标为 retired。AC-3、AC-7、AC-8 不在本规格改写范围内。
  2026-10-22：未点名不再写「群主选人」，改由 bot-room-speaker-pick 按贴题程度决定。AC-1 的「没被选中的成员不会都被叫起来」仍然有效。本规格不 retired。
