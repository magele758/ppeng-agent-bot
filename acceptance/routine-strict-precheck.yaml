id: routine-strict-precheck
title: 严格例行预检与持久游标
status: implemented
requirement: |
  先按你建议的顺序推进第一批：记忆删除抑制、严格预检、定时任务故障治理。按仓库的验收优先流程，先写验收标准给我确认。
notes: |
  新增严格模式，不修改 routine-precheck-fail-closed 的已实现条款；旧任务继续兼容，新建带预检任务默认严格，可在 Lab 显式升级旧任务。严格结论沿用 wakeAgent 布尔字段；可携带 state 游标，最大 16 KiB。游标代表预检已观察进度，不代表模型工作或外部动作已完成。
criteria:
  - id: AC-1
    given: 用户新建带预检的例行任务，或已有一个兼容模式任务
    when: 用户保存新任务，或在 Lab 明确将旧任务升级为严格模式
    then: 新任务默认严格，未升级旧任务行为不变，所选模式保存后立即生效且重启后保留
  - id: AC-2
    given: 任务启用严格预检
    when: 预检正常退出且最后一个非空输出行为包含 wakeAgent 为布尔值 true 的合法 JSON 对象
    then: 任务进入正常执行流程，仍遵守既有审批与串行规则
  - id: AC-3
    given: 任务启用严格预检
    when: 预检正常退出且最后一个非空输出行为包含 wakeAgent 为布尔值 false 的合法 JSON 对象
    then: 不调用模型，运行记录显示无变化而非失败或成功
  - id: AC-4
    given: 任务启用严格预检
    when: 预检输出为空、末行不是合法结论、缺少 wakeAgent 或该字段不是布尔值
    then: 不调用模型，运行记录显示预检失败并说明原因
  - id: AC-5
    given: 任务启用严格预检
    when: 预检异常、超时或非正常退出，即使输出声称允许唤醒
    then: 不调用模型，运行记录显示预检失败，并继续保持预检无法获取守护进程密钥或访问公网的隔离
  - id: AC-6
    given: 严格预检正常完成并给出合法结论及未超限的新游标
    when: 下一次预检运行，包括服务重启之后
    then: 能读取上次成功保存的游标；未提供新游标时继续保留原游标
  - id: AC-7
    given: 严格预检已有上次保存的游标
    when: 本次预检失败、结论无效、游标超过 16 KiB 或无法保存新游标
    then: 旧游标保持不变，本次显示预检失败且不调用模型
  - id: AC-8
    given: 不同用户或不同任务各自保存了预检游标
    when: 执行预检或访问任务设置
    then: 只能使用和查看有权访问的对应任务游标，不会串用其他任务进度
