id: bot-goal-live-chain
title: Bot 默认配置完整执行与证据回流
status: implemented
requirement: |
  按优先级把这次实测发现的四个卡点完整修掉，补齐回归，再用真实模型跑通默认配置下的完整链路，不要靠手动绕行。审查和验收通过后提交 PR 合并，更新本地并重启服务。
notes: 'assumedApproval: standing-order-2026-10-22'
criteria:
  - id: AC-1
    given: 目标通过直接执行、子任务或指定 Bot 委托产出结果
    when: 目标继续执行并验收
    then: 验收读取同一目标版本的真实执行证据及委托记录，不混入其他用户、旧委托尝试、无关会话或撤回的证据
  - id: AC-2
    given: 用户提出一个包含步骤、核对和约束的交付任务
    when: 语义分类成功、失败或超时
    then: 保留完整任务及指代上下文；独立任务和明确的状态控制仍可分别处理
  - id: AC-3
    given: 默认渐进工具配置和一个已授权的目标执行
    when: 模型开始执行所选策略或搜索工具
    then: 必需的目标入口直接可用，带加号的工具名可搜索，且不扩大工具权限
  - id: AC-4
    given: 目标进入待核对、完成、阻塞或失败状态
    when: 状态通知发布或旧执行尝试写入进度
    then: 对话准确显示当前状态，不为通知重跑旧任务，不接受过期检查点，不吞掉新的用户任务
