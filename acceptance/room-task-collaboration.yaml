id: room-task-collaboration
title: 群聊临时负责人任务协作模式
status: implemented
requirement: |
  按你说的方向改吧，先把目标的两套状态和展示统一起来，完成或失败的保留历史但别一直挂底部，再把重复调用检测改成看有没有实际进展。Jev我已经恢复了，不用管了。群聊组织模式，可以按你说的再新增一种模式，我对比看看执行效果。

  分多个agent去推进
notes: 'assumedApproval: standing-order-2026-10-22'
criteria:
  - id: AC-1
    given: 群聊已有成员和两种回复模式
    when: 用户保存任务协作模式并发送消息
    then: 设置持久保存，下轮只先启动一位临时负责人，明确点名不触发未点名成员兜底
  - id: AC-2
    given: 任务协作模式负责人正在执行
    when: 按需邀请协作者
    then: 必须为每位协作者指定具体任务和交付证据，非负责人不能派发，群外成员不能加入
  - id: AC-3
    given: 负责人及协作者执行任务
    when: 协作者回复并结束本轮
    then: 共享记录保留负责人、任务、公开回复证据及执行状态，由负责人汇总且不自动唤醒无任务成员
