id: unlimited-bot-rounds
title: Bot 对话轮和执行轮默认不限
status: implemented
requirement: |
  怎么bot还有max_turn的限制，我是要无限轮的，你去掉类似的限制或者开关默认关闭，我要无限轮对话和执行轮的
notes: |
  assumedApproval: standing-order-2026-10-22
  群聊对话轮和目标执行轮的上限默认关闭。显式设成正数仍然会停下。工具次数和估算费用仍按默认上限执行，不因对话轮不限而关掉。
criteria:
  - id: AC-1
    given: 新建群聊，没有打开对话轮上限
    when: 成员连续发言超过旧默认的 8 轮
    then: 不因对话轮上限停下
  - id: AC-2
    given: 群聊显式把对话轮上限设成 2
    when: 发言达到 2
    then: 这一轮因上限停下
  - id: AC-3
    given: 没有打开目标执行轮上限，也没有设置 RAW_AGENT_GOAL_MAX_TURNS
    when: 目标已经自动继续超过旧默认的 25 轮
    then: 不因执行轮上限结束
