id: outbound-draft-edit-identity
title: 外发草稿可编辑预览，并显示将以哪个身份发送（Draft → Confirm → Send 之上）
status: implemented
requirement: |
  P1-B（接在 #307 之上）：用户在批准发送之前，可以修改待发草稿的预览文字，并清楚看到这条消息会以哪个身份发出。
  仍然必须由人确认才发送，不新增任何静默发送路径。不新增环境变量。
notes: 'assumedApproval: standing-order-2026-10-22; P1-B; final acceptance by lei pending'
criteria:
  - id: AC-1
    given: 一条待发送的外发草稿
    when: 登录的用户修改它的预览文字并保存
    then: 草稿显示修改后的文字、仍然是待发送状态，对外渠道什么都没有收到；原文保留可查
  - id: AC-2
    given: 一条已被用户修改过文字的草稿
    when: 用户批准并发送
    then: 渠道收到的正是修改后的文字，且只发一次
  - id: AC-3
    given: 用户看到的是旧版预览，草稿在此之后又被改过
    when: 用户按旧版预览批准发送
    then: 请求被拒绝（冲突），什么都不发出，草稿保持待发送，用户需要重新查看新版再批准
  - id: AC-4
    given: 草稿已经在发送中、已确认或已发出，或修改后的文字为空或超长
    when: 用户尝试修改
    then: 修改被拒绝，原草稿不变
  - id: AC-5
    given: 一条待发送草稿，它的渠道配置了凭据
    when: 用户查看草稿预览
    then: 预览里有身份栏，写明渠道类型、发送身份（如应用编号的脱敏形式、凭据所在的环境变量名或目标域名）和收件人；不出现密钥、令牌或完整 URL 路径；渠道缺失或凭据不全时标明「现在发不出去」
  - id: AC-6
    given: 没有登录会话的请求，包括带运维令牌的模型 Shell
    when: 请求修改草稿文字
    then: 请求被拒绝，草稿文字不变
  - id: AC-7
    given: Lab 收件箱里一条待发送草稿
    when: 用户点「编辑」改了文字但还没保存
    then: 「批准并发送」不可用，必须先保存或放弃修改；保存后仍要再点「批准并发送」才会发出，发送时带上用户看到的版本号
