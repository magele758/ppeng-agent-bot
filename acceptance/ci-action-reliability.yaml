id: ci-action-reliability
title: Actions 长短验证可靠性
status: implemented
requirement: 去修复一下这个项目的Action，看看怎么改造合适，现在长任务一直失败，短任务好像也没完全卡住bug
notes: |
  assumedApproval: standing-order-2026-10-22
  2026-10-27 用户要求云端去掉不稳定的浏览器 E2E。HTTP 失败仍然阻止通过。
criteria:
  - id: AC-1
    given: Bot 配置或目标回流出现回归
    when: 运行快速门禁
    then: 执行真实的 Bot 配置、目标回流和 HTTP 集成测试，失败阻止通过且仍遵守两分钟预算
  - id: AC-2
    given: 目标等待的团队或群体执行记录不存在
    when: 调度器检查等待状态
    then: 明确标记阻塞且不启动重复工作
  - id: AC-3
    given: 需要在任意修复分支验证完整候选
    when: PR 添加 full-validation 标签或更新带此标签的版本
    then: 完整验证可执行；未标记且未触及核心路径的 PR 不自动运行全量验证（核心路径见 AC-9）
  - id: AC-4
    given: HTTP 集成检查失败
    when: 完整验证继续收集结果
    then: HTTP 失败仍阻止通过，云端不再接着跑浏览器 E2E，也不能把这次 HTTP 失败记成通过
  - id: AC-5
    given: 云端浏览器套件不稳定，经常让整轮完整验证失败
    when: 运行云端完整验证
    then: 不跑浏览器 E2E，也不按分片执行它。浏览器用例仍留在仓库里，供本地执行
  - id: AC-6
    given: 完整变异测试包含多个独立模块
    when: 运行完整验证
    then: 各模块可独立执行和重试，汇总必须覆盖全部模块并遵守原基线，任一任务失败仍阻止通过
  - id: AC-7
    given: 长会话顶部仅露出上一条消息不足一像素的残余
    when: 用户收起侧栏改变消息宽度
    then: 保持当前可读消息的位置，短门禁覆盖此锚点选择回归
  - id: AC-8
    given: 新增菜单已因悬停而展开
    when: 用户点击新增按钮
    then: 菜单的透明区域不遮挡按钮，仍可正常进入新建会话
  - id: AC-9
    given: PR 改动触及核心路径（packages/core、agent-loop、capability-gateway、api-types、apps/daemon、formal、crap 及验证相关 CI 脚本与工作流）
    when: PR 打开或更新
    then: 无需标签即自动运行与 full-validation 标签相同的 Release gate；仅改文档、领域包、web-console、desktop 的 PR 仍跳过，已有标签的 PR 不论路径照常运行，Main full health 与 CRAP 阈值不变
