id: turn-stats-end-time
title: 对话轮次统计显示结束时间
status: implemented
notes: |
  assumedApproval: standing-order-2026-10-22
  结束时间加在每轮底下那条统计上，和执行耗时、输入、输出、费用同一行。会话还没结束时不显示。数据记在每轮结束时刻上：已结束的轮次显示该轮结束时刻，最后一轮用「会话结束」标出整段会话何时结束。
requirement: |
  我不是要求在这个地方，显示这个会话的结束时间吗？这里还没加上
criteria:
  - id: AC-1
    given: 一轮对话已经结束，底下统计里已有执行耗时、输入、输出和费用
    when: 查看这一轮底下的统计
    then: 执行耗时、输入、输出和费用仍在，并多出能读的本地结束时间
  - id: AC-2
    given: 会话还在进行，或还在等你处理，当前这一轮尚未结束
    when: 查看这一轮底下的统计
    then: 不出现结束时间
  - id: AC-3
    given: 同一会话有多轮，而且都已经结束
    when: 查看每一轮底下的统计
    then: 前面的轮次显示各自的结束时刻；最后一轮显示会话结束时刻，能看出整段会话何时结束
  - id: AC-4
    given: 这一轮没有可用的结束时刻
    when: 查看该轮统计
    then: 不显示结束时间
