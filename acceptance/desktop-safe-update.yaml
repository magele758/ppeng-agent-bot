id: desktop-safe-update
title: 客户端手动一键更新、备份与失败回滚
status: implemented
requirement: |
  那你帮我把一键更新做出来，更新前自动备份，保留我的正式数据，失败能回滚，由我点击更新才执行。
notes: |
  首期针对当前使用的 macOS Apple Silicon 客户端，更新到开发完成并验证过的本机版本。
  开发与自动化验证全部使用独立测试数据、测试工作目录和测试客户端，不操作正式环境。
  2026-10-21：AC-1 到 AC-10 的单测通过，标为 implemented。
criteria:
  - id: AC-1
    given: 用户有已准备好的客户端新版本
    when: 用户打开客户端更新入口
    then: 能看到当前版本、待更新版本及更新说明，并能点击“更新客户端”启动更新
  - id: AC-2
    given: 用户尚未点击“更新客户端”
    when: 开发完成、生成新版本或客户端启动
    then: 不自动备份、安装、迁移数据、停止或重启正式客户端
  - id: AC-3
    given: 客户端有正在执行的任务
    when: 用户点击“更新客户端”
    then: 提示等待任务结束后重试，保留当前任务运行且不开始更新
  - id: AC-4
    given: 客户端可以开始更新
    when: 用户点击“更新客户端”
    then: 在替换程序或改变正式数据之前，自动完成可恢复的一致性备份，涵盖旧版本程序、正式数据和必要配置，并显示备份位置
  - id: AC-5
    given: 更新包无效、不兼容、权限不足、空间不足或备份失败
    when: 用户尝试更新
    then: 更新停止并显示具体原因，旧版本和正式数据保持可用
  - id: AC-6
    given: 新版本有效且更新前备份成功
    when: 更新成功并重新打开客户端
    then: 原有 Bot、会话、消息、记忆、群聊、技能、附件、模型配置和工作目录绑定保留，开发测试数据不进入正式环境
  - id: AC-7
    given: 已开始替换程序或升级数据
    when: 安装、数据升级或新版本启动验证失败
    then: 自动恢复更新前的程序、数据和配置，显示失败原因与回滚结果，且不把失败更新报告为成功
  - id: AC-8
    given: 更新或回滚过程中应用异常退出或电脑重启
    when: 用户再次打开客户端或恢复入口
    then: 能识别未完成的更新并恢复到完整可用的版本；无法自动恢复时保留备份并提供明确的人工恢复指引
  - id: AC-9
    given: 更新或回滚正在进行
    when: 用户重复点击更新或再次启动客户端
    then: 不并行执行第二次更新，也不启动会读写正在迁移数据或重复执行定时任务的后端
  - id: AC-10
    given: 新版本尚未通过启动与数据可用性检查
    when: 更新流程验证新版本
    then: 不提前恢复正式定时任务或接受新任务，只有验证成功后才恢复正常使用并显示更新成功
