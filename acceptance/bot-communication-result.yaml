id: bot-communication-result
title: "Bot 执行结果统一回流与结算"
status: draft
requirement: |
  那先帮我制订一个详细的改造和提升的开发计划
notes: "用户明确要求先制定计划，本轮仅为 P2 编写验收草稿，不代表实施或验收通过。方案见 doc/BOT_COMMUNICATION_UPGRADE_PLAN.md。实施该阶段时按 acceptance-first 改 approved 并加入 standing-order notes，逐条写失败测试再实现；既有标准保持有效。"
criteria:
  - id: AC-1
    given: "一项目标交给子任务或另一只 Bot，接收 Bot 还可再开子任务"
    when: "下游执行返回证据和结果"
    then: "原目标收到对应证据并按实际结果收口，结果不只留在下游对话"
  - id: AC-2
    given: "一项工作返回了执行结束或成功措辞"
    when: "目标尚未通过既有完成核验"
    then: "用户看到执行结果但目标不会仅凭该措辞被标记完成"
  - id: AC-3
    given: "目标已经修改要求或开始新的尝试"
    when: "旧版本或旧尝试的结果迟到"
    then: "旧结果保留可查，但不会替新要求宣告完成或覆盖新尝试"
  - id: AC-4
    given: "目标已经取消"
    when: "先前执行的结果随后返回"
    then: "结果保留可查，目标仍为取消且不会自动启动后续工作"
  - id: AC-5
    given: "执行停在待批准，或外部操作结果不明"
    when: "用户批准、拒绝，或服务恢复"
    then: "待批准按用户决定继续原执行或收口，结果不明的操作在核对前不会自动重做"
  - id: AC-6
    given: "群协作或定时报告配置了群内发布，且有私聊过程或受限产物"
    when: "执行结算并准备发布，或群访问权限已经撤销"
    then: "内部结果保持可查；公开内容只含允许发布的摘要和产物，失去访问权时显示发布受阻且不换到无关会话"
