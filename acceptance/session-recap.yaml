id: session-recap
title: 会话末尾回顾
status: implemented
requirement: |
  我觉得像claude code的会话最后的recap挺好的，研究一下他的产品设计思路，以及他总计的内容是什么，以及他的产品逻辑，给当前项目也加上这个能力，来提升使用体验
notes: 'assumedApproval: standing-order-2026-10-22。2026-10-27 用户要求回顾调用模型，只写最近进展，不再把用户原话拼上文件数。AC-1 已按此改写。2026-10-27 用户要求给回顾加一个可配置的开关。AC-5 是整段开关，默认开；AC-4 的自动开关保持不变。2026-10-27 点过回顾后，新的一轮结束要刷新这行，不沿用点下去时的旧句。新增 AC-6。2026-10-28：Bot 正在回复时回顾不得再调用模型；客户端断开必须取消这次模型调用。新增 AC-7、AC-8。'
criteria:
  - id: AC-1
    given: 一场已经进行过的会话，最近几轮有具体进展
    when: 回到这场会话
    then: 输入框上方出现一行回顾。这行由模型根据最近几轮写成，说出刚刚做到哪了，不是把用户原话拼成「回顾：你在…」再附上改了几个文件。整行不超过 400 字，而且不会变成一条新的对话。模型没写成时说明这次没回顾成，不会拿原话去补
  - id: AC-2
    given: 自动回顾开着
    when: 会话还不满三轮，或者同一段进展已经回顾过又回来，或者人还在打未发送的字，或者这轮还在生成
    then: 输入框上方不会自动再冒出一行回顾
  - id: AC-3
    given: 会话里至少有一轮已经结束的对话
    when: 人发送整句 /recap 或 /回顾，或点回顾
    then: 马上在输入框上方看到同样的一行回顾，这句话本身不会发给助手；没离开过也可以
  - id: AC-4
    given: 设置里把自动回顾关掉并保存
    when: 离开后再回到一场已经够三轮的会话，或重新打开设置
    then: 不会自动出现回顾；当场回顾仍然可以用；开关保持关闭。从未保存过时自动回顾是开的
  - id: AC-5
    given: 设置里把会话回顾整段关掉并保存
    when: 回到一场已经进行过的会话，或发送整句 /recap 或 /回顾
    then: 输入框上方不出现回顾，也不会再让模型写这一行；这句话会当作普通消息发给助手。重新打开设置时整段开关仍是关的，自动回顾保持关掉前的选择。从未保存过时会话回顾是开的
  - id: AC-6
    given: 用户点过回顾，输入框上方正显示当时那一行
    when: 随后又有一轮新的对话结束
    then: 这行换成根据新进展写成的回顾，不再停在点下去时的那句；这轮还在生成时不把没写完的回复算进去；收起之后不会因为新消息自己弹回来；同一段进展不会再要一次
  - id: AC-7
    given: 这场会话里 Bot 正在回复
    when: 打开会话并请求这一行回顾
    then: 不再调用模型写回顾；若已有保存的回顾就原样返回，没有就返回空文本，并且不会把回顾写进对话消息
  - id: AC-8
    given: 回顾正在调用模型
    when: 客户端断开或取消这次请求
    then: 传给模型的调用一起取消，不会只等到固定超时才停
