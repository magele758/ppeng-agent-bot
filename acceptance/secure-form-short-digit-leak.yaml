id: secure-form-short-digit-leak
title: 短数字验证码不因编号或时间被误判为泄露
status: implemented
notes: 'assumedApproval: standing-order-2026-10-22'
requirement: |
  修复安全表单回执检查把短数字秘密误判成泄露的问题。
  短数字秘密不能因为嵌在 id 或时间戳里就判泄露；真正作为独立值出现仍要拒绝。
  卡号 4111111111111111 和更长密码仍必须被拒绝。
  不要把该测试加进已知抖动名单，不要放宽验收标准，不要删测试。
criteria:
  - id: AC-1
    given: 用户提交的验证码是三位数字，回执里的表单编号或时间碰巧含有同样的连续数字
    when: 服务端决定这份回执能不能交回去
    then: 不把这种情况当成明文泄露，提交可以成功
  - id: AC-2
    given: 回执或对话文本把短数字验证码写成独立的值（带引号的字符串、不带引号的数字，或句子里单独出现的数字）
    when: 服务端检查这份文本
    then: 判定为泄露并拒绝把回执交出去
  - id: AC-3
    given: 用户提交的是银行卡号 4111111111111111，或一串更长的密码
    when: 回执文本里出现这串明文，哪怕它嵌在别的文字中间
    then: 判定为泄露并拒绝把回执交出去
