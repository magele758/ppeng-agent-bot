id: bot-group-members-off-canvas
title: 群成员管理离开主聊天区，收进群聊设置
status: draft
requirement: |
  这些东西放到群聊设置里，或者专门搞个群聊成员列表都行。
owner: user
notes: |
  落点用已有的「群聊设置」，不另做成员列表页。群聊标题栏已有这个入口，默认关着；打开后已有改名、暂停/恢复，以及一套较简的成员增减。
  现在挡在对话正文上的是一整块成员区：左侧「群聊」标记、成员卡（头像、名字、移出；仅专属模型不同时有一行模型名）、「加入 Bot」和「加入」、折叠的「群聊共享信息」。用户说的「这些东西」指这一整块。
  共享信息是给这个群准备的上下文，但折叠在同一块里。它跟随成员区离开主聊天区，避免主区还留着这块大面板。成员这次没回复成功的短提示留在对话旁边，那是这一轮对话的结果，不是成员管理。
  标题栏上的群名、前往全局默认模型设置的短入口，以及「群聊设置」留在主区。不再把全局默认模型路径和优先级说明留在主区。普通单 Bot 对话和非群聊会话不在范围内。
criteria:
  - id: AC-1
    given: 打开一个已有多名成员的群聊，群聊设置还关着
    when: 看标题栏下方、输入框上方的主聊天区
    then: 这里直接是这段群聊的对话记录。看不到「群聊」成员标记、成员卡、职责文案、每个成员的模型行、「移出」、「加入 Bot」、「加入」，也看不到「群聊共享信息」
  - id: AC-2
    given: 同一个群聊
    when: 点开标题栏上的「群聊设置」
    then: 当前成员都在这里。每个成员能看到头像和名字；不铺职责、系统提示或 persona 长文。只有专属模型与全局默认不同时才有一行模型名。可以移出成员，也可以从还没进群的 Bot 里选一只再加入。群聊共享信息也在这里，默认收着，展开后能看、能改、能保存。主聊天区不再另外铺着一套同样的成员区
  - id: AC-3
    given: 群聊设置正开着
    when: 关掉群聊设置
    then: 回到这个群的对话。对话记录还在，成员管理和群聊共享信息不再挡在对话上面
  - id: AC-4
    given: 群里至少有三只 Bot
    when: 在群聊设置里移出其中一只
    then: 名单里不再有它，之后也不能在这个群的输入里用 @ 点到它。只剩两只时不能再移到只剩一只，并看到至少保留两只的说明
  - id: AC-5
    given: 还有一只没在这个群里的 Bot
    when: 在群聊设置里选中它并加入
    then: 它出现在成员名单里，之后可以在这个群里用 @ 点到。已经在群里的 Bot 不会再出现在可加入的名单里，也不能重复加入
  - id: AC-6
    given: 在群聊设置里展开群聊共享信息
    when: 填写一条信息并保存，然后关掉再打开
    then: 能看到已保存的提示，再次打开仍是这条。这条只属于当前群聊
  - id: AC-7
    given: 这个群最近一轮有成员没回复成功，群聊设置关着
    when: 看主聊天区
    then: 对话旁边仍能看到这次没回复成功的提示，不用先打开群聊设置。成员加入或移出没成功的提示出现在群聊设置里的操作旁边
  - id: AC-8
    given: 打开群聊
    when: 看标题栏
    then: 仍能看到群名称、一个前往全局默认模型设置的短入口，以及「群聊设置」。看不到全局默认模型路径，也看不到成员优先跟随全局默认的说明段落。输入框里用 @ 点名成员的方式还在
  - id: AC-9
    given: 打开的是单个 Bot 的对话，或一条不是群聊的会话
    when: 看对话主区域和标题栏
    then: 没有群成员名单，没有「移出」和「加入 Bot」，也没有「群聊设置」。对话保持这次改动前的样子
