id: collaboration-quality-gates
title: 多 Agent 交付必须通过有证据的质量门禁
status: implemented
requirement: |
  那就按你建议的顺序，先把 Swarm 和 Orchestrator 的质量门禁补齐，再用真实多 Agent 任务验证完整交付闭环，做完审查、提交并合并。然后帮我建一个excalidraw的架构图的稿子，帮我把项目完整的架构和模块链路都画好
notes: |
  assumedApproval: standing-order-2026-10-22
  真实模型验证单独记录模型、产物、实际测试和限制；自动化测试不冒充现场结果。
criteria:
  - id: AC-1
    given: 协作成员结束执行但产物未满足全部验收要求
    when: 独立审查给出失败、缺失或无效证据
    then: 任务与运行不会被标为成功，保留逐项判定和失败原因
  - id: AC-2
    given: 协作成员交付了满足要求的产物
    when: 独立审查逐项通过且独立测试提供实际执行成功的证据
    then: 任务和运行可以完成，审查和测试证据持久保存且重复调度不重复验收
  - id: AC-3
    given: 编排进入审查或测试阶段
    when: 结果失败、缺失、格式错误或执行抛出异常
    then: 阶段和运行明确失败，后续阶段不执行，不把自然语言或缺失执行器当作通过
  - id: AC-4
    given: 编排已完成实现且有可检查的产物
    when: 审查和测试均给出完整的有证据结果
    then: 只有全部通过才完成，检查者能看到实现上下文，证据引用可追溯
  - id: AC-5
    given: 检查者声称通过
    when: 未逐项覆盖要求、引用不存在或失败的操作、测试没有成功执行证据，或检查者仍在等待审批
    then: 判定无效并阻止交付成功
