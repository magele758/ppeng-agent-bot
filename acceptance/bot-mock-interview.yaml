id: bot-mock-interview
title: 内置模拟面试官按指定信息出题、评分并给改进建议
status: implemented
requirement: |
  帮我建个模拟面试的bot，根据指定的信息，出题面试和给出评分和改进建议
notes: |
  assumedApproval: standing-order-2026-10-22
  选择：做成名册里一直都在的一只内置 Bot「模拟面试官」，不另做一套产品入口。题目、评分和追问只依据这场对话里用户给出的岗位、简历或考察范围。
criteria:
  - id: AC-1
    given: 用户打开 Bot 名册
    when: 查看已有 Bot，并打开「模拟面试官」说出岗位、简历或考察范围，要求开始面试
    then: 这只 Bot 已经在名册里，不用先新建；它当场开始出题，一次只问一道，并且不为此再开一个目标或子任务去重做这场面试
  - id: AC-2
    given: 一场模拟面试正在进行，用户已经答过题
    when: 用户要求结束并评分
    then: 回复里同时有依据答题表现给出的评分和改进建议
  - id: AC-3
    given: 用户没有提供岗位、简历或考察范围，或者要求问材料里没有的内容
    when: 模拟面试官准备出题或评分
    then: 它先说明缺少哪一项，或直接说明这一问没有依据，不编造用户没给过的经历
  - id: AC-4
    given: 用户已经和模拟面试官开始过一场面试
    when: 另一场对话或重启之后再打开它
    then: 仍是原来那一只，已有的面试内容还在，不另建第二只同名面试官
