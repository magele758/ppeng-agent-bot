id: system-message-ui
title: 统一聊天系统消息展示
status: implemented
requirement: |
  顺便把聊天里其他这种裸的系统消息也检查一遍，统一加上合适的 UI，长内容默认折叠，原始详情保留，别漏了。
notes: |
  assumedApproval: standing-order-2026-10-22
  系统文字统一渲染，保留现有专用卡片和会话归属规则；未知及无标记文本使用兜底卡片。
  AC-2 中的目标更新长内容/原始详情已被 goal-update-hidden 取代（目标更新通知不再展示）。
criteria:
  - id: AC-1
    given: 历史、即时或结构化系统消息包含恢复、模型回退、目标、压缩、扩展、协作或权限信息
    when: 在聊天中查看
    then: 使用对应的本地化卡片，明确的停止提示与一般通知区分，未识别文本也有系统通知卡片
  - id: AC-2
    given: 系统通知或目标更新包含长内容
    when: 查看卡片或展开原始详情
    then: 默认只展示有限预览，展开后可读取完整原文；既有风险、摘要与 Jev 卡片继续可用
  - id: AC-3
    given: 用户引用、模型视图、跨会话目标通知或含工具内容的混合系统消息
    when: 渲染消息
    then: 引用和模型视图保持原样，跨会话隐藏规则保留，工具等非文本部分不会被卡片遮掉
  - id: AC-4
    given: 用户使用英文或手机窄屏
    when: 查看并展开系统卡片
    then: 标题与说明使用当前语言，长原文不撑出卡片
