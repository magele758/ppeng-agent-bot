id: bot-switch-live-turn
title: 切换 Bot 后主画面离开上一场进行中的对话
status: implemented
requirement: |
  我在一个 bot 里会话，切换别的 bot，ui 会话没切换过去，新的 bot 里展示的是正在对话的 UI，不过从历史信息看，数据是对的。
  在一个 bot 吐文字的时候，切换其他 bot，还是会话有问题。
criteria:
  - id: AC-1
    given: 用户正在某个 Bot 的会话里对话，画面上有这场进行中的回合（流式占位、刚发出的气泡或「…」）
    when: 用户切换到另一个 Bot 或另一场会话
    then: 主画面改为展示新会话里已经有的内容，不再绘制上一场进行中的占位、气泡或「…」
  - id: AC-2
    given: 新会话已有自己的历史消息
    when: 用户从一场进行中的对话切换过来
    then: 新会话的历史消息保持原样，不会被上一场的进行中内容替换
  - id: AC-3
    given: 用户正在当前会话里对话，这场回合还在进行
    when: 用户留在这个会话、没有切走
    then: 主画面继续显示这场进行中的回合
  - id: AC-4
    given: Bot A 正在吐字，主画面上已经有这场回合写出的文字、占位或「…」
    when: 用户切到 Bot B，B 自己的会话内容还没装上画面
    then: 主画面不再显示 A 已写出的文字、占位、「…」以及之后新吐出的字
