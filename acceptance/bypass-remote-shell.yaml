id: bypass-remote-shell
title: bypass 下不再为无隔离反复审批，远端查找不被本机浏览规则拦住
status: implemented
requirement: |
  我给4090的bot已经配置了bypass权限了，怎么还是一直在申请权限，还有ssh那边一直完成的不好，帮我排查一下原因
  优化一下这个问题
notes: |
  批准后要改写已实现标准 model-sandbox-isolation 的 AC-3：
  去掉「包括会话被设成跳过一般审批时」。
  无隔离在普通档位仍要审批；只有已被人确认成从不请求审批的对话才直接执行。
  毁灭性命令和密钥脱敏的已有标准不变。
criteria:
  - id: AC-1
    given: 某个 Bot 的对话已被人确认成从不请求审批
    when: 它执行一条需要读取本机 SSH 密钥或配置才能连上另一台机器的命令
    then: 命令直接开始执行，不再为这次执行弹出审批
  - id: AC-2
    given: 对话不是从不请求审批
    when: Agent 选择去掉系统级隔离来执行命令，而人还没有批准
    then: 命令不执行，仍然进入审批；人批准之后才会执行
  - id: AC-3
    given: Bot 通过 ssh 在另一台机器上查找目录或文件
    when: 这类远端查找已经做过很多次，或远端查找没有写本机那种深度限制
    then: 不会因为本机目录浏览次数用完或本机无界扫描而被拒绝，命令会进入实际执行
  - id: AC-4
    given: Agent 在本机上反复列出目录，或在本机上不限深度地扫描家目录或系统目录
    when: 浏览次数超过限额，或扫描没有深度限制
    then: 本机命令仍然被拒绝，并说明原因
  - id: AC-5
    given: 对话是从不请求审批，Agent 去掉隔离执行命令
    when: 命令是递归删除根目录、系统目录或家目录，或格式化磁盘、关机重启
    then: 命令在执行前被拒绝，不会因为跳过审批而跑起来
  - id: AC-6
    given: 对话是从不请求审批，Agent 去掉隔离执行命令
    when: 命令启动
    then: 用来注入代码的环境变量仍然不会进入这条命令
