id: bot-history-memory
title: Bot 持续对话历史与记忆
status: implemented
requirement: |
  完整补齐前述 gap，从纵向切片完成开发计划，包括持续对话、历史、记忆与模型窗口。
owner: user
notes: 用户已授权按开发计划实施；真实模型长期质量与发布规模报告由集成验收单独记录。
criteria:
  - id: AC-1
    given: Bot 历史已经多次压缩
    when: 用户或 Bot 按关键词和时间查询并展开原文
    then: 能返回未损失的原消息、稳定引用与前后文，且只能读取有权访问的历史
  - id: AC-2
    given: Bot 有大量历史且持续新增消息
    when: 用户按页浏览历史
    then: 页面按稳定顺序加载，无重复或跳页，不必全量加载历史
  - id: AC-3
    given: Bot 使用固定模型、默认模型或备用模型
    when: 会话增长需要压缩
    then: 预算采用实际模型窗口并扣除系统工具开销，未知窗口使用公开可配置的回退
  - id: AC-4
    given: Bot 已保存带原文来源的记忆
    when: 用户纠错或删除后再次召回
    then: 能追溯原文来源，修改立即生效且删除内容不再从记忆与旧向量召回
  - id: AC-5
    given: 无登录的安装或已登录用户正在使用 Bot
    when: 对话产生值得长期保存的事实
    then: 自动保存并在同一身份后续对话召回，不误归属其他用户或 Bot
  - id: AC-6
    given: Bot 持续经历多次压缩
    when: 用户继续未完成任务并查找过去事实
    then: 可验证的原始事实和来源仍可检索且长期记忆保持明确预算，不以短摘要冒充全部原文

links:
