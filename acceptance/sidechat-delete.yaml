id: sidechat-delete
title: 删除会话中的侧聊批注
status: implemented
notes: "assumedApproval: standing-order-2026-10-22"
requirement: |
  会话中的侧聊批注，要能够删除
criteria:
  - id: AC-1
    given: 普通对话或一对一 Bot 的同一条已完成回复上有两条已保存的侧聊批注
    when: 用户在侧栏确认删除其中一条
    then: 这条批注及其讨论从侧栏和原文标记中消失，另一条批注和主对话消息仍在
  - id: AC-2
    given: 被删批注能用它的摘录或只在该讨论里出现的词找到，其他会话和同一会话还有别的批注
    when: 用户再次按该摘录或该词查找
    then: 已删除的批注不再出现，其余批注仍可找到
  - id: AC-3
    given: 一条批注正在回答，当前用户无权查看其来源会话
    when: 有权的用户确认删除，或无权的用户尝试删除
    then: 有权删除会停掉未完成的回答并移除批注；无权删除不会移除批注，也看不到其中内容
  - id: AC-4
    given: 用户打开了一条已保存的批注
    when: 用户取消删除，或删除请求失败
    then: 批注、原文标记和讨论都还在，失败时侧栏说明没能删除
