id: message-search-ui
title: 对话页搜索消息正文
status: implemented
requirement: |
  对话页有独立于「搜索 Bot」的正文搜索。输入非空关键词后请求
  GET /api/search/messages，展示会话标题、摘录和时间。点击结果打开对应会话。
  输入为空时不发请求。接口失败或没有命中时显示明确状态，不编造结果。
criteria:
  - id: AC-1
    given: 对话页同时有 Bot 名字搜索和正文搜索
    when: 查看这两个入口
    then: 它们彼此独立，Bot 名字搜索仍在
  - id: AC-2
    given: 用户输入非空关键词
    when: 发起正文搜索
    then: 请求 GET /api/search/messages，并展示 sessionTitle、snippet 和 createdAt
  - id: AC-3
    given: 搜索结果里有一条会话
    when: 点击该结果
    then: 打开对应 sessionId 的会话
  - id: AC-4
    given: 关键词为空或只有空白
    when: 正文搜索框变化
    then: 不发请求
  - id: AC-5
    given: 接口返回错误或空列表
    when: 展示结果
    then: 说明失败或没有命中，不显示伪造结果
out_of_scope:
  - 不改后端搜索实现。
  - 不改 Bot 名字搜索的原有行为。
source: 用户要求搜索对话正文，而不只是 Bot 名字。
updated: 2026-11-10
