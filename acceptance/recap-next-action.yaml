id: recap-next-action
title: 回顾之后推荐下一步行动
status: implemented
requirement: |
  还有个问题，在recap的后续，其实可以把之前自动建议下一步行动的那个功能串联上，让模型给出下一步的的行动建议推荐
owner: user
notes: |
  assumedApproval: standing-order-2026-10-22
  选了回顾完成后，用已有的输入框下一步行动建议接上。建议仍是提示，不写进对话，也不改回顾那一行。
criteria:
  - id: AC-1
    given: 一场已经结束过的 Bot 主对话，输入框是空的，上方正在出现一行回顾
    when: 这行回顾写成
    then: 输入框里随后出现下一步行动建议，以提示显示，还不是真正输入；这句由模型根据这行回顾和已有对话写成
  - id: AC-2
    given: 回顾里点到了一件还没做完的具体事情
    when: 查看这句建议
    then: 它是可以发出去的下一步，用到回顾里的那件具体事情；不是「继续」「好的」，也不是把助手上一句改成问句
  - id: AC-3
    given: 这句建议显示着，回顾也还在
    when: 按 Tab，或不按 Tab 直接打字或发送
    then: Tab 后建议成为真实输入；直接打字不混进建议；没按 Tab 发出去的不是这句建议。建议和回顾都不会变成一条新的对话
  - id: AC-4
    given: 回顾没写成，或模型认为没有可执行的下一步
    when: 查看输入框
    then: 输入框保持可输入，不插入半截建议，也不用错误挡住对话
  - id: AC-5
    given: 没有在看回顾，助手刚刚回复完
    when: 查看输入框
    then: 原有的下一步行动建议仍会出现，不必先等一行回顾
