id: bot-tasks-queue-redesign
title: Bot 任务与任务队列界面主从重构
status: approved
owner: user
notes: |
  assumedApproval: standing-order-2026-10-22
  参考主从分栏收件箱布局重构「任务 → Bot 任务」与「任务 → 任务队列」，保留全部既有能力、状态语义与中英文支持，不新增环境变量。
requirement: |
  http://localhost:23000/#/tasks/bots 里的bot的任务部分和任务队列部分，你可以参考下http://localhost:53798/#thread=msg_01M7X02GKZRQ24S8ECCEPXY4ZS 他的实现，现在设计的太杂乱了，根本看不清也看不懂
criteria:
  - id: AC-1
    given: 用户在桌面端打开「任务 → Bot 任务」页面，且存在任务记录
    when: 查看首屏页面布局
    then: 页面采用视口锁定的左右主从分栏（左侧紧凑任务列表、右侧详情阅读区）并配紧凑快速分派栏，无需整页长滚动即可在首屏同时看清任务列表与当前选中任务详情
  - id: AC-2
    given: Bot 任务包含内部目标续跑前缀、阶段工单包装或冗长 JSON 约束指令
    when: 用户浏览左侧任务列表与右侧详情区
    then: 列表行自动提炼为简洁可读的单行标题与单行结果摘要，不再把整段系统指令铺满列表；完整原始任务指令在右侧详情区默认折叠，点击可展开查看
  - id: AC-3
    given: Bot 任务列表同时包含受阻/失败、进行中与已完成的历史任务，涉及多个 Bot 与不同时间
    when: 用户浏览列表并使用关键词搜索、Bot 筛选或时间范围筛选
    then: 任务按处理优先级分组（需关注、进行中、历史记录）并显示实时数量，筛选条件准确生效且可一键清除，同时不影响正常分派新任务
  - id: AC-4
    given: 用户在「任务 → Bot 任务」列表中选中某条任务或点击「详情」
    when: 查看右侧详情区并执行操作
    then: 右侧详情区立即展示任务状态、交付内容、上一项/下一项切换以及底部吸底操作栏（人工验收通过/未通过、基于此版本修改、打开来源对话、重试、取消、保存为例行任务）
  - id: AC-5
    given: 用户打开「任务 → 任务队列」页面
    when: 查看队列列表、切换范围或使用状态筛选与搜索
    then: 页面采用左右主从分栏，左侧清晰组织按优先级分组的队列任务（失败与进行中优先于已完成）、定时发布与后台任务，保留全部状态筛选及数量、搜索、无匹配清除筛选与各块说明性空状态
  - id: AC-6
    given: 任务队列中存在由 Bot 负责的任务以及包含长路径与重定向的后台命令
    when: 用户查看左侧列表与右侧详情区
    then: 负责者显示可读的 Bot 名称而非内部随机编号，后台命令提炼为简洁可读的标题，并在右侧详情区完整展示原始命令与执行输出
  - id: AC-7
    given: 用户在「任务 → 任务队列」中选中一条队列任务、定时发布或后台任务
    when: 查看右侧详情区
    then: 右侧展示对应的任务说明、前置依赖与时间线事件，或定时发布的渠道/排期与批准/拒绝/立即发布/取消操作，或后台任务的完整命令与输出，并提供直达关联会话的入口
  - id: AC-8
    given: 用户在中文与 English 界面之间切换并查看「Bot 任务」与「任务队列」页面
    when: 检查两个页面及筛选、详情、空状态等全部可见文案
    then: 中英文文案键完全一致且均非空，不出现缺失翻译或硬编码文本
