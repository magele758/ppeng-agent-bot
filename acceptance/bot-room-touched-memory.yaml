id: bot-room-touched-memory
title: 按触达打通单聊记忆与群内容
status: implemented
owner: user
requirement: |
  我想要都有，他保留自己的单聊记忆，同时能接入群里的信息，如果群聊的内容，他也可以融入到单聊里，因为他触达了这个信息，只要他的触达，就算他的信息源。
criteria:
  - id: AC-1
    given: 一名成员在单聊里已经记住了一件事实，并且这次在群里被叫醒
    when: 用户在群里问到这件事
    then: 他可以在群回复里说出这件事实。仅仅加入群，不会把他的单聊记录整段贴进群历史。其他成员也不会仅仅因为同群，就在自己的单聊里看到他的全部单聊记录
  - id: AC-2
    given: 这次群回合把纪要和最近消息推给了这名成员，他用群内查阅取回了更早的原话或附件，并且他自己也在群里发过言
    when: 之后用户在他的单聊里问起这些内容
    then: 他能用上这些触达过的群内容，包括推送给他的纪要和最近消息、他取回的原话和附件，以及他自己发出的群消息
  - id: AC-3
    given: 群里有一些消息没有推送给这名成员，他也没有亲自查阅
    when: 之后用户在他的单聊里问起那些消息
    then: 那些未触达的群内容不出现在他的单聊里，也不因他在群里就被注入
  - id: AC-4
    given: 同一条群消息只推送给了部分成员
    when: 没收到这条消息的成员回到自己的单聊
    then: 这条群消息不进入他的单聊
  - id: AC-5
    given: 群里有一步需要本人批准，并且按默认转到了该成员的私聊
    when: 用户只在私聊里完成批准或拒绝
    then: 私聊里的审批过程不写进群历史。群里仍只有转到私聊的那句说明，批准结果不自动回到群里
notes: |
  触达 = 该 Bot 在某次群回合中实际收到的上下文：推给它的纪要、最近消息、它用群内只读工具取回的原文和附件，以及它自己发出的群消息。未入选、未推送的群消息不算它的信息源。
  隐私后果（负责人明确要的，不改回互不打通）：单聊记忆可能在群里被说出来；该 Bot 触达过的其他成员群消息会进入它之后的单聊。
  本规格替代 bot-rooms AC-3 中这一句的隔离口径：「私人历史不会自动复制入群且群工作不写入私人对话」。替代方式是：私人对话原文仍不整段复制进群记录；成员可以在群回复中使用自己的单聊记忆；它触达过的群内容可以进入它自己之后的单聊。未触达的群内容仍然不写入单聊。
  不替代 bot-rooms AC-7：成员发出的 1:1 私聊及其后的私聊内容仍不写回群历史。
  不替代 bot-rooms AC-8：只发生在私聊的审批过程不回写进群历史。本规格 AC-5 复述这一点。
  不替代 bot-functional-groups AC-10：把 Bot 加入职能组或群聊，仍不会因此自动向其他 Bot 公开其私人历史和私有记忆。
  待用户批准本规格后，才请用户确认改写 bot-rooms AC-3 的上述句子。验收规范的 retired 作用于整份规格，bot-rooms 不能整份 retired。本次不修改 bot-rooms.yaml、bot-functional-groups.yaml 的状态和正文。
  依赖 bot-room-recall。排在群上下文推送之后。
