id: bot-coaching-loop
title: Bot 行为契约与有证据的经验沉淀
status: implemented
requirement: |
  然后你结合4090的调教经验，看看系统要新增什么能力，然后通过操作帮我把开发组里的几个bot都给我调教好，跟他们会话的内容，把他们配置好，然后测试下，看看是否能提升质量，结合这个调教过程，帮我优化一下bot的能力和沉淀链路
notes: 'assumedApproval: standing-order-2026-10-22'
criteria:
  - id: AC-1
    given: 用户选中了一个 Bot
    when: 保存职责、默认执行位置、执行入口和完成条件
    then: 下次执行立即使用该 Bot 自己的契约，其他 Bot 不受影响，过期保存不能覆盖新版
  - id: AC-2
    given: 用户记录了 Bot 的经验候选
    when: 尚未登记带证据的通过验证
    then: 候选不能作为有效行为规则注入，缺少验证证据不能标为已验证
  - id: AC-3
    given: 某经验已有通过验证的记录
    when: 标为已验证或退役
    then: 已验证经验在执行时可见，退役后不再生效，历史验证记录仍可查看
  - id: AC-4
    given: 已登录用户查看 Bot 的调教配置
    when: 读取或更新配置
    then: 遵守 Bot 归属权限，不暴露其他用户的配置
  - id: AC-5
    given: 用户为 Bot 指定了可见的流程技能
    when: 普通请求的关键词没有命中该技能
    then: 流程技能仍可加载，但不可见或被策略禁止的技能不会因此越权可用
  - id: AC-6
    given: 用户通过对话要求教练调整可管理的 Bot
    when: 教练读取或保存行为契约与经验
    then: 可经专用工具完成同样操作，版本、证据、归属和只读模式限制仍有效
