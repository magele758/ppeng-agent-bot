id: skill-capture-dismissal
title: 技能沉淀完成提示可收起和关闭
status: implemented
requirement: |
  这沉淀了技能了，无法关闭这个，一直挡着对话框
notes: |
  补充已完成沉淀建议的展示与关闭行为，不改变确认、保存、拒绝或撤销技能的含义。
  用户于 2026-10-21 确认。新增 4 项浏览器测试在旧实现上均失败；
  实现后新增测试与原技能沉淀回归共 6 项通过，覆盖 1280px 与 820px。
  中英文校验 16 项、Next 生产构建及验收门禁通过。
  已在当前 4090 bot 页面验证展开、收起、关闭及刷新后保持关闭。
criteria:
  - id: AC-1
    given: 一条技能沉淀建议已成功保存，包括打开会话时已有的成功记录
    when: 用户查看对话
    then: 默认只显示技能名称、已保存状态及查看详情和关闭入口，不再展开长篇理由和拟记录内容；用户仍可展开查看详情
  - id: AC-2
    given: 用户看到已保存的技能沉淀提示
    when: 用户点击关闭
    then: 该提示从对话区移除，已保存技能及其共享和启用设置不变，仍可在技能管理中查找和使用
  - id: AC-3
    given: 用户已关闭一条成功提示
    when: 在同一浏览器中自动刷新数据、刷新页面或离开后重新打开该会话
    then: 同一提示保持关闭，不会再次占据对话区；其他会话和后续新产生的建议不受影响
  - id: AC-4
    given: 对话中还存在待确认、处理中或失败的技能沉淀建议
    when: 用户关闭另一条已保存提示
    then: 这些建议的确认入口、处理状态或失败原因仍然可见，不会被误确认、误拒绝或误报成功
  - id: AC-5
    given: 用户在桌面或窄屏对话中看到已保存提示
    when: 用鼠标或键盘展开详情、收起或关闭提示
    then: 控件可操作且含义明确，关闭后可以继续阅读和输入消息，不会出现空白遮挡或跳到无关的历史位置
