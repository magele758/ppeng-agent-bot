id: session-lifecycle-verification
title: 会话生命周期验证：取消、重试与审批恢复
status: implemented
requirement: |
  继续把验证扩大到会话生命周期，重点检查取消、重试和审批恢复时的状态一致性，按项目规范先写验收标准给我确认。
notes: |
  本次扩大验证范围，不预先授权修改被验证的产品行为；发现违反标准的行为时保留失败证据并另提修复验收。
  区分会话与一次运行：本次运行结束不意味着整个会话永久不可再次启动；新运行不能受旧运行的迟到事件影响。
  取消只要求停止本次运行继续推进，不承诺撤销工具已经发生的外部副作用。已完成并记录的运行不因后来的取消改写结果。
  重试范围为运行中的模型请求自动重试，包含重试等待、成功、额度耗尽及等待期间取消；不引入工具副作用的自动重放。
  覆盖普通对话和任务运行、单进程单会话的先后两次运行、最多两个待审批事项，以及每次运行至多一次模型重试的有界验证。
  探索上述范围内取消、返回结果、重试及审批决定的不同先后顺序；不证明无限规模、多进程竞争、强杀、断电或存储损坏后的恢复。
  真实执行验证须覆盖会话执行、取消及审批恢复的实际控制流程；不得仅重放手写状态表，或只测孤立状态转换函数便声称实现通过。
  既有工具调用配对验收及验证门禁继续保留；本次不新增界面，也不指定内部状态枚举名称，以对外状态、结束原因和可继续执行的行为是否一致为准。
criteria:
  - id: AC-1
    given: 普通对话或任务正在运行
    when: 本次运行正常结束
    then: 返回结果与保存的会话状态、结束原因一致，普通对话可等待下一条消息，任务明确完成，不残留正在运行或等待审批的标记
  - id: AC-2
    given: 本次运行正在等待模型、执行工具、等待重试或等待审批
    when: 取消生效并完成可控收尾
    then: 状态与结束原因一致地表明本次运行已取消，不误报成功、不继续启动本次运行的新工作，也不残留可恢复本次运行的待审批状态
  - id: AC-3
    given: 本次运行已完成、失败或取消，且可能已开始下一次运行
    when: 旧运行的结果、重试触发、审批决定或重复取消迟到
    then: 旧运行不会自行恢复或被改写为其他结束结果，下一次运行的状态和工作不被这些旧事件改变
  - id: AC-4
    given: 模型请求发生允许自动重试的失败
    when: 进入重试等待后成功返回或耗尽重试额度
    then: 等待期间不误报运行已结束；成功后正常继续，耗尽后明确失败；本次运行结束后不残留运行或重试状态，也不重复执行已完成的工具调用
  - id: AC-5
    given: 本次运行存在一个或多个必须审批的待决事项
    when: 审批尚未全部决定，或只决定了其中一部分
    then: 会话保持等待审批，尚未获准的操作不执行，也不误报本次运行已完成
  - id: AC-6
    given: 本次运行因审批暂停且未被取消
    when: 所有待决审批已批准或拒绝，随后恢复或重复提交同一决定
    then: 只继续尚未执行且已获准的操作，被拒绝的操作明确记录为拒绝且不执行；恢复后不残留旧等待状态，重复决定不重复执行或重新创建相同审批
  - id: AC-7
    given: 开发者运行会话生命周期验证
    when: 查看报告
    then: 能分别看到有界模型检查和真实会话执行验证的结果，以及覆盖状态、事件顺序范围、假设和排除场景；旧状态表或模型通过不能替代真实执行通过
  - id: AC-8
    given: 验证发现状态、结束原因或实际执行行为相互矛盾
    when: 检查失败报告
    then: 能按事件顺序复现问题并识别受影响的运行、预期及实际状态；问题保留为失败，不通过弱化标准消除红灯
  - id: AC-9
    given: 在隔离副本中分别引入取消后继续推进、重试结束后残留运行状态、审批恢复后重复执行的真实代码缺陷
    when: 运行验证并在演练后恢复原始代码
    then: 三种缺陷分别被捕获并留下证据，原有失败不算捕获新缺陷，恢复后结果与演练前一致
  - id: AC-10
    given: 开发者按说明准备固定版本的验证工具且不配置真实模型密钥
    when: 重复运行验证，或遇到工具缺失、超时及检查未完成
    then: 相同代码和配置得到一致判定；无法完成时明确说明原因并阻止发布门禁通过，不报告验证成功
  - id: AC-11
    given: 后续修改触及已覆盖的生命周期行为或验证规则
    when: 尚未完成代码与验证范围的对应复核
    then: 检查明确提示需要复核并阻止沿用旧的通过结论，开发者或 Coding Agent 可按项目指引复核并重新运行验证
