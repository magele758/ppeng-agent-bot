id: session-lifecycle-state-consistency
title: 生命周期验证发现的结束原因与部分审批状态一致性修复
status: implemented
requirement: |
  确认，这 11 条验收标准可以，按项目规范开始实现会话生命周期验证，先写失败测试再实现，保留现有工具配对验证，发现产品缺陷后另提修复验收。
notes: |
  这是验证发现 L-1、L-2 后的独立产品修复，用户已确认三条标准，按先红后绿流程实施。
  反例来自真实会话执行、取消与审批接口及 SQLite 状态；详见 doc/formal/session-lifecycle-findings.md。
  原生命周期和工具配对验收标准保留，不通过修改它们使验证通过。
criteria:
  - id: AC-1
    given: 某次运行已经完成或失败并保存了结束结果，且没有新的活动运行
    when: 随后收到一次或多次取消请求
    then: 原状态和结束原因保持不变，不被改写为取消，也不启动新的工作
  - id: AC-2
    given: 会话正在等待多个审批事项
    when: 部分事项已批准或拒绝，但仍有事项尚未决定
    then: 对外会话状态与等待审批原因保持一致，继续明确等待审批，未获准操作不执行
  - id: AC-3
    given: 会话正在运行或等待审批，尚未结束
    when: 用户取消本次运行
    then: 本次运行仍能正常取消并清理待恢复审批状态，不因保护历史结束结果而忽略有效取消
