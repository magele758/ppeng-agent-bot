id: bot-face-first-creation
title: Bot 创建以机器人脸型和颜色为主
status: retired
retiredReason: 用户要求简化 Bot 操作，外观改为可选展开，由 bot-settings-flow AC-5/AC-10/AC-11/AC-12 替代；原预览、持久化、失败重试标准继续验收。
owner: user
requirement: |
  不用搞这种bot的头像
  bot创建就以这个为主就行了
notes: |
  用户明确指向 emoji 头像选择区和当前高级选项中的显示标题、描述、机器人脸型及颜色。
  本次调整创建界面，不批量更改已有 Bot 的头像或配置。
criteria:
  - id: AC-1
    given: 用户从聊天页或 Bot 管理页新建 Bot
    when: 打开创建界面
    then: 直接看到名称、显示标题、描述、机器人脸型和颜色，不必展开高级选项；不再显示 emoji 头像选择和图片地址输入
  - id: AC-2
    given: 用户正在填写新 Bot
    when: 修改名称、选择脸型或颜色
    then: 能立即看到对应的机器人脸预览；不选择脸型和颜色时按名称生成默认外观
  - id: AC-3
    given: 用户只填写名称，或同时填写显示标题、描述并选择脸型和颜色
    when: 成功创建 Bot 并刷新页面
    then: 创建结果及填写的内容保留，选择器、会话和群聊使用同一机器人脸，仍遵循工作时动态、空闲时静止的规则
  - id: AC-4
    given: 用户正在创建 Bot
    when: 名称为空、重名、提交失败或用户取消
    then: 缺少或无效名称不能创建，提交失败明确提示并保留输入供重试，取消不创建 Bot 且保留原对话
