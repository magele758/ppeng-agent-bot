id: conversation-date-clock
title: 续聊时日期跟现在走，不跟历史里的旧日期走
status: implemented
requirement: |
  我发现一个问题，bot对于对话中的日期很不敏感，如果历史对话里有日期了，过几天回来对话，一般日期都会不对，这个问题怎么解决？深度分析一下，然后分多个Agent去修复这个问题
owner: user
notes: |
  assumedApproval: standing-order-2026-10-22
  选了「每轮重算当前时钟 + 历史消息标写下时间」，不把当前时间写进对话记录，也不放进长期不变的系统说明里。
criteria:
  - id: AC-1
    given: 一场几天前的对话里已经出现过日期，用户过几天回来继续聊，并问今天是哪一天
    when: 这一轮发给模型
    then: 模型看到的是现在的日历日期和星期，不是历史消息里写过的那个旧日期
  - id: AC-2
    given: 早先的消息正文里有今天、明天、昨天，或对应的英文说法
    when: 过几天再把这些消息发给模型
    then: 每条旧消息都标着它写下时的日期和钟点，旧的「今天」不会被当成现在
  - id: AC-3
    given: 对话被压缩成摘要，摘要或被压缩的原文里有相对日期
    when: 生成新摘要，或之后再把旧摘要发给模型
    then: 新摘要被要求写成绝对日期，不再写今天或明天；旧摘要里的相对日期被标明不是现在
  - id: AC-4
    given: 群聊里有几天前的消息，正文里写了今天
    when: 成员再次被叫来回复
    then: 成员看到的历史里，那条旧消息标着写下时的日期，同时能看到现在的日期；旧的今天不会被当成现在
  - id: AC-5
    given: 当前时间已经出现在某一轮发给模型的内容里
    when: 用户隔天再打开同一场对话
    then: 对话记录里没有留下过期的当前时间；不会越积越多
  - id: AC-6
    given: 会话指定了时区，或没有指定而使用运行环境的本地时区
    when: 协调世界时已经跨日，但该时区的日历日还没跨，或反过来
    then: 模型看到的今天是该时区的日历日，不是协调世界时的日期
  - id: AC-7
    given: 用户离开几天后再回到同一场对话，系统为这次返回准备一行回顾
    when: 生成这行回顾
    then: 依据的是每轮写下的日期和现在的日期，不会把几天前的今天说成现在
