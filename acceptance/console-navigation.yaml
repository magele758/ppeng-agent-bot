id: console-navigation
title: 控制台主导航与页面结构
status: implemented
requirement: |
  apps/web-console 前端很乱：功能堆在一起，配置太多不好用，交互不清晰。目标是整体重构，让控制台清晰、易用。
  主导航：Bot / 对话 / Bots 与 Agents / 任务 / 知识与记忆 / 设置。运维不在左侧主导航，从设置进入。
notes: |
  assumedApproval: standing-order-2026-10-22；2026-10-28 单机收尾采用 Bot 默认入口，保留显式旧对话地址和所有导航能力。
  负责人要求把「运维」从左侧主导航移入设置，并把 Bot 从对话面板的页内切换改为主导航、放在「对话」之前。
  AC-1 的导航名单按该要求更新（仍是六项，运维换成 Bot）。
criteria:
  - id: AC-1
    given: 用户首次打开控制台
    when: 页面加载完成
    then: 默认停在「Bot」页；左侧主导航恰好显示六项且顺序为 Bot、对话、Bots 与 Agents、任务、知识与记忆、设置（不包含运维），当前页高亮，且不再有需要先点开的「工作台」抽屉
  - id: AC-2
    given: 用户在主导航中
    when: 点击某一项或某个子页签
    then: 内容区切换到对应页面并在地址栏记录位置；刷新页面或直接打开该地址后停留在同一页面；无效地址回到「Bot」
  - id: AC-3
    given: 重构前「功能 / 会话轨迹 / Teams / 更多」里的功能
    when: 用户在新导航中查找
    then: 每项功能仍可到达（Agent 与技能、Teams 与 DAG、任务与审批、记忆与摄取、会话轨迹与系统状态、全部设置卡片）。会话轨迹与系统状态从「设置」中的运维进入；直接打开原来的运维地址仍进入同一页面
  - id: AC-4
    given: 用户在对话页输入了尚未发送的内容
    when: 切换到其他页面再切回「对话」
    then: 输入内容与当前会话原样保留
  - id: AC-5
    given: 用户切换界面语言（中文 / English）
    when: 查看主导航、各页标题与设置分类
    then: 文案随语言切换，中英文两套文案完整一致
