id: bot-communication-observability
title: "Bot 通信轨迹与等待原因展示"
status: draft
requirement: |
  那先帮我制订一个详细的改造和提升的开发计划
notes: "用户明确要求先制定计划，本轮仅为 P6 编写验收草稿，不代表实施或验收通过。方案见 doc/BOT_COMMUNICATION_UPGRADE_PLAN.md。实施该阶段时按 acceptance-first 改 approved 并加入 standing-order notes，逐条写失败测试再实现；既有标准保持有效。"
criteria:
  - id: AC-1
    given: "一项工作经过群、Bot 委派和子任务"
    when: "用户从现有任务或活动详情查看处理过程"
    then: "能看到来源、去向、等待原因、执行与结果，并定位有权访问的原消息和产物"
  - id: AC-2
    given: "其他用户拥有一条工作轨迹"
    when: "当前用户使用其追踪标识查询"
    then: "无法看到其他用户的对话、摘要、身份细节或产物"
  - id: AC-3
    given: "工作轨迹的一部分记录已删除或变得不可访问"
    when: "用户展开轨迹"
    then: "页面明确显示信息缺口，不猜测内容、不跳到无关会话"
  - id: AC-4
    given: "用户正在阅读活动列表或已展开的轨迹"
    when: "后台自动刷新且切换中英文界面"
    then: "滚动和展开状态得到保留，新增文案按语言显示且无缺失翻译"
  - id: AC-5
    given: "执行结果已经完成但发布失败"
    when: "用户查看详情并选择重新发送结果"
    then: "能区分执行状态和发布状态，重新发送不会重新执行原工作"
  - id: AC-6
    given: "部分终态轨迹达到保留期限而另有待投递或活跃任务"
    when: "系统执行历史清理后收到允许重试范围内的重复结果"
    then: "活跃与待投递工作仍可追踪，历史清理不会使重复结果变成新的执行"
