id: session-restart-recovery-verification
title: 进程重启恢复验证：运行中、重试等待与等待审批
status: implemented
requirement: |
  继续把验证扩大到进程重启后的恢复，重点检查运行中、重试等待和等待审批时重启后的状态一致性，按项目规范先写验收标准给我确认。
notes: |
  本次新增验证，不预先授权修改产品恢复行为。发现产品缺陷时保存失败证据，并另提修复验收交用户确认；不得通过弱化本标准消除失败。
  覆盖普通对话与任务、单个状态目录、同一时刻仅一个服务进程，先后两代进程；另检查重复启动恢复的幂等性。
  进程停止覆盖正常退出和未经可控收尾的强制终止，恢复读取同一份已提交持久化数据。强制终止只在已确认到达目标阶段后触发，不能用手写状态或内存重建代替真实进程重启。
  核心场景为等待模型、执行工具、模型重试退避等待、等待最多两项审批；每次运行至多一次模型自动重试。覆盖最后一项审批决定已保存但尚未继续执行的窗口。
  运行中或重试等待时失去执行上下文，不默认授权静默重放。审批暂停具有可恢复信息时允许依既有入口恢复，仍受原权限约束。
  审批持久化场景使用未过期且未被撤销的审批；到期与撤销仍遵守现有策略，重启不延长有效期。
  只对已确认保存的工具结果检查不重复执行；外部副作用已经发生但结果尚未保存时只能标记未确认并阻止盲目重放，不宣称跨系统恰好一次或自动撤销副作用。
  不覆盖整机断电、磁盘或数据库损坏、多进程同时写入、数据库版本迁移、外部模型和工具服务自身的恢复，也不扩大到独立调度任务及 Bot 专用队列的完整恢复协议。
  不新增界面或环境变量；现有工具配对、会话生命周期验收及验证门禁完整保留。
criteria:
  - id: AC-1
    given: 普通对话或任务正在等待模型或执行工具，尚未保存本次运行的结束结果
    when: 服务进程停止并使用原有数据重新启动
    then: 会话不再虚报旧进程仍在执行；状态与结束原因明确反映本次运行已中断或结果未确认，不误报成功，也不自动重放未确认的操作
  - id: AC-2
    given: 本次运行因模型请求失败正在等待重试
    when: 服务进程在等待期间停止并重新启动，随后超过原定重试时间
    then: 旧运行不再保持虚假的运行或重试状态，也不自行发起旧请求；状态与中断原因一致，不通过静默重置重试额度继续旧运行
  - id: AC-3
    given: 会话正在等待一项或两项尚未决定且仍有效的审批
    when: 服务进程停止并重新启动
    then: 待决事项及其原有标识、操作内容和决定状态保留，会话仍明确等待审批，未获准的操作不执行，不生成重复审批
  - id: AC-4
    given: 两项审批中已有一项批准或拒绝，另一项仍待决定
    when: 服务进程停止并重新启动
    then: 已保存的决定保留，会话继续等待剩余审批，状态与等待原因一致，不将已决定事项重新变成待决
  - id: AC-5
    given: 审批暂停所需信息已保存，全部审批在重启前或重启后完成决定，且本次运行未被取消
    when: 重启后通过现有入口恢复，并重复提交相同审批决定或恢复请求
    then: 只执行尚未完成且已获准的操作，被拒绝的操作不执行且有明确记录；已保存完成结果的操作不重复执行，恢复结束后不残留旧等待状态
  - id: AC-6
    given: 重启后会话仍在等待审批，包含尚未全部决定的情况
    when: 用户取消本次运行，之后再次提交原审批决定或再次重启
    then: 取消结果和审批清理结果保留，旧运行不因迟到决定或重启而恢复，也不执行原待审批操作
  - id: AC-7
    given: 旧运行因进程停止而中断，用户在恢复后明确发起新的运行
    when: 新运行执行并结束
    then: 新运行能按当前权限正常推进，其状态、结束原因及工具结果不与旧运行混淆，不受旧重试或旧审批恢复信息驱动
  - id: AC-8
    given: 会话已有保存的完成、失败、取消结果，或上一轮启动已完成中断恢复
    when: 再次启动并重复执行恢复检查
    then: 已确定的结果保持不变，不新增重复审批、工具结果或恢复记录，也不重新启动已结束的工作
  - id: AC-9
    given: 进程停止前已有部分工具结果保存，另有工具调用尚无已确认结果
    when: 重启后查看历史或继续获准的新工作
    then: 已保存结果保留且不重复，未确认部分明确体现中断或未知，不伪造成功；送入模型的工具调用与结果保持合法配对，不因修补历史而执行未确认操作
  - id: AC-10
    given: 开发者运行进程重启恢复验证
    when: 查看验证报告
    then: 能分别看到有界模型与真实进程正常退出、强制终止及重启的结果，并识别旧运行、新运行、事件顺序、预期和实际状态，以及验证范围与排除项；仅重建内存对象或模型通过不能替代真实重启验证
  - id: AC-11
    given: 在隔离环境分别引入重启后残留虚假运行状态、旧重试自行继续、审批决定丢失或重复执行的真实代码缺陷
    when: 运行验证并恢复原始代码
    then: 三类缺陷分别造成原本通过的场景新增失败并留下可复现证据，恢复后结果与演练前一致，原有失败不能算作检出新缺陷
  - id: AC-12
    given: 开发者使用固定版本的验证工具且不配置真实模型密钥
    when: 重复运行验证，或遇到子进程启动失败、超时、检查未完成及证据缺失
    then: 相同代码与配置得到一致判定；未完成时明确报告原因并使门禁失败，不因缺少结果而误报成功
  - id: AC-13
    given: 后续修改触及已覆盖的启动恢复行为或验证规则
    when: 尚未复核代码与验证范围的对应关系，或现有生命周期、工具配对验证未通过
    then: 门禁阻止沿用旧的通过结论，并提供可按项目指引复核和重新验证的说明
