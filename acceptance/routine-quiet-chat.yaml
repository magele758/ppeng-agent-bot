id: routine-quiet-chat
title: 无结论的定时回执不进主对话
status: implemented
requirement: |
  “定时任务结果 … [NO_UPDATE] 查看详情” 这个感觉完全没用啊，还徒增了我理解的负担，这个到底是要干嘛用的？
  那你就优化一下这个
notes: |
  assumedApproval: standing-order-2026-10-22
  无新结论的回执不进主对话。标记只出现在正文中间时，结论仍显示。
criteria:
  - id: AC-1
    given: 定时任务跑完，模型先写了一句核对说明，再把 [NO_UPDATE] 放在回复结尾
    when: 这次运行结束
    then: 运行记为静默而不是成功，主对话不出现结果摘要；正文里只是提到该标记、标记不在开头也不在结尾的真实结论仍会通知
  - id: AC-2
    given: 主对话里已经有一条定时任务结果，正文是核对说明加上结尾的 [NO_UPDATE]
    when: 用户阅读这段对话
    then: 不显示这张结果卡片，也不显示那段核对说明；带有实质结论的定时结果卡片仍显示任务名和摘要；普通消息即使包含该标记也不会被藏起来
