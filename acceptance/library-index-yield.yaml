id: library-index-yield
title: 保存知识库目录不堵住访问
status: implemented
requirement: |
  保存知识库目录后，设置接口马上返回。索引在后台继续，不能挡住 /api/health。
  进程刚开始听端口时也不能先把整库扫完。
  扫描在文件之间把事件循环让出去。禁止在调用栈上同步读完整棵大目录。
  跳过 .obsidian 元数据目录。能不下载就认出来的 iCloud 占位文件不要 readFileSync 把它们拉下来；认不出来就跳过该文件并继续，不要让一次读卡住后面的请求。
  现有 5000 文件 / 深度 24 的上限保持。小目录的现有索引测试必须继续通过：内容仍会进 library scope，删掉的目录仍会清掉索引。
  不要新增 RAW_AGENT_* 或任何功能开关环境变量。
notes: |
  assumedApproval: standing-order-2026-10-22
criteria:
  - id: AC-1
    given: 已保存的知识库目录里有很多文件，索引还要花一段时间
    when: 保存这个目录
    then: 保存请求会返回成功；索引还没做完时，健康检查仍然返回成功
  - id: AC-2
    given: 已经保存了文件很多的知识库目录，服务正在启动
    when: 端口刚开始接受访问
    then: 健康检查能返回成功，不必等整个资料库索引结束
  - id: AC-3
    given: 资料目录里有一篇普通笔记，旁边有 Obsidian 元数据目录、一份还没下载到本机的云端占位文件，以及一份读不出来的文件
    when: 索引这个目录
    then: 普通笔记能被检索到；元数据目录和占位文件里的内容检索不到，占位文件不会被读下来；读不出来的文件不会让这篇笔记索引停掉
