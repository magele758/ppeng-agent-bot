id: bot-pin-permission
title: Bot 模型与思考力度固定的修改权限
status: implemented
requirement: |
  权限漏洞（早就存在）：对没有主人的 Bot，POST /api/sessions 对任何登录用户放行，所以带 metadata
  打开对话就能改它的模型固定和思考力度固定；而 PATCH /api/bots/:id 要求管理员。
  要求：
  - 审计所有能写入 Bot 对话 metadata.modelOverride / metadata.thinkingEffort 的路径（至少：
    POST /api/sessions、会话 metadata 的任何 PATCH/更新路由、bot_update 工具、其它 grep 到的写入点），
    全部与 PATCH /api/bots/:id 使用同一权限判断（所有者或管理员；无主 Bot 仅管理员）。抽一个共用的判定函数，
    不要各处复制逻辑。
  - 语义：只有「改变」固定值才需要权限。无权限的调用者在 metadata 里不带这两个字段，或带的值与该 Bot
    当前固定值相同 → 放行，新对话继承当前固定值；带的值不同 → 403，不创建会话、不改任何已有值。先查 Lab
    前端打开 Bot 对话时会发什么 metadata，确保普通用户正常打开 Bot 对话不受影响。
  - 普通非 Bot 会话行为不变。
  - AC 覆盖：无主 Bot 普通用户改不了（模型、思考力度各一条）、普通用户仍能正常打开对话并继承固定值、
    所有者和管理员仍能改、bot_update 工具路径同样受限。
notes: |
  assumedApproval: standing-order-2026-10-22
  「改」包括改成别的值和改回跟随默认 / 跟随全局；请求里写不出合法值也算改。
  Lab 登录未开启（单用户 / 运营方）时请求方视为管理员，行为与修复前一致。
  即时通讯网关入站的 `/model` 没有 Lab 登录身份，按运营方配置的集成处理，本规格不改变它。
criteria:
  - id: AC-1
    given: 一只没有主人的 Bot 固定了模型 A，一位已登录的普通用户（不是管理员）
    when: 他在打开这只 Bot 的对话、修改这只 Bot 的设置，或新建一条标成这只 Bot 的会话时，要求把模型改成另一个模型或改回跟随默认
    then: 请求被拒绝（没有权限）；不会因此新建对话，这只 Bot 每条对话的模型固定仍是 A
  - id: AC-2
    given: 一只没有主人的 Bot 固定了思考力度「低」，一位已登录的普通用户（不是管理员）
    when: 他在打开这只 Bot 的对话、修改这只 Bot 的设置，或新建一条标成这只 Bot 的会话时，要求把思考力度改成另一档或改回跟随全局
    then: 请求被拒绝（没有权限）；不会因此新建对话，这只 Bot 每条对话的思考力度固定仍是「低」
  - id: AC-3
    given: 一只没有主人的 Bot 固定了模型和思考力度
    when: 普通用户打开它的对话，请求里不带这两项，或带的值与当前固定值相同
    then: 对话正常打开，他的新对话沿用这只 Bot 当前的模型和思考力度固定
  - id: AC-4
    given: 一只有主人的 Bot 和一只没有主人的 Bot
    when: 主人修改自己那只 Bot 的模型或思考力度固定，管理员修改没有主人那只的
    then: 都能保存，该 Bot 的每条对话（包括之后新开的）都按新的固定值运行
  - id: AC-5
    given: 一只没有主人的 Bot
    when: 普通用户在自己的对话里让助手用 Bot 管理工具（bot_update）修改它的模型或思考力度固定
    then: 工具返回没有权限，固定值不变；同样的修改由管理员或 Bot 主人发起时照常保存
  - id: AC-6
    given: 一只没有主人的 Bot 固定了模型 A
    when: 普通用户在这只 Bot 的对话里发送 `/model` 切到另一个模型，或发送 `/model default`
    then: 命令被拒绝（没有权限），模型固定仍是 A；管理员发送同样的命令仍能切换
  - id: AC-7
    given: 一条不属于任何 Bot 的普通对话
    when: 普通用户新建它时带上模型固定或思考力度
    then: 照常创建并按所带的值运行，与修复前一致
