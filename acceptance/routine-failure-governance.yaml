id: routine-failure-governance
title: 例行任务连续故障治理
status: implemented
requirement: |
  先按你建议的顺序推进第一批：记忆删除抑制、严格预检、定时任务故障治理。按仓库的验收优先流程，先写验收标准给我确认。
notes: |
  第一批适用于周期和间隔任务的未来自动执行，不自动重放一次性或事件任务。默认连续硬失败 7 次自动暂停；第二次连续失败起等待 2 分钟，之后翻倍，上限 60 分钟；失败通知冷却默认 30 分钟。这些策略可在 Lab 调整并持久化，无新增环境变量。成功清零失败序列；无变化、静默、取消和等待审批不计失败，也不触发恢复通知。故障与恢复通知仅在所有者私人任务中心显示，保留 bot-routine-lifecycle 的群投递约束。
criteria:
  - id: AC-1
    given: 用户在 Lab 为周期或间隔任务设置失败等待上限、连续硬失败暂停阈值和通知冷却时间
    when: 保存有效设置，或尝试保存无效设置
    then: 有效设置立即生效且重启后保留，无效设置被明确拒绝，无需修改环境变量
  - id: AC-2
    given: 周期或间隔任务连续执行失败且采用默认策略
    when: 第二次及后续失败后出现新的自动触发机会
    then: 第二次失败后至少等待 2 分钟，之后等待翻倍并封顶 60 分钟；等待期间不启动新执行且界面可见最早可执行时间
  - id: AC-3
    given: 任务失败原因是临时超时、限流、网络或上游临时故障，或是凭据失效、欠费、预检失败等硬故障
    when: 查看失败记录和自动暂停计数
    then: 记录区分临时与硬故障；临时故障参与退避但不增加连续硬失败计数，硬故障增加该计数
  - id: AC-4
    given: 周期或间隔任务已达到设定的连续硬失败阈值
    when: 后续自动触发到来
    then: 任务保持自动暂停，不产生新运行，所有者可看到暂停原因及恢复入口
  - id: AC-5
    given: 任务进入一段新的故障期
    when: 首次失败及后续重复失败发生
    then: 所有者私人任务中心收到一次故障通知；持续故障不重复通知，冷却期内的再次故障也不重复通知，目标群不收到故障消息
  - id: AC-6
    given: 任务曾显示故障通知，之后恢复执行
    when: 一次运行成功完成且不是静默结果
    then: 失败序列与退避被清零，所有者私人任务中心仅收到一次恢复通知
  - id: AC-7
    given: 任务运行得到无变化或静默结果，或被取消、等待审批
    when: 系统更新运行记录与故障策略
    then: 记录保持对应真实状态，不增加失败计数、不发布故障或恢复通知，也不将这些状态当作成功来清零已有失败序列
  - id: AC-8
    given: 任务因连续硬失败自动暂停，所有者已修复原因
    when: 所有者在 Lab 明确恢复任务
    then: 任务从之后的触发继续执行，旧失败序列及退避清零，不自动补跑暂停期间错过的工作
  - id: AC-9
    given: 任务处于退避、自动暂停或结果未知状态
    when: 服务重启或多个实例同时处理后续触发
    then: 退避和暂停状态仍有效，同一触发最多执行一次，可能已产生外部效果的未知运行不自动重放
  - id: AC-10
    given: 用户无权管理某任务
    when: 尝试查看其私人故障通知、修改策略或恢复任务
    then: 请求被拒绝且该任务的配置和运行状态不变
