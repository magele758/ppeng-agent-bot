id: bot-coding-agent-tools
title: Bot 识别并善用本机编程助手处理深度编码任务
status: implemented
notes: |
  assumedApproval: standing-order-2026-10-22
requirement: |
  现在bot会不会调用我电脑里的coding-agent 的工具去解决一些深度的编码的问题？如果目前不能，最好让他能知道并能善用工具，避免bot里处理过于复杂的编码问题
criteria:
  - id: AC-1
    given: 未设置任何外部编程助手环境变量，本机已安装本地编程助手命令行工具
    when: 在设置中开启本机编程助手并保存
    then: 无需重启，下一次对话即可感知已开启状态并查看本机检测到的命令行工具；关闭后下一次对话立即收回这些工具
  - id: AC-2
    given: 已开启本机编程助手且允许 Bot 使用，本机安装了部分本地编程助手命令行工具，工具提供方式为渐进加载
    when: 打开一个 Bot 主对话并开始第一轮推理
    then: Bot 首轮即可直接看到已安装的本地编程助手工具（未安装的命令行不占用首轮工具位），而未单独授权的普通非 Bot 聊天会话仍默认隔离不可见
  - id: AC-3
    given: 已开启本机编程助手且本机检测到可用的本地编程助手（可配置偏好工具）
    when: 构建 Bot 的系统上下文
    then: Bot 明确知晓本机已安装哪些编程助手与偏好设置，并得到清晰指引：多文件重构、深度调试或复杂编码任务应优先委派给本地编程助手（并给出明确目标、目录与验证命令），简单小改动直接用内置工具处理；若未开启或未检测到任何命令行工具，不误导 Bot 假装可用
  - id: AC-4
    given: Bot 拥有本地编程助手能力，但配置了不含该工具的白名单、关闭了允许 Bot 使用开关，或处于自动/询问权限模式
    when: Bot 尝试查看或调用本地编程助手工具，或尝试指定工作区外的目录执行
    then: 白名单外与关闭状态下工具不可见也不可执行；允许调用时每次仍触发人工审批；工作区外的目标目录被拒绝执行，合法工作区子目录可正常作为执行目录
  - id: AC-5
    given: 管理员打开设置中的工具分类
    when: 查看和修改本机编程助手设置（总开关、允许 Bot 使用、首选工具、Cursor 模型）或提交非法值
    then: 界面以当前语言（中/英）展示本机检测结果与可保存项，非法配置被拒绝且不覆盖原已保存设置，有效配置覆盖环境变量回退并立即反映到生效配置视图中
