id: bot-list-face-plate
title: 侧栏 Bot 脸保持原形，不套外框也不拉变形
status: implemented
notes: |
  用户纠正了未提交的圆角横条底：列表头像不要外框，也不要把脸非等比拉成圆形的外接框。
  Super Bot 和定义 Bot 时可选的豆形是同一张较小横豆（git 里被青绿块换掉的那张），不是铺满的不规则块。
  六边形、云朵、花朵、水滴不换成这张豆。输入框、群成员和定时任务不在这次范围。
requirement: |
  你这个框加错了，你给 icon 都加个框干嘛？
  你这都把 icon 搞的变形了，赶紧修复一下，还有上面那个六边形的也变形了。
  你把上一版的 super bot 的 icon 给我恢复，我挺喜欢那个的。
criteria:
  - id: AC-1
    given: Bot 页左侧列表里能同时看到一只圆形脸的 Bot 和一只心形脸的 Bot
    when: 对比这两行上的脸
    then: 心形没有被拉到和圆形一样的宽和高，仍是心形自己的比例；圆形脸保持原来的大小，不被缩小
  - id: AC-2
    given: 同一列表里还有云朵、六边形、水滴，以及名为 Super Bot 的豆形脸
    when: 看这些脸的外形
    then: 云朵仍比自己更高更宽，六边形和水滴仍比自己更宽更高，没有被压扁或拉长；云朵仍是云朵，花朵仍是花朵。Super Bot 和定义 Bot 时可选的豆形是同一张较小的横豆，不是铺满的青绿不规则块；六边形、云朵、花朵、水滴不被换成这张豆
  - id: AC-3
    given: 左侧列表里有多只 Bot，其中一行被选中
    when: 查看每只 Bot 的脸，包括被选中的行
    then: 脸外面没有圆润的横向长方形底，选中也不会在头像上多出一圈框
  - id: AC-4
    given: 一只 Bot 用自己的心形和颜色，另一只用自己的圆形和颜色
    when: 在左侧列表里看这两张脸
    then: 心形仍是心形，圆形仍是圆形，颜色仍是各自的颜色；心形没有被改成圆形，也没有换成另一只 Bot 的颜色
  - id: AC-5
    given: 列表里有不同脸型的 Bot
    when: 看脸上的眼睛和嘴巴，并阅读这一行的名字和名字下面的一行字
    then: 眼睛和嘴巴仍在各自的脸形里面，轮廓没有被裁掉或挡住；名字和下面的文字露在脸的旁边；不同脸型的行一样高
  - id: AC-6
    given: 同一左侧列表里还有不带机器人脸的行
    when: 查看这些行
    then: 这些行不出现机器人脸，也没有横向长方形底
  - id: AC-7
    given: 某只 Bot 用的是自己的图片或表情，而不是画出来的脸
    when: 在左侧列表里看它
    then: 图片或表情仍是原来的那一个，没有被换成心形或圆形；它外面也没有横向长方形底
  - id: AC-8
    given: 脸上会有轻微的待机小动作
    when: 看着脸动一下
    then: 小动作不改变脸的宽和高；列表里没有一块底板跟着脸一起出现

