id: tool-search-experiment
title: 可切换的增强工具检索实验
status: implemented
requirement: |
  那你用配置来配合，帮我完成这个功能开发吧，搞好了，我去实验下效果
notes: |
  assumedApproval: standing-order-2026-10-22
  复用工具提供方式配置，默认保留原有关键词策略；增强策略不缩减常驻工具、不自动卸载，不改变现有权限和全量模式。
criteria:
  - id: AC-1
    given: 用户未选择增强检索
    when: 保存搜索策略并继续对话，或恢复原有策略
    then: 默认仍是原有关键词策略；选择持久保存并立即用于后续搜索；非法值被拒绝且原配置不变
  - id: AC-2
    given: 用户启用增强检索且有可用的股票查询工具
    when: 搜索中文股价需求、英文同义词或精确工具名
    then: 能找到相关工具；精确名称优先；最多自动加载五个工具且不执行它们
  - id: AC-3
    given: 工具已经加载、被禁用或被权限限制
    when: 使用增强检索再次搜索
    then: 已提供工具明确标记为可调用且不重复加载；禁止的工具不出现在结果和分类里；加载失败明确报告
  - id: AC-4
    given: 增强检索无匹配结果或某类工具较多
    when: Agent 搜索或按分类翻页
    then: 无结果时返回当前授权范围的分类入口和后续指引，不加载无关工具；分类结果可以分页且不会一次提供全量定义
  - id: AC-5
    given: 用户打开 Lab 的工具提供方式设置
    when: 切换检索策略并刷新页面或切换界面语言
    then: 中英文界面均显示并保留所选策略，解释全量和两种渐进策略的实验方式
  - id: AC-6
    given: 增强检索用于渐进模式的对话
    when: Agent 搜索所需工具并继续下一轮
    then: 下一轮可以真实调用新加载的工具；工具结果包含策略、候选数和加载清单以支持实验对比，默认提示指引无结果后的恢复
