id: bot-working-animation
title: Bot 工作期间持续动态、列表待机保持活性
status: implemented
owner: user
requirement: |
  最好加个特性，如果bot在干活，他就表情和动作一直在动，如果没干活再静止
notes: |
  按已批准 bot-list-idle-motion 更新：列表待机播放轻动作，其他位置空闲静止，以真实工作状态决定工作动画。
  思考、生成回复、执行工具和等待工具结果均属于工作中；仅排队、暂停或等待人工审批不算正在执行。
  用户切换会话不改变 Bot 的实际工作状态。
criteria:
  - id: AC-1
    given: Bot 正在思考、生成回复、执行工具或等待工具结果
    when: 用户持续查看该 Bot 的头像
    then: 机器人头像的表情和身体动作持续循环变化，整个工作期间不会播放一遍就停止，也不会因为暂时没有新文字而变回静止
  - id: AC-2
    given: 同一个 Bot 的头像同时出现在列表、当前对话或群聊当前成员区
    when: Bot 开始或结束实际工作，或者用户切换会话、刷新页面
    then: 这些位置均按该 Bot 的真实工作状态显示工作或待机表现；列表待机使用间歇小动作，其他位置空闲静止，群聊中未工作的成员不会因其他成员工作而一起动
  - id: AC-3
    given: Bot 已完成、失败、取消、暂停、正在排队或等待人工审批，且没有其他正在执行的工作
    when: 用户查看该 Bot
    then: 头像停止工作动画；列表使用间歇待机小动作，其他位置显示静止的对应状态，且不显示工作中
  - id: AC-4
    given: 同一个 Bot 有多个并行工作
    when: 其中一个工作结束，而另一个仍在执行
    then: 头像持续显示工作动画，直到最后一个正在执行的工作结束后才切回待机表现
  - id: AC-5
    given: Bot 使用自定义图片或 emoji 头像
    when: Bot 开始或结束实际工作
    then: 工作期间也有持续且可辨认的状态动效，结束后保留原头像；列表切回轻快待机动作，其他位置静止
  - id: AC-6
    given: 用户在系统中开启了减少动态效果
    when: Bot 正在工作
    then: 避免持续晃动，仍能通过明确的状态提示区分工作和空闲
