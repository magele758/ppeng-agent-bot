id: bot-finish-follow-through
title: Bot 收尾时由运行时盯着做完
status: implemented
requirement: |
  用户反馈：Bot 完成目标的能力弱，经常停下来等用户指导，希望运行时在收尾时检查并盯着 agent 做完，而不是只靠 agent 自觉。

  A. 后续消息接续未完成目标 + 无目标 run 的轻量收尾检查
  - Bot 私聊里，当该会话存在最近的未完成目标（运行中/排队/等待/受阻/待审核等非终态，具体哪些状态可接续由你按现有状态机判断）时，「继续/接着做/go on」类催促、进度追问（「什么进度了」「跑完了吗」「干完了吗」）以及明显针对该目标的追问，应当绑定到该目标上执行，使收尾时有判官检查；「继续」类应当真正推进目标而不是只回答一句。不要因此把真正的闲聊、无关问句变成任务；不要推翻 bot-goal-only-when-needed 里「独立的分析/说明/检查类新请求不建新目标」的既有约定——这里是接续旧目标，不是新建。
  - 没有绑定任何目标的 Bot run 在软停时做一次轻量收尾检查：确定性信号优先（本轮 run 内写入或更新过的 todo 仍有未完成项；注意不要用会话里残留的旧 todo），另加一个语义判断（可复用现有 completeText 判官通道）识别「承诺了继续做却没做 / 在明显可自行决定的下一步上停下来问用户」。命中则注入续跑消息继续，而不是结束。必须放过：答完问题后的可选提议、确实需要用户提供的东西（登录、凭证、不可逆操作确认、用户要求先讨论）。
  - 续跑必须有上限和「连续无进展即停」（例如被打回后没有新的工具调用或产出就停），并且绝不覆盖：等审批、ask_user、用户中止、预算或尝试次数耗尽、循环防护/复读/思考空转等 recovery 中止。判官出错时的行为要明确（有限次重试后放行，并在 trace 里记为出错放行）。

  B. 异步等待必须登记唤醒
  - run 要结束时，如果本轮自己起了仍在运行的后台/远端长任务，或回复里承诺「稍后/有结果再汇报」，而没有登记任何持久的等待或定时唤醒，就不能直接放行：要么打回让 agent 用现有机制登记唤醒，要么由运行时自动登记一次到期唤醒。唤醒触发后 bot 应核验状态并向用户汇报或继续推进。
  - 唤醒要有次数/时长上限，避免无限轮询；用户可见的回复不要刷屏。
  - 「说了稍后汇报但没登记等待」要有 trace 标记。

  C. 轮数上限不再伪装成正常结束
  - 因轮数上限收尾的 run（包括最后一轮被强制文本回答的情况）要有可区分的终结原因，不再记成普通 end；trace 与 run 结局归类要一致。
  - 已绑定目标且目标未完成时，达到轮数上限不应让主对话静默停住：在目标预算/尝试次数限额内继续推进（复用现有续跑路径即可），并让用户看得到「还在继续」。成本由现有目标预算兜底。

  D. 可观测性
  - Bot 收尾判官及新加的轻量收尾检查每次判定都发 trace：结论、理由、来源、是否出错或超时放行、已续跑次数。
  - intake 分类结果与降级原因（如因问号降级、self-contained 释放、接续到哪个目标）完整落到 trace 或库。

  E. 提示语
  - 去掉循环防护提示里主动建议 ask the user 的措辞，改为先换策略、确实只有用户能解决时才问。

  开关与阈值走 Lab UI + 持久化配置，不新增环境变量；默认开启。
notes: |
  assumedApproval: standing-order-2026-10-22
  选择：接续只挂到 24 小时内动过、当前没有在别处执行的未完成目标；正在执行或等待中的目标只报状态。无目标收尾检查先用文字线索和本轮 todo 做预筛，再交给判官确认，判官拿不准一律放行。稍后汇报由运行时自动登记唤醒，不依赖模型自己登记。既有「同一执行最多一次修正」（bot-completion-reliability#AC-6）不变。
criteria:
  - id: AC-1
    given: Bot 私聊里有一个最近的未完成目标（排队、受阻、暂停或结果待审核），当前没有在别处执行
    when: 用户发「继续」「接着做」或「go on」
    then: 这一轮接到该目标上执行并推进，不新建目标，也不反问是哪个目标
  - id: AC-2
    given: Bot 私聊里有一个最近的未完成目标
    when: 用户追问进度，例如「什么进度了」「跑完了吗」「干完了吗」
    then: 目标没有在执行时，这一轮接到该目标上，回答进度后继续做；目标正在执行或等待中时只报告状态，不重复开工
  - id: AC-3
    given: 用户发来闲聊、无关问句、一件独立的分析或说明请求，或会话里没有任何未完成目标
    when: 消息被接收
    then: 不接续任何旧目标，也不因此新建目标；没有目标时说「继续」不会让 Bot 反问指的是哪个目标
  - id: AC-4
    given: 一轮没有绑定目标的 Bot 对话，回复里承诺接着做却停了、在可以自己决定的下一步上停下来问用户，或本轮写下的待办仍有未完成项
    when: Bot 准备结束这一轮
    then: 运行时让它继续做下去，而不是就此结束
  - id: AC-5
    given: Bot 已答完问题只是附带一个可选提议，确实需要用户登录、提供凭证、确认不可逆操作，用户要求先讨论，或只是闲聊；或待办是更早几轮残留的旧项
    when: Bot 准备结束这一轮
    then: 这一轮照常结束，不被打回
  - id: AC-6
    given: 一轮被收尾检查打回过
    when: 打回后没有新的工具调用，或已达到续跑上限
    then: 这一轮照常结束，不再打回；等待审批、等待用户回答、用户中止和防护中止的结束不受收尾检查影响
  - id: AC-7
    given: 收尾判官请求失败或返回无法解析
    when: 重试一次仍失败
    then: 这一轮照常结束，并记录为判官出错放行
  - id: AC-8
    given: Bot 回复里承诺稍后或有结果再汇报，本轮没有登记任何等待、定时任务，也没有仍在运行的后台任务
    when: 这一轮结束
    then: 运行时登记一次到期唤醒并留下「说了稍后汇报但没登记等待」的标记；到期后 Bot 被唤醒去核验状态并汇报或继续
  - id: AC-9
    given: Bot 承诺稍后汇报，但本轮已有仍在运行的后台任务、已建定时任务或已登记等待
    when: 这一轮结束
    then: 不再重复登记唤醒
  - id: AC-10
    given: 运行时已为同一件事连续唤醒到上限次数，或用户在唤醒到期前发来新消息
    when: 下一次唤醒本应登记或到期
    then: 达到上限后不再登记新的唤醒；用户的新消息让旧唤醒作废
  - id: AC-11
    given: 一轮对话到达轮数上限，最后一轮被要求直接作答
    when: 这一轮结束
    then: 终结原因记为轮数上限而不是正常结束，trace 与结局一致；例行任务、委派任务、群聊和等待仍把它当作有答复的结束来处理
  - id: AC-12
    given: 已绑定目标的一轮到达轮数上限，目标尚未被判定完成
    when: 这一轮结束
    then: 目标回到排队并在预算和尝试次数限额内由后续执行接着做，主对话出现「还在继续」的提示；限额用尽时停下并说明原因
  - id: AC-13
    given: 已绑定目标的 Bot 一轮准备结束，或无目标的一轮触发了收尾检查
    when: 判官给出结论、出错或超时
    then: 每次判定都留下可查的记录，包含结论、理由、来源、是否出错放行和已续跑次数
  - id: AC-14
    given: 用户在 Bot 私聊发来一条消息
    when: 消息被分类
    then: 留下可查的记录，包含分类结果以及降级原因，例如因问号按闲聊处理、因 Bot 自己就能做完而不建目标、接续到哪个目标
  - id: AC-15
    given: 负责人打开 Lab 设置
    when: 关闭收尾检查或自动唤醒，或调整续跑上限、唤醒次数与间隔并保存
    then: 设置立即生效且重启后保留；关闭后不再打回或登记唤醒；非法数值被拒绝
  - id: AC-16
    given: 循环防护发现重复失败并给出提醒
    when: 提醒注入对话
    then: 提醒先要求换策略，只有确实只有用户能解决时才建议询问用户
