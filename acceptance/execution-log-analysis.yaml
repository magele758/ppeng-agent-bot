id: execution-log-analysis
title: 执行日志能查出问题并指到具体调用
status: implemented
requirement: |
  帮我看看现在的agent的执行日志是否记录完成，我想要构建一套基于日志分析agent行为，发现问题，自己去排查问题，解决问题，提升整体能力的方案，分多个agent去帮我检查，如果没有就分多个agent去快速补全
notes: |
  assumedApproval: standing-order-2026-10-22
  同一轮补上对不上的调用、失败码、等待审批、缺失技能，以及从执行日志直接列出的问题。不自动改仓库、不新增环境变量。
criteria:
  - id: AC-1
    given: 同一轮里同一个工具被调用两次，一次成功，一次失败，失败有机器可读的错误码
    when: 查看这次会话的执行日志
    then: 两条记录各自带有调用编号，失败那条能看出错误码，不会和成功那条混在一起
  - id: AC-2
    given: 一份执行日志里有模型报错、输出被截断、以及因复读或空转而停止，没有对话正文
    when: 只根据这份执行日志列出问题
    then: 问题清单同时包含这三类，每一条有时间和一句话说明
  - id: AC-3
    given: 要加载的技能不存在，或同一个名字对上了不止一个技能
    when: 这次加载结束
    then: 执行日志记下所问的名字，以及被拒绝是因为找不到，还是因为名字不唯一
  - id: AC-4
    given: 模型点了一个当前没有的工具
    when: 查看执行日志并列出问题
    then: 这次尝试记成一次已结束的失败调用，带调用编号和错误码，并出现在问题清单里
  - id: AC-5
    given: 一次工具调用在执行前停下来等批准
    when: 查看执行日志并列出问题
    then: 能看出这次调用在等批准，而不是只有开始没有结束
  - id: AC-6
    given: 一份带有失败调用的执行日志
    when: 读取这份会话执行日志
    then: 同一次读取除了原始记录，还带上问题清单，清单里能指到失败调用的编号
  - id: AC-7
    given: 一轮开始时已经选定模型和本轮可用的工具
    when: 执行日志记下这一轮开始
    then: 记录里有模型名，以及本轮提供的工具名
