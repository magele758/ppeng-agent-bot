id: chat-bubble-written-stamp
title: 对话气泡不展示写入时间戳
status: implemented
requirement: |
  这个时间没必要每个都展示，怎么这么多奇怪的东西。
  对话气泡里不要再显示这种写入时间戳。若它只是给模型看的时间，留在模型上下文里，不要画进气泡。已经落库、正文开头就是 `[written …]` 的旧消息，展示时也去掉这一行，不要改历史库里的原文，除非它本来就不该存进用户可见正文。
  顺手看对话气泡里还有没有同类泄漏（例如单独一行的时区戳、内部标记被当成正文）。只收掉这类不该给用户看的标记，不要改助手真正要说的话，也不要拆掉「纠错转评测」、工具过程这些已有控件。
notes: |
  assumedApproval: standing-order-2026-10-22
criteria:
  - id: AC-1
    given: 助手气泡正文开头是单独一行写入时间，例如 [written 2026-10-27 17:29 Asia/Shanghai]，后面还有助手要说的话；这条原文已经在对话记录里
    when: 对话里展示这条气泡
    then: 气泡里看不到这行写入时间，后面的正文还在；纠错转评测和工具过程还在
  - id: AC-2
    given: 同样的写入时间，或一行给模型看的会话时钟标记，单独成行出现在正文开头或中间
    when: 对话里展示这条气泡
    then: 这些标记行不出现，标记前后助手真正要说的话都还在
  - id: AC-3
    given: 助手只是在正文里提到日期、时区，或别的方括号标记，并不是单独一行的写入时间或会话时钟
    when: 对话里展示这条气泡
    then: 这些话原样还在
