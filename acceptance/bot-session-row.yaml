id: bot-session-row
title: 单 Bot 会话行显示名字、问题和活体脸
status: implemented
notes: |
  负责人在这条需求里明确要求现在就实现并合并。验收标准按该说明视为已批准。
  活体脸沿用输入框 Bot 选择器已经在用的那一个组件，不另画一张脸。
  AC-5 的 Bot 行操作已按负责人批准的 bot-entry-simplification AC-7 同步为保留历史的确认移除；普通会话删除语义保持不变。
requirement: |
  选中的 Play 侧边栏会话行不要再显示「Bot Chat」前缀，也不要把原始 bot id 当副标题。
  单个 Bot 的会话行显示这只 Bot 的名字，以及这条对话里最后一条用户问题。
  还没有用户问题时，用一句很短的空状态文案，不要显示 id。
  问题只占一行；悬停时横向滚动，能读完整句，不能把这一行撑高换行。
  这一行上显示这只 Bot 的活体脸：会眨眼、眼睛跟着指针、颜色由名字决定，
  和输入框里 Bot 选择器使用的是同一个组件。
  多 Bot 群聊行可以保留自己的标记。普通会话标题保持原样。删除仍然可用。
criteria:
  - id: AC-1
    given: 侧边栏里有一条单个 Bot 的会话，用户已经问过问题
    when: 用户查看这一行
    then: 行上是这只 Bot 的名字和最后一条用户问题，没有「Bot Chat」前缀，也没有原始 Bot id
  - id: AC-2
    given: 这条单个 Bot 的会话里还没有任何用户问题
    when: 用户查看这一行
    then: 副标题是一句很短的空状态提示，不是 Bot id
  - id: AC-3
    given: 最后一条用户问题比这一行更长
    when: 用户把指针停在这一行上
    then: 问题保持一行，并横向滚动到能读完，这一行不会变高换行
  - id: AC-4
    given: 这一行是单个 Bot 的会话
    when: 用户查看这一行
    then: 行上有这只 Bot 的活体脸，和输入框里 Bot 选择器使用的是同一种会动的脸
  - id: AC-5
    given: 列表里还有普通会话，以及多 Bot 群聊行
    when: 用户查看列表并操作单个 Bot 行上的移除入口
    then: 普通会话标题保持原样，群聊行仍能辨认是群；Bot 行提供标明名称并说明保留历史的移除确认入口，普通会话仍保留删除能力
