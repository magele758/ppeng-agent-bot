id: session-multiprocess-state-consistency
title: 多进程会话状态一致性修复
status: implemented
requirement: |
  确认，这 15 条验收标准可以，按项目规范开始实现多进程并发验证，先写失败测试再实现，保留现有重启恢复、生命周期和工具配对验证；发现新的产品缺陷后另提修复验收给我确认。
notes: |
  这是多进程验证发现的产品缺陷修复标准，用户已确认授权实现；原十五条验证标准及现有重启恢复、生命周期、工具配对标准原文全部保留。
  证据见 doc/formal/session-multiprocess-concurrency-findings.md 及对应 evidence.json；真实进程场景涵盖 chat/task、首次争抢、存活占用、结束与崩溃后接续、旧结果与释放、最后审批及并发恢复。
  修复范围为同机共享健康本地数据库的普通会话，不新增配置开关，不扩大到多机或 Bot 专用队列。
  已发出的外部请求与未确认副作用不能保证撤回；不得借修复静默重放。取消后的旧审批恢复与用户明确发起的新运行必须区分。
  每条先写带本规格标签的失败测试，再修复；修复后运行本次多进程验证及全部既有三组验证和相关测试。若涉及 agent-loop，按仓库要求同步 SDK 技能并运行 SDK 测试与构建。
criteria:
  - id: AC-1
    given: 两个进程竞争同一会话，包含首次开始、已有有效运行、原运行结束或原进程退出后的合法接续
    when: 竞争请求完成
    then: 可开始工作时恰有一个竞争者获得写入资格并推进；已有有效占用不被覆盖，竞争失败明确返回占用冲突且不启动重复工作，合法释放或恢复后新工作能够继续，其他会话仍可独立运行
  - id: AC-2
    given: 旧运行已失去资格，新运行正在执行或已有确定的结束结果
    when: 旧模型或工具返回，或旧运行继续执行基于先前状态的结束和释放清理
    then: 新运行的占用、状态、结束原因及已保存消息结果保持不变，旧操作被拒绝且可识别，旧清理不能释放新占用，工具历史仍合法配对
  - id: AC-3
    given: 会话等待审批，两个进程并发决定同一事项，或非原执行进程决定最后一项审批
    when: 审批请求及重复请求完成
    then: 每项审批只保留一个不可被覆盖的最终决定，响应明确反映已保存决定或冲突；最后一项决定能正常完成且只产生一份继续执行记录，部分审批仍等待剩余事项
  - id: AC-4
    given: 全部审批已有决定，两个进程同时恢复同一暂停运行
    when: 恢复执行结束，并再次提交原决定或恢复请求
    then: 只有一个恢复执行者推进剩余工作，已获准且未完成的操作只执行一次，被拒绝的操作不执行，已保存结果不重放，最终等待状态及写入占用正确清理
  - id: AC-5
    given: 会话仍等待审批，或最后决定已保存但尚未继续执行，或审批恢复刚开始
    when: 用户取消本次运行，随后其他进程提交旧审批决定或触发原审批恢复
    then: 取消生效并保留一致结果，迟到审批不能复活旧运行或发起新的工具工作；用户之后明确发起的新运行仍能正常推进，不受旧审批驱动
