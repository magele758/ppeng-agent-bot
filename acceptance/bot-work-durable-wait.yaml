id: bot-work-durable-wait
title: Bot 任务停在持久等待上并只恢复一次
status: implemented
requirement: |
  如果bot在执行过程中，服务重启了，之前的任务就直接停了，重启之后，也没有继续执行。Bot 任务在等待自己启动的后台命令时，要停在持久等待上；重启后条件没满足就不叫模型，条件满足后同一任务只恢复一次。
notes: |
  assumedApproval: standing-order-2026-10-22
  本轮只覆盖任务自己启动的后台命令。子会话要等子执行结束才返回，委派也不在同一条返回路径上，所以这两类还没有停在持久等待上。
criteria:
  - id: AC-1
    given: 一个 Bot 任务正在执行，并启动了它自己拥有的后台命令
    when: 宿主为这条命令登记持久等待，并且这一轮模型执行结束
    then: 任务不会因为这一轮结束而被当成完成
  - id: AC-2
    given: 进程已经不在，持久等待仍在等待，后台命令还没有结束
    when: 工作调度再走一轮
    then: 不会调用模型
  - id: AC-3
    given: 同一条后台命令随后进入终态
    when: 工作调度再走一轮，然后再走一轮
    then: 同一个任务只恢复一次，继续执行时能看到这次观察；第二轮不会再次恢复
  - id: AC-4
    given: 等待指向另一个 Bot 的会话，或者条件格式不合法，或者观察暂时不可用
    when: 登记或再次调度
    then: 越权或非法条件被拒绝；不可用的观察不会被当成成功，也不会恢复任务
  - id: AC-5
    given: 进程已经不在，会话仍显示为执行中，写入者已经不在，后台命令随后进入终态
    when: 工作调度再走一轮，然后再走一轮
    then: 同一个任务只恢复一次，继续执行时能看到这次观察
