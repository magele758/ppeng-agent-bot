id: session-multiprocess-concurrency-verification
title: 多进程并发验证：写入占用、迟到结果与审批恢复
status: implemented
requirement: |
  继续把验证扩大到多进程并发，重点检查同一会话的写入占用争抢、旧进程迟到结果和审批恢复时的状态一致性，按项目规范先写验收标准给我确认。
notes: |
  本次新增验证，不预先授权修复产品行为。发现新产品缺陷时保留失败证据，另提修复验收交用户确认；不得弱化现有或本次标准消除失败。
  覆盖同机、同一健康本地数据库、普通对话与任务，至少两个同时存活的真实操作系统进程；必要时增加后继进程检查接管与再次恢复。
  关键并发窗口包括首次争抢、已有运行占用、运行结束释放、旧占用失效与新运行建立、部分审批及最后一项审批决定保存后的恢复。
  使用真实运行时及持久化入口，以进程间阶段屏障控制事件顺序，模型和工具输入输出可控；不能用单进程对象或直接改数据库状态代替多进程行为证据。
  旧运行失去资格的场景通过正常取消、结束或既有合法恢复流程建立，不要求新增强抢有效占用的能力；进程存活、暂停或墙钟时间经过本身不是任意夺取有效占用的授权。
  审批为仍有效且未撤销的原审批，覆盖最多两项审批；决定内容、权限与原操作关联必须保留，并发不扩大权限。到期或撤销继续遵守原策略。
  外部副作用发生而结果未保存时，只要求标记未确认并阻止盲目重放，不承诺外部系统恰好一次执行或自动撤销；旧执行已发出的外部请求不要求能被强制撤回。
  有界模型结果与真实多进程结果分别报告；固定场景覆盖关键竞争顺序，不宣称穷尽任意进程数、所有调度或无限期公平性。
  不覆盖多机或网络文件系统、网络分区、整机断电、数据库损坏或版本迁移、Bot 专用队列及独立调度任务的完整并发协议，也不扩大为完整 daemon HTTP 或界面验证。
  不新增配置界面或环境变量。现有重启恢复、生命周期、工具配对标准原文及门禁完整保留；旧验证的单进程范围不修改，由本标准补充并发范围。
criteria:
  - id: AC-1
    given: 同一会话没有有效的运行占用，两个进程同时尝试开始运行
    when: 两个请求完成争抢
    then: 恰有一个运行取得写入资格并推进，另一个明确收到占用冲突且不启动重复的模型或工具工作，不改变获胜运行的状态
  - id: AC-2
    given: 一个进程持有同一会话的有效运行占用，正在等待模型、执行工具或等待重试
    when: 另一个进程启动恢复检查并尝试运行该会话
    then: 原占用不被夺取，原运行不被误判中断；竞争请求明确冲突，不重放原工作
  - id: AC-3
    given: 一个进程未取得占用，或旧运行已失去资格且该会话已有新运行
    when: 该进程迟到地执行释放、取消或结束清理
    then: 当前运行的占用、状态和结束原因保持不变，旧清理不能释放当前运行的写入资格
  - id: AC-4
    given: 原运行已经结束，或原进程退出且旧占用已可按现有规则恢复
    when: 两个进程竞争接续该会话的新工作
    then: 恰有一个新运行获得资格并正常推进，不被残留占用永久阻塞，也不重复恢复旧工作
  - id: AC-5
    given: 旧运行已有延迟返回的模型或工具请求，失去写入资格后会话已开始新运行
    when: 旧请求的内容、结果或结束通知到达
    then: 旧返回不能追加为新运行的消息或结果，不能改写当前状态与结束原因，也不能据此启动后续工具工作；被拒绝的旧返回有可识别记录
  - id: AC-6
    given: 两个进程同时提交同一审批事项的相同或相反决定
    when: 两个审批请求处理完成
    then: 该事项只保留一个最终决定，响应明确反映已保存决定或冲突，重复请求不新增重复的继续执行记录，后来的请求不能覆盖已有决定
  - id: AC-7
    given: 会话等待两项审批，只有其中一项已决定或正在被并发决定
    when: 其他进程读取状态或尝试恢复会话
    then: 已保存决定保留，会话继续明确等待剩余审批，未全部决定前不执行审批后的工作，不生成重复审批
  - id: AC-8
    given: 最后一项审批即将完成或已保存，两个进程同时尝试恢复同一运行
    when: 审批恢复推进并结束
    then: 只有一个恢复执行者推进剩余工作，已批准且尚未完成的操作只执行一次，被拒绝的操作不执行，已保存完成结果不重放，最终状态与审批决定一致
  - id: AC-9
    given: 一个进程取消等待审批的运行，另一个进程同时提交审批决定或尝试恢复
    when: 两个操作按实际生效顺序完成
    then: 结果能对应一个明确的先后顺序；取消生效后旧审批不能使运行复活或发起新的工具工作，已确定的取消结果不被迟到恢复改写
  - id: AC-10
    given: 会话已保存部分工具结果，随后发生占用争抢、合法接续或旧结果迟到
    when: 查看历史并准备后续模型输入
    then: 已保存结果保留且不重复，未确认操作不伪造成功或盲目重放，消息顺序无冲突，模型输入中的工具调用与结果合法配对
  - id: AC-11
    given: 一个会话正在发生占用冲突，另一个会话具备独立运行条件
    when: 其他进程运行另一个会话
    then: 另一个会话能够正常推进，其消息、审批、占用与结束结果不受前一会话争抢或清理影响
  - id: AC-12
    given: 开发者运行多进程并发验证
    when: 查看验证报告
    then: 能分别看到有界模型与真实多进程结果，并识别各进程、运行及占用归属变化、关键事件顺序、预期和实际结果以及范围与排除项；单进程模拟或模型通过不能替代真实并发验证
  - id: AC-13
    given: 在隔离环境分别引入允许双重占用、接受旧运行迟到写入或释放、重复推进审批恢复的真实代码缺陷
    when: 运行验证并恢复原始代码
    then: 三类缺陷分别使原本通过的场景新增失败并留下可复现证据，恢复后结果与演练前一致，原有失败不能算作检出新缺陷
  - id: AC-14
    given: 开发者使用固定版本的验证工具且不配置真实模型密钥
    when: 重复运行受控竞争场景，或遇到子进程失败、阶段同步失败、超时、检查未完成及证据缺失
    then: 相同代码与受控事件顺序得到一致判定；未完成时明确报告原因并使门禁失败，不因缺少结果而误报成功
  - id: AC-15
    given: 后续修改触及已覆盖的占用、迟到写入、审批恢复行为或验证规则
    when: 尚未复核代码与验证范围的对应关系，或现有重启恢复、生命周期、工具配对验证未通过
    then: 门禁阻止沿用旧的通过结论，并提供可按项目指引复核和重新验证的说明
