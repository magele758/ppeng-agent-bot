id: bot-detail-routine-switch
title: Bot 详情里用开关控制定时任务
status: draft
requirement: |
  问题：
  1、这里用Switch开关来控制定时任务
  2、如果bot需要持续盯着某个任务，可以让bot去通过定时任务去处理类似的工作
notes: |
  详情里现在是「已开启」加一个写着「关闭」的文字按钮，下次时间直接显示成 2026-10-20T08:31:45.000Z。
  本次只改用户能看到的控制方式和时间读法，并让 Bot 能用定时任务去盯还在做的工作。
  不改变实时插话何时开始被处理。不新增环境变量，也不为此重启。
  「允许通过对话创建定时任务」仍是现有的那一项设置，默认可用；关掉后对话里不能新建会执行的定时任务。
  短于一分钟的间隔仍不能保存。错过的触发仍按这条任务原来的处理方式，不在这里改掉。
  需要人确认才能安排时，确认前任务不算成立。
  只等外部事件、本来没有下次钟点的任务，不要硬补一条下次时间。
  文件资料和记忆这两页不在本次范围。
criteria:
  - id: AC-1
    given: 当前 Bot 详情的定时任务里有一条还会再跑的任务
    when: 用户查看这条任务
    then: 用来开和关的是一枚可以拨开、拨关的开关，开关处于打开，表示这条任务还会再跑；卡片上没有写着「关闭」或「开启」的文字按钮
  - id: AC-2
    given: 这条任务的开关开着，约定的下次时间还没到
    when: 用户把开关关掉，并一直关到那个时间
    then: 开关处于关闭，到了那个时间这条任务不会执行；卡片不会一边关着开关、一边让人以为到点还会自动跑
  - id: AC-3
    given: 用户在下次时间到达前关掉了这条任务，这段时间它没有执行
    when: 用户在那个时间还没到时再把开关打开
    then: 开关回到打开，到了原来的下次时间这条任务会执行
  - id: AC-4
    given: 一条开关打开、还会在未来某个时刻自动执行的定时任务
    when: 用户在该 Bot 详情的定时任务里看下次执行时间
    then: 看到的是按用户当前时区换算后、人能直接读出的日期和钟点；不会出现 2026-10-20T08:31:45.000Z 这种中间带 T、结尾带 Z 的时间原文。用户若在东八区，协调世界时 08:31 应能读出当天 16:31
  - id: AC-5
    given: 同一条任务被关掉，卡片上如果还留着时间
    when: 用户再看这条任务
    then: 时间仍是人能读的日期和钟点，不会改回带 T 和 Z 的时间原文；开关是关的，并且能看出这段时间不会自动执行
  - id: AC-6
    given: 同一个 Bot 有两条定时任务，一条开着，一条关着
    when: 用户只拨动其中一条的开关
    then: 只有这一条的开关、以及它还会不会再跑，变成新的状态；另一条保持原样
  - id: AC-7
    given: 用户拨动开关时，这次没能保存成功
    when: 保存失败
    then: 开关停在拨动前的位置，并出现失败说明；这条任务还会不会再跑，也保持拨动前
  - id: AC-8
    given: 允许通过对话创建定时任务，用户正在和这只 Bot 对话，它正在做一件还没做完的工作（例如查差距分析）
    when: 用户让它过一会儿再盯一次这件事（例如五分钟后再查一次）
    then: 这只 Bot 安排出一条定时任务；若按现有规则需要人确认，确认后才成立，确认前不会到点执行。成立后出现在该 Bot 详情的定时任务里，名称能对上这件事，开关是打开的，并用这枚开关控制。不需要新增环境变量，也不需要重启
  - id: AC-9
    given: 这条刚由对话安排出来的盯办任务已经出现在详情里，开关开着，约定时间还没到
    when: 用户用这枚开关把它关掉，再在时间还没到时打开
    then: 关掉期间到了约定时间也不会执行；重新打开后，到了约定时间会执行
  - id: AC-10
    given: 允许通过对话创建定时任务，这只 Bot 需要按一个往后重复的节奏持续盯一件正在做的工作
    when: 用户在对话里让它按不少于一分钟的间隔反复去看这件事
    then: 详情的定时任务里出现这一条，开关打开；关掉后不再按这个节奏自动执行，再打开后恢复后续的自动执行
  - id: AC-11
    given: 用户已经关掉「允许通过对话创建定时任务」
    when: 在对话里让这只 Bot 新建一条定时任务去盯工作
    then: 不会出现一条新的、到点会执行的定时任务
  - id: AC-12
    given: 甲 Bot 刚刚通过对话安排了一条盯办任务
    when: 用户打开乙 Bot 详情里的定时任务
    then: 乙的列表里没有甲这条任务
  - id: AC-13
    given: 一条定时任务只等外部事件到来才执行，本身没有下次钟点
    when: 用户在详情里看它
    then: 不显示「下次」后面跟着一串时间原文，也不编造一个下次钟点；开关打开表示还会响应这类事件，关掉表示不会
  - id: AC-14
    given: 一条任务在开关关掉期间错过了原本的触发
    when: 用户再打开开关
    then: 任务恢复为还会继续按原定安排执行；这次错过要不要补跑，仍按这条任务原来的错过处理方式，不因本次改动改变
  - id: AC-15
    given: 这只 Bot 还在对话里干活
    when: 用户发出一条实时插话
    then: 这句话何时开始被 Bot 处理，与现在相同；安排定时任务或拨动定时任务开关，不会让插话提前或推迟生效
