id: pnpm-migration
title: 全仓库迁移至 pnpm 并完成回归
status: implemented
requirement: |
  那就整体迁移到pnpm，做好回归
notes: |
  迁移依赖安装与仓库任务执行，保留 Node.js 运行时。统一使用固定版本的 pnpm 与单一安装锁文件。
  npm registry、公开包名称及消费者使用 npm 安装的能力继续保留；公开发布所需的 npm 官方认证、OIDC 或发布命令可以保留，不要求把这些用途机械替换为 pnpm。
  当前开发、运维与贡献指南同步更新；历史报告、已批准验收正文和历史版本快照保留原文。历史版本验证应兼容当时的安装方式。
  先为批准条款补失败测试再实现；回归包含全量单测、agent-loop SDK 测试与构建、形式验证、包产物验证、集成、回归、浏览器与软件验收门禁。失败不得通过删减检查、降低阈值或新增跳过项规避。
  安装性能记录冷缓存与热缓存的环境、耗时和磁盘占用；报告实际结果，不预设提速比例。验证不得发布包、部署生产或自动合并其他业务变更。
criteria:
  - id: AC-1
    given: 开发者在满足文档前置条件的新检出目录中尚未安装依赖
    when: 按指南启用指定版本的 pnpm 并执行安装
    then: 所有工作区依赖安装成功，内部包正确链接到当前仓库，后续操作不要求先执行 npm install
  - id: AC-2
    given: 仓库已提交统一的依赖版本记录
    when: 本地或 CI 重复执行冻结安装，或依赖声明与版本记录不一致
    then: 一致时可重复安装且不改写版本记录，不一致时明确失败，不静默更新或回退到另一套安装记录
  - id: AC-3
    given: 开发者已使用 pnpm 安装依赖
    when: 执行 pnpm dev，并在默认端口已被占用时再次启动
    then: Daemon 与 Lab 能正常启动并连通，端口自动选择继续有效，停止命令后相关子进程退出
  - id: AC-4
    given: 开发者使用 pnpm 安装依赖
    when: 执行工作区构建及现有单独启动入口
    then: SDK、领域包、Daemon、CLI、Lab 和桌面端适用构建成功，已有启动参数与输出产物保持可用
  - id: AC-5
    given: 仓库任务之间存在转调以及向子任务传递参数的情况
    when: 通过 pnpm 执行开发、测试、评估或运维任务
    then: 子任务在正确工作区执行并收到原有参数，失败和中断能正确传回，普通仓库任务不再依赖 npm 或 npx 转调
  - id: AC-6
    given: 自动化流水线从干净检出开始运行
    when: 执行现有 CI、验收、质量、基准及发布准备检查
    then: 使用指定版本的 pnpm 安装和执行任务，缓存与冻结安装匹配，原有检查及失败阻断均保留
  - id: AC-7
    given: 使用仓库提供的 Daemon 和 Lab 容器构建入口
    when: 从干净环境构建并启动镜像
    then: 构建通过 pnpm 获取所需依赖，运行镜像中依赖完整，Daemon 健康检查与 Lab 代理访问成功
  - id: AC-8
    given: 自愈或 Evolution 在隔离工作目录中执行已授权工作
    when: 安装依赖、构建、运行白名单测试或处理失败与取消
    then: 工作流使用 pnpm 正常完成相应阶段，失败和取消仍被记录，既有审批、沙箱及凭据隔离不被放宽
  - id: AC-9
    given: 回归需要检出历史版本或恢复历史数据库
    when: 生成迁移快照并执行历史升级、停止后回滚及形式验证
    then: 新旧版本均能获得各自正确的依赖，原始数据及验证结论保持正确，不因依赖布局变化串用当前源码
  - id: AC-10
    given: 维护者准备公开 SDK 的发布产物
    when: 通过 pnpm 执行只验证而不发布的打包检查，并在独立消费者项目安装产物
    then: 产物可以被 npm 消费者正常安装和使用，不含无法解析的仓库内部依赖，mini 的便携性及各装配档位契约保持有效
  - id: AC-11
    given: 新版安装器需要决定是否执行依赖包的构建脚本
    when: 安装并运行图像处理、桌面端等使用原生或平台依赖的现有功能
    then: 所需依赖经过明确配置后可用，不以全局放开全部依赖脚本或隐藏安装失败来通过检查
  - id: AC-12
    given: 仓库完成 pnpm 迁移
    when: 执行全量单测、SDK 测试与构建、形式验证、包检查、集成、回归、浏览器和软件验收门禁
    then: 所有适用检查通过，已有跳过项被如实列出且不新增跳过项，不删除或弱化原有测试与验收标准
  - id: AC-13
    given: 开发者首次使用或维护本项目
    when: 阅读当前安装、启动、测试、CI、容器及发布指南
    then: 指南与实际 pnpm 命令及版本要求一致，保留 npm 的发布和消费者用途被清楚说明，不出现相互矛盾的安装指引
  - id: AC-14
    given: 开发者只按指南准备 Node.js 与 pnpm
    when: 在隔离环境运行主要开发及验证流程
    then: 流程不会因缺少 npm 或 npx 仓库任务执行器而失败，也不会自动下载其他包管理器绕过迁移
  - id: AC-15
    given: 维护者需要了解此次迁移的实际安装收益
    when: 在相同依赖版本和可比环境下对迁移前后进行冷缓存与热缓存安装测量
    then: 提供环境、安装耗时及磁盘占用的对照记录，明确未测项与结果限制，不将估算或缓存差异当成已证实的提速
