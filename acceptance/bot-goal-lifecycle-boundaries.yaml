id: bot-goal-lifecycle-boundaries
title: Bot 目标跨用户与执行生命周期闭环
status: implemented
requirement: |
  按你分析的优先级，把这七个问题完整修掉，补齐跨状态、跨执行入口和跨用户的回归测试，再审查一遍整个链路，没问题就提交 PR 合并。
notes: |
  assumedApproval: standing-order-2026-10-22
  普通多目标列表仍保持两条门槛；单个待验收、受阻或暂停目标使用独立处理卡片，不改变原多目标列表的显示规则。
criteria:
  - id: AC-1
    given: 不同用户或来源向同一 Bot 委派工作，接收方已有自己的目标
    when: 工作排队、开始、完成或再次尝试
    then: 只有本次接收会话继承本次委派来源，排队任务不覆盖正在执行的任务，其他用户及接收方自己的目标不变，旧尝试结果不提前结束新尝试
  - id: AC-2
    given: 子任务已创建但没有执行结束的记录
    when: 原目标从运行中或等待中检查结果
    then: 不认为子任务完成且不续派；真实结束、失败或取消才按实际结果回流，重启后仍遵守这一规则
  - id: AC-3
    given: 仅有一个目标需要验收或恢复
    when: 用户打开其对话
    then: 能直接接受、退回或处理恢复，状态正确翻译，普通单目标不出现多目标列表
  - id: AC-4
    given: 最后一次允许的执行或预算耗尽时已有未核验结果
    when: 核验不可用或没有通过
    then: 结果仍待验收且可接受或退回，不自动重复执行，新的执行仍受额度约束
  - id: AC-5
    given: 已到并发上限且外部子任务、委派或团队工作仍在运行或停止中
    when: 另一件工作申请执行
    then: 等待容量，外部工作结束并回流后才允许执行，不影响其他用户的独立额度
  - id: AC-6
    given: 目标正在等待已有工作，或尚有工作未停止
    when: 用户通过对话或操作接口要求恢复
    then: 保留原等待和执行引用，不开始重复执行；只有已暂停或受阻且原工作已确认停止的目标可恢复
  - id: AC-7
    given: 一件目标费用耗尽或尝试额度不足
    when: 用户在界面为该目标增加预算或明确批准额外尝试
    then: 只修改该目标的额度，保留历史费用、尝试和结果，授权范围内可恢复，其他用户不能修改且默认预算设置不被改变
