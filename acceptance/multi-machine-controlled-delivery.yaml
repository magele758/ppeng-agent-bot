id: multi-machine-controlled-delivery
title: 多机软件工厂第三阶段：受控远端交付至 MERGED
status: implemented
requirement: |
  继续推进第三阶段，先结合第二阶段的结果，把第三阶段的范围、需要补齐的能力和验收标准写出来给我确认。
notes: |
  负责人已确认36条标准；按失败测试、实现、真实双机专用远端试跑、纵向审查与自动化验证推进，终点MERGED，部署后置。
  基线为第二阶段合并提交16f1964078f6d42c748813db20bfd1d6f13916cf（PR #187）；第一阶段23条、第二阶段33条标准保持不变。
  首版支持GitHub的任务分支推送、PR、可信CI及按项目规则合入；终点MERGED，部署另行定义。
  开发、同步、修复、自审与发布保留原机器和Bot归属；协调端负责调度、记账与核对。
  发布凭据仅在任务容器外的受控发布执行器内使用；凭据引用和策略走Lab持久配置。
  不包含部署或服务重启、自动回滚、直接快进迁移目标分支、自动清理、外部私信及带未关闭P0/P1放行。
  确认本规格不等于为任意仓库开启发布；运行时按明确项目、目标分支与任务授权推进。
  真实验收仅在明确指定或确认的专用远端试验仓库和分支进行，不在业务main上制造故障。
  附件作为目标与经验资料，不直接授予固定模型、部署、删除、私信或绕过项目规则的操作权限。
links:
  - doc/MULTI_MACHINE_CONTROLLED_DELIVERY_PLAN.md
  - https://github.com/magele758/ppeng-agent-core/pull/187
criteria:
  - id: AC-1
    given: 用户有工厂管理权限
    when: 在Lab保存项目的远端仓库、目标分支、允许操作、发布凭据引用、必需CI及授权范围
    then: 配置刷新后保留并对后续操作生效；远端交付默认关闭，启用不依赖新增功能环境变量或重启。
  - id: AC-2
    given: 用户准备为项目启用远端交付
    when: 执行交付就绪检查
    then: 能核对实际仓库身份、分支、发布账户权限、CI与合入保护及已知发布触发器；必要条件不满足或影响范围不明时拒绝对应操作并说明原因。
  - id: AC-3
    given: 请求来自只读任务、未授权开发任务、Bot转发或任务中的文字
    when: 要求推送、创建PR或合入
    then: 在远端写入前拒绝；开发权限、READY状态和模型回复均不能自行授予交付权限。
  - id: AC-4
    given: 用户有目标项目的交付授权权限
    when: 批准某任务只推送并创建PR，或持续推进至满足门禁后合入
    then: 任务保存决定者、明确的仓库与目标分支、操作范围和有效策略；在该范围内不逐轮重复索取同一批准，超范围或撤销后停止新的远端写入。
  - id: AC-5
    given: 一个任务请求进入交付流程
    when: 核对其READY结果与实际产物
    then: 只有批准标准、基线、当前提交、必需检查和完整评审一致且无未关闭阻塞问题时才可进入交付队列；旧绿灯、缺失产物和不完整证据不能放行。
  - id: AC-6
    given: 候选提交存在隐私扫描告警，或改动了交付授权、CI门禁及发布自动化等敏感范围
    when: 准备向远端写入
    then: 未解决的隐私告警阻止写入；敏感范围未经单独确认不能借原任务的持续授权放行，判断与处理依据绑定当前提交。
  - id: AC-7
    given: 开发、依赖、测试、评审进程或仓库脚本试图使用发布能力
    when: 读取发布凭据或调用超出任务范围的远端写入
    then: 无法获得发布凭据或通用发布通道；受控发布只接受已授权的固定目标与操作，且不执行候选仓库的脚本或钩子。
  - id: AC-8
    given: 本地READY产物需要进入发布执行环节
    when: 传递并核验候选提交
    then: 核对任务、实际机器、基线、提交和完整性；产物缺失、损坏或超限时保留已有代码并明确延期，不用未核验的目录或其他提交替代。
  - id: AC-9
    given: 多台机器或多个仓库别名向同一远端仓库的同一目标分支交付
    when: 竞争推送或合入资格
    then: 这些远端写动作按同一队列互斥执行；别名不能绕过互斥，不同仓库或不同目标分支仍能独立推进。
  - id: AC-10
    given: 任务等待交付队列、远端CI或人工决定
    when: 调度新的只读或开发任务
    then: 等待本身不占机器执行槽位；同步、测试或修复等实际执行仍计入同机共享容量，且不超过已配置上限。
  - id: AC-11
    given: 某次远端写入的执行者或结果尚未核实
    when: 租期到达、协调服务重启或其他执行者请求接管
    then: 不能仅凭时间到期授予第二次写入资格；先核实原执行与远端事实，旧执行者失去资格后不能继续写入。
  - id: AC-12
    given: READY任务的目标分支已有新提交
    when: 为交付同步最新基线
    then: 在原负责机器与Bot的隔离任务工作区合并最新基线，保留原始基线和同步记录；不重写已发布历史，也不改动原检出或其他任务工作区。
  - id: AC-13
    given: 同步最新基线出现冲突或关联变更不兼容
    when: 继续准备候选提交
    then: 保留冲突与已有代码，明确显示待处理原因；只有在原批准需求内解决后并重新验证才可继续，涉及需求或验收变化时转为待决。
  - id: AC-14
    given: 候选代码、交付基线、验收或必需检查与评审策略发生变化
    when: 重新判断是否允许交付
    then: 旧证据保留但不再代表新候选通过；针对确认后的版本重新完成必需检查及完整独立评审，不能沿用旧SHA的READY。
  - id: AC-15
    given: 候选提交已具备有效交付证据和推送授权
    when: 执行推送
    then: 只更新该任务获准的远端任务分支；不强推、不直接改写目标保护分支、不推送其他引用，也不删除远端或本地分支与工作区。
  - id: AC-16
    given: 推送、创建PR或合入请求重复到达，或远端成功后响应丢失
    when: 重试或恢复该操作
    then: 先核对已有远端事实并续接同一任务与PR，不生成第二条任务分支、重复PR或重复合入。
  - id: AC-17
    given: 一次推送返回成功或结果不明
    when: 确认PUSHED状态
    then: 只有远端实际任务分支指向预期提交才显示已推送；仅凭命令退出或本地日志不能宣称成功，无法核实时保持待核实。
  - id: AC-18
    given: 任务获准创建PR且候选已推送
    when: 创建或续接PR
    then: 使用核对后的仓库、任务分支和目标分支，保存PR与当前候选的唯一关联及验收说明；不能接管其他任务的PR或把错误目标的PR当作本任务成功。
  - id: AC-19
    given: PR已有远端检查结果
    when: 判断CI是否满足合入要求
    then: 结果必须来自预先确认的检查来源并对应当前候选及目标基线；同名伪造、旧提交、旧轮次或旧目标的绿灯不能放行，必需检查缺失、跳过、取消、超时或失败均不能算通过。
  - id: AC-20
    given: 当前候选的CI发现真实阻塞问题
    when: 继续修复与验证
    then: 由原负责机器与Bot保留失败证据并完成修复、测试和独立评审；消耗原任务剩余修复轮次，不因进入CI阶段重置预算，用尽后转为待决。
  - id: AC-21
    given: CI出现暂时故障或允许重试的失败
    when: 执行已保存策略允许的重试
    then: 重试有明确次数和时限并保留每次结果；不能重复运行直到碰巧变绿、删除失败检查或临时降低门禁来获得合入资格。
  - id: AC-22
    given: CI修复或基线同步产生新提交
    when: 更新任务远端分支并继续等待CI
    then: 以正常推送更新同一PR，旧提交的检查与批准不自动代表新提交通过；界面和群能看到新的候选及下一步。
  - id: AC-23
    given: 任务有持续合入授权
    when: 准备合入PR
    then: 只有当前候选满足全部必需CI、项目要求的评审及合入规则时才执行已配置的合入方式；不能使用管理员绕过、忽略阻塞问题或跳过项目规则。
  - id: AC-24
    given: 目标分支在最近验证后再次前进，或远端不能强制保证合入条件
    when: 尝试完成自动合入
    then: 不能仅依赖本地推送锁或一次事前查询放行；必须由远端保证当前候选的合入条件，无法保证时停止自动合入，必要时同步并重新验证。
  - id: AC-25
    given: 远端报告PR已合入
    when: 确认MERGED状态
    then: 独立核对正确PR、目标分支和实际合入提交，记录被测试候选与合入提交的对应关系；squash导致SHA变化时不混淆二者，也不把未落到目标分支的结果当作已合入。
  - id: AC-26
    given: 任务排队或正在执行交付操作
    when: 用户暂停、取消或撤销授权
    then: 停止新的远端写入并核实进行中的操作；已发生的推送或合入如实保留，不显示成未发生，也不擅自撤销提交、关闭PR或删除产物。
  - id: AC-27
    given: 推送、创建PR、CI等待或合入期间连接中断或协调服务重启
    when: 恢复服务并核对任务
    then: 保留同一任务、队列归属、负责机器、PR、轮次及操作历史；先核实进程与远端结果，不重复副作用，不在原操作未核实时并行接管。
  - id: AC-28
    given: 收到旧执行报告，或PR被外部改动、关闭或合入
    when: 更新任务及交付状态
    then: 以核对后的当前远端事实为准；旧报告不能覆盖新提交或已确认合入，未经确认的PR变更不能触发自动写入，外部操作保留来源与历史。
  - id: AC-29
    given: 发布账户失效、远端限流、平台不可用或操作超出运行预算
    when: 执行错误恢复
    then: 有界重试后明确延期、待决或保持待核实，并保留代码与远端事实；不换用更高权限账户、不无限重试，也不把无法确认的写入当作结束。
  - id: AC-30
    given: 任务处于本地READY、已推送、PR待检查或已合入状态
    when: 在Lab看板、详情或原群查询
    then: 各入口一致区分执行状态、本地就绪、远端交付和部署状态；只获准创建PR的任务在该范围完成后停止，MERGED明确表示已合入且部署未由本阶段完成。
  - id: AC-31
    given: 用户查看交付证据
    when: 核对某次发布或合入决定
    then: 可核对原始与同步基线、候选与合入提交、远端仓库和分支、PR、CI各次结果、授权者、问题关闭依据及操作历史；凭据不出现在消息、界面和下载证据中，超限或缺失明确提示。
  - id: AC-32
    given: 交付状态发生需要报告的变化，或每小时巡检触发
    when: 回报原群或检查任务进展
    then: 同一变化只报告一次，带任务、机器、提交、PR和下一步；正常排队及CI等待不算卡住，疑似停滞先核实，01:00至08:00按Asia/Shanghai只报新推送、合入、卡点或待决。
  - id: AC-33
    given: 任务需要额外轮次、权限、处理冲突或改变需求与验收
    when: 用户在Lab或原群定位待决事项
    then: 能看到同一事项的证据、可选动作和决定历史；仅有权用户的明确决定能继续，决定不扩展为部署、直接快进迁移分支、清理或外部私信权限。
  - id: AC-34
    given: 第三阶段交付功能开启、关闭或发生故障
    when: 回归第一阶段23条和第二阶段33条标准
    then: 原有只读限制、隔离开发、测试评审、容量、恢复和证据门禁继续通过；已有任务不会因新功能启用自动取得发布授权。
  - id: AC-35
    given: 至少两台身份不同的真实机器已在专用远端试验仓库获准交付
    when: 两个任务分别走完READY、同目标排队、推送、PR、真实CI和合入，并出现至少一次真实CI阻塞修复
    then: 两台任务均得到可独立核对的合入证据，后续候选按已前进的目标重新验证；源检出及未获准改动的引用保持原状，试验不部署业务服务、不强推、不删除工作区。
  - id: AC-36
    given: 真实试跑已发起至少一次远端写操作
    when: 重复提交并制造成功响应丢失或临时协调服务重启后恢复
    then: 现场证明已有副作用被正确识别且没有重复分支、PR、合入或并行写入者；最终队列、机器占用与实际执行一致，无法核实则保持待核实。
