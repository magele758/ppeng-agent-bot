id: session-brief
title: 会话可以只看关键信息
status: implemented
requirement: |
  还有一个问题，现在的会话的内容显示太多了，可以加一个简化的配置，这样只展示关键信息，避免太长的会话展示，干扰很大，解读负担很高
owner: user
notes: |
  assumedApproval: standing-order-2026-10-22
  默认只看关键信息。关掉后才展开全文。选择记在这个浏览器。只留用户的话、助手回答、图片、目标进展，以及还没处理的确认。工具过程、推理、系统流水、统计和子任务收成一行。不改对话记录，也不改模型看到的内容。
criteria:
  - id: AC-1
    given: 已经关掉只看关键信息
    when: 查看一场有工具过程、推理、系统流水和统计的会话
    then: 这些内容仍按原来的全文显示
  - id: AC-2
    given: 已打开只看关键信息
    when: 查看同一场会话
    then: 仍能看到用户说的话和助手的回答；工具正文、推理、系统流水、统计和子任务不再铺开
  - id: AC-3
    given: 一轮里只有工具过程，没有助手回答
    when: 只看关键信息
    then: 这些过程收成一行，不按每条过程各占一行
  - id: AC-4
    given: 会话里还有没处理的确认
    when: 只看关键信息
    then: 这则确认仍留在原处，可以处理，不会被收进过程那一行
  - id: AC-5
    given: 打开了只看关键信息
    when: 刷新页面，或继续对话
    then: 这个选择还在，对话记录本身没有被改写
  - id: AC-6
    given: 只看关键信息开着，过程已收起
    when: 关掉这个配置
    then: 全文立刻回来，不必重新加载会话
  - id: AC-7
    given: 这个浏览器还没保存过会话显示选择
    when: 打开一场有工具过程的会话
    then: 默认只看关键信息，过程收成一行，用户的话和助手回答仍在
  - id: AC-8
    given: 只看关键信息，一段过程已经收成一行
    when: 点开这一行
    then: 能看到这一段被收起的过程；再点一次收回去。别的段落不跟着展开，对话记录没有被改写
  - id: AC-9
    given: 只看关键信息，已经点开了某一段过程
    when: 刷新页面再打开同一场会话
    then: 这一段仍是展开的；没点开的段落仍收起。对话记录没有被改写
