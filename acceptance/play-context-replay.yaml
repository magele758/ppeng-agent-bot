id: play-context-replay
title: Play 上下文回放
status: implemented
requirement: |
  在 Play 右侧「上下文」标签上增加回放，让用户看这块准备好的模型上下文是怎么变的。
  保留色条和每块原文。可以步进或拖动到更早的快照（每一轮准备之后记一次即可）。
  切到更早的快照时，色条和块内容都变成那一刻的样子。最新一格是当前的实时上下文，并标出时间或轮次。
  若还没有快照，就在一轮准备模型视图时记下种类、标签、token 估算和原文。
  为了记历史，不要压缩会话，也不要另写一条摘要。回放只读。
criteria:
  - id: AC-1
    given: 同一会话里已经留下多次准备好的上下文
    when: 打开上下文回放
    then: 按轮次从早到晚排列，最新一格是当前准备好的上下文，并标出时间或轮次
  - id: AC-2
    given: 回放里有较早的一轮和当前
    when: 选中较早的一轮
    then: 色条占比和每一块的原文变成那一轮的内容；回到最新一格仍是当前上下文
