id: durable-agent-waits
title: Agent 持久化条件等待与恢复
status: implemented
requirement: |
  按这个通用方案开始实现，复用现有 Goal、Routine 和执行器能力，不要针对具体 case 写特殊逻辑。先把持久化等待、条件触发和恢复执行这条链路跑通，再用我的真实日志做回归验证。
notes: |
  assumedApproval: standing-order-2026-10-22
  Goal and Routine now park on a durable wait by default when owned work is still outstanding. A waiting dispatch or a routine child registers the wait and the same execution resumes once. final acceptance by lei pending
criteria:
  - id: AC-1
    given: Agent 已登记一个有效的外部执行等待条件
    when: 宿主重启且条件仍未满足
    then: 等待仍存在且不启动模型，条件满足后仅恢复一次原目标
  - id: AC-2
    given: 定时工作在执行中登记了等待条件
    when: 条件满足或进程重启后条件满足
    then: 同一次工作恢复执行且不重新执行原始启动指令，不因重复检查重复恢复
  - id: AC-3
    given: 等待指向不属于当前权限范围的资源或失效的任务修订
    when: 登记或尝试恢复
    then: 拒绝越权观察，已取消或过期修订不会被恢复
  - id: AC-4
    given: 数据暂不可用、授权撤回或等待有期限及检查上限
    when: 重复检查或期限及上限到达
    then: 不把未知和拒绝当成完成，等待明确终止或受阻而不反复调用模型
  - id: AC-5
    given: 新的数据来源实现了通用观测契约
    when: Agent 等待组合条件或版本变化
    then: 无需新增业务调度分支即可判断条件并提供本次恢复证据
  - id: AC-6
    given: Agent 在工具回合中登记等待
    when: 工具结果已经保存
    then: 当前执行及时结束且工具调用结果配对完整，不额外启动模型来确认等待
  - id: AC-7
    given: 从真实日志提取的静默等待和多任务轮询节奏
    when: 通过通用等待机制回放不变、不可用和完成的观测
    then: 不变及不可用时模型恢复次数为零，新增完成观测仅触发所属任务一次，报告保留真实数据缺口
