id: bot-goal-only-when-needed
title: Bot 只在必须时才为目标再开子任务
status: implemented
requirement: |
  我看现在bot模式有个问题，他bot已经分析和处理好了，不是必须的时候也去启动了一个goal去做子任务，有时候感觉很多余，非必须，可以优化这个流程
notes: |
  assumedApproval: standing-order-2026-10-22
  选择：分析、说明、检查这类 Bot 自己就能做完的请求，不再收成目标，也不再因此派子任务。只有用户说清要做完的交付（改代码、修问题、实现功能，或写明完成结果）才留下目标。用户明确要求拆开、并行或交给专业角色时，仍可派子任务。不改「明确的多件独立任务各自保留」和「未完成的真目标可以续做」。
criteria:
  - id: AC-1
    given: 用户在和这个 Bot 对话，这句话是让 Bot 分析、说明或检查一件事，Bot 自己就能在当前对话里处理
    when: 用户发出这句话，例如「顺便帮我分析一下报错日志」或「看看这段代码为什么报错」
    then: 这场对话不因此多出一个目标，也不因此再启动一个子任务去重做这件事
  - id: AC-2
    given: 用户明确要求做完一件有交付的事，例如把某个问题修好、把某个功能实现出来，或写明完成结果
    when: 用户发出这句话
    then: 这件事仍留下一条还在进行的目标，不因为上面的收紧被丢掉
  - id: AC-3
    given: 一个目标已经由当前 Bot 分析并处理过，回复里没有未做完的下一步，也没有用户要求拆开、并行或交给别的角色
    when: 这一轮结束
    then: 不会再为同一个目标启动一个子任务去重做
  - id: AC-4
    given: 一个目标还没做完，或用户明确要求拆开、并行或交给规划、实现、验收这类角色
    when: 需要继续推进
    then: 仍会继续推进或派子任务，已有成果保留，不把未完成伪装成完成
