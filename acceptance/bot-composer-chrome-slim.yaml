id: bot-composer-chrome-slim
title: Bot 对话输入区左侧精简
status: draft
requirement: |
  Bot 页不需要「会话设置」；输入区那个 bot 头像 icon 和顶部重复；工作区对 bot 没什么用，如果确实没用就去掉；模型配置也不用放在这里，因为 bot 自己有配置地方。Bot 模式下这块可以精简。
notes: |
  只精简一只 Bot 的一对一对话输入区。普通会话保持原样。群聊输入区本来没有这排控件，不在本次范围。
  对话区顶部只有这只 Bot 的头像和名字，不能在顶部换成另一只；左侧列表点另一只可以换。所以输入区去掉头像，保留名字下拉。
  「+」是添加附件（本地文件或网址），不是新建会话。Bot 发消息可以带上这些，所以保留。
  模型改在这只 Bot 自己的配置里。对话页右侧详情只有定时任务、文件和记忆，没有模型。
  工作区不是 Bot 自己的配置。今天在输入区改它，会改这条对话背后会话的文件目录；Bot 对话里不再提供这个选择。若仍要在对话里改这只 Bot 能碰的目录，不要批 AC-4。
  「会话设置」在 Bot 对话里大部分是锁住的。里面还能改目标、可选工具，对话进行中还能编辑排队的插话。按原话整块不显示。若还要在输入区改排队插话，需要另说。
criteria:
  - id: AC-1
    given: 打开一只 Bot 的一对一对话
    when: 看输入区左侧
    then: 看不到「会话设置」，也打不开那一块设置
  - id: AC-2
    given: 打开一只 Bot 的一对一对话，对话区顶部已经有这只 Bot 的头像和名字，而且不能在顶部换成另一只
    when: 看输入区左侧
    then: 输入区不再出现 Bot 头像；仍能看到当前 Bot 的名字，点开名字可以换成另一只，换完后对话和顶部名字一起变成那一只
  - id: AC-3
    given: 打开一只 Bot 的一对一对话
    when: 看输入区
    then: 看不到当前模型名称，也不能在这里切换模型；到这只 Bot 自己的配置里仍能查看和修改它用的模型
  - id: AC-4
    given: 打开一只 Bot 的一对一对话
    when: 看输入区
    then: 看不到「工作区」，也看不到「默认工作区」
  - id: AC-5
    given: 打开一只 Bot 的一对一对话
    when: 看输入区左侧并点「+」
    then: 「+」仍在；点开后可以添加本地文件或填写网址，不是新建会话
  - id: AC-6
    given: 打开一只 Bot 的一对一对话
    when: 看输入区并发送一条消息
    then: 仍能输入文字并发送；当前环境能语音输入时，语音按钮仍在
  - id: AC-7
    given: 打开的是普通会话，不是 Bot 对话
    when: 看输入区左侧
    then: 仍能看到「会话设置」、当前模型和工作区，并能打开它们；这里没有 Bot 头像，也没有 Bot 名字下拉
  - id: AC-8
    given: 打开一只 Bot 的一对一对话
    when: 看对话区顶部、对话内容、右侧详情，以及这只 Bot 在管理里的配置
    then: 顶部仍是这只 Bot 的头像和名字；对话内容不因这次精简改变；右侧详情仍是定时任务、文件和记忆；管理里的模型等配置仍在
