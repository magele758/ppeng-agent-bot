id: bot-composer-chrome-slim
title: Bot 对话输入区左侧精简
status: draft
requirement: |
  这里内容，除了 bot 的 icon 感觉都多余，可以把 bot 的 icon 放到上面对话框的左侧。Bot 模式下，这些配置都没什么用，可以简化一下。
notes: |
  只精简一只 Bot 的一对一对话。普通会话保持原样。群聊输入区本来没有这排控件，不在本次范围。
  输入框上方不再放会话设置、Bot 名字下拉、模型和工作区。「+」附件入口也不放在这里；文件仍可拖进输入框。
  Bot 头像放到输入框左侧。标题栏左侧原有的头像保留。换 Bot 从左侧列表点另一只。模型仍在这只 Bot 自己的配置里。
criteria:
  - id: AC-1
    given: 打开一只 Bot 的一对一对话
    when: 看输入框和它下面那一排
    then: 看不到「+」、会话设置、Bot 名字下拉、当前模型和工作区
  - id: AC-2
    given: 打开一只 Bot 的一对一对话
    when: 看输入框
    then: 这只 Bot 的头像在输入框左侧，输入文字在头像右边
  - id: AC-3
    given: 打开一只 Bot 的一对一对话
    when: 发送一条消息
    then: 仍能输入并发送；当前环境能语音输入时，语音按钮仍在
  - id: AC-4
    given: 打开的是普通会话，不是 Bot 对话
    when: 看输入框和它下面那一排
    then: 输入框左侧没有 Bot 头像；仍能看到「+」、会话设置、当前模型和工作区
  - id: AC-5
    given: 打开一只 Bot 的一对一对话
    when: 看标题栏和这只 Bot 的配置
    then: 标题栏左侧仍有这只 Bot 的头像和名字；模型仍能在这只 Bot 自己的配置里查看和修改
