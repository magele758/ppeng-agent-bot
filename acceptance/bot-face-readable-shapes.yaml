id: bot-face-readable-shapes
title: 脸型圆润，列表里能看见表情，干活时更忙
status: implemented
notes: |
  负责人在同一条需求里指定了验收结果，并要求先写失败测试再实现，因此按该说明视为已批准。
  已保存的星星、房子标识仍指向这两格，画出的图形改为圆润形状。
requirement: |
  这个云朵的 bot，有点小，嘴巴看不到了。
  这里形状不好看，可以把十字星，房子的改成一些更圆润的，还有一些 icon 太小，不方便展示表情，然后如果在干活，他的动作可以丰富一点，感觉很忙碌一样。
criteria:
  - id: AC-1
    given: 用户打开创建 Bot 的脸型
    when: 查看脸型一排
    then: 不再出现尖角星和尖顶房子，这两格是圆润图形，眼睛和嘴巴都在形状里面，名称也不再叫星星或房子
  - id: AC-2
    given: 已有 Bot 保存的是原来的星星或房子
    when: 在选择器、会话列表或对话里看这只 Bot 的头像
    then: 显示同一张圆润的新脸，不是破图、空白，也不是尖角星或尖顶房子
  - id: AC-3
    given: Bot 使用云朵脸
    when: 在会话列表的小头像尺寸下查看
    then: 嘴巴看得见，云朵不再只剩一条挤在中间的细图标
  - id: AC-4
    given: Bot 正在思考、吐字或执行工作
    when: 用户持续查看头像
    then: 头像连续有左右看、点头或轻晃这类小动作，看起来在忙，不会播一次就停；没在干活时不会一直剧烈晃
