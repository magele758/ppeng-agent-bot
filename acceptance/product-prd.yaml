id: product-prd
title: 产品需求目录
status: implemented
notes: 'assumedApproval: standing-order-2026-10-22'
requirement: |
  我想要在readme之外，构建一套产品的prd体系，一个是现有的功能的说明，一个是开发了具体哪些feature，还有未来待开发的功能的特性，然后还有一个这个项目使用的skill也要同步的配套更新，分多个agent去完成这几件事情
criteria:
  - id: AC-1
    given: 读者不打开根目录 README
    when: 打开产品需求目录
    then: 能分别读到三块正文：现在已有的功能说明、已经开发出来的具体功能、未来待开发的功能；每一块都有可阅读的内容，不是只有标题
  - id: AC-2
    given: 已经开发出来的功能清单，以及仓库里全部验收规格
    when: 对照两边
    then: 清单只收录已经实现的规格，每条都能对上该规格的名称和用户需求；草稿、已批准但未实现、已取消的规格不会被写成已经交付
  - id: AC-3
    given: 未来待开发的功能
    when: 阅读这一块
    then: 尚未实现的验收规格单独列出，并且不出现在「现在就能用」的已交付清单里；还没有验收规格、只是方向的条目会标明还不是承诺
  - id: AC-4
    given: 仓库里给编码助手用的技能
    when: 产品里用户能看到的行为或技能说明发生变化
    then: 有一份技能要求助手同步更新这套产品需求目录，而不是只改 README；目录里的技能对照和仓库里每份技能的名称与用途一致
