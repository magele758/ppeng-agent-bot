id: outbound-style-sample-hint
title: 外发前建议先采样同渠道近期消息，只提示语气，不改已编正文
status: implemented
requirement: |
  r4-6（接在 #326 之上，只做选项 A）：外发前可选采样同渠道近期消息 → 提示语气；不自动改写用户已编正文。
  在批准并发送之前，给出不阻断的提示，建议先采样该渠道最近几条消息，好让草稿更贴近用户在这个渠道里的口气。
  提示只是建议：不阻止批准并发送，不自动改写草稿正文，不把风格提示词写进正文，也不把样例摘要附进草稿。
  点开后最多给用户看几条同渠道近期消息供扫一眼，仍然绝不改写正文。不新增静默发送路径，不新增环境变量。
notes: 'assumedApproval: standing-order-2026-10-22; Option A only (hint, never rewrite); not B (sample summaries) or C (style prompt into draft)'
criteria:
  - id: AC-1
    given: Lab 任务收件箱里一条待发送的外发草稿
    when: 用户在批准并发送之前查看这条草稿
    then: 批准按钮之前出现一条不阻断的提示，建议先采样同渠道近期消息来对照语气；英文界面有对应文案
  - id: AC-2
    given: 用户还没有采样，草稿正文是用户已经写好的文字
    when: 用户直接点批准并发送
    then: 批准仍然可用并按原样发出，提示没有拦住发送
  - id: AC-3
    given: 用户编辑或保存了草稿正文
    when: 界面展示或用户点开同渠道近期消息
    then: 正文保持用户写下的内容，不会被样例自动改写，也不会被风格提示词或样例摘要写进去
  - id: AC-4
    given: 用户点开同渠道近期消息，看到若干条样例
    when: 样例显示在草稿旁边
    then: 样例只供扫一眼，不会替换草稿正文
