id: agent-skill-management
title: Agent 在对话中管理自身技能
status: implemented
requirement: |
  然后这个共享skill、沉淀skill、修改skill、管理更新删除的能力，我想要agent也具备自己去操作的能力
notes: |
  与 bot-detail-skill-management 配套，用户已确认两份共 17 条标准。
  Agent 可以发现并调用技能管理能力；Bot 场景以当前 Bot 为归属和授权边界。
  用户已明确指令且目标无歧义时直接执行，不重复确认；模型自主发起变更时先确认一次。
  自主沉淀和更新仍先确认意图，再自动提炼保存，无第二次正文审核。
  本期管理自身沉淀的技能；公共、历史未归属和他人共享技能不由 Agent 擅自修改。
criteria:
  - id: AC-1
    given: Agent 在某个 Bot 的对话中工作
    when: 用户要求查看或管理技能
    then: Agent 能列出有权使用的技能及归属、共享对象和可执行操作，不暴露其他 Bot 未授权的私有技能
  - id: AC-2
    given: Agent 判断当前经验值得新建技能或更新自身技能
    when: Agent 自主提出沉淀或更新建议
    then: 先展示目标和理由供用户确认一次，确认后自动提炼并保存且不再次审核正文；拒绝则不修改，新技能默认当前 Bot 私有，更新保留原共享范围
  - id: AC-3
    given: 用户已明确要求新建、修改、共享、取消共享或删除技能且目标和范围无歧义
    when: Agent 执行该指令
    then: 在当前 Bot 权限内直接完成并报告结果，不重复索要确认；有歧义时先明确目标，不猜测技能或接收 Bot
  - id: AC-4
    given: Agent 自主判断应共享、取消共享或删除自身技能但用户尚未授权这次操作
    when: Agent 提出管理建议
    then: 展示操作、目标和受影响 Bot，用户确认一次后自动完成，拒绝或未确认不改变技能及权限
  - id: AC-5
    given: 当前 Bot 拥有待管理的技能
    when: Agent 完成共享、取消共享、更新或删除
    then: 共享对象获得同一技能的只读访问且仍受其使用限制约束；取消共享后不能再搜索或加载；更新后有权使用者可加载新正文；删除后技能文件移除且所属和接收 Bot 都不能再搜索或加载，历史对话正文不被清除
  - id: AC-6
    given: 技能来自其他 Bot 共享、公共来源或历史未归属来源
    when: Agent 尝试修改、删除、转共享或改变其归属
    then: 操作被拒绝且原技能保持不变；用户可另行要求提炼为当前 Bot 的独立私有技能，不覆盖来源
  - id: AC-7
    given: 操作失败、重复执行或确认前技能及共享范围已变化
    when: Agent 执行管理操作
    then: 不误报成功、不重复创建且不覆盖较新的变更；失败保留原状态，过期确认失效并展示变化供重新决策
  - id: AC-8
    given: Agent 完成了一次技能管理操作
    when: 用户查看对话结果或 Bot 详情技能页
    then: 能看到一致的最新技能状态及操作记录，记录包含发起 Bot、操作目标、授权来源、结果和时间
