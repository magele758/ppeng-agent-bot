id: bot-fork-retrievable-inheritance
title: Bot 子任务按权限检索父 Bot 的记忆、技能、文件与上下文
status: implemented
requirement: |
  bot 模式，如果 fork 子任务，要继承父 bot 的信息，记忆、skill、文件、上下文等，作为可以检索的内容，可以不用一次性塞入，但是要能做权限继承和隔离，现在好像是不对的。
notes: |
  继承的是可检索权限，不是把父 Bot 的记忆、技能正文、文件和对话一次性塞进子任务开场。
  覆盖 Bot 分出的子任务：同时处理多件事时分出的、在对话里委派的、以及把一条新消息拆出去执行的。
  不改写已实现标准，待负责人确认后再决定是否修订旧文案：
  - subagent-delegation AC-1：开场仍从委派说明开始，父方仍只收到结果摘要。本草案允许子任务按需检索父对话原文；若负责人认为「看不到父对话」是永久禁止检索，需要另行确认并改那一条。
  - bot-concurrent-subagents AC-3：父会话笔记和该 Bot 全局记忆可被搜索、其他 Bot 与共享记忆池不可见，仍然有效。本草案补上全文读取、列出与搜索一致，以及父 Bot 能用的团队/项目记忆。
  - bot-concurrent-subagents AC-4 与 subagent-delegation AC-2：求助可以送到父 Bot 和同 Bot 兄弟；子任务仍不能改写父记忆、对外发消息、建定时任务、向用户追问。
  - bot-task-permission-inheritance：审批档位继承不在本草案重复。
  - bot-scoped-skill-sharing：技能归属与共享规则不在本草案重复；本草案只要求子任务沿用父 Bot 已有的技能使用范围。
criteria:
  - id: AC-1
    given: 父 Bot 的对话里已经有先前往来，其中有一句可以辨认的原话
    when: 它分出一个子任务，子任务再按这句话查找父 Bot 的对话
    then: 子任务开场只有这次任务说明，父对话全文不在开场里；查找能返回这句原话和它的出处；父对话只收到结果摘要，看不到子任务的中间过程
  - id: AC-2
    given: 父 Bot 有会话笔记、长期记忆，以及它自己能用的团队或项目记忆；另一 Bot 和另一用户各自有私有记忆
    when: 子任务列出并打开这些记忆，也搜索另一 Bot 和另一用户的私有记忆
    then: 列出和搜索都能找到父 Bot 能用的那些记忆，打开后是完整内容而不是一小段摘录；另一 Bot、另一用户，以及父 Bot 无权使用的共享记忆都找不到
  - id: AC-3
    given: 父 Bot 可以使用某项技能，另一 Bot 有一项父 Bot 未被授权的私有技能
    when: 子任务搜索并加载技能
    then: 能按需加载父 Bot 可用技能的正文，开场不会一次性放进父 Bot 的全部技能正文；不能发现或加载那项私有技能
  - id: AC-4
    given: 父 Bot 的工作区、附件或已生成资料里有一份它能读取的文件，另一 Bot 有自己的私有文件
    when: 同时处理多件事时分出的子任务、对话里委派的子任务，或把一条新消息拆出去执行的子任务，去读取这两份文件
    then: 三种子任务都能读到父 Bot 那份文件，都读不到另一 Bot 的私有文件，也不会改去读父 Bot 权限之外的位置
  - id: AC-5
    given: 父 Bot 有名称和职责说明，分出的子任务被派去承担研究或实现之类的角色
    when: 子任务确认自己代表谁，并查看该 Bot 的职责
    then: 能查到父 Bot 的名称和职责，并保持这个身份；不能改用另一个 Bot 的身份；职责说明不必把父对话全文带进开场
  - id: AC-6
    given: 同一父 Bot 有两个子任务，各自有自己的对话和未约定共享的产出文件
    when: 其中一个子任务检索另一个的对话和未共享文件，或向父 Bot 与兄弟发一条求助
    then: 检索不到对方的对话和未共享文件；求助只是一条求助，不会因此打开对方的私有资料。父 Bot 自己的笔记仍按父 Bot 的权限可检索
  - id: AC-7
    given: 父 Bot 的工具、技能或文件范围被限制，子任务被明确要求使用范围外的工具、技能或文件
    when: 子任务执行这个要求
    then: 请求被拒绝。子任务仍可以使用父 Bot 已有范围内的工具和资料，并且仍然不能改写父 Bot 记忆、对外发消息、新建定时任务或向用户追问
  - id: AC-8
    given: 父 Bot 没有与查询对应的记忆、技能、文件或更早对话
    when: 子任务按关键词检索
    then: 结果明确说明没有找到，不会把其他 Bot 或其他用户的内容当作结果，开场里也没有父 Bot 的全部记忆、技能正文、文件和历史对话
