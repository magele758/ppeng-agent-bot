id: console-tasks
title: 任务页：队列、编排运行与审批收件箱
status: implemented
requirement: |
  apps/web-console 前端很乱：功能堆在一起，配置太多不好用，交互不清晰。目标是整体重构，让控制台清晰、易用。
  任务页要有清晰的任务收件箱与编排运行视图，空状态要有说明。
criteria:
  - id: AC-1
    given: 任务队列里有处于不同状态的任务（待处理、进行中、已完成、失败、已取消）
    when: 用户打开「任务 → 任务队列」并点击某个状态筛选
    then: 筛选条显示「全部」与各状态的任务数量；只列出该状态的任务；再点「全部」恢复完整列表
  - id: AC-2
    given: 任务队列里有多条任务
    when: 用户在任务搜索框输入关键词（任务标题或负责 Agent）
    then: 只列出匹配的任务；没有匹配时显示「没有匹配的任务」并提供清除筛选的入口，而不是空白
  - id: AC-3
    given: 当前没有任何任务、定时发布或后台任务
    when: 用户打开「任务 → 任务队列」
    then: 每一块都显示说明性的空状态（这里会出现什么、如何产生），而不是空白列表
  - id: AC-4
    given: 有待审批的工具调用
    when: 用户打开「任务 → 审批与收件箱」
    then: 每条审批显示工具名称、原因与所属会话，并有「批准」「拒绝」按钮；页面头部子页签与导航徽标显示待审批数量；处理后该条消失；已被批准、拒绝或过期的审批即使仍在接口返回里也不出现在待审批列表，也不计入数量
  - id: AC-5
    given: 没有任何待审批项
    when: 用户打开「任务 → 审批与收件箱」
    then: 审批区显示「没有待处理的审批」的空状态说明，而不是空白列表
  - id: AC-6
    given: 存在编排运行
    when: 用户打开「任务 → 编排运行」并按状态筛选
    then: 显示各状态运行数量，只列出所选状态的运行，每条运行显示标题、状态与风险等级；没有运行时显示说明性的空状态
  - id: AC-7
    given: 用户切换界面语言（中文 / English）
    when: 查看任务页与知识与记忆页的全部文案
    then: 两种语言的文案键完全一致，不出现缺失或硬编码文本
