id: bot-goal-conclusion
title: 目标结算与子会话身份的生命周期闭环
status: implemented
requirement: |
  修复目标结算与子会话身份的生命周期闭环（breakpoint-5，同一件活，一次做完）。
  1. 派出的子会话结束后，等待记录要指向这个子会话而不是父执行会话，目标能读到子会话的结果，不会被判为未授权而阻塞。
  2. 同一 Bot 同时有多件待办、其中一件已登记为目标并交给子会话时，子会话跑完后目标按实际结果结算，不再停在执行中，结果不只留在子会话里。
  3. 委托给另一个 Bot 后，原目标只依据对方这个委托任务的状态和结果继续；对方在自己会话里另开的子会话不是原目标的执行。
  4. 团队或群体扇出后，成员会话失败或群体没有任何任务时，对应计划或执行进入失败终态；父目标不会一直等待，也不会被缺失的执行误唤醒。
  5. 回合已经给出可核对的完成证据时，完成判官不可用或抛错不得把该回合收成阻塞。
notes: |
  assumedApproval: standing-order-2026-10-22
criteria:
  - id: AC-1
    given: 一个正在执行的 Bot 目标派出了子会话
    when: 子会话结束并留下结果
    then: 等待记录指向这个子会话而不是父执行会话，目标能读到子会话的结果，不会被判为未授权而阻塞
  - id: AC-2
    given: 同一个 Bot 同时收到多件待办，其中一件已登记为持久目标并交给子会话
    when: 该子会话跑完
    then: 目标按子会话的实际结果结算，不再停在执行中，结果不只留在子会话里
  - id: AC-3
    given: 一个目标把工作委托给另一个 Bot，对方 Bot 在自己的会话里又开了子会话
    when: 委托任务结束
    then: 原目标只依据对方这个委托任务的状态和结果继续，对方内部子会话不会被当成原目标的执行
  - id: AC-4
    given: 一个目标用团队或群体执行扇出了工作
    when: 成员会话失败，或群体执行没有任何任务
    then: 对应的计划或执行进入失败终态，父目标不会一直等待，也不会被缺失的执行误唤醒
  - id: AC-5
    given: 一个目标回合已经给出可核对的完成证据
    when: 完成判官不可用或抛错
    then: 该回合保持待核对的完成，不会被收成阻塞
