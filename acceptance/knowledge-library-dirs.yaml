id: knowledge-library-dirs
title: 本地资料目录进入知识库并可检索
status: implemented
requirement: |
  把本地目录（他持续收集资料的文档库）加进现有知识库，让对话里的 agent 真能检索到，并且目录更新后索引跟上，形成闭环。
  1. Lab「知识与记忆」里可以添加、移除本地目录。用这台电脑的文件夹选择对话框挑选，可以添加多个，不要手填路径。持久化到现有配置（daemon KV / 知识库或 ingestion 设置 API）。禁止新增 RAW_AGENT_*，禁止把私人路径写进仓库。
  2. 目录文档进入现有索引。对话里的 agent 能检索到。若现在检索工具存在但模型用不上，把它接到对话回路。
  3. 目录里文件新增、修改、删除后索引跟上（监听或保存后刷新，不要求改 .env 或重启）。删掉的文件不再被检索到。
  4. 跳过 .env、id_rsa、credentials 以及已有 isBlockedPath。只索引用户明确添加的目录。
  5. 文案 i18n，zh 与 en 同一套 key。不要新开导航。
  本次改为：这里要能打开他电脑上的路径选择器来选文件夹，不要手动输入；而且可以添加多个路径。
  1. 点按钮打开本机文件夹选择对话框（macOS 用 daemon 调系统选择文件夹，返回绝对路径）。浏览器的 input webkitdirectory 拿不到 daemon 能索引的绝对路径，不要用它冒充。这是本机 Lab，对话框必须出现在用户这台电脑上。无图形界面或用户取消时，给出 i18n 错误/取消，不要写进列表。
  2. 可以添加多个目录。每选一次追加一个，不要覆盖已有。列表里能逐个移除。重复路径不要加两次。空列表仍有现在的空状态。
  3. 去掉手填路径作为主路径。不要留一个必填文本框。选择后沿用现有保存和索引（立即索引、文件变动监听）。
  4. 文案走 i18n，zh 与 en 同一套 key。不要新增 RAW_AGENT_*。不要把用户私人路径写进仓库。
  5. 选择器 API 只给已登录的本机 Lab 用，不要变成远程替别人弹窗或读任意路径的漏洞。只索引选中的目录，继续跳过密钥文件。
  用户看着本地资料目录列表说「没对齐」。每一行同一高度。路径靠左，从同一条左缘开始；「移除」固定在右侧同一列，两行的按钮左缘/右缘对齐，不要跟着路径长短乱跑。路径和「移除」在行内垂直居中。路径过长时单行省略，不要把按钮挤到下一行或撑歪行高。列表本身和上方「选择文件夹」按钮、卡片内容区左右对齐，不要单独缩进或凸出。
notes: |
  assumedApproval: standing-order-2026-10-22
  手填路径改为本机文件夹选择并追加多个目录。AC-1 的加入方式改为选择后保存，检索与移除结果不变。新增 AC-6 至 AC-9。
  新增 AC-10：目录列表行左右对齐。assumedApproval: standing-order-2026-10-22
criteria:
  - id: AC-1
    given: 用户打开「知识与记忆」
    when: 加入一个本机文件夹并保存，稍后移除并再次保存
    then: 再次读取时仍能看到刚添加的目录；移除后列表里没有它，该目录里的文档也不再被检索到
  - id: AC-2
    given: 已保存的目录里有一份文档
    when: 对话中的助手按正文检索
    then: 能命中这份文档，并读到其中的原文
  - id: AC-3
    given: 目录已在知识库中
    when: 目录里的文件被修改或删除
    then: 检索到的是修改后的正文；删除后检索不到该文件。跟上索引不需要改环境变量或重启
  - id: AC-4
    given: 已添加的目录里有 .env、id_rsa、名为 credentials 的文件，旁边还有没添加的目录，以及系统禁止访问的路径
    when: 按这些内容检索，或试图把禁止访问的路径加进知识库
    then: 检索不到这些文件和未添加目录里的内容；禁止访问的路径不能保存
  - id: AC-5
    given: 界面有中文和英文
    when: 查看添加本地目录的文案
    then: 两种语言使用同一套文案条目
  - id: AC-6
    given: 用户打开「知识与记忆」里的本地资料目录
    when: 点「选择文件夹」，并在这台电脑弹出的对话框里选中一个文件夹
    then: 列表出现该文件夹的绝对路径并已保存；页面上没有要手填路径的输入框
  - id: AC-7
    given: 列表里已经有一个目录
    when: 再选一个不同的文件夹，然后再选一次已经在列表里的文件夹
    then: 新目录追加在后面，原来的还在；同一个路径只出现一次；每一项都能单独移除；全部移除后仍显示还没有目录的说明
  - id: AC-8
    given: 列表里已有目录
    when: 打开选择对话框后取消，或这台电脑打不开图形对话框
    then: 列表不变，并看到取消或无法打开的说明，不会把空路径写进列表
  - id: AC-9
    given: 请求没有登录，或来自另一台电脑，或在请求里指定了某个路径
    when: 试图打开文件夹选择
    then: 不会在本机弹出对话框，也不会读出该路径里的文件内容；仍只索引选中的目录，并继续跳过密钥文件
  - id: AC-10
    given: 「知识与记忆 → 记忆」里已有长短不同的本地资料目录
    when: 查看目录列表
    then: 每一行等高；路径从同一左缘开始并在行内垂直居中，过长时在一行内省略；「移除」固定在右侧同一列且垂直居中，左右缘不随路径长短变化；列表与上方「选择文件夹」以及卡片内容左右对齐，没有单独缩进或凸出
