id: group-settings-clarity
title: 群聊设置分区与成员提及清理
status: implemented
requirement: |
  上面的几个是什么？是默认的分组？怎么会有这个东西的？完全没用吧？
  这个设置页面帮我改的好看点，现在完全一锅粥
notes: 'assumedApproval: standing-order-2026-10-22'
criteria:
  - id: AC-1
    given: 群聊存在成员且侧栏存在功能分组
    when: 用户在群聊输入 @
    then: 候选只列出当前群成员，不显示功能分组；仍可选择成员插入提及
  - id: AC-2
    given: 用户打开群聊设置
    when: 查看并修改设置
    then: 基本信息、回复方式与默认折叠的运行限制分区展示，设置区不重复显示聊天表单和成员列表，名称和预算仍能保存
  - id: AC-3
    given: 用户查看群聊回复方式
    when: 切换方式或保存失败
    then: 选中卡片清晰可辨，提示即时生效，保存失败时恢复原选择并显示错误
