id: assistant-actions-at-end
title: 助手消息的引用/纠错按钮放在正文末尾
status: implemented
requirement: |
  引用与纠错按钮不再放在顶部标题行，跟在已经结束的回复正文末尾，不再悬浮到顶部；
  标题行仅保留角色名及 steer/cron 标签；连续助手消息省略标题后无任何顶部占位。
  其它角色行为不变。
criteria:
  - id: AC-1
    given: 助手消息
    when: 渲染
    then: 纠错与引用按钮位于气泡之后的操作行，不在标题行，也不再悬浮到消息顶部
  - id: AC-2
    given: 标题被省略且无标签的连续助手消息
    when: 渲染
    then: 不渲染 chat-turn__label 行
  - id: AC-3
    given: 非助手角色
    when: 渲染
    then: 按钮仍在标题行（行为不变）
notes: "assumedApproval: standing-order-2026-10-22; 按用户最新要求由 composer-quote-layout 改为不占行悬浮；与 assistant-run-spacing AC-1 措辞同步调整，未删除"
