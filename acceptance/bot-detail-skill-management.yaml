id: bot-detail-skill-management
title: 在 Bot 详情中查看可选技能并管理技能
status: implemented
requirement: |
  还有一个问题，我想要点击bot详情能看到他有哪些可选的skill，也可以在里面管理skill
notes: |
  Bot 详情新增“技能”页签，集中展示当前 Bot 有权使用的技能与实际启用状态。
  管理范围包括技能启用范围、自有沉淀技能的共享与撤销；不新增正文编辑器。
  共享仍为只读授权，未共享的其他 Bot 私有技能不出现在可选列表。
  启用策略明确区分“全部可用技能”和“仅选定技能”，后者空选表示不启用任何技能。
  保留现有默认策略和配置；未保存前不改变运行行为，保存后影响后续搜索与加载。
criteria:
  - id: AC-1
    given: 用户在 Bot 列表或对话中打开某个 Bot 的详情
    when: 用户进入技能页签
    then: 无需离开详情即可看到该 Bot 有权使用的技能，包含自有、他人共享、历史共享和公共技能，未授权的其他 Bot 私有技能不可见
  - id: AC-2
    given: 技能页中有多个技能或同名技能
    when: 用户查找或查看技能
    then: 可按名称或描述搜索，每项显示来源、所属 Bot、只读状态及实际启用或受限状态，同名技能能够区分并查看各自说明和正文
  - id: AC-3
    given: 用户希望调整该 Bot 的技能使用范围
    when: 用户选择全部可用技能或仅选定技能并保存
    then: 后续搜索和加载遵循保存的范围；仅选定技能时空选代表不启用任何技能，不会误恢复为全部启用；配置在刷新和重启后保留
  - id: AC-4
    given: 用户正在管理该 Bot 的自有沉淀技能
    when: 用户添加或取消指定共享对象并保存
    then: 接收 Bot 的后续搜索和加载权限随之变化，仍受接收 Bot 既有使用限制约束；详情页显示保存结果以及受限原因
  - id: AC-5
    given: 用户正在查看其他 Bot 共享来的技能
    when: 用户在当前 Bot 的详情中管理这项技能
    then: 可以调整当前 Bot 是否启用，但不能从该条目修改原技能、转共享或撤销原技能，并明确显示只读来源
  - id: AC-6
    given: 用户要撤销当前 Bot 的自有沉淀技能
    when: 用户点击撤销并确认列出的受影响 Bot
    then: 技能从所属和接收 Bot 的后续搜索与加载中移除，详情页及时更新并保留处理结果；说明不会清除历史对话中已加载的正文
  - id: AC-7
    given: 当前 Bot 没有可用技能或搜索没有匹配项
    when: 用户查看技能页
    then: 显示明确的空状态，并能清除搜索或调整筛选，不将空结果误报为加载失败
  - id: AC-8
    given: 用户加载或保存技能管理设置时遇到网络失败、权限不足或目标已变化
    when: 操作未成功
    then: 页面显示原因并允许重试，不显示虚假的保存成功，保留尚未保存的选择且不覆盖原有生效配置
  - id: AC-9
    given: 用户在 Bot A 的技能页有尚未保存的选择
    when: 用户切换查看 Bot B 或在两个 Bot 间来回切换
    then: 选择不会串到其他 Bot，也不会自动保存；未保存改动有明确提示，各 Bot 显示自身最新的归属和使用范围
