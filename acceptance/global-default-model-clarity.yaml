id: global-default-model-clarity
title: 全局默认模型配置与群聊模型来源可见
status: implemented
owner: user
requirement: |
  群聊里没有模型选择，都是用的什么模型？是bot里配置的？感觉有点混乱，可以加一个配置，设置全局默认模型，从已有列表里选择
notes: |
  已有全局默认模型选择能力，本需求完善其命名、入口和群聊中的可见性，沿用现有模型列表与持久化配置。
  群聊由各成员 Bot 分别生成回复，不新增独立的群聊模型覆盖层。
  当前普通文本模型的配置优先级：群成员 Bot 的专属模型高于全局默认模型；普通对话显式选定的会话模型仍保留。
  2026-10-22：AC-4 改为群聊不再重复全局默认路径和来源讲解，只在专属模型不同时显示模型名，并保留短设置入口。AC-5 的未配置提示留在设置页，群聊成员区不再复述。优先级说明仍在设置页。
criteria:
  - id: AC-1
    given: 用户已经配置可用模型
    when: 打开「设置 → 模型」
    then: 能清楚看到标为「全局默认模型」的选择器、当前模型及所属服务商，并且只能从已有且已启用的模型中选择
  - id: AC-2
    given: Bot、群聊成员或普通对话没有单独指定模型
    when: 用户更改并成功保存全局默认模型
    then: 后续新发起的模型请求使用新的默认模型，无需重启，刷新页面和重启后配置仍保留
  - id: AC-3
    given: Bot 已有专属模型或普通对话已单独选定模型
    when: 用户修改全局默认模型，或随后清除该单独指定
    then: 已单独指定的模型优先使用；清除后才跟随全局默认模型，界面明确说明这一规则
  - id: AC-4
    given: 用户打开群聊
    when: 查看标题栏和群成员列表
    then: 标题栏不再铺全局默认模型路径和优先级说明，只留一个短入口前往全局默认模型设置。跟随全局默认的成员不重复模型路径；只有专属模型与全局默认不同的成员显示一行模型名。更改全局默认后，没单独指定的成员改用新默认，已单独指定的成员仍用原来的模型
  - id: AC-5
    given: 用户尚未配置可用模型
    when: 查看设置里的全局默认模型
    then: 明确提示尚未配置，并提供前往模型配置的入口，不把不可用模型显示为可用默认模型。群聊成员区不再另铺一段未配置说明
  - id: AC-6
    given: 用户正在更改全局默认模型
    when: 保存失败或选中的模型已被禁用、删除而不可用
    then: 显示可理解的错误并允许重试，实际生效的配置不被这次失败更改，界面不显示保存成功
