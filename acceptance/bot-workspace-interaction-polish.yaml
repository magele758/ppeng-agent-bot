id: bot-workspace-interaction-polish
title: Bot 工作台引用、任务通知、上下文与长会话体验优化
status: implemented
requirement: |
  这个引用的交互太粗糙了，帮我优化一下
  这里是否可以继续优化一下展示？
  这种对于定时任务，可以加个特殊的ui来提醒，不用这么直接把原始调试文案都发出来
  这边加一个收起列表的按钮
  这里跟上面新建融合一下，可以用iconfont去表达
  帮我检查下，共享信息的写入和读取链路是否完整
  分组的名称用浅一点的颜色
  这里我是想要看到实时发送给模型的上下文的长度统计，这里是有的吗？最好标识的明显一点
  这里要能显示是一次性的任务还是循环的，而且对于他 cron表达式要能查看、编辑和更新
  这种都不知道什么内容，看不懂，最好能跳转文件
  这个列表的内容太多了，看看怎么优化一下展示，看看是否可以做分组或者多个tab拆分
  超长的会话列表，会有性能问题，看看能不能继续优化一下性能和展示，避免白屏和样式错乱
notes: |
  对应浏览器批注 1–12；用户已确认本标准及右侧整栏收起，未修改其他正在进行的 Bot 产品标准。
  2026-10-21：先复现失败后实现；20项专项浏览器测试、47项相关后端测试、16项i18n测试通过。
  验证范围与运行边界见 doc/BOT_WORKSPACE_INTERACTION_VERIFICATION.md。
  批注4按收起整个右侧信息栏理解，保留可重新展开的入口；不是仅折叠“活动”分组。
  图标采用统一风格，具体载体不限定为 iconfont；键盘和触屏用户也能发现并使用操作。
  分组名称降低视觉权重，但继续满足 mac-retina-text-readability 的字号和 4.5:1 对比度要求。
  上下文长度区分发送时的完整请求估算、上游返回的实际输入用量和下一轮预览，不能相互冒充。
  来源不一定是文件；有文件时打开文件，有消息时定位原消息，不制造不存在的文件链接。
  性能样本为本地固定测试数据，2000条历史消息，其中一条含10万字符；计时从页面就绪后开始，
  不包含模型、外网和首次开发编译延迟。真机观感与自动化性能结果分别报告。
criteria:
  - id: AC-1
    given: 用户正在阅读一条可引用的 Bot 回复
    when: 鼠标移入、键盘聚焦或通过触屏操作该回复并选择引用
    then: 可以通过紧凑且有明确名称的操作引用该回复，输入区显示作者和最多三行的引用摘要并可取消；取消保留草稿，发送后仍关联正确原回复
  - id: AC-2
    given: 用户在 Bot 对话中已有草稿、附件或引用
    when: 查看输入区、编辑多行消息或调整窗口宽度
    then: 输入区把引用和附件预览、文本输入及发送操作组织为连续区域，次要操作有明确入口；内容不遮挡，草稿不丢失，发送后立即出现用户消息并清空已发送内容
  - id: AC-3
    given: 对话包含定时任务结果或任务延续所用的历史上下文
    when: 用户阅读这些消息
    then: 任务结果以专用卡片呈现任务名、可理解的状态和结果摘要，并可查看详情；内部标记、运行编号、接口地址及超长历史上下文默认收起，普通用户文字不会仅因包含相似字符而被误隐藏
  - id: AC-4
    given: Bot 对话右侧信息栏已展开
    when: 用户点击收起按钮后再展开
    then: 收起后对话区获得释放的宽度且保留明确的展开入口，重新展开恢复原标签页，切换过程不丢失草稿或改变正在阅读的消息位置
  - id: AC-5
    given: 用户打开左侧会话列表
    when: 使用新建、筛选或批量选择
    then: 三种操作集中在同一紧凑工具栏，以有名称提示的图标入口呈现；键盘可操作，筛选可清除，批量选择有明确退出入口，现有新建选项保留
  - id: AC-6
    given: 用户具有共享信息编辑权限
    when: 新增、修改或删除全局或分组共享信息并保存，再重新打开页面并与适用的 Bot 对话
    then: 页面读回保存后的信息，Bot 下一次请求使用更新后的有效共享信息；同名键由分组覆盖全局，其他分组和其他用户的私有信息不会混入
  - id: AC-7
    given: 共享信息尚未成功加载、保存失败或用户快速切换作用域
    when: 用户查看或继续编辑共享信息
    then: 界面不会把加载失败显示为已加载的空数据，不会误报保存成功或把旧作用域内容写入新作用域；失败时可重试且保留当前编辑内容
  - id: AC-8
    given: 用户使用浅色或深色主题查看 Bot 分组
    when: 阅读分组名称与组内 Bot 名称
    then: 分组名称采用比 Bot 名称更弱的视觉层级，同时字号至少12px、文字对比度至少4.5:1
  - id: AC-9
    given: 当前会话向模型发起一次新请求，包括同一轮中的后续工具调用请求
    when: 用户打开上下文面板
    then: 显著显示最近一次已发送请求的完整输入估算 token 数、模型窗口占比及请求时间，并随每次发送更新；统计包含系统提示、工具定义和最终送出的消息
  - id: AC-10
    given: 请求尚未发送、上游尚未返回输入用量或面板正在查看历史记录
    when: 用户查看上下文长度
    then: 明确区分发送前预览、发送时估算、上游实际输入用量与历史记录，缺失值显示未知或等待；压缩阈值作为次要信息，不把累计用量冒充当前请求长度
  - id: AC-11
    given: Bot 有一次性、固定间隔或 cron 定时任务
    when: 用户打开任务详情
    then: 每项任务显示准确的调度类型、启用状态、时间规则及时区；cron任务可查看原表达式，下一次执行时间可用时显示，不把已完成的一次性任务显示为仍将重复执行
  - id: AC-12
    given: 用户具有任务编辑权限并打开一个 cron 任务
    when: 修改表达式或时区后保存、取消，或提交无效表达式
    then: 有效修改保存后更新执行计划并在重新打开时保留；取消不改变任务，无效输入或保存失败给出明确提示且保留原计划，不因编辑而立即额外执行任务
  - id: AC-13
    given: Bot 记忆条目来自压缩摘要或存在多个来源
    when: 用户查看记忆列表
    then: 默认显示可读的内容摘要、记忆类型及来源数量，正文和完整来源列表按需展开，不以内部键名和大批来源编号按钮占满页面
  - id: AC-14
    given: 用户展开记忆条目的来源
    when: 选择查看某个来源
    then: 文件来源可打开或预览对应文件，消息来源可定位对应原消息；来源不存在或无权限时明确说明，不跳到无关位置或显示不可用的伪文件链接
  - id: AC-15
    given: 用户打开 Bot 设置详情
    when: 在概览与外观、能力与权限、任务与自动化、历史与记忆标签间切换
    then: 每次仅呈现所选类别的内容，现有设置和操作均有可找到的入口，权限直达链接打开对应标签；切换前会保留未保存编辑或明确提示处理
  - id: AC-16
    given: 会话已有2000条历史消息且其中一条包含10万字符
    when: 页面就绪后用户滚动、输入或连续切换会话十次
    then: 每次操作在1秒内出现可见响应，不出现持续白屏、消息重叠或布局错乱；长消息默认显示有界摘要并可展开查看完整内容
  - id: AC-17
    given: 用户正在长会话中阅读历史位置
    when: 加载更早记录、展开长消息、调整侧栏或收到流式更新
    then: 保持当前阅读位置，只有用户原本位于底部时才自动跟随新消息；加载失败可重试且已加载消息保留，任务内部上下文默认不会占满聊天区
  - id: AC-18
    given: 用户选择中文或英文，并使用浅色或深色主题
    when: 使用本次优化的引用、任务、上下文、记忆和侧栏功能
    then: 新增名称、提示、错误和状态使用所选语言，图标操作具有可访问名称，文字满足已批准的可读性要求，功能无需新增环境变量或重启服务
