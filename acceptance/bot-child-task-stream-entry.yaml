id: bot-child-task-stream-entry
title: 主对话流里的子任务入口
status: implemented
requirement: |
  确认，分多个agent去开发完成吧，另外bot的对话流里，也可以加个小UI作为入口，点击可以跳转过去，免得不知道主bot在干嘛
notes: |
  assumedApproval: standing-order-2026-10-22
  2026-10-22：入口不再收成对话底部的一块，改按生成时刻插在对应的话后面。
  2026-10-28：正在执行的子任务在入口上多一行状态，不藏起，也不展开日志。
criteria:
  - id: AC-1
    given: 当前这场是某只 Bot 的主对话，它有若干子任务
    when: 用户看这场对话流
    then: 能读出这些子任务在做什么（任务原文的短摘），而不是把详情里那一整条长列表铺进对话
  - id: AC-2
    given: 这场主对话的小入口里有若干子任务
    when: 用户点击其中一条入口
    then: 主对话区打开的是对应的那条子任务
  - id: AC-3
    given: 这场主对话没有子任务
    when: 用户看这场对话流
    then: 对话流里不出现这块空入口
  - id: AC-4
    given: 另一只 Bot 也有自己的子任务，当前这场是这只 Bot 的主对话
    when: 用户看这场主对话的入口
    then: 另一只 Bot 的子任务不会出现在这场主对话的入口里
  - id: AC-5
    given: 这场主对话里已有用户自己的消息和助手回复，并且小入口也在
    when: 用户看这场对话流
    then: 用户自己的消息和助手回复仍按原样显示，不被收成这个入口，也不被挡住
  - id: AC-6
    given: 这场主对话的小入口出现了
    when: 用户分别用中文界面和英文界面看这块入口
    then: 入口上的说法走界面语言，中文界面是中文，英文界面是英文
  - id: AC-7
    given: 这场主对话里先有一句较早的话，后来又有一句较晚的话；较早那句发出时生成了一条子任务，较晚那句发出时又生成了另一条
    when: 用户看这场对话流
    then: 较早的子任务出现在两句话之间，较晚的子任务出现在较晚那句话之后；它们不会排成一块都堆在最后一句的后面
  - id: AC-8
    given: 当前这段能看到的话都比某条子任务更晚，这条子任务是在更早、还没出现在这段里的话发出时生成的
    when: 用户看当前这段对话
    then: 这条更早的子任务不出现在这段末尾
  - id: AC-9
    given: 这场主对话的入口里有一条正在执行的子任务，也有一条不是正在执行的子任务
    when: 用户看这场对话流
    then: 正在执行的那条入口上多一行「正在执行」，英文界面是 Running；其他状态不加这行。子任务仍在，不会被藏起，也不会展开成长日志
