id: tool-loop-same-call
title: 工具循环按同一次调用判断
status: implemented
requirement: |
  我不是关闭了模型的工具调用循环检测吗？怎么还有这种导致的停止问题？
  检查配置是否生效，以及工具循环检测的逻辑，目前感觉不合理，检测循环也不是这么蠢的逻辑，分多个Agent去快速分析解决
notes: |
  assumedApproval: standing-order-2026-10-22
  关闭重复检测已经能放过「同一批调用内容没进展」。仍然停下的是按工具名累计的失败熔断，换参数也算在一起，界面还写成工具循环。
  熔断改成只累计同一次调用（同一个工具、同一组参数）。换参数的失败不共用计数。同一调用连续失败在关闭重复检测后仍会停下，文案能看出是这次调用失败，不是重复检测。
  没有工具调用、只是把同一段助手正文再说一遍，也跟重复检测同一个开关：关掉就不因此停下。
criteria:
  - id: AC-1
    given: 同一个工具被换着参数反复调用，每次都失败
    when: 失败次数已经达到原先按工具名熔断的次数
    then: 不会因为工具名相同而停下
  - id: AC-2
    given: 重复检测已关闭
    when: 同一次调用（同一工具、同一组参数）连续失败直到熔断
    then: 这次执行仍会停下，并能看出是这次调用连续失败，而不是重复检测
  - id: AC-3
    given: 重复检测已关闭
    when: 助手连续多轮不调用工具，只重复同一段正文
    then: 不会因为正文重复而停下
