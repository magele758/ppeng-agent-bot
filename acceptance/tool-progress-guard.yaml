id: tool-progress-guard
title: 重复工具调用按实际进展判断
status: implemented
requirement: |
  按你说的方向改吧，先把目标的两套状态和展示统一起来，完成或失败的保留历史但别一直挂底部，再把重复调用检测改成看有没有实际进展。Jev我已经恢复了，不用管了。群聊组织模式，可以按你说的再新增一种模式，我对比看看执行效果。

  分多个agent去推进
notes: 'assumedApproval: standing-order-2026-10-22'
criteria:
  - id: AC-1
    given: 智能体多次调用相同工具查询正在推进的任务
    when: 返回成功且包含新的实质信息
    then: 不因调用重复而中断或发出重复风险提醒，即使助手的调用说明相同
  - id: AC-2
    given: 智能体持续重复相同调用且没有新信息
    when: 结果不变或只有时间戳等运行噪声变化
    then: 仍识别停滞并按既有重复保护配置处理，反复返回旧结果不算进展
  - id: AC-3
    given: 重复调用失败或者没有完整的成功结果
    when: 错误文本变化或结果缺失
    then: 不把这些变化当成成功进展，原有失败保护仍有效
