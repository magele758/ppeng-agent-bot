id: group-member-sections
title: 群成员分成已在群里和添加成员
status: implemented
requirement: |
  用户看着群聊设置里的「群成员」（section.play-group-settings-members，组件 PlayBotGroupChat）。现在同一块里又是已有成员、又是加人、又是职能分组：每个职能组都同时有「加入整组」和「移出整组」，组员再各有一个「移出」，未分组里群主旁边也有「移出」。用户说操作逻辑奇怪，要整理得清爽、逻辑清楚。
  按这个结构改，不要只换皮：
  1. 已在群里：只列当前群成员。群主标出来，不能移出。其他成员一行一个「移出」。不要再按职能组把已在群里的人拆开，也不要在这一段放「加入整组」。
  2. 添加成员：搜索框留在这里（名字、职责、头衔或职能组）。搜到还没进群的 Bot，一行一个「加入」。职能组只作为添加动作：该组里还有人没进群时，给一行「开发 · 加入整组」这种，不要把组员再列一遍。已经全都在群里的职能组不要出现。不要和「加入整组」并排再放「移出整组」。
  3. 去掉「未分组」这种把群主和剩余 Bot 混在添加区里的块。
  4. 加入、移出、加入整组的实际效果保持：人进群、出群、整组加入。不要改群聊回复、置顶、侧栏拖拽。
  5. 文案走 i18n，zh 与 en 同一套 key。不要硬编码中英文。不要新增环境变量。
notes: |
  assumedApproval: standing-order-2026-10-22
  与 bot-room-console AC-1、group-active-header AC-3 里「按职能组查看 / 整组移出」冲突，那两句已改成这两段分开的行为，标准没有删。
criteria:
  - id: AC-1
    given: 群里有群主和其他成员，侧栏还有职能组
    when: 打开群聊设置里的群成员
    then: 「已在群里」只列出当前群成员，不按职能组拆开，也没有「加入整组」。群主被标出且没有「移出」，其他成员各有一个「移出」。看不到把群主和其余 Bot 混在一起的「未分组」
  - id: AC-2
    given: 有的 Bot 还没进群，有的职能组还有人没进群，有的职能组已经全员在群里
    when: 在群成员的添加区按名字、职责、头衔或职能组搜索
    then: 搜索框在添加区。匹配且还没进群的 Bot 一行一个「加入」。还有人没进群且名字匹配的职能组只出现一行「加入整组」，不再列出组员。已经全员在群里的职能组不出现。已在群里的名单不因这次搜索被拆开或藏起来
  - id: AC-3
    given: 某个职能组里还有人没进群
    when: 查看这一组在群成员里能做的操作
    then: 只会看到「加入整组」，不会同时看到「移出整组」
