id: bot-multi-goal-coordination
title: Bot 多目标持续执行与自动选择执行方式
status: implemented
requirement: |
  那你帮我设计一下，怎么把这些已有能力围绕多goal统一起来，让bot能自动选择执行方式，我插话也不会丢任务，先给我方案。
notes: |
  用户于 2026-10-21 确认方案与验收标准，并明确要求多个 Agent 开发完成。
  保留 bot-concurrent-subagents AC-1/AC-2：单件工作由主 Bot 执行，多件独立工作中额外工作由子代理处理。
  本功能增加独立工作与查询、约束修改的区分，不改写既有验收标准。
  子代理沿用既有权限隔离规则；bot-fork-retrievable-inheritance 由独立验收跟踪。
  2026-10-28：AC-13 改为超预算、超次数、无进展都不得停掉执行。费用和尝试次数仍记账。
criteria:
  - id: AC-1
    given: Bot 正在处理一个尚未完成的目标
    when: 用户提出另一个明确独立的任务
    then: 两个目标分别展示并保留进度，原目标不会被新任务替换或误标完成
  - id: AC-2
    given: Bot 有进行中的目标
    when: 用户只询问该目标的进度
    then: Bot 回答进度而不新增目标，也不取消原工作
  - id: AC-3
    given: 用户明确指出要修改哪个进行中目标
    when: 用户追加约束
    then: 该目标采用新约束，后续行动遵守新约束；已执行或无法及时中止的冲突行动明确展示并处理，不被旧结果直接判为完成
  - id: AC-4
    given: 同时存在多个目标且用户的修改或取消指代不明确
    when: Bot 无法可靠判断用户指的是哪个目标
    then: Bot 请求澄清，不擅自修改或取消目标，不影响其他可继续工作
  - id: AC-5
    given: 用户提出任务且 Bot 有多种可用执行能力
    when: Bot 开始处理任务
    then: Bot 自动选择执行方式并展示选择原因，用户无需先选择模式
  - id: AC-6
    given: 首选执行能力未启用或无权使用
    when: Bot 尝试安排该目标
    then: Bot 采用权限范围内可行的替代方式并说明原因；没有可行方式时明确报告阻塞，不擅自扩大权限
  - id: AC-7
    given: 一个目标的执行者已经返回但目标完成证据不足
    when: Bot 检查结果
    then: 目标不会显示完成，而是继续推进、等待或明确报告阻塞原因
  - id: AC-8
    given: 一个目标正在等待外部任务结果
    when: 等待期间用户继续聊天且随后外部结果到达
    then: 等待目标保持可见并在结果到达后继续处理，其他聊天和目标不被覆盖
  - id: AC-9
    given: 已接收目标的进度已经保存且服务发生重启
    when: 服务恢复
    then: 未完成目标及其进度仍然可见，可安全续接的工作自动恢复，结果不明的外部操作先核实而不盲目重复
  - id: AC-10
    given: 同一个目标的唤醒或执行结果被重复送达
    when: Bot 处理这些通知
    then: 不产生重复执行或重复交付
  - id: AC-11
    given: 多个目标需要修改同一资源
    when: Bot 安排它们执行
    then: 冲突操作得到协调且不相互覆盖，用户能看到排队或协调原因
  - id: AC-12
    given: 某个目标正在运行或等待
    when: 用户明确暂停或取消该目标
    then: 该目标停止派发后续工作，不因迟到结果自动恢复，其他目标不受影响，并展示仍在收尾的行动
  - id: AC-13
    given: 某个目标的费用、尝试次数或无进展次数已经超过已设上限
    when: 系统继续安排或结算这次执行
    then: 超预算、超次数、无进展都不得停掉执行，也不因此取消会话；费用和尝试次数仍被记下，且不伪装为完成
  - id: AC-14
    given: 用户在 Lab 保存并发、预算或执行偏好
    when: 系统安排后续执行
    then: 新设置立即生效，无需修改环境变量或重启，且可查看每个目标的状态、下一步、执行方式和结果
