id: bot-immediate-steer
title: Bot 回合中直接插入并转向
status: implemented
notes: |
  实现任务已给出完成标准并要求直接合入。标准按用户可观察行为书写。
requirement: |
  Bot 模式默认支持 steering。Bot 回合还在跑时，在对话输入框里发出的消息必须立刻出现在对话列表里，并在循环能接收的最早点插入对话，不要询问用户是否 steering。普通会话保持原来的先询问再转向。只有规范 Bot 对话会立刻插入。Bot 不能因为插入一条 steering 消息而再要一次批准。这不是工具审批。
criteria:
  - id: AC-1
    given: 某个 Bot 的固定对话正在生成回复
    when: 用户在输入框发送一条新消息
    then: 这条消息立刻出现在对话里，并在当前回合还能接收的最早时机进入对话，不弹出是否转向的确认
  - id: AC-2
    given: 一条普通（非 Bot）对话正在生成回复
    when: 用户在输入框发送一条新消息
    then: 仍按原来的方式先询问是否转向，不会被当成 Bot 直接插入
  - id: AC-3
    given: 某个 Bot 的固定对话正在生成回复，且工作中发消息被设为排队或关闭
    when: 用户发送一条新消息
    then: 消息仍被接收并在下一枪转向，不会被拒绝，也不需要为了插入这条消息再批准一次
