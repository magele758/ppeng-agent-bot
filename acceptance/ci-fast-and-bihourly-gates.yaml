id: ci-fast-and-bihourly-gates
title: 两分钟快速门禁与每两小时完整验证
status: implemented
requirement: |
  按这个办，改标准和门禁。
  日常提交继续走 2 分钟快速门禁，并加上改动函数的复杂度检查和核心单测。
  全量检查仍不放进每次提交。代码合入主分支后立刻跑与两小时定时相同的完整验证，定时任务保留。
  主分支最新完整验证失败时暂停再合并；这个分支自己已经完整验证通过时可以合并，避免修复被挡住。
notes: |
  assumedApproval: standing-order-2026-10-22
  本草案明确调整原ci-gate-speedup的触发频率和合并适用条件，用户于2026-10-20确认按新的Actions执行后合并全部PR。
  2026-10-27 用户确认在保留两分钟快速门禁的前提下补上核心单测、改动函数复杂度和主分支全量健康；全量仍不回到每个 PR。
  同日用户要求云端先去掉不稳定的浏览器 E2E，以保证完整验证能够通过。HTTP 回归和集成仍在。浏览器用例留在仓库，本地仍可运行。
  确认后以本规格替代旧规格的逐PR完整验证合并条件；旧9条原文、批准记录、失败记录和已消耗资源保留。
  原完整测试范围、阈值、变异基线、反向控制和重复性要求保留，改为每两小时在固定主分支候选上完整执行。
  快速通过不等于完整验证或发布就绪；现场部署验收仍单独保留。三旧三新性能对比暂缓并明确未验收，不宣称30%提速验收通过。
  已发现的PR缺陷仍需先写失败测试、修复并review；不因改变门禁频率而直接合并已知有问题的PR。
criteria:
  - id: AC-1
    given: 提交或更新一个PR版本
    when: 高频快速门禁实际执行
    then: 类型与配置检查及短时关键回归在120秒内给出通过或失败结论，平台排队单独计时，超时不得记为通过
  - id: AC-2
    given: 当前PR版本的快速门禁失败、超时、缺失，或review仍有待修复问题
    when: 尝试合并该PR
    then: 系统阻止合并，不能借用其他版本的绿灯或把未解决问题当作通过
  - id: AC-3
    given: 主分支有可验证的固定候选版本
    when: 到达每两小时的完整验证时段
    then: 对该候选执行全量功能与覆盖率、SDK与复杂度、形式与真实进程、完整变异、HTTP与集成及验收检查。云端不跑浏览器 E2E。其余范围和阈值不降低
  - id: AC-4
    given: 一个PR版本已有快速验证，且完整验证已按两小时时段安排
    when: 收到等价提交事件或PR更新
    then: 不因 PR 更新自动重跑全套复杂验证。合并要当前版本的快速门禁和核心单测通过，并且主分支最新完整验证不是失败，除非这个版本自己已经完整验证通过
  - id: AC-5
    given: 定时完整验证失败、超时、缺少证据或出现未获准flaky
    when: 展示结果及判断能否发布
    then: 失败及对应候选明确可见并阻止发布，后续快速绿灯不能覆盖该失败，也不能把已合并说成发布就绪
  - id: AC-6
    given: 上轮完整验证未结束，或新的主分支版本已经出现
    when: 安排下一轮完整验证
    then: 并发受控且数据和证据互不覆盖，每轮保留实际候选、排队、执行、取消及资源记录，结果不能冒充其他版本的验证
  - id: AC-7
    given: 需要立即验证一个候选或准备发布
    when: 手动启动完整验证
    then: 无需等待下一个两小时时段即可执行相同完整检查，发布仍要求其实际发布候选获得完整通过结果
  - id: AC-8
    given: 快速门禁、完整门禁及历史验证记录采用新的分工
    when: 更新分支保护和验收报告
    then: 分支保护与新的合并条件一致，旧标准原文和失败记录保留，复用证据仍严格核对输入与完整性，未完成的性能对比和现场验收明确标为未验收
  - id: AC-9
    given: 这次改动碰到一个圈复杂度超过 30 的函数，另有未改到的更复杂旧函数
    when: 快速门禁执行
    then: 快速门禁因这次改动失败，不等覆盖率；没改到的旧函数不因此失败
  - id: AC-10
    given: 一个普通 PR
    when: 持续集成执行
    then: 两分钟快速门禁之外，并行跑核心库、可嵌入循环和控制台单测，不收集覆盖率，不跑浏览器、浸泡或变异。快速门禁时限仍是 2 分钟
  - id: AC-11
    given: 改动已经合入主分支，且两小时定时仍然有效
    when: 合入完成
    then: 立即开始与定时任务相同的完整验证。正在进行的完整验证不被新的提交取消，定时任务仍每两小时执行
  - id: AC-12
    given: 主分支最新一次完整验证失败
    when: 另一个 PR 准备合并
    then: 该 PR 的快速门禁仍会执行，但合并被拒绝。若这个 PR 自身的完整验证已经通过，则允许合并
