id: steer-tool-continuity
title: 插话即时入会话与按工具取消
status: implemented
notes: |
  assumedApproval: standing-order-2026-10-22
  普通插话指当前回合的 next-step 输入；显式排到下一次运行的 next-run 和独立子任务保留原语义。
requirement: |
  那就按这个方案改，普通插话立即进入会话，不要跳过或中断工具；只有明确要求停止，或者结合上下文确实需要取消时，才中断对应的工具，不要把整个会话停掉。
criteria:
  - id: AC-1
    given: 当前回合正在执行工具或等待模型回答
    when: 用户发送普通插话
    then: 插话立即持久化到当前对话，重载可见，下一轮模型只读取一份且消息位置不跳动
  - id: AC-2
    given: 当前回合已计划或正在执行多个工具，包含旧的启动前转向设置
    when: 用户补充信息但未要求取消工作
    then: 工具不被跳过或中断，结果正常返回并结合插话继续会话
  - id: AC-3
    given: 多个工具正在执行
    when: 用户明确要求停止其中一个工具
    then: 只取消对应工具，其他工具及成功结果保留，会话继续并收到完整配对的取消结果
  - id: AC-4
    given: 用户改变要求且上下文显示某个正在执行的工具与新要求直接冲突
    when: 系统判断是否需要取消
    then: 只取消有明确依据的对应工具，普通补充、否定停止、引用文本、判断失败或无法确定时继续执行
  - id: AC-5
    given: 取消判断尚未返回时工具已完成或用户又发来新消息
    when: 旧判断返回
    then: 不取消已完成工具、其他会话或后续新调用，不重复写工具结果
