id: global-default-model-row-align
title: 全局默认模型行左右对齐
status: implemented
requirement: |
  这个左右都没对齐
notes: |
  assumedApproval: standing-order-2026-10-22
  设置「模型服务商」卡片里「全局默认模型」这一行：标题、下拉框和右侧服务商/模型说明在同一行垂直居中，左边与卡片内容左缘对齐。窄屏可以换行，换行后仍左对齐。不改模型列表、保存逻辑或已保存的默认值。
criteria:
  - id: AC-1
    given: 已经选好一个可用的全局默认模型，窗口足够宽
    when: 打开设置里的模型服务商
    then: 「全局默认模型」标题、下拉框、以及右侧「服务商 / 模型名」说明在同一行里垂直居中；这一行的左边缘与卡片内容左边缘对齐；说明紧挨下拉框，不掉到下拉框下方，也不超出卡片右边缘
  - id: AC-2
    given: 已经选好一个可用的全局默认模型，窗口窄到这一行放不下
    when: 打开设置里的模型服务商
    then: 标题、下拉框和说明可以换行，但每一行的左边缘仍与卡片内容左边缘对齐，彼此不错位，也不超出卡片左右边缘
  - id: AC-3
    given: 还没有可用的全局默认模型
    when: 打开设置里的模型服务商
    then: 标题和下拉框仍在同一行垂直居中，左边缘与卡片内容左边缘对齐，这一行里不出现错位的说明
