id: agents-management
title: Bots / Agents / Teams / Skills 管理页清晰易用
status: implemented
owner: ws2-agents
notes: |
  assumedApproval: standing-order-2026-10-22
  用户要求简化 Bot 操作；bot-settings-flow 取代旧的外观默认展开和创建后停留管理页布局，保留预览、持久化、重复校验及完整设置能力。
requirement: |
  让创建/管理 bot、agent、team、skill 清晰、容易：卡片/列表总览加搜索，创建流程只要求最少必填字段并把其余放进「高级」，
  空状态要有清晰指引，team 图要易读。
criteria:
  - id: AC-1
    given: 用户打开「Bots 与 Agents → Agents」
    when: 页面加载完成并在搜索框输入名称、角色或 id 的一部分
    then: 每个 Agent 以卡片显示名称、角色和 id；列表按输入实时过滤；没有匹配时显示「没有匹配」提示和一个清除搜索的按钮
  - id: AC-2
    given: Agents 页有若干 Agent 卡片
    when: 用户点击其中一张卡片
    then: 看到该 Agent 的详情：用途说明、能力标签，以及它可以使用的工具列表（未限制时明确写出「可使用全部工具」）
  - id: AC-3
    given: 用户还没有任何 Bot
    when: 打开「Bots 与 Agents → Bots」
    then: 看到空状态，说明 Bot 是什么，并有一个醒目的「新建 Bot」按钮
  - id: AC-4
    given: 用户在 Bots 页点击「新建 Bot」
    when: 只填写名称并提交
    then: 表单仅要求名称，用途直接展示，标题与外观按需展开且为可选；名称为空时不能提交；创建成功后新 Bot 出现在列表中并直接进入其对话；同名 Bot 再次创建会显示明确的错误，且不会多出一个 Bot
  - id: AC-5
    given: 用户已有多个 Bot
    when: 在 Bots 页搜索框输入名称、标题或描述的一部分
    then: Bot 以卡片显示名称与所绑定的 Agent，列表按输入过滤；没有匹配时显示「没有匹配」提示
  - id: AC-6
    given: 用户在 Bots 页选中一个 Bot
    when: 查看和修改它的设置
    then: 在同一个详情面板里可以改权限档位、模型、最大回合数和定时任务；允许工具及统一技能选择位于「能力与权限」；保存后刷新页面仍保留
  - id: AC-7
    given: 用户在 Bots 页选中一个 Bot
    when: 点击「打开对话」
    then: 跳转到对话页并停在这个 Bot 自己的对话上
  - id: AC-8
    given: 用户打开「Bots 与 Agents → Teams」且还没有 Swarm 运行
    when: 查看页面
    then: 看到说明如何开始的空状态；只需输入一个目标即可创建并启动 Swarm，策略等选项收在「高级」里；启动后运行出现在列表中
  - id: AC-9
    given: 已有至少一个 Swarm 运行并包含子任务
    when: 查看 Teams 页
    then: 团队图旁边列出每个子任务的完整标题、状态和角色，并带工作态图例；点击不同的运行，图和任务列表切换到所选运行
  - id: AC-10
    given: 用户打开「Bots 与 Agents → Skills」
    when: 在搜索框输入关键词或按来源筛选
    then: 技能以卡片显示名称、来源和描述，按关键词和来源过滤；没有匹配时显示「没有匹配」提示；技能提案审批仍在同一页可用
