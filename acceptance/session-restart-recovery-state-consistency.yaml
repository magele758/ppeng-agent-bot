id: session-restart-recovery-state-consistency
title: 重启恢复发现的运行状态、审批衔接与未确认工具结果修复
status: implemented
requirement: |
  确认，这 13 条验收标准可以，按项目规范开始实现进程重启恢复验证，先写失败测试再实现，保留现有生命周期和工具配对验证；发现新的产品缺陷后另提修复验收给我确认。
notes: |
  这是进程重启验证发现实际不一致后的独立修复，用户已批准四条标准，按先红后绿流程实施。
  正常退出及强制终止后的真实运行均发现旧运行状态或写入占用未正确交接，影响新消息、审批决定和取消后的新运行。
  部分工具结果场景的新请求也被上述占用拒绝，尚无法确认其后是否还有独立的模型上下文清理缺陷；AC-4 保留这个必要的端到端验收，不预先断言额外根因。
  保留全部已批准的重启、生命周期及工具配对标准和原始失败证据，不修改它们来使门禁通过。
  恢复只处理单个状态目录中已退出进程留下的会话，不授权清除其他仍存活进程的占用，不承诺撤销外部副作用。
criteria:
  - id: AC-1
    given: 普通对话或任务正在等待模型、执行工具或等待重试
    when: 服务正常退出或被强制终止后使用原有数据重启，用户随后明确发起新的运行
    then: 旧运行明确显示中断或结果未确认，不再显示仍在执行，也不自动重放；新运行能正常接收消息并完成，不被已退出的旧运行阻塞
  - id: AC-2
    given: 一项或两项审批暂停信息已经保存，且可能已有部分决定或全部决定
    when: 服务重启后用户提交剩余决定并恢复本次运行
    then: 原审批及决定保留，提交决定不报旧运行占用冲突，决定未齐时继续等待，决定齐全后只执行尚未完成且获准的操作一次，拒绝事项不执行，状态与等待或结束原因一致
  - id: AC-3
    given: 重启后会话仍等待审批，可能已有部分事项决定
    when: 用户取消本次运行，重复提交原决定或再次重启，然后明确发起新的运行
    then: 取消结果保留且旧操作不恢复，新运行可以正常接收消息并推进，不残留阻止新工作的旧运行占用
  - id: AC-4
    given: 进程停止前已有工具结果保存，另有操作已经开始但尚无已确认结果
    when: 重启后用户明确继续会话，系统准备并发出新的模型请求
    then: 已保存结果保留且不重复，未确认操作以中断或未知结果明确呈现，模型收到合法的工具调用与结果配对，不伪造成功也不自动重放未确认操作
