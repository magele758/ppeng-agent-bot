id: necessary-tool-injection
title: 只把当前任务需要的工具定义交给模型
status: implemented
requirement: |
  减少无效工具注入，只注入必要的工具
notes: |
  2026-10-21 用户批准 tool-exposure-tiers：AC-1 适用于渐进模式且未固定相关包；用户显式选择全量是例外，其余权限和可达性约束不变。
  「必要」指完成当前用户请求要用到的工具。没在谈的整组领域能力，不要带着完整定义进入模型上下文。
  需要时要能在后续回合发现并真正调用，不能因为没收进首轮就永远不可用。
  用户在界面里明确关掉的能力仍然不出现，也不能靠发现绕过去。
  某个 Bot 已经保存过自己的工具名单时，名单以外的工具仍然不可用。
  不规定能力发现的默认开关，也不新增 Jev 模型配置界面。
  用户于 2026-10-21 确认：工具定义范围以本规格为准。discovery-default-on 不再要求每轮下发全部工具定义。
criteria:
  - id: AC-1
    given: 通用助手使用渐进加载且未固定领域能力包，已经接上股票行情和 Kubernetes 集群查询，用户没有在设置里关掉它们
    when: 用户在新的普通对话里只问一件与股票、集群都无关的事（例如改一段说明文字）
    then: 这一轮发给模型的工具里，没有股票行情的完整工具定义，也没有 Kubernetes 集群查询的完整工具定义
  - id: AC-2
    given: 同一位通用助手里，股票行情或 Kubernetes 集群查询先前没有出现在发给模型的工具里
    when: 用户接着明确要查股价，或要看集群状态
    then: 这次任务结束前，模型能发现对应的那类工具并完成一次真实调用。外部服务没配好时可以是连接失败，但不得表示系统里没有这个工具
  - id: AC-3
    given: 用户在「设置 → 工具与技能」里关掉了「本机桌面操作」并保存
    when: 用户在通用助手对话里提出要操作本机桌面
    then: 发给模型的工具里没有本机桌面操作的完整工具定义，后续回合也不能把它发现出来再调用
  - id: AC-4
    given: 用户在「设置 → 工具与技能」里关掉了「动态工具」并保存
    when: 用户在通用助手对话里提出要保存或复用一个临时工具
    then: 发给模型的工具里没有动态工具的完整工具定义，后续回合也不能把它发现出来再调用
  - id: AC-5
    given: 用户没有关掉查看文件这类完成当前任务需要的能力
    when: 用户让通用助手查看仓库里的一个文件
    then: 模型仍然能读到该文件。收起股票行情和集群查询，不会把当前任务真正要用的工具一起拿掉
  - id: AC-6
    given: 用户给某个 Bot 保存过一份工具名单，里面没有股票行情
    when: 用户让这个 Bot 查股价
    then: 股票行情的完整工具定义不会出现，后续回合也不能把它发现出来再调用
